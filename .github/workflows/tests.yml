name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  translations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install pyyaml jinja2

      - name: Check translated blueprints
        run: python -m unittest discover -s tests -v
