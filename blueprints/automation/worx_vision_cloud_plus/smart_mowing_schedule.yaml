blueprint:
  name: Worx Vision Cloud PLUS - inteligentny harmonogram koszenia
  description: |
    Kompletny harmonogram koszenia dla robotów Worx Vision Cloud PLUS,
    sterowany przez Home Assistant. Automatyzacja ocenia rzeczywistą potrzebę
    koszenia, wybiera bezpieczny termin i prowadzi robota przez cały cykl pracy.

    Inteligentne planowanie:
    - dzienny przyrost trawy jest szacowany modelem Growth Potential (GP),
    - obliczenia uwzględniają temperaturę, opady, wilgotność gleby,
      nasłonecznienie oraz opcjonalne podlewanie i nawożenie,
    - próg startu jest dopasowany do częstego, lekkiego koszenia robotem;
      zasada 1/3 źdźbła pozostaje limitem bezpieczeństwa, a nie celem,
    - czas pracy jest dobierany do powierzchni trawnika i wydajności kosiarki.

    W trybie automatycznym prognoza godzinowa służy do wyboru najlepszego
    momentu w wybranym oknie czasowym. Automatyzacja preferuje codzienne
    koszenie, gdy trawa odpowiednio przyrosła, ale unika deszczu, świeżo mokrej
    trawy i nadmiernej wilgotności. Dostępny jest także tryb stałej godziny
    z głównym terminem i drugą próbą startu.

    Kolejność zaplanowanego cyklu:
    - najpierw wysyłana jest sprawdzona komenda przycinania samych krawędzi,
    - Home Assistant potwierdza wyjazd robota; przy braku potwierdzenia komenda
      jest ponawiana jeden raz,
    - automatyzacja czeka na zakończenie krawędzi i potwierdzony powrót do bazy,
    - robot pozostaje w bazie do osiągnięcia co najmniej 80% baterii; maksymalny
      czas oczekiwania na ładowanie wynosi 8 godzin,
    - dopiero wtedy wysyłana jest osobna komenda normalnego koszenia
      jednorazowego z obliczonym czasem pracy.

    Zwykłe koszenie nie zostanie uruchomione, jeśli nie uda się potwierdzić
    startu krawędzi, powrotu do bazy lub wymaganego poziomu baterii. Deszcz
    przerywa bezpiecznie cykl i odsyła robota do bazy. Każde uruchomienie,
    przełożenie, przerwanie i zakończenie tworzy czytelne powiadomienie z
    przyczyną oraz następnym planowanym terminem, np. dziś, jutro lub za 2 dni.

    Wymagania przed uruchomieniem:
    - integracja Worx Vision Cloud PLUS 1.0.11 lub nowsza,
    - trzy helpery Home Assistant: przyrost trawy, ostatnie koszenie oraz
      następne planowane koszenie,
    - wyłączony harmonogram w aplikacji WORX, aby aplikacja i Home Assistant
      nie uruchamiały robota niezależnie od siebie.
  domain: automation
  author: Smart Service
  homeassistant:
    min_version: 2025.1.0
  source_url: https://github.com/SmartServicePL/worx_vision_cloud_plus_automation/blob/main/blueprints/automation/worx_vision_cloud_plus/smart_mowing_schedule.yaml
  input:
    mower_section:
      name: Kosiarka
      icon: mdi:robot-mower
      input:
        mower_entity:
          name: Kosiarka
          description: Encja lawn_mower z integracji Worx Vision Cloud PLUS.
          selector:
            entity:
              filter:
                - domain: lawn_mower
        battery_sensor:
          name: Bateria
          description: Sensor procentu baterii kosiarki.
          selector:
            entity:
              filter:
                - domain: sensor
        rain_binary_sensor:
          name: Czujnik deszczu kosiarki
          description: Binary sensor opadow deszczu, uzywany do blokady startu i powrotu do bazy w trakcie deszczu.
          selector:
            entity:
              filter:
                - domain: binary_sensor
    weather_section:
      name: Pogoda
      icon: mdi:weather-partly-rainy
      input:
        temperature_source_entity:
          name: Temperatura
          description: Czujnik temperatury zewnetrznej albo encja weather z atrybutem temperature.
          selector:
            entity:
              filter:
                - domain: sensor
                - domain: weather
        rain_source_entity:
          name: Opad albo prognoza
          description: Najlepiej wybierz encje weather, wtedy automatyzacja moze dobrac godzine z prognozy godzinowej.
          selector:
            entity:
              filter:
                - domain: sensor
                - domain: weather
        sunlight_source_entity:
          name: Naslonecznienie / UV
          description: Sensor UV/naslonecznienia albo encja weather z atrybutem uv_index.
          selector:
            entity:
              filter:
                - domain: sensor
                - domain: weather
        soil_moisture_sensor:
          name: Wilgotnosc gleby opcjonalnie
          description: Mozesz zostawic puste. Wtedy automatyzacja policzy wirtualna wilgotnosc z pogody.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
    helpers_section:
      name: Helpery
      icon: mdi:database-clock
      input:
        growth_helper:
          name: Przyrost trawy
          description: Helper input_number przechowujacy szacowany przyrost trawy od ostatniego pelnego koszenia.
          selector:
            entity:
              filter:
                - domain: input_number
        last_mow_helper:
          name: Ostatnie koszenie
          description: Helper input_datetime aktualizowany po pelnym cyklu koszenia.
          selector:
            entity:
              filter:
                - domain: input_datetime
        next_mow_helper:
          name: Nastepne koszenie
          description: Helper input_datetime, w ktorym automatyzacja zapisuje przewidywany termin nastepnego koszenia.
          selector:
            entity:
              filter:
                - domain: input_datetime
    simple_settings_section:
      name: Proste ustawienia
      icon: mdi:tune-variant
      input:
        mower_model:
          name: Model kosiarki
          description: Wybierz model WORX Vision / Vision Cloud. Dla innego modelu wybierz tryb reczny.
          default: custom
          selector:
            select:
              mode: dropdown
              options:
                - label: Recznie / inny model
                  value: custom
                - label: Vision AI S250 WR202E - 250 m2
                  value: wr202e_250
                - label: Vision AI M600 WR206E - 600 m2
                  value: wr206e_600
                - label: Vision AI M800 WR208E - 800 m2
                  value: wr208e_800
                - label: Vision AI L1300 WR213E - 1300 m2
                  value: wr213e_1300
                - label: Vision AI L1600 WR216E - 1600 m2
                  value: wr216e_1600
                - label: Vision AI WR220 - 1/2 acre
                  value: wr220_2023
                - label: Vision Cloud 300 WR303E - 300 m2
                  value: wr303e_300
                - label: Vision Cloud 500 WR305E - 500 m2
                  value: wr305e_500
                - label: Vision Cloud 650 WR365E - 650 m2
                  value: wr365e_650
                - label: Vision Cloud 650 WR365E.1 Cut-to-Zero - 650 m2
                  value: wr365e1_650
                - label: Vision Cloud 800 WR308E - 800 m2
                  value: wr308e_800
                - label: Vision Cloud 1200 WR312E - 1200 m2
                  value: wr312e_1200
                - label: Vision Cloud 1800 WR318E - 1800 m2
                  value: wr318e_1800
                - label: Vision Cloud 3000 WR330E - 3000 m2
                  value: wr330e_3000
                - label: Vision Cloud 1/4 acre WR310/WR310.1
                  value: wr310_1012
                - label: Vision Cloud 1/2 acre WR320/WR320.1
                  value: wr320_2023
                - label: Vision Cloud 1 acre WR340
                  value: wr340_us_4047
                - label: Vision Cloud 4WD 600 WR340E - 600 m2
                  value: wr340e_600
                - label: Vision Cloud 4WD 1000 WR341E - 1000 m2
                  value: wr341e_1000
                - label: Vision Cloud 4WD 2000 WR342E - 2000 m2
                  value: wr342e_2000
                - label: Vision Cloud 4WD 4000 WR344E - 4000 m2
                  value: wr344e_4000
                - label: Vision Cloud 4WD 1/4 acre WR341/WR341.1
                  value: wr341_us_1012
                - label: Vision Cloud 4WD 1 acre WR344
                  value: wr344_us_4047
        lawn_area_m2:
          name: Powierzchnia trawnika
          description: Powierzchnia robocza trawnika w metrach kwadratowych.
          default: 500
          selector:
            number:
              min: 20
              max: 5000
              step: 10
              unit_of_measurement: m2
              mode: box
        growth_threshold_mode:
          name: Moment startu koszenia
          description: Automatyczny tryb dobiera niski prog startu dla robota koszacego. Zasada 1/3 zdzbla jest traktowana tylko jako limit bezpieczenstwa, a nie jako prog startu.
          default: auto_cutting_height
          selector:
            select:
              mode: dropdown
              options:
                - label: Automatycznie dla robota
                  value: auto_cutting_height
                - label: Reczny prog wzrostu
                  value: manual
        cutting_height_mm:
          name: Wysokosc koszenia
          description: Docelowa wysokosc trawy ustawiona w kosiarce. Automatyzacja uzywa jej do dobrania malego progu startu i limitu bezpiecznego koszenia.
          default: 40
          selector:
            number:
              min: 20
              max: 60
              step: 1
              unit_of_measurement: mm
              mode: slider
        planning_mode:
          name: Tryb wyboru godziny
          description: Automatycznie wybiera najlepsza godzine z prognozy albo trzyma sie stalej godziny.
          default: auto
          selector:
            select:
              mode: dropdown
              options:
                - label: Automatycznie z prognozy pogody
                  value: auto
                - label: Stala godzina
                  value: fixed
        mowing_window_preset:
          name: Preferowane okno koszenia
          description: Wybierz proste okno czasu. Opcja "Wlasne godziny" uzywa godzin ustawionych ponizej.
          default: before_noon
          selector:
            select:
              mode: dropdown
              options:
                - label: Rano (07:00 - 10:00)
                  value: morning
                - label: Przed poludniem (09:00 - 12:00)
                  value: before_noon
                - label: Poludnie (11:00 - 14:00)
                  value: noon
                - label: Popoludnie (14:00 - 17:00)
                  value: afternoon
                - label: Wieczor (17:00 - 20:00)
                  value: evening
                - label: Wlasne godziny
                  value: custom
        primary_start_time:
          name: Wlasny poczatek okna
          description: Uzywane przy opcji "Wlasne godziny". W trybie stalej godziny to glowny start.
          default: "10:00:00"
          selector:
            time:
        backup_start_time:
          name: Wlasny koniec okna
          description: Uzywane przy opcji "Wlasne godziny". W trybie stalej godziny to druga proba.
          default: "16:30:00"
          selector:
            time:
        automatic_irrigation_enabled:
          name: Automatyczne nawadnianie
          description: Wlacz, jesli trawnik jest regularnie podlewany automatycznie.
          default: false
          selector:
            boolean:
        fertilization_enabled:
          name: Trawnik nawozony
          description: Wlacz, jesli trawnik jest regularnie nawozony.
          default: false
          selector:
            boolean:
    advanced_growth_section:
      name: Zaawansowane - wzrost trawy
      icon: mdi:sprout
      collapsed: true
      input:
        growth_threshold_mm:
          name: Reczny prog startu koszenia
          description: Uzywany tylko wtedy, gdy moment startu koszenia ustawiono na "Reczny prog wzrostu".
          default: 3
          selector:
            number:
              min: 1
              max: 12
              step: 0.5
              unit_of_measurement: mm
              mode: slider
        high_growth_threshold_mm:
          name: Prog intensywnego koszenia
          description: W trybie automatycznym jest wyliczany z progu startu i limitu 1/3 wysokosci koszenia. Ten suwak dziala tylko przy recznym progu wzrostu.
          default: 6
          selector:
            number:
              min: 2
              max: 25
              step: 0.5
              unit_of_measurement: mm
              mode: slider
        irrigation_growth_adjustment_percent:
          name: Korekta wzrostu przy nawadnianiu
          description: Uzywane tylko przy wlaczonym automatycznym nawadnianiu.
          default: 140
          selector:
            number:
              min: 100
              max: 220
              step: 5
              unit_of_measurement: "%"
              mode: slider
        fertilization_growth_adjustment_percent:
          name: Korekta wzrostu przy nawozeniu
          description: Uzywane tylko przy wlaczonym nawozeniu.
          default: 125
          selector:
            number:
              min: 100
              max: 180
              step: 5
              unit_of_measurement: "%"
              mode: slider
        min_days_between_mows:
          name: Minimalna przerwa miedzy koszeniami
          description: Zabezpieczenie przed zbyt czestym uruchamianiem. Wartosc 1 dzien oznacza kolejny dzien kalendarzowy, zeby robot mogl kosic codziennie, gdy wzrost i pogoda sa odpowiednie.
          default: 1
          selector:
            number:
              min: 0
              max: 7
              step: 0.5
              unit_of_measurement: d
              mode: slider
    advanced_runtime_section:
      name: Zaawansowane - czas pracy
      icon: mdi:timer-cog
      collapsed: true
      input:
        mower_capacity_m2_per_hour:
          name: Reczna wydajnosc kosiarki
          description: Uzywane tylko dla modelu "Recznie / inny model".
          default: 80
          selector:
            number:
              min: 20
              max: 250
              step: 5
              unit_of_measurement: m2/h
              mode: slider
        model_capacity_adjustment_percent:
          name: Korekta wydajnosci modelu
          description: Korekta dla waskich przejazdow, wielu stref albo prostego trawnika.
          default: 100
          selector:
            number:
              min: 50
              max: 150
              step: 5
              unit_of_measurement: "%"
              mode: slider
        min_runtime_minutes:
          name: Minimalny czas koszenia
          default: 45
          selector:
            number:
              min: 10
              max: 180
              step: 5
              unit_of_measurement: min
              mode: slider
        max_runtime_minutes:
          name: Maksymalny czas koszenia
          default: 240
          selector:
            number:
              min: 30
              max: 480
              step: 15
              unit_of_measurement: min
              mode: slider
    advanced_safety_section:
      name: Zaawansowane - bezpieczenstwo
      icon: mdi:shield-check
      collapsed: true
      input:
        growth_update_time:
          name: Godzina przeliczenia przyrostu
          default: "05:30:00"
          selector:
            time:
        min_battery_percent:
          name: Minimalna bateria do startu
          default: 45
          selector:
            number:
              min: 10
              max: 100
              step: 5
              unit_of_measurement: "%"
              mode: slider
        max_rain_24h_mm:
          name: Maksymalny opad 24 h dla startu
          description: Jesli spadlo wiecej deszczu, koszenie zostanie odlozone.
          default: 3
          selector:
            number:
              min: 0
              max: 30
              step: 0.5
              unit_of_measurement: mm
              mode: slider
        max_soil_moisture_percent:
          name: Maksymalna wilgotnosc gleby dla startu
          description: "Ustaw ponizej 100%, jesli wilgotnosc gleby ma blokowac start. Domyslnie wilgotnosc sluzy tylko do liczenia przyrostu trawy."
          default: 100
          selector:
            number:
              min: 20
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: slider
        mowing_start_confirm_timeout_minutes:
          name: Maksymalny czas potwierdzenia startu koszenia
          description: Ile minut automatyzacja czeka na wyjazd po komendzie normalnego koszenia albo przycinania krawedzi.
          default: 5
          selector:
            number:
              min: 2
              max: 20
              step: 1
              unit_of_measurement: min
              mode: slider

mode: single
max_exceeded: silent

triggers:
  - trigger: time
    id: update_growth
    at: !input growth_update_time
  - trigger: time
    id: start_scheduled
    at: !input next_mow_helper
  - trigger: time_pattern
    id: start_due_check
    minutes: "/5"
  - trigger: state
    id: external_mowing_started
    entity_id: !input mower_entity
    to: mowing
    for: "00:10:00"

variables:
  mower_entity: !input mower_entity
  battery_sensor: !input battery_sensor
  rain_binary_sensor: !input rain_binary_sensor
  temperature_source_entity: !input temperature_source_entity
  rain_source_entity: !input rain_source_entity
  soil_moisture_sensor: !input soil_moisture_sensor
  sunlight_source_entity: !input sunlight_source_entity
  growth_helper: !input growth_helper
  last_mow_helper: !input last_mow_helper
  next_mow_helper: !input next_mow_helper
  mower_model: !input mower_model
  lawn_area_m2: !input lawn_area_m2
  manual_mower_capacity_m2_per_hour: !input mower_capacity_m2_per_hour
  model_capacity_adjustment_percent: !input model_capacity_adjustment_percent
  growth_threshold_mode: !input growth_threshold_mode
  cutting_height_mm: !input cutting_height_mm
  manual_growth_threshold_mm: !input growth_threshold_mm
  growth_threshold_mm: >-
    {% if growth_threshold_mode == 'auto_cutting_height' %}
      {% set height = cutting_height_mm | float(40) %}
      {% set threshold = height * 0.075 %}
      {% if threshold < 2 %}2{% elif threshold > 4.5 %}4.5{% else %}{{ threshold | round(1) }}{% endif %}
    {% else %}
      {{ manual_growth_threshold_mm }}
    {% endif %}
  automatic_irrigation_enabled: !input automatic_irrigation_enabled
  irrigation_growth_adjustment_percent: !input irrigation_growth_adjustment_percent
  fertilization_enabled: !input fertilization_enabled
  fertilization_growth_adjustment_percent: !input fertilization_growth_adjustment_percent
  manual_high_growth_threshold_mm: !input high_growth_threshold_mm
  high_growth_threshold_mm: >-
    {% if growth_threshold_mode == 'auto_cutting_height' %}
      {% set safe_limit = (cutting_height_mm | float(40)) / 3 %}
      {% set intensive = (growth_threshold_mm | float(3)) * 2 %}
      {% if intensive > safe_limit %}{{ safe_limit | round(1) }}{% else %}{{ intensive | round(1) }}{% endif %}
    {% else %}
      {{ manual_high_growth_threshold_mm }}
    {% endif %}
  min_days_between_mows: !input min_days_between_mows
  min_battery_percent: !input min_battery_percent
  post_edge_battery_percent: 80
  max_rain_24h_mm: !input max_rain_24h_mm
  max_soil_moisture_percent: !input max_soil_moisture_percent
  min_runtime_minutes: !input min_runtime_minutes
  max_runtime_minutes: !input max_runtime_minutes
  mowing_start_confirm_timeout_minutes: !input mowing_start_confirm_timeout_minutes
  planning_mode: !input planning_mode
  mowing_window_preset: !input mowing_window_preset
  custom_primary_start_time_value: !input primary_start_time
  custom_backup_start_time_value: !input backup_start_time
  primary_start_time_value: >-
    {% if mowing_window_preset == 'morning' %}07:00:00
    {% elif mowing_window_preset == 'before_noon' %}09:00:00
    {% elif mowing_window_preset == 'noon' %}11:00:00
    {% elif mowing_window_preset == 'afternoon' %}14:00:00
    {% elif mowing_window_preset == 'evening' %}17:00:00
    {% else %}{{ custom_primary_start_time_value }}{% endif %}
  backup_start_time_value: >-
    {% if mowing_window_preset == 'morning' %}10:00:00
    {% elif mowing_window_preset == 'before_noon' %}12:00:00
    {% elif mowing_window_preset == 'noon' %}14:00:00
    {% elif mowing_window_preset == 'afternoon' %}17:00:00
    {% elif mowing_window_preset == 'evening' %}20:00:00
    {% else %}{{ custom_backup_start_time_value }}{% endif %}
  auto_planning_step_seconds: 900
  missed_start_grace_minutes: 30
  weather_search_days: 4
  dry_after_rain_hours: 3
  wet_grass_humidity_percent: 88
  high_rain_probability_percent: 60
  notification_id: >-
    {{ 'worx_smart_mowing_' ~ mower_entity | replace('.', '_') }}
  model_capacity_m2_per_hour: >-
    {% set model = mower_model %}
    {% if model in ['wr202e_250'] %}60
    {% elif model in ['wr303e_300'] %}65
    {% elif model in ['wr305e_500', 'wr206e_600'] %}70
    {% elif model in ['wr365e_650', 'wr365e1_650'] %}75
    {% elif model in ['wr208e_800', 'wr308e_800'] %}85
    {% elif model in ['wr213e_1300', 'wr312e_1200', 'wr310_1012'] %}95
    {% elif model in ['wr216e_1600', 'wr318e_1800', 'wr341e_1000'] %}100
    {% elif model in ['wr220_2023', 'wr320_2023', 'wr340e_600', 'wr341_us_1012', 'wr342e_2000'] %}105
    {% elif model in ['wr330e_3000', 'wr340_us_4047'] %}110
    {% elif model in ['wr344e_4000'] %}115
    {% elif model in ['wr344_us_4047'] %}120
    {% else %}{{ manual_mower_capacity_m2_per_hour | float(80) }}
    {% endif %}
  mower_capacity_m2_per_hour: >-
    {% set base = model_capacity_m2_per_hour | float(80) %}
    {% set adjustment = model_capacity_adjustment_percent | float(100) %}
    {{ (base * adjustment / 100) | round(0) }}
  temp_c: >-
    {% if temperature_source_entity.split('.')[0] == 'weather' %}
      {{ state_attr(temperature_source_entity, 'temperature') | float(10) }}
    {% else %}
      {{ states(temperature_source_entity) | float(10) }}
    {% endif %}
  rain_mm: >-
    {% if rain_source_entity.split('.')[0] == 'weather' %}
      {% set attr_rain = state_attr(rain_source_entity, 'precipitation') %}
      {% if attr_rain is not none %}
        {{ attr_rain | float(0) }}
      {% elif states(rain_source_entity) == 'pouring' %}
        8
      {% elif states(rain_source_entity) in ['rainy', 'lightning-rainy', 'snowy-rainy'] %}
        4
      {% elif states(rain_source_entity) == 'snowy' %}
        1
      {% else %}
        0
      {% endif %}
    {% else %}
      {{ states(rain_source_entity) | float(0) }}
    {% endif %}
  sunlight_index: >-
    {% if sunlight_source_entity.split('.')[0] == 'weather' %}
      {{ state_attr(sunlight_source_entity, 'uv_index') | float(5) }}
    {% else %}
      {{ states(sunlight_source_entity) | float(5) }}
    {% endif %}
  virtual_soil_moisture: >-
    {% set rain = rain_mm | float(0) %}
    {% set temp = temp_c | float(10) %}
    {% set sun = sunlight_index | float(5) %}
    {% set m = now().month %}
    {% if m in [12, 1, 2] %}
      {% set base = 72 %}
    {% elif m in [3, 4, 10, 11] %}
      {% set base = 58 %}
    {% else %}
      {% set base = 45 %}
    {% endif %}
    {% set rain_boost = rain * 7 %}
    {% if temp < 5 %}
      {% set temp_drying = -8 %}
    {% elif temp < 12 %}
      {% set temp_drying = -3 %}
    {% elif temp < 20 %}
      {% set temp_drying = 4 %}
    {% elif temp < 26 %}
      {% set temp_drying = 10 %}
    {% elif temp < 32 %}
      {% set temp_drying = 18 %}
    {% else %}
      {% set temp_drying = 25 %}
    {% endif %}
    {% set sun_drying = sun * 1.8 %}
    {% set raw = base + rain_boost - temp_drying - sun_drying %}
    {% if raw < 15 %}15{% elif raw > 95 %}95{% else %}{{ raw | round(0) }}{% endif %}
  soil_moisture: >-
    {% set entity = soil_moisture_sensor | default('', true) %}
    {% if entity | length > 0 and states(entity) not in ['unknown', 'unavailable', 'none', ''] %}
      {{ states(entity) | float(virtual_soil_moisture | float) }}
    {% else %}
      {{ virtual_soil_moisture }}
    {% endif %}
  estimated_growth_mm: "{{ states(growth_helper) | float(0) }}"
  last_mow_days_ago: >-
    {% set raw = states(last_mow_helper) %}
    {% if raw in ['unknown', 'unavailable', 'none', ''] %}
      999
    {% else %}
      {% set days = (as_timestamp(now()) - as_timestamp(raw)) / 86400 %}
      {% if days < 0 %}0{% else %}{{ days | round(1) }}{% endif %}
    {% endif %}
  mowing_gap_ready_ts: >-
    {% set raw = states(last_mow_helper) %}
    {% set min_gap = min_days_between_mows | float(1) %}
    {% if raw in ['unknown', 'unavailable', 'none', ''] or min_gap <= 0 %}
      0
    {% elif min_gap < 1 %}
      {{ as_timestamp(raw) + (min_gap * 86400) }}
    {% else %}
      {% set last_ts = as_timestamp(raw) %}
      {% set last_day_ts = as_timestamp((last_ts | timestamp_custom('%Y-%m-%d', true)) ~ ' 00:00:00') %}
      {{ last_day_ts + ((min_gap | round(0, 'ceil') | int) * 86400) }}
    {% endif %}
  temp_factor: >-
    {% set t = temp_c | float %}
    {% if t < 3 %}
      0
    {% else %}
      {% set gp = 2.718281828459045 ** (-0.5 * (((t - 20) / 5.5) ** 2)) %}
      {% if gp < 0.02 %}0.02{% elif gp > 1 %}1{% else %}{{ gp | round(3) }}{% endif %}
    {% endif %}
  rain_factor: >-
    {% set r = rain_mm | float %}
    {% if r < 0.2 %}0.75
    {% elif r < 2 %}0.9
    {% elif r < 10 %}1
    {% elif r < 25 %}0.9
    {% else %}0.7
    {% endif %}
  effective_rain_factor: >-
    {% set factor = rain_factor | float %}
    {% if automatic_irrigation_enabled and factor < 0.95 %}0.95{% else %}{{ factor }}{% endif %}
  soil_factor: >-
    {% set s = soil_moisture | float %}
    {% if s < 20 %}0.35
    {% elif s < 35 %}0.65
    {% elif s <= 80 %}1
    {% elif s <= 95 %}0.9
    {% else %}0.75
    {% endif %}
  effective_soil_factor: >-
    {% set factor = soil_factor | float %}
    {% if automatic_irrigation_enabled and (soil_moisture | float) < 80 and factor < 0.95 %}0.95{% else %}{{ factor }}{% endif %}
  sunlight_factor: >-
    {% set u = sunlight_index | float %}
    {% if u < 1 %}0.35
    {% elif u < 3 %}0.65
    {% elif u <= 8 %}1
    {% else %}0.85
    {% endif %}
  season_factor: >-
    {% set m = now().month %}
    {% if m in [12, 1, 2] %}0.15
    {% elif m in [3, 11] %}0.65
    {% elif m in [4, 10] %}0.9
    {% else %}1
    {% endif %}
  irrigation_growth_factor: >-
    {% if automatic_irrigation_enabled %}
      {% set adjustment = irrigation_growth_adjustment_percent | float(140) %}
      {{ (1 + (((adjustment - 100) / 100) * 0.35)) | round(2) }}
    {% else %}
      1
    {% endif %}
  fertilization_growth_factor: >-
    {% if fertilization_enabled %}
      {% set adjustment = fertilization_growth_adjustment_percent | float(125) %}
      {{ (1 + (((adjustment - 100) / 100) * 0.4)) | round(2) }}
    {% else %}
      1
    {% endif %}
  growth_today_mm: >-
    {% set max_daily_growth_mm = 8.5 %}
    {% set raw = max_daily_growth_mm * (temp_factor | float) * (effective_rain_factor | float) * (effective_soil_factor | float) * (sunlight_factor | float) * (season_factor | float) * (irrigation_growth_factor | float) * (fertilization_growth_factor | float) %}
    {% if raw < 0 %}0{% elif raw > 12 %}12{% else %}{{ raw | round(1) }}{% endif %}
  new_growth_mm: >-
    {% set raw = (estimated_growth_mm | float) + (growth_today_mm | float) %}
    {% if raw < 0 %}0{% elif raw > 40 %}40{% else %}{{ raw | round(1) }}{% endif %}
  planning_growth_mm: >-
    {% if trigger.id == 'update_growth' %}
      {{ new_growth_mm }}
    {% else %}
      {{ estimated_growth_mm }}
    {% endif %}
  growth_pressure_ratio: >-
    {% set threshold = growth_threshold_mm | float(3) %}
    {% set growth = planning_growth_mm | float(0) %}
    {% if threshold <= 0 %}0{% else %}{{ (growth / threshold) | round(2) }}{% endif %}
  forecast_delay_penalty_per_day: >-
    {% set pressure = growth_pressure_ratio | float(0) %}
    {% if pressure >= 2 %}2500
    {% elif pressure >= 1 %}450
    {% else %}8
    {% endif %}
  coverage_factor: >-
    {% set threshold = growth_threshold_mm | float %}
    {% set pressure = (estimated_growth_mm | float) / (threshold if threshold > 0 else 0.1) %}
    {% set raw = 0.45 + (pressure * 0.35) %}
    {% if raw < 0.45 %}0.45{% elif raw > 1 %}1{% else %}{{ raw | round(2) }}{% endif %}
  growth_runtime_factor: >-
    {% set g = estimated_growth_mm | float %}
    {% if g >= (high_growth_threshold_mm | float) %}1.25
    {% elif g >= (growth_threshold_mm | float) %}1
    {% else %}0.75
    {% endif %}
  recommended_runtime_minutes: >-
    {% set capacity = mower_capacity_m2_per_hour | float %}
    {% set raw = ((lawn_area_m2 | float) / (capacity if capacity > 0 else 1)) * 60 * (coverage_factor | float) * (growth_runtime_factor | float) %}
    {% set rounded = raw | round(0) | int %}
    {% if rounded < (min_runtime_minutes | int) %}{{ min_runtime_minutes | int }}{% elif rounded > (max_runtime_minutes | int) %}{{ max_runtime_minutes | int }}{% else %}{{ rounded }}{% endif %}
  normal_mowing_runtime_minutes: >-
    {% set runtime = recommended_runtime_minutes | int(60) %}
    {% if runtime < 10 %}10{% elif runtime > 120 %}120{% else %}{{ runtime }}{% endif %}
  next_mow_datetime: >-
    {% set planned_growth = new_growth_mm | float if trigger.id == 'update_growth' else estimated_growth_mm | float %}
    {% set missing_growth = (growth_threshold_mm | float) - planned_growth %}
    {% set daily_growth = growth_today_mm | float %}
    {% if missing_growth <= 0 %}
      {% set days_growth = 0 %}
    {% elif daily_growth <= 0.1 %}
      {% set days_growth = 7 %}
    {% else %}
      {% set days_growth = (missing_growth / daily_growth) | round(0, 'ceil') | int %}
    {% endif %}
    {% set primary = today_at(primary_start_time_value) %}
    {% set backup = today_at(backup_start_time_value) %}
    {% set primary_ts = as_timestamp(primary) %}
    {% set backup_ts = as_timestamp(backup) %}
    {% set window_end_ts = backup_ts if backup_ts > primary_ts else primary_ts + 21600 %}
    {% if trigger.id == 'update_growth' %}
      {% set gap_ready_ts = mowing_gap_ready_ts | float(0) %}
      {% set growth_ready_ts = primary_ts + (days_growth * 86400) %}
      {% set earliest_ts = [growth_ready_ts, gap_ready_ts, as_timestamp(now()) + 300] | max %}
      {% set target_date = earliest_ts | timestamp_custom('%Y-%m-%d', true) %}
      {% set target_primary_ts = as_timestamp(target_date ~ ' ' ~ primary_start_time_value) %}
      {% set target_raw_window_end_ts = as_timestamp(target_date ~ ' ' ~ backup_start_time_value) %}
      {% set target_window_end_ts = target_raw_window_end_ts if target_raw_window_end_ts > target_primary_ts else target_primary_ts + 21600 %}
      {% if earliest_ts <= target_primary_ts %}
        {{ target_primary_ts | timestamp_custom('%Y-%m-%d %H:%M:%S', true) }}
      {% elif earliest_ts <= target_window_end_ts %}
        {% set selected_ts = ((earliest_ts / 60) | round(0, 'ceil') | int) * 60 %}
        {{ selected_ts | timestamp_custom('%Y-%m-%d %H:%M:%S', true) }}
      {% else %}
        {{ (target_primary_ts + 86400) | timestamp_custom('%Y-%m-%d %H:%M:%S', true) }}
      {% endif %}
    {% else %}
      {% set gap_ready_ts = mowing_gap_ready_ts | float(0) %}
      {% if gap_ready_ts <= as_timestamp(now()) %}
        {% set days_gap = 0 %}
      {% else %}
        {% set today_midnight = as_timestamp(today_at('00:00:00')) %}
        {% set gap_midnight = as_timestamp((gap_ready_ts | timestamp_custom('%Y-%m-%d', true)) ~ ' 00:00:00') %}
        {% set days_gap = ((gap_midnight - today_midnight) / 86400) | round(0, 'ceil') | int %}
        {% if days_gap < 0 %}{% set days_gap = 0 %}{% endif %}
      {% endif %}
      {% set days_ready = days_growth if days_growth > days_gap else days_gap %}
      {% if days_ready <= 0 %}
      {% if as_timestamp(now()) < as_timestamp(primary) %}
        {{ as_timestamp(primary) | timestamp_custom('%Y-%m-%d %H:%M:%S', true) }}
      {% elif as_timestamp(now()) < as_timestamp(backup) %}
        {{ as_timestamp(backup) | timestamp_custom('%Y-%m-%d %H:%M:%S', true) }}
      {% else %}
        {{ (as_timestamp(primary) + 86400) | timestamp_custom('%Y-%m-%d %H:%M:%S', true) }}
      {% endif %}
      {% else %}
        {{ (as_timestamp(primary) + (days_ready * 86400)) | timestamp_custom('%Y-%m-%d %H:%M:%S', true) }}
      {% endif %}
    {% endif %}
  stable_next_mow_datetime: >-
    {% set calculated_ts = as_timestamp(next_mow_datetime) %}
    {{ calculated_ts | timestamp_custom('%Y-%m-%d %H:%M:%S', true) }}
  scheduled_start_due: >-
    {% if trigger.id == 'start_scheduled' %}
      on
    {% elif trigger.id == 'start_due_check' %}
      {% set raw = states(next_mow_helper) %}
      {% if raw in ['unknown', 'unavailable', 'none', ''] %}
        off
      {% else %}
        {% set diff = as_timestamp(now()) - as_timestamp(raw) %}
        {{ 'on' if diff >= 0 and diff <= ((missed_start_grace_minutes | int(30)) * 60) else 'off' }}
      {% endif %}
    {% else %}
      off
    {% endif %}
  mower_cloud_stale_at_station: >-
    {% set status_id = state_attr(mower_entity, 'status_id') | int(-1) %}
    {% set rtk_distance = state_attr(mower_entity, 'rtk_station_distance_m') | float(999) %}
    {% set at_station = state_attr(mower_entity, 'rtk_at_station') == true or rtk_distance <= 1.5 %}
    {{ at_station
       and (states(mower_entity) in ['mowing', 'returning']
            or status_id in [4, 5, 6, 7, 8, 12, 30, 32, 104, 110, 111]) }}
  next_mow_after_reset_datetime: >-
    {% set daily_growth = growth_today_mm | float %}
    {% if daily_growth <= 0.1 %}
      {% set days_growth = 7 %}
    {% else %}
      {% set days_growth = ((growth_threshold_mm | float) / daily_growth) | round(0, 'ceil') | int %}
    {% endif %}
    {% set days_gap = min_days_between_mows | float | round(0, 'ceil') | int %}
    {% set days_ready = days_growth if days_growth > days_gap else days_gap %}
    {% if days_ready < 1 %}
      {% set days_ready = 1 %}
    {% endif %}
    {{ (as_timestamp(today_at(primary_start_time_value)) + (days_ready * 86400)) | timestamp_custom('%Y-%m-%d %H:%M:%S', true) }}
  start_block_reason: >-
    {% set stale_at_station = (mower_cloud_stale_at_station | string | lower) == 'true' %}
    {% if states(mower_entity) != 'docked' and not stale_at_station %}
      kosiarka nie jest w bazie, aktualny stan: {{ states(mower_entity) }}. Stare reczne koszenie nie bedzie wznawiane automatycznie
    {% elif (states(battery_sensor) | float(0)) < (min_battery_percent | float) %}
      bateria ma {{ states(battery_sensor) }}%, a wymagane minimum to {{ min_battery_percent }}%
    {% elif is_state(rain_binary_sensor, 'on') %}
      czujnik deszczu kosiarki jest aktywny
    {% elif (rain_mm | float) > (max_rain_24h_mm | float) %}
      opad wynosi {{ rain_mm }} mm, czyli wiecej niz ustawiony limit {{ max_rain_24h_mm }} mm
    {% elif (soil_moisture | float) > (max_soil_moisture_percent | float) %}
      gleba jest zbyt mokra: {{ soil_moisture }}%
    {% elif (estimated_growth_mm | float) < (growth_threshold_mm | float) %}
      szacowany przyrost trawy to {{ estimated_growth_mm }} mm, a prog startu robota to {{ growth_threshold_mm }} mm{% if growth_threshold_mode == 'auto_cutting_height' %} (czeste koszenie po trochu; limit 1/3 to okolo {{ ((cutting_height_mm | float(40)) / 3) | round(1) }} mm){% endif %}
    {% elif (mowing_gap_ready_ts | float(0)) > as_timestamp(now()) %}
      od ostatniego koszenia nie minela minimalna przerwa; najwczesniej {{ (mowing_gap_ready_ts | float(0)) | timestamp_custom('%Y-%m-%d %H:%M', true) }}
    {% else %}
      {{ '' }}
    {% endif %}

actions:
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'external_mowing_started' }}"
          - condition: template
            value_template: "{{ state_attr(mower_entity, 'rtk_at_station') != true }}"
        sequence:
          - wait_template: "{{ states(mower_entity) in ['docked', 'paused'] }}"
            timeout: "04:00:00"
            continue_on_timeout: false
          - variables:
              manual_mow_finished_at: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
              manual_next_mow_datetime: "{{ next_mow_after_reset_datetime | trim }}"
              manual_next_mow_label: >-
                {% set raw = next_mow_after_reset_datetime | trim %}
                {% set ts = as_timestamp(raw) %}
                {% set target_midnight = as_timestamp((ts | timestamp_custom('%Y-%m-%d', true)) ~ ' 00:00:00') %}
                {% set today_midnight = as_timestamp(today_at('00:00:00')) %}
                {% set days = ((target_midnight - today_midnight) / 86400) | round(0) | int %}
                {% if days <= 0 %}dziś o {{ ts | timestamp_custom('%H:%M', true) }}
                {% elif days == 1 %}jutro o {{ ts | timestamp_custom('%H:%M', true) }}
                {% elif days == 2 %}za 2 dni o {{ ts | timestamp_custom('%H:%M', true) }}
                {% else %}za {{ days }} dni o {{ ts | timestamp_custom('%H:%M', true) }}{% endif %}
          - action: input_datetime.set_datetime
            alias: Zapisz reczne koszenie jako ostatnie koszenie
            target:
              entity_id: !input last_mow_helper
            data:
              datetime: "{{ manual_mow_finished_at }}"
          - action: input_number.set_value
            alias: Wyzeruj przyrost po recznym koszeniu
            target:
              entity_id: !input growth_helper
            data:
              value: 0
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ (next_mow_helper | default('', true) | length) > 0 }}"
                sequence:
                  - action: input_datetime.set_datetime
                    alias: Przelicz nastepne koszenie po recznym koszeniu
                    target:
                      entity_id: "{{ next_mow_helper }}"
                    data:
                      datetime: "{{ manual_next_mow_datetime }}"
          - action: persistent_notification.create
            data:
              notification_id: "{{ notification_id }}"
              title: "Worx: zapisano reczne koszenie"
              message: >-
                Wykryto koszenie uruchomione poza automatyzacja. Robot kosil
                co najmniej 10 minut i wrocil do bazy, wiec przyrost trawy
                zostal wyzerowany. Nastepne koszenie: {{ manual_next_mow_label | trim }}.

      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'update_growth' }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ planning_mode == 'auto' and rain_source_entity.split('.')[0] == 'weather' }}"
                sequence:
                  - action: weather.get_forecasts
                    target:
                      entity_id: !input rain_source_entity
                    data:
                      type: hourly
                    response_variable: weather_forecast
          - variables:
              planned_next_mow_datetime: >-
                {% set fallback = stable_next_mow_datetime | trim %}
                {% if planning_mode != 'auto' or weather_forecast is not defined %}
                  {{ fallback }}
                {% else %}
                  {% set items = weather_forecast.get(rain_source_entity, {}).get('forecast', []) %}
                  {% set step = auto_planning_step_seconds | int(900) %}
                  {% set earliest_allowed_ts = [as_timestamp(fallback), as_timestamp(now()) + 300] | max %}
                  {% set horizon = namespace(max=0) %}
                  {% for item in items %}
                    {% set item_ts = as_timestamp(item.datetime) %}
                    {% if item_ts > horizon.max %}
                      {% set horizon.max = item_ts %}
                    {% endif %}
                  {% endfor %}
                  {% if horizon.max > 0 %}
                    {% set bad = ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'snowy', 'hail'] %}
                    {% set ns = namespace(best_ts=0, best_score=999999) %}
                    {% set first_day = earliest_allowed_ts | timestamp_custom('%Y-%m-%d', true) %}
                    {% for day in range(0, weather_search_days | int(4)) %}
                      {% set day_ts = as_timestamp(first_day ~ ' 00:00:00') + (day * 86400) %}
                      {% set target_date = day_ts | timestamp_custom('%Y-%m-%d', true) %}
                      {% set window_start = as_timestamp(target_date ~ ' ' ~ primary_start_time_value) %}
                      {% set raw_window_end = as_timestamp(target_date ~ ' ' ~ backup_start_time_value) %}
                      {% set window_end = raw_window_end if raw_window_end > window_start else window_start + 21600 %}
                      {% set search_end = [window_end, horizon.max + 3600] | min %}
                      {% set start_ts = [window_start, earliest_allowed_ts] | max %}
                      {% if start_ts <= search_end %}
                        {% set window_mid = ((window_start + window_end) / 2) %}
                        {% set first_slot = ((start_ts / step) | round(0, 'ceil') | int) * step %}
                        {% set slots = [(((search_end - first_slot) / step) | round(0, 'floor') | int) + 1, 0] | max %}
                        {% for slot in range(0, slots) %}
                          {% set ts = first_slot + (slot * step) %}
                          {% set fc = namespace(seen=0, rain=0, probability=0, temp=temp_c | float(10), wind=0, humidity=60, condition='') %}
                          {% set recent = namespace(rain=0, wet=0) %}
                          {% for item in items %}
                            {% set item_ts = as_timestamp(item.datetime) %}
                            {% if item_ts <= ts and item_ts > (ts - 3600) %}
                              {% set fc.seen = 1 %}
                              {% set fc.rain = item.precipitation | default(0) | float(0) %}
                              {% set fc.probability = item.precipitation_probability | default(0) | float(0) %}
                              {% set fc.temp = item.temperature | default(temp_c) | float(temp_c) %}
                              {% set fc.wind = item.wind_speed | default(0) | float(0) %}
                              {% set fc.humidity = item.humidity | default(60) | float(60) %}
                              {% set fc.condition = item.condition | default('') %}
                            {% endif %}
                            {% if item_ts <= ts and item_ts > (ts - ((dry_after_rain_hours | int(3)) * 3600)) %}
                              {% set recent_rain = item.precipitation | default(0) | float(0) %}
                              {% set recent_condition = item.condition | default('') %}
                              {% if recent_rain > 0.05 or recent_condition in bad %}
                                {% set recent.rain = recent.rain + recent_rain %}
                                {% set recent.wet = 1 %}
                              {% endif %}
                            {% endif %}
                          {% endfor %}
                          {% set score = (fc.rain * 500) + (fc.probability * 3) + (((fc.temp - 20) | abs) * 2) + (fc.wind * 0.8) + ((((ts - window_mid) | abs) / 3600) * 1.2) + (((ts - earliest_allowed_ts) / 86400) * (forecast_delay_penalty_per_day | float(8))) %}
                          {% if fc.seen == 0 %}
                            {% set score = score + 120 %}
                          {% endif %}
                          {% if fc.rain > 0.05 or fc.condition in bad %}
                            {% set score = score + 10000 %}
                          {% endif %}
                          {% if fc.probability > (high_rain_probability_percent | float(60)) %}
                            {% set score = score + 2000 %}
                          {% endif %}
                          {% if recent.wet == 1 %}
                            {% set score = score + 1800 + (recent.rain * 200) %}
                          {% endif %}
                          {% if fc.humidity > (wet_grass_humidity_percent | float(88)) %}
                            {% set score = score + 250 %}
                          {% elif fc.humidity > 82 %}
                            {% set score = score + 80 %}
                          {% endif %}
                          {% if score < ns.best_score %}
                            {% set ns.best_score = score %}
                            {% set ns.best_ts = ts %}
                          {% endif %}
                        {% endfor %}
                      {% endif %}
                    {% endfor %}
                    {% if ns.best_ts > 0 %}
                      {{ ns.best_ts | timestamp_custom('%Y-%m-%d %H:%M:%S', true) }}
                    {% else %}
                      {{ fallback }}
                    {% endif %}
                  {% else %}
                    {{ fallback }}
                  {% endif %}
                {% endif %}
          - variables:
              planned_next_mow_label: >-
                {% set raw = planned_next_mow_datetime | trim %}
                {% set ts = as_timestamp(raw) %}
                {% set target_midnight = as_timestamp((ts | timestamp_custom('%Y-%m-%d', true)) ~ ' 00:00:00') %}
                {% set today_midnight = as_timestamp(today_at('00:00:00')) %}
                {% set days = ((target_midnight - today_midnight) / 86400) | round(0) | int %}
                {% if days <= 0 %}dziś o {{ ts | timestamp_custom('%H:%M', true) }}
                {% elif days == 1 %}jutro o {{ ts | timestamp_custom('%H:%M', true) }}
                {% elif days == 2 %}za 2 dni o {{ ts | timestamp_custom('%H:%M', true) }}
                {% else %}za {{ days }} dni o {{ ts | timestamp_custom('%H:%M', true) }}{% endif %}
              planned_next_mow_reason: >-
                {% if planning_mode != 'auto' or weather_forecast is not defined %}
                  wybrano termin z ustawionego okna koszenia, bez oceny prognozy godzinowej
                {% else %}
                  {% set items = weather_forecast.get(rain_source_entity, {}).get('forecast', []) %}
                  {% set ts = as_timestamp(planned_next_mow_datetime | trim) %}
                  {% set bad = ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'snowy', 'hail'] %}
                  {% set urgent_growth = (planning_growth_mm | float(0)) >= (high_growth_threshold_mm | float(999)) %}
                  {% set fc = namespace(seen=0, rain=0, probability=0, temp=temp_c | float(10), wind=0, humidity=60, condition='') %}
                  {% set recent = namespace(rain=0, wet=0) %}
                  {% for item in items %}
                    {% set item_ts = as_timestamp(item.datetime) %}
                    {% if item_ts <= ts and item_ts > (ts - 3600) %}
                      {% set fc.seen = 1 %}
                      {% set fc.rain = item.precipitation | default(0) | float(0) %}
                      {% set fc.probability = item.precipitation_probability | default(0) | float(0) %}
                      {% set fc.temp = item.temperature | default(temp_c) | float(temp_c) %}
                      {% set fc.wind = item.wind_speed | default(0) | float(0) %}
                      {% set fc.humidity = item.humidity | default(60) | float(60) %}
                      {% set fc.condition = item.condition | default('') %}
                    {% endif %}
                    {% if item_ts <= ts and item_ts > (ts - ((dry_after_rain_hours | int(3)) * 3600)) %}
                      {% set recent_rain = item.precipitation | default(0) | float(0) %}
                      {% set recent_condition = item.condition | default('') %}
                      {% if recent_rain > 0.05 or recent_condition in bad %}
                        {% set recent.rain = recent.rain + recent_rain %}
                        {% set recent.wet = 1 %}
                      {% endif %}
                    {% endif %}
                  {% endfor %}
                  {% if fc.seen == 0 %}
                    to najbliższy sensowny termin, ale prognoza godzinowa nie ma już dokładnych danych dla tej godziny
                  {% elif fc.rain > 0.05 or fc.condition in bad %}
                    to najbezpieczniejszy dostępny termin w prognozie, mimo że nadal widać ryzyko opadu
                  {% elif urgent_growth and recent.wet == 0 and fc.humidity <= (wet_grass_humidity_percent | float(88)) %}
                    przyrost trawy jest wysoki, więc automatyzacja wybrała najbliższe bezpieczne okno zamiast czekać na idealniejsze warunki kolejnego dnia
                  {% elif recent.wet == 1 %}
                    to pierwsze sensowne okno po deszczu; automatyzacja odczekała, żeby trawnik nie był świeżo mokry
                  {% elif fc.humidity > (wet_grass_humidity_percent | float(88)) %}
                    to najlepszy dostępny termin, ale wilgotność nadal jest wysoka, więc start może zostać ponownie przesunięty
                  {% else %}
                    prognoza pokazuje brak deszczu, przerwę po opadach i najniższe ryzyko mokrej trawy w wybranym oknie
                  {% endif %}
                  (ryzyko deszczu {{ fc.probability | round(0) }}%, opad {{ fc.rain | round(1) }} mm, wilgotność {{ fc.humidity | round(0) }}%, temperatura {{ fc.temp | round(0) }} st. C)
                {% endif %}
          - action: input_number.set_value
            target:
              entity_id: !input growth_helper
            data:
              value: "{{ new_growth_mm }}"
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ (next_mow_helper | default('', true) | length) > 0 }}"
                sequence:
                  - action: input_datetime.set_datetime
                    target:
                      entity_id: "{{ next_mow_helper }}"
                    data:
                      datetime: "{{ planned_next_mow_datetime | trim }}"
          - action: persistent_notification.create
            data:
              notification_id: "{{ notification_id }}"
              title: "Worx: zaktualizowano harmonogram"
              message: >-
                Przyrost dzisiaj: {{ growth_today_mm }} mm. Skumulowany przyrost:
                {{ new_growth_mm }} mm. Prog startu robota: {{ growth_threshold_mm }} mm{% if growth_threshold_mode == 'auto_cutting_height' %} (czeste koszenie po trochu; limit 1/3 to okolo {{ ((cutting_height_mm | float(40)) / 3) | round(1) }} mm){% endif %}. Koszenie zaplanowane:
                {{ planned_next_mow_label | trim }}. Dlaczego:
                {{ planned_next_mow_reason | trim }}.

      - conditions:
          - condition: template
            value_template: "{{ trigger.id in ['start_scheduled', 'start_due_check'] and scheduled_start_due | trim == 'on' }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ planning_mode == 'auto' and rain_source_entity.split('.')[0] == 'weather' }}"
                sequence:
                  - action: weather.get_forecasts
                    target:
                      entity_id: !input rain_source_entity
                    data:
                      type: hourly
                    response_variable: weather_forecast_at_start
          - variables:
              planned_retry_mow_datetime: >-
                {% set fallback = next_mow_datetime | trim %}
                {% if planning_mode != 'auto' or weather_forecast_at_start is not defined %}
                  {{ fallback }}
                {% else %}
                  {% set items = weather_forecast_at_start.get(rain_source_entity, {}).get('forecast', []) %}
                  {% set step = auto_planning_step_seconds | int(900) %}
                  {% set earliest_allowed_ts = [as_timestamp(fallback), as_timestamp(now()) + 300] | max %}
                  {% set horizon = namespace(max=0) %}
                  {% for item in items %}
                    {% set item_ts = as_timestamp(item.datetime) %}
                    {% if item_ts > horizon.max %}
                      {% set horizon.max = item_ts %}
                    {% endif %}
                  {% endfor %}
                  {% if horizon.max > 0 %}
                    {% set bad = ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'snowy', 'hail'] %}
                    {% set ns = namespace(best_ts=0, best_score=999999) %}
                    {% set first_day = earliest_allowed_ts | timestamp_custom('%Y-%m-%d', true) %}
                    {% for day in range(0, weather_search_days | int(4)) %}
                      {% set day_ts = as_timestamp(first_day ~ ' 00:00:00') + (day * 86400) %}
                      {% set target_date = day_ts | timestamp_custom('%Y-%m-%d', true) %}
                      {% set window_start = as_timestamp(target_date ~ ' ' ~ primary_start_time_value) %}
                      {% set raw_window_end = as_timestamp(target_date ~ ' ' ~ backup_start_time_value) %}
                      {% set window_end = raw_window_end if raw_window_end > window_start else window_start + 21600 %}
                      {% set search_end = [window_end, horizon.max + 3600] | min %}
                      {% set start_ts = [window_start, earliest_allowed_ts] | max %}
                      {% if start_ts <= search_end %}
                        {% set window_mid = ((window_start + window_end) / 2) %}
                        {% set first_slot = ((start_ts / step) | round(0, 'ceil') | int) * step %}
                        {% set slots = [(((search_end - first_slot) / step) | round(0, 'floor') | int) + 1, 0] | max %}
                        {% for slot in range(0, slots) %}
                          {% set ts = first_slot + (slot * step) %}
                          {% set fc = namespace(seen=0, rain=0, probability=0, temp=temp_c | float(10), wind=0, humidity=60, condition='') %}
                          {% set recent = namespace(rain=0, wet=0) %}
                          {% for item in items %}
                            {% set item_ts = as_timestamp(item.datetime) %}
                            {% if item_ts <= ts and item_ts > (ts - 3600) %}
                              {% set fc.seen = 1 %}
                              {% set fc.rain = item.precipitation | default(0) | float(0) %}
                              {% set fc.probability = item.precipitation_probability | default(0) | float(0) %}
                              {% set fc.temp = item.temperature | default(temp_c) | float(temp_c) %}
                              {% set fc.wind = item.wind_speed | default(0) | float(0) %}
                              {% set fc.humidity = item.humidity | default(60) | float(60) %}
                              {% set fc.condition = item.condition | default('') %}
                            {% endif %}
                            {% if item_ts <= ts and item_ts > (ts - ((dry_after_rain_hours | int(3)) * 3600)) %}
                              {% set recent_rain = item.precipitation | default(0) | float(0) %}
                              {% set recent_condition = item.condition | default('') %}
                              {% if recent_rain > 0.05 or recent_condition in bad %}
                                {% set recent.rain = recent.rain + recent_rain %}
                                {% set recent.wet = 1 %}
                              {% endif %}
                            {% endif %}
                          {% endfor %}
                          {% set score = (fc.rain * 500) + (fc.probability * 3) + (((fc.temp - 20) | abs) * 2) + (fc.wind * 0.8) + ((((ts - window_mid) | abs) / 3600) * 1.2) + (((ts - earliest_allowed_ts) / 86400) * (forecast_delay_penalty_per_day | float(8))) %}
                          {% if fc.seen == 0 %}
                            {% set score = score + 120 %}
                          {% endif %}
                          {% if fc.rain > 0.05 or fc.condition in bad %}
                            {% set score = score + 10000 %}
                          {% endif %}
                          {% if fc.probability > (high_rain_probability_percent | float(60)) %}
                            {% set score = score + 2000 %}
                          {% endif %}
                          {% if recent.wet == 1 %}
                            {% set score = score + 1800 + (recent.rain * 200) %}
                          {% endif %}
                          {% if fc.humidity > (wet_grass_humidity_percent | float(88)) %}
                            {% set score = score + 250 %}
                          {% elif fc.humidity > 82 %}
                            {% set score = score + 80 %}
                          {% endif %}
                          {% if score < ns.best_score %}
                            {% set ns.best_score = score %}
                            {% set ns.best_ts = ts %}
                          {% endif %}
                        {% endfor %}
                      {% endif %}
                    {% endfor %}
                    {% if ns.best_ts > 0 %}
                      {{ ns.best_ts | timestamp_custom('%Y-%m-%d %H:%M:%S', true) }}
                    {% else %}
                      {{ fallback }}
                    {% endif %}
                  {% else %}
                    {{ fallback }}
                  {% endif %}
                {% endif %}
          - variables:
              current_time_label: >-
                {% set ts = as_timestamp(now()) %}
                dziś o {{ ts | timestamp_custom('%H:%M', true) }}
              planned_retry_mow_label: >-
                {% set raw = planned_retry_mow_datetime | trim %}
                {% set ts = as_timestamp(raw) %}
                {% set target_midnight = as_timestamp((ts | timestamp_custom('%Y-%m-%d', true)) ~ ' 00:00:00') %}
                {% set today_midnight = as_timestamp(today_at('00:00:00')) %}
                {% set days = ((target_midnight - today_midnight) / 86400) | round(0) | int %}
                {% if days <= 0 %}dziś o {{ ts | timestamp_custom('%H:%M', true) }}
                {% elif days == 1 %}jutro o {{ ts | timestamp_custom('%H:%M', true) }}
                {% elif days == 2 %}za 2 dni o {{ ts | timestamp_custom('%H:%M', true) }}
                {% else %}za {{ days }} dni o {{ ts | timestamp_custom('%H:%M', true) }}{% endif %}
              planned_retry_mow_reason: >-
                {% if planning_mode != 'auto' or weather_forecast_at_start is not defined %}
                  wybrano kolejny termin z ustawionego okna koszenia, bez oceny prognozy godzinowej
                {% else %}
                  {% set items = weather_forecast_at_start.get(rain_source_entity, {}).get('forecast', []) %}
                  {% set ts = as_timestamp(planned_retry_mow_datetime | trim) %}
                  {% set bad = ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'snowy', 'hail'] %}
                  {% set urgent_growth = (planning_growth_mm | float(0)) >= (high_growth_threshold_mm | float(999)) %}
                  {% set fc = namespace(seen=0, rain=0, probability=0, temp=temp_c | float(10), wind=0, humidity=60, condition='') %}
                  {% set recent = namespace(rain=0, wet=0) %}
                  {% for item in items %}
                    {% set item_ts = as_timestamp(item.datetime) %}
                    {% if item_ts <= ts and item_ts > (ts - 3600) %}
                      {% set fc.seen = 1 %}
                      {% set fc.rain = item.precipitation | default(0) | float(0) %}
                      {% set fc.probability = item.precipitation_probability | default(0) | float(0) %}
                      {% set fc.temp = item.temperature | default(temp_c) | float(temp_c) %}
                      {% set fc.wind = item.wind_speed | default(0) | float(0) %}
                      {% set fc.humidity = item.humidity | default(60) | float(60) %}
                      {% set fc.condition = item.condition | default('') %}
                    {% endif %}
                    {% if item_ts <= ts and item_ts > (ts - ((dry_after_rain_hours | int(3)) * 3600)) %}
                      {% set recent_rain = item.precipitation | default(0) | float(0) %}
                      {% set recent_condition = item.condition | default('') %}
                      {% if recent_rain > 0.05 or recent_condition in bad %}
                        {% set recent.rain = recent.rain + recent_rain %}
                        {% set recent.wet = 1 %}
                      {% endif %}
                    {% endif %}
                  {% endfor %}
                  {% if fc.seen == 0 %}
                    to najbliższy sensowny termin, ale prognoza godzinowa nie ma już dokładnych danych dla tej godziny
                  {% elif fc.rain > 0.05 or fc.condition in bad %}
                    to najbezpieczniejsza następna próba w prognozie, mimo że nadal widać ryzyko opadu
                  {% elif urgent_growth and recent.wet == 0 and fc.humidity <= (wet_grass_humidity_percent | float(88)) %}
                    przyrost trawy jest wysoki, więc automatyzacja wybiera najbliższą bezpieczną próbę zamiast czekać na idealniejsze warunki kolejnego dnia
                  {% elif recent.wet == 1 %}
                    automatyzacja przesuwa start po deszczu, żeby nie kosić świeżo mokrego trawnika
                  {% elif fc.humidity > (wet_grass_humidity_percent | float(88)) %}
                    to najlepsza następna próba, ale wilgotność nadal jest wysoka, więc start może zostać ponownie przesunięty
                  {% else %}
                    prognoza pokazuje brak deszczu, przerwę po opadach i najniższe ryzyko mokrej trawy w wybranym oknie
                  {% endif %}
                  (ryzyko deszczu {{ fc.probability | round(0) }}%, opad {{ fc.rain | round(1) }} mm, wilgotność {{ fc.humidity | round(0) }}%, temperatura {{ fc.temp | round(0) }} st. C)
                {% endif %}
          - choose:
              - conditions:
                  - condition: template
                    alias: Start koszenia jest zablokowany
                    value_template: "{{ (start_block_reason | trim | length) > 0 }}"
                sequence:
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ (next_mow_helper | default('', true) | length) > 0 }}"
                        sequence:
                          - action: input_datetime.set_datetime
                            alias: Przesun nastepne koszenie
                            target:
                              entity_id: "{{ next_mow_helper }}"
                            data:
                              datetime: "{{ planned_retry_mow_datetime | trim }}"
                  - action: persistent_notification.create
                    data:
                      notification_id: "{{ notification_id }}"
                      title: "Worx: koszenie odlozone"
                      message: >-
                        Koszenie pominięte {{ current_time_label | trim }}.
                        Dlaczego: {{ start_block_reason | trim }}.
                        Następna próba: {{ planned_retry_mow_label | trim }}.
                        Dlaczego wtedy: {{ planned_retry_mow_reason | trim }}.
                  - stop: Warunki koszenia nie sa spelnione; przesunieto nastepne koszenie.
          - variables:
              mowing_cycle_started_at: "{{ current_time_label | trim }}"
          - action: worx_vision_cloud.start_one_time_mowing
            alias: Uruchom samo przycinanie krawedzi
            data:
              entity_id: !input mower_entity
              runtime: 0
              edge_cut: true
              zones: []
          - alias: Poczekaj na potwierdzenie wyjazdu do krawedzi
            repeat:
              while:
                - condition: template
                  value_template: >-
                    {{ states(mower_entity) in ['docked', 'paused']
                       and is_state(rain_binary_sensor, 'off')
                       and repeat.index <= ((mowing_start_confirm_timeout_minutes | int(5)) * 6) }}
              sequence:
                - delay: "00:00:10"
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ is_state(rain_binary_sensor, 'on') }}"
                sequence:
                  - action: lawn_mower.dock
                    target:
                      entity_id: !input mower_entity
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ (next_mow_helper | default('', true) | length) > 0 }}"
                        sequence:
                          - action: input_datetime.set_datetime
                            target:
                              entity_id: "{{ next_mow_helper }}"
                            data:
                              datetime: "{{ planned_retry_mow_datetime | trim }}"
                  - action: persistent_notification.create
                    data:
                      notification_id: "{{ notification_id }}"
                      title: "Worx: krawedzie przerwane"
                      message: >-
                        Po wyslaniu komendy przycinania krawedzi wlaczyl sie
                        czujnik deszczu. Robot zostal odeslany do bazy.
                        Nastepna proba: {{ planned_retry_mow_label | trim }}.
                  - stop: Przycinanie krawedzi przerwane przez deszcz.
              - conditions:
                  - condition: template
                    value_template: "{{ states(mower_entity) in ['docked', 'paused'] }}"
                sequence:
                  - action: worx_vision_cloud.start_one_time_mowing
                    alias: Ponow samo przycinanie krawedzi
                    data:
                      entity_id: !input mower_entity
                      runtime: 0
                      edge_cut: true
                      zones: []
                  - alias: Poczekaj na potwierdzenie drugiego startu krawedzi
                    repeat:
                      while:
                        - condition: template
                          value_template: >-
                            {{ states(mower_entity) in ['docked', 'paused']
                               and is_state(rain_binary_sensor, 'off')
                               and repeat.index <= ((mowing_start_confirm_timeout_minutes | int(5)) * 6) }}
                      sequence:
                        - delay: "00:00:10"
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ is_state(rain_binary_sensor, 'on') }}"
                sequence:
                  - action: lawn_mower.dock
                    target:
                      entity_id: !input mower_entity
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ (next_mow_helper | default('', true) | length) > 0 }}"
                        sequence:
                          - action: input_datetime.set_datetime
                            target:
                              entity_id: "{{ next_mow_helper }}"
                            data:
                              datetime: "{{ planned_retry_mow_datetime | trim }}"
                  - action: persistent_notification.create
                    data:
                      notification_id: "{{ notification_id }}"
                      title: "Worx: krawedzie przerwane"
                      message: >-
                        Przy ponowieniu komendy krawedzi wlaczyl sie czujnik
                        deszczu. Robot zostal odeslany do bazy. Nastepna proba:
                        {{ planned_retry_mow_label | trim }}.
                  - stop: Przycinanie krawedzi przerwane przez deszcz po ponowieniu.
              - conditions:
                  - condition: template
                    value_template: "{{ states(mower_entity) in ['docked', 'paused'] }}"
                sequence:
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ (next_mow_helper | default('', true) | length) > 0 }}"
                        sequence:
                          - action: input_datetime.set_datetime
                            target:
                              entity_id: "{{ next_mow_helper }}"
                            data:
                              datetime: "{{ planned_retry_mow_datetime | trim }}"
                  - action: persistent_notification.create
                    data:
                      notification_id: "{{ notification_id }}"
                      title: "Worx: krawedzie nie wystartowaly"
                      message: >-
                        Wyslano dwa razy sprawdzona komende samego przycinania
                        krawedzi, ale robot nie potwierdzil wyjazdu z bazy.
                        Zwykle koszenie nie zostanie uruchomione. Nastepna proba:
                        {{ planned_retry_mow_label | trim }}.
                  - stop: Nie potwierdzono startu przycinania krawedzi po dwoch probach.
          - condition: template
            alias: Przycinanie krawedzi rozpoczete
            value_template: "{{ states(mower_entity) not in ['docked', 'paused', 'unavailable', 'unknown'] }}"
          - action: persistent_notification.create
            data:
              notification_id: "{{ notification_id }}"
              title: "Worx: przycinanie krawedzi"
              message: >-
                Robot rozpoczal przycinanie krawedzi
                {{ current_time_label | trim }}. Po powrocie do bazy
                automatyzacja poczeka na naladowanie baterii do co najmniej
                {{ post_edge_battery_percent }}% i uruchomi zwykle koszenie.
          - wait_template: "{{ is_state(mower_entity, 'docked') or is_state(rain_binary_sensor, 'on') }}"
            alias: Poczekaj na zakonczenie krawedzi i powrot do bazy
            timeout: "02:00:00"
            continue_on_timeout: true
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ is_state(rain_binary_sensor, 'on') }}"
                sequence:
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ states(mower_entity) not in ['docked', 'unavailable', 'unknown'] }}"
                        sequence:
                          - action: lawn_mower.dock
                            target:
                              entity_id: !input mower_entity
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ (next_mow_helper | default('', true) | length) > 0 }}"
                        sequence:
                          - action: input_datetime.set_datetime
                            target:
                              entity_id: "{{ next_mow_helper }}"
                            data:
                              datetime: "{{ planned_retry_mow_datetime | trim }}"
                  - action: persistent_notification.create
                    data:
                      notification_id: "{{ notification_id }}"
                      title: "Worx: koszenie odlozone"
                      message: >-
                        Deszcz przerwal etap krawedzi. Robot zostal odeslany
                        do bazy, a zwykle koszenie nie zostanie uruchomione.
                        Nastepna proba: {{ planned_retry_mow_label | trim }}.
                  - stop: Deszcz przerwal etap krawedzi.
              - conditions:
                  - condition: template
                    value_template: "{{ not is_state(mower_entity, 'docked') }}"
                sequence:
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ states(mower_entity) not in ['unavailable', 'unknown'] }}"
                        sequence:
                          - action: lawn_mower.dock
                            target:
                              entity_id: !input mower_entity
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ (next_mow_helper | default('', true) | length) > 0 }}"
                        sequence:
                          - action: input_datetime.set_datetime
                            target:
                              entity_id: "{{ next_mow_helper }}"
                            data:
                              datetime: "{{ planned_retry_mow_datetime | trim }}"
                  - action: persistent_notification.create
                    data:
                      notification_id: "{{ notification_id }}"
                      title: "Worx: brak powrotu po krawedziach"
                      message: >-
                        Robot nie potwierdzil powrotu do bazy w ciagu 2 godzin
                        od rozpoczecia krawedzi. Wyslano komende powrotu, ale
                        zwykle koszenie nie zostanie uruchomione. Nastepna proba:
                        {{ planned_retry_mow_label | trim }}.
                  - stop: Nie potwierdzono powrotu do bazy po krawedziach.
          - wait_template: >-
              {{ is_state(rain_binary_sensor, 'on')
                 or not is_state(mower_entity, 'docked')
                 or (states(battery_sensor) | float(0)) >= (post_edge_battery_percent | float(80)) }}
            alias: Poczekaj w bazie na naladowanie baterii do 80 procent
            timeout: "08:00:00"
            continue_on_timeout: true
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ is_state(rain_binary_sensor, 'on') }}"
                sequence:
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ (next_mow_helper | default('', true) | length) > 0 }}"
                        sequence:
                          - action: input_datetime.set_datetime
                            target:
                              entity_id: "{{ next_mow_helper }}"
                            data:
                              datetime: "{{ planned_retry_mow_datetime | trim }}"
                  - action: persistent_notification.create
                    data:
                      notification_id: "{{ notification_id }}"
                      title: "Worx: koszenie odlozone"
                      message: >-
                        Krawedzie zostaly wykonane, ale podczas ladowania
                        zaczal padac deszcz. Zwykle koszenie nie wystartuje.
                        Nastepna proba: {{ planned_retry_mow_label | trim }}.
                  - stop: Po krawedziach zaczal padac deszcz.
              - conditions:
                  - condition: template
                    value_template: "{{ not is_state(mower_entity, 'docked') }}"
                sequence:
                  - action: persistent_notification.create
                    data:
                      notification_id: "{{ notification_id }}"
                      title: "Worx: robot opuscil baze"
                      message: >-
                        Po wykonaniu krawedzi robot przestal byc w bazie przed
                        osiagnieciem wymaganego poziomu baterii. Zwykle koszenie
                        nie zostanie uruchomione.
                  - stop: Robot opuscil baze podczas ladowania po krawedziach.
              - conditions:
                  - condition: template
                    value_template: >-
                      {{ (states(battery_sensor) | float(0))
                         < (post_edge_battery_percent | float(80)) }}
                sequence:
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ (next_mow_helper | default('', true) | length) > 0 }}"
                        sequence:
                          - action: input_datetime.set_datetime
                            target:
                              entity_id: "{{ next_mow_helper }}"
                            data:
                              datetime: "{{ planned_retry_mow_datetime | trim }}"
                  - action: persistent_notification.create
                    data:
                      notification_id: "{{ notification_id }}"
                      title: "Worx: bateria nie osiagnela 80%"
                      message: >-
                        Krawedzie zostaly wykonane, ale po 8 godzinach bateria
                        ma {{ states(battery_sensor) }}%. Zwykle koszenie nie
                        wystartuje. Nastepna proba:
                        {{ planned_retry_mow_label | trim }}.
                  - stop: Bateria nie osiagnela 80 procent po krawedziach.
          - condition: template
            alias: Robot w bazie i bateria minimum 80 procent
            value_template: >-
              {{ is_state(mower_entity, 'docked')
                 and (states(battery_sensor) | float(0)) >= (post_edge_battery_percent | float(80))
                 and is_state(rain_binary_sensor, 'off') }}
          - action: worx_vision_cloud.start_one_time_mowing
            alias: Uruchom normalne koszenie jednorazowe
            data:
              entity_id: !input mower_entity
              runtime: "{{ normal_mowing_runtime_minutes }}"
              edge_cut: false
              zones: []
          - alias: Poczekaj na potwierdzenie wyjazdu do koszenia
            repeat:
              while:
                - condition: template
                  value_template: >-
                    {{ states(mower_entity) in ['docked', 'paused']
                       and is_state(rain_binary_sensor, 'off')
                       and repeat.index <= ((mowing_start_confirm_timeout_minutes | int(5)) * 6) }}
              sequence:
                - delay: "00:00:10"
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ is_state(rain_binary_sensor, 'on') }}"
                sequence:
                  - action: lawn_mower.dock
                    target:
                      entity_id: !input mower_entity
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ (next_mow_helper | default('', true) | length) > 0 }}"
                        sequence:
                          - action: input_datetime.set_datetime
                            alias: Zapisz kolejna probe po deszczu przy starcie
                            target:
                              entity_id: "{{ next_mow_helper }}"
                            data:
                              datetime: "{{ planned_retry_mow_datetime | trim }}"
                  - action: persistent_notification.create
                    data:
                      notification_id: "{{ notification_id }}"
                      title: "Worx: koszenie odlozone"
                      message: >-
                        Koszenie nie zostalo wykonane. Po wyslaniu komendy
                        normalnego koszenia wlaczyl sie czujnik deszczu.
                        Następna próba:
                        {{ planned_retry_mow_label | trim }}.
                  - stop: Start koszenia przerwany przez deszcz.
              - conditions:
                  - condition: template
                    value_template: "{{ states(mower_entity) in ['docked', 'paused'] }}"
                sequence:
                  - action: worx_vision_cloud.start_one_time_mowing
                    alias: Ponow normalne koszenie jednorazowe
                    data:
                      entity_id: !input mower_entity
                      runtime: "{{ normal_mowing_runtime_minutes }}"
                      edge_cut: false
                      zones: []
                  - alias: Poczekaj na potwierdzenie drugiego startu koszenia
                    repeat:
                      while:
                        - condition: template
                          value_template: >-
                            {{ states(mower_entity) in ['docked', 'paused']
                               and is_state(rain_binary_sensor, 'off')
                               and repeat.index <= ((mowing_start_confirm_timeout_minutes | int(5)) * 6) }}
                      sequence:
                        - delay: "00:00:10"
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ is_state(rain_binary_sensor, 'on') }}"
                sequence:
                  - action: lawn_mower.dock
                    target:
                      entity_id: !input mower_entity
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ (next_mow_helper | default('', true) | length) > 0 }}"
                        sequence:
                          - action: input_datetime.set_datetime
                            alias: Zapisz kolejna probe po deszczu przy ponowieniu
                            target:
                              entity_id: "{{ next_mow_helper }}"
                            data:
                              datetime: "{{ planned_retry_mow_datetime | trim }}"
                  - action: persistent_notification.create
                    data:
                      notification_id: "{{ notification_id }}"
                      title: "Worx: koszenie odlozone"
                      message: >-
                        Koszenie nie zostalo wykonane. Po ponowieniu komendy
                        normalnego koszenia wlaczyl sie czujnik deszczu.
                        Następna próba:
                        {{ planned_retry_mow_label | trim }}.
                  - stop: Start koszenia przerwany przez deszcz po ponowieniu.
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ states(mower_entity) in ['docked', 'paused'] }}"
                sequence:
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ (next_mow_helper | default('', true) | length) > 0 }}"
                        sequence:
                          - action: input_datetime.set_datetime
                            alias: Zapisz kolejna probe po braku startu
                            target:
                              entity_id: "{{ next_mow_helper }}"
                            data:
                              datetime: "{{ planned_retry_mow_datetime | trim }}"
                  - action: persistent_notification.create
                    data:
                      notification_id: "{{ notification_id }}"
                      title: "Worx: koszenie nie wystartowalo"
                      message: >-
                        Wyslano komende normalnego koszenia jednorazowego,
                        ale kosiarka nadal ma stan {{ states(mower_entity) }}
                        po dwoch probach startu. Następna próba:
                        {{ planned_retry_mow_label | trim }}.
                  - stop: Nie potwierdzono startu koszenia po dwoch probach.
          - condition: template
            alias: Normalne koszenie rozpoczete
            value_template: "{{ states(mower_entity) not in ['docked', 'paused'] }}"
          - action: persistent_notification.create
            data:
              notification_id: "{{ notification_id }}"
              title: "Worx: koszenie rozpoczete"
              message: >-
                Kosiarka rozpoczęła koszenie {{ current_time_label | trim }}.
                Krawedzie zostaly juz wykonane, robot wrocil do bazy i
                naladowal baterie do {{ states(battery_sensor) }}%.
                Teraz wyslano komende normalnego koszenia jednorazowego.
                Planowany czas normalnego koszenia: {{ normal_mowing_runtime_minutes }} min.
          - alias: Koszenie przez wyliczony czas albo do deszczu
            repeat:
              while:
                - condition: template
                  value_template: >-
                    {{ is_state(rain_binary_sensor, 'off')
                       and states(mower_entity) not in ['docked', 'paused', 'unavailable', 'unknown']
                       and repeat.index <= (normal_mowing_runtime_minutes | int(60)) }}
              sequence:
                - delay: "00:01:00"
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ states(mower_entity) not in ['docked', 'paused', 'unavailable', 'unknown'] }}"
                sequence:
                  - action: lawn_mower.dock
                    target:
                      entity_id: !input mower_entity
          - wait_template: "{{ is_state(mower_entity, 'docked') or is_state(rain_binary_sensor, 'on') }}"
            alias: Poczekaj na powrot do bazy po normalnym koszeniu
            timeout: "00:30:00"
            continue_on_timeout: true
          - choose:
              - conditions:
                  - condition: template
                    value_template: >-
                      {{ is_state(rain_binary_sensor, 'off')
                         and is_state(mower_entity, 'docked') }}
                sequence:
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ planning_mode == 'auto' and rain_source_entity.split('.')[0] == 'weather' }}"
                        sequence:
                          - action: weather.get_forecasts
                            target:
                              entity_id: !input rain_source_entity
                            data:
                              type: hourly
                            response_variable: weather_forecast_after_mow
                  - variables:
                      planned_next_after_reset_datetime: >-
                        {% set fallback = next_mow_after_reset_datetime | trim %}
                        {% if planning_mode != 'auto' or weather_forecast_after_mow is not defined %}
                          {{ fallback }}
                        {% else %}
                          {% set items = weather_forecast_after_mow.get(rain_source_entity, {}).get('forecast', []) %}
                          {% set step = auto_planning_step_seconds | int(900) %}
                          {% set earliest_allowed_ts = [as_timestamp(fallback), as_timestamp(now()) + 300] | max %}
                          {% set horizon = namespace(max=0) %}
                          {% for item in items %}
                            {% set item_ts = as_timestamp(item.datetime) %}
                            {% if item_ts > horizon.max %}
                              {% set horizon.max = item_ts %}
                            {% endif %}
                          {% endfor %}
                          {% if horizon.max > 0 %}
                            {% set bad = ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'snowy', 'hail'] %}
                            {% set ns = namespace(best_ts=0, best_score=999999) %}
                            {% set first_day = earliest_allowed_ts | timestamp_custom('%Y-%m-%d', true) %}
                            {% for day in range(0, weather_search_days | int(4)) %}
                              {% set day_ts = as_timestamp(first_day ~ ' 00:00:00') + (day * 86400) %}
                              {% set target_date = day_ts | timestamp_custom('%Y-%m-%d', true) %}
                              {% set window_start = as_timestamp(target_date ~ ' ' ~ primary_start_time_value) %}
                              {% set raw_window_end = as_timestamp(target_date ~ ' ' ~ backup_start_time_value) %}
                              {% set window_end = raw_window_end if raw_window_end > window_start else window_start + 21600 %}
                              {% set search_end = [window_end, horizon.max + 3600] | min %}
                              {% set start_ts = [window_start, earliest_allowed_ts] | max %}
                              {% if start_ts <= search_end %}
                                {% set window_mid = ((window_start + window_end) / 2) %}
                                {% set first_slot = ((start_ts / step) | round(0, 'ceil') | int) * step %}
                                {% set slots = [(((search_end - first_slot) / step) | round(0, 'floor') | int) + 1, 0] | max %}
                                {% for slot in range(0, slots) %}
                                  {% set ts = first_slot + (slot * step) %}
                                  {% set fc = namespace(seen=0, rain=0, probability=0, temp=temp_c | float(10), wind=0, humidity=60, condition='') %}
                                  {% set recent = namespace(rain=0, wet=0) %}
                                  {% for item in items %}
                                    {% set item_ts = as_timestamp(item.datetime) %}
                                    {% if item_ts <= ts and item_ts > (ts - 3600) %}
                                      {% set fc.seen = 1 %}
                                      {% set fc.rain = item.precipitation | default(0) | float(0) %}
                                      {% set fc.probability = item.precipitation_probability | default(0) | float(0) %}
                                      {% set fc.temp = item.temperature | default(temp_c) | float(temp_c) %}
                                      {% set fc.wind = item.wind_speed | default(0) | float(0) %}
                                      {% set fc.humidity = item.humidity | default(60) | float(60) %}
                                      {% set fc.condition = item.condition | default('') %}
                                    {% endif %}
                                    {% if item_ts <= ts and item_ts > (ts - ((dry_after_rain_hours | int(3)) * 3600)) %}
                                      {% set recent_rain = item.precipitation | default(0) | float(0) %}
                                      {% set recent_condition = item.condition | default('') %}
                                      {% if recent_rain > 0.05 or recent_condition in bad %}
                                        {% set recent.rain = recent.rain + recent_rain %}
                                        {% set recent.wet = 1 %}
                                      {% endif %}
                                    {% endif %}
                                  {% endfor %}
                                  {% set score = (fc.rain * 500) + (fc.probability * 3) + (((fc.temp - 20) | abs) * 2) + (fc.wind * 0.8) + ((((ts - window_mid) | abs) / 3600) * 1.2) + (((ts - earliest_allowed_ts) / 86400) * 8) %}
                                  {% if fc.seen == 0 %}
                                    {% set score = score + 120 %}
                                  {% endif %}
                                  {% if fc.rain > 0.05 or fc.condition in bad %}
                                    {% set score = score + 10000 %}
                                  {% endif %}
                                  {% if fc.probability > (high_rain_probability_percent | float(60)) %}
                                    {% set score = score + 2000 %}
                                  {% endif %}
                                  {% if recent.wet == 1 %}
                                    {% set score = score + 1800 + (recent.rain * 200) %}
                                  {% endif %}
                                  {% if fc.humidity > (wet_grass_humidity_percent | float(88)) %}
                                    {% set score = score + 250 %}
                                  {% elif fc.humidity > 82 %}
                                    {% set score = score + 80 %}
                                  {% endif %}
                                  {% if score < ns.best_score %}
                                    {% set ns.best_score = score %}
                                    {% set ns.best_ts = ts %}
                                  {% endif %}
                                {% endfor %}
                              {% endif %}
                            {% endfor %}
                            {% if ns.best_ts > 0 %}
                              {{ ns.best_ts | timestamp_custom('%Y-%m-%d %H:%M:%S', true) }}
                            {% else %}
                              {{ fallback }}
                            {% endif %}
                          {% else %}
                            {{ fallback }}
                          {% endif %}
                        {% endif %}
                  - variables:
                      planned_next_after_reset_label: >-
                        {% set raw = planned_next_after_reset_datetime | trim %}
                        {% set ts = as_timestamp(raw) %}
                        {% set target_midnight = as_timestamp((ts | timestamp_custom('%Y-%m-%d', true)) ~ ' 00:00:00') %}
                        {% set today_midnight = as_timestamp(today_at('00:00:00')) %}
                        {% set days = ((target_midnight - today_midnight) / 86400) | round(0) | int %}
                        {% if days <= 0 %}dziś o {{ ts | timestamp_custom('%H:%M', true) }}
                        {% elif days == 1 %}jutro o {{ ts | timestamp_custom('%H:%M', true) }}
                        {% elif days == 2 %}za 2 dni o {{ ts | timestamp_custom('%H:%M', true) }}
                        {% else %}za {{ days }} dni o {{ ts | timestamp_custom('%H:%M', true) }}{% endif %}
                      planned_next_after_reset_reason: >-
                        {% if planning_mode != 'auto' or weather_forecast_after_mow is not defined %}
                          wybrano kolejny termin z ustawionego okna koszenia, bez oceny prognozy godzinowej
                        {% else %}
                          {% set items = weather_forecast_after_mow.get(rain_source_entity, {}).get('forecast', []) %}
                          {% set ts = as_timestamp(planned_next_after_reset_datetime | trim) %}
                          {% set bad = ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'snowy', 'hail'] %}
                          {% set fc = namespace(seen=0, rain=0, probability=0, temp=temp_c | float(10), wind=0, humidity=60, condition='') %}
                          {% set recent = namespace(rain=0, wet=0) %}
                          {% for item in items %}
                            {% set item_ts = as_timestamp(item.datetime) %}
                            {% if item_ts <= ts and item_ts > (ts - 3600) %}
                              {% set fc.seen = 1 %}
                              {% set fc.rain = item.precipitation | default(0) | float(0) %}
                              {% set fc.probability = item.precipitation_probability | default(0) | float(0) %}
                              {% set fc.temp = item.temperature | default(temp_c) | float(temp_c) %}
                              {% set fc.wind = item.wind_speed | default(0) | float(0) %}
                              {% set fc.humidity = item.humidity | default(60) | float(60) %}
                              {% set fc.condition = item.condition | default('') %}
                            {% endif %}
                            {% if item_ts <= ts and item_ts > (ts - ((dry_after_rain_hours | int(3)) * 3600)) %}
                              {% set recent_rain = item.precipitation | default(0) | float(0) %}
                              {% set recent_condition = item.condition | default('') %}
                              {% if recent_rain > 0.05 or recent_condition in bad %}
                                {% set recent.rain = recent.rain + recent_rain %}
                                {% set recent.wet = 1 %}
                              {% endif %}
                            {% endif %}
                          {% endfor %}
                          {% if fc.seen == 0 %}
                            to najbliższy sensowny termin, ale prognoza godzinowa nie ma już dokładnych danych dla tej godziny
                          {% elif fc.rain > 0.05 or fc.condition in bad %}
                            to najbezpieczniejszy dostępny termin w prognozie, mimo że nadal widać ryzyko opadu
                          {% elif recent.wet == 1 %}
                            automatyzacja odczeka po deszczu, żeby kolejne koszenie nie weszło na świeżo mokry trawnik
                          {% elif fc.humidity > (wet_grass_humidity_percent | float(88)) %}
                            to najlepszy dostępny termin, ale wilgotność nadal jest wysoka, więc start może zostać ponownie przesunięty
                          {% else %}
                            prognoza pokazuje brak deszczu, przerwę po opadach i najniższe ryzyko mokrej trawy w wybranym oknie
                          {% endif %}
                          (ryzyko deszczu {{ fc.probability | round(0) }}%, opad {{ fc.rain | round(1) }} mm, wilgotność {{ fc.humidity | round(0) }}%, temperatura {{ fc.temp | round(0) }} st. C)
                        {% endif %}
                  - action: input_datetime.set_datetime
                    target:
                      entity_id: !input last_mow_helper
                    data:
                      datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
                  - action: input_number.set_value
                    target:
                      entity_id: !input growth_helper
                    data:
                      value: 0
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ (next_mow_helper | default('', true) | length) > 0 }}"
                        sequence:
                          - action: input_datetime.set_datetime
                            target:
                              entity_id: "{{ next_mow_helper }}"
                            data:
                              datetime: "{{ planned_next_after_reset_datetime | trim }}"
                  - action: persistent_notification.create
                    data:
                      notification_id: "{{ notification_id }}"
                      title: "Worx: koszenie wykonane"
                      message: >-
                        Koszenie wystartowalo {{ mowing_cycle_started_at }} i
                        zakonczylo sie dziś o {{ now().strftime('%H:%M') }}.
                        Najpierw wykonano przycinanie krawedzi, potem robot
                        wrocil do bazy i naladowal akumulator do minimum
                        {{ post_edge_battery_percent }}%, a nastepnie wykonal
                        normalne koszenie trwajace okolo
                        {{ normal_mowing_runtime_minutes }} min.
                        Następne koszenie: {{ planned_next_after_reset_label | trim }}.
                        Dlaczego wtedy: {{ planned_next_after_reset_reason | trim }}.
            default:
              - action: input_number.set_value
                target:
                  entity_id: !input growth_helper
                data:
                  value: "{{ ((estimated_growth_mm | float) * 0.7) | round(1) }}"
              - choose:
                  - conditions:
                      - condition: template
                        value_template: "{{ (next_mow_helper | default('', true) | length) > 0 }}"
                    sequence:
                      - action: input_datetime.set_datetime
                        target:
                          entity_id: "{{ next_mow_helper }}"
                        data:
                          datetime: "{{ planned_retry_mow_datetime | trim }}"
              - action: persistent_notification.create
                data:
                  notification_id: "{{ notification_id }}"
                  title: "Worx: koszenie przerwane"
                  message: >-
                    {% if is_state(rain_binary_sensor, 'on') %}
                    Normalne koszenie zostalo przerwane przez deszcz.
                    {% else %}
                    Po normalnym koszeniu robot nie potwierdzil powrotu do bazy
                    w wymaganym czasie.
                    {% endif %}
                    Przyrost trawy
                    zostal zmniejszony tylko czesciowo do
                    {{ ((estimated_growth_mm | float) * 0.7) | round(1) }} mm.
                    Następna próba: {{ planned_retry_mow_label | trim }}.
                    Dlaczego wtedy: {{ planned_retry_mow_reason | trim }}.
