blueprint:
  name: Worx Vision Cloud PLUS - inteligentny harmonogram koszenia
  description: |
    Inteligentny harmonogram koszenia dla robotów Worx, sterowany z Home
    Assistant zamiast ze sztywnego harmonogramu w aplikacji WORX.

    Co robi automatyzacja:
    - szacuje dzienny przyrost trawy modelem Growth Potential (GP),
    - uwzględnia pogodę, opady, temperaturę, słońce, opcjonalną wilgotność gleby,
      podlewanie i nawożenie,
    - preferuje wybrane okno czasowe, ale w razie potrzeby szuka bezpiecznej godziny poza nim,
    - omija deszcz, świeżo mokry trawnik i temperatury poza ustawionym zakresem,
    - preferuje częste, lekkie koszenie robotem zamiast czekania na wysoką trawę.

    Źródło pogody:
    - własna stacja pogodowa lub lokalne czujniki dostarczają rzeczywiste pomiary,
    - zalecana integracja MeteoFusion HA dostarcza lokalnie korygowaną prognozę
      godzinową, bieżący opad i ocenę jakości prognozy,
    - można również użyć innej encji weather, np. Tomorrow.io,
    - prognoza jest używana raz podczas planowania do wybrania konkretnej godziny
      bez opadu i z bezpieczną temperaturą,
    - zapisana godzina nie jest później przesuwana przez okresowe zmiany prognozy,
    - w chwili startu pierwszeństwo mają rzeczywiste czujniki: przy suchej pogodzie
      robot rusza, a po wykryciu faktycznego deszczu wraca do bazy,
    - bez prognozy automatyzacja używa wybranego okna i sprawdza rzeczywiste
      warunki bezpośrednio przed startem.

    Jak wygląda cykl koszenia:
    1. Home Assistant uruchamia osobne przycinanie krawędzi.
    2. Automatyzacja czeka, aż robot wróci do bazy.
    3. Robot ładuje baterię do minimum 80%.
    4. Temperatura, deszcz, wilgotność i prognoza na najbliższe godziny są
       sprawdzane ponownie.
    5. Dopiero wtedy startuje normalne koszenie jednorazowe.

    Typ robota:
    - Worx Vision / RTK sam kończy koszenie według mapy lub strefy. Użytkownik
      nie musi ustawiać czasu pełnego koszenia. Powrót z niską baterią, ładowanie
      i automatyczne wznowienie są traktowane jako jeden cykl.
    - Starsze roboty Worx z przewodem granicznym nadal używają wyliczonego
      czasu pracy, bo tego wymaga ich tryb koszenia jednorazowego.

    Tryby pracy:
    - tryb automatyczny wybiera najlepszy termin z prognozy godzinowej,
    - przy zbyt wysokiej temperaturze najpierw szuka chłodniejszej godziny tego
      samego dnia; z FiatLux może wykorzystać także godziny nocne do 05:00,
    - tryb stałej godziny działa jak klasyczny harmonogram z drugą próbą startu,
    - koszenie nocne 22:00-05:00 jest dostępne tylko po potwierdzeniu akcesorium
      FiatLux.

    Powiadomienia:
    - po dziennym przeliczeniu przyrostu trawy,
    - po rozpoczęciu cyklu koszenia,
    - po zakończeniu albo przerwaniu cyklu po realnym starcie.

    Wymagania:
    - integracja Worx Vision Cloud PLUS 1.3.1 lub nowsza,
    - trzy helpery Home Assistant: przyrost trawy, ostatnie koszenie i następne
      planowane koszenie,
    - wyłączony harmonogram koszenia w aplikacji WORX.
  domain: automation
  author: Smart Service
  homeassistant:
    min_version: 2025.1.0
  source_url: https://github.com/SmartServicePL/worx_vision_cloud_plus_automation/blob/main/blueprints/automation/worx_vision_cloud_plus/smart_mowing_schedule.yaml
  input:
    mower_section:
      name: Kosiarka
      icon: mdi:robot-mower
      input:
        mower_entity:
          name: Kosiarka
          description: Encja lawn_mower z integracji Worx Vision Cloud PLUS.
          selector:
            entity:
              filter:
                - domain: lawn_mower
        battery_sensor:
          name: Bateria
          description: Sensor procentu baterii kosiarki.
          selector:
            entity:
              filter:
                - domain: sensor
        rain_binary_sensor:
          name: Bieżący stan opadu
          description: Binary sensor informujący, czy aktualnie pada. Może pochodzić z kosiarki albo lokalnej stacji pogodowej. Gdy jest dostępny, jego rzeczywisty pomiar ma pierwszeństwo nad prognozą deszczu.
          selector:
            entity:
              filter:
                - domain: binary_sensor
    weather_section:
      name: Pogoda
      icon: mdi:weather-partly-rainy
      input:
        temperature_source_entity:
          name: Temperatura
          description: Czujnik temperatury zewnetrznej albo encja weather z atrybutem temperature.
          selector:
            entity:
              filter:
                - domain: sensor
                - domain: weather
        rain_source_entity:
          name: Zmierzony opad
          description: Sensor sumy opadu z bieżącego dnia lub ostatnich 24 godzin albo encja weather. Nie wybieraj chwilowego natężenia opadu. W MeteoFusion HA suma opadu jest pobierana automatycznie.
          selector:
            entity:
              filter:
                - domain: sensor
                - domain: weather
        forecast_weather_entity:
          name: Prognoza godzinowa opcjonalnie
          description: Zalecana jest encja weather z integracji MeteoFusion HA. Automatyzacja raz wybierze z jej prognozy konkretną suchą godzinę z bezpieczną temperaturą i zapisze ją do czasu startu. Obsługiwane są również zwykłe encje weather, np. Tomorrow.io. Bez prognozy używane jest wybrane okno, a bieżące warunki są sprawdzane w chwili startu.
          default: ""
          selector:
            entity:
              filter:
                - domain: weather
        outdoor_humidity_sensor:
          name: Wilgotność powietrza opcjonalnie
          description: Lokalny sensor wilgotności zewnętrznej. Pomaga rozpoznać rosę i bardzo mokrą trawę. Bez niego automatyzacja użyje wilgotności z encji weather, jeśli jest dostępna.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
        sunlight_source_entity:
          name: Naslonecznienie / UV
          description: Sensor UV/naslonecznienia albo encja weather z atrybutem uv_index.
          selector:
            entity:
              filter:
                - domain: sensor
                - domain: weather
        soil_moisture_sensor:
          name: Wilgotnosc gleby opcjonalnie
          description: Mozesz zostawic puste. Wtedy automatyzacja policzy wirtualna wilgotnosc z pogody.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
    helpers_section:
      name: Helpery
      icon: mdi:database-clock
      input:
        growth_helper:
          name: Przyrost trawy
          description: Helper input_number przechowujacy szacowany przyrost trawy od ostatniego pelnego koszenia.
          selector:
            entity:
              filter:
                - domain: input_number
        last_mow_helper:
          name: Ostatnie koszenie
          description: Helper input_datetime aktualizowany po pelnym cyklu koszenia.
          selector:
            entity:
              filter:
                - domain: input_datetime
        next_mow_helper:
          name: Nastepne koszenie
          description: Helper input_datetime, w ktorym automatyzacja zapisuje przewidywany termin nastepnego koszenia.
          selector:
            entity:
              filter:
                - domain: input_datetime
    simple_settings_section:
      name: Proste ustawienia
      icon: mdi:tune-variant
      input:
        mower_cycle_type:
          name: Typ robota
          description: Dla Worx Vision / RTK robot sam kończy koszenie według mapy. Dla starszych robotów z przewodem granicznym automatyzacja używa wyliczonego czasu pracy.
          default: vision_rtk
          selector:
            select:
              mode: dropdown
              options:
                - label: Worx Vision / RTK
                  value: vision_rtk
                - label: Starszy Worx z przewodem granicznym
                  value: wired_timed
        mower_model:
          name: Model kosiarki
          description: Wybierz model WORX Vision / Vision Cloud albo tryb ręczny dla innego modelu.
          default: custom
          selector:
            select:
              mode: dropdown
              options:
                - label: Recznie / inny model
                  value: custom
                - label: Vision AI S250 WR202E - 250 m2
                  value: wr202e_250
                - label: Vision AI M600 WR206E - 600 m2
                  value: wr206e_600
                - label: Vision AI M800 WR208E - 800 m2
                  value: wr208e_800
                - label: Vision AI L1300 WR213E - 1300 m2
                  value: wr213e_1300
                - label: Vision AI L1600 WR216E - 1600 m2
                  value: wr216e_1600
                - label: Vision AI WR220 - 1/2 acre
                  value: wr220_2023
                - label: Vision Cloud 300 WR303E - 300 m2
                  value: wr303e_300
                - label: Vision Cloud 500 WR305E - 500 m2
                  value: wr305e_500
                - label: Vision Cloud 650 WR365E - 650 m2
                  value: wr365e_650
                - label: Vision Cloud 650 WR365E.1 Cut-to-Zero - 650 m2
                  value: wr365e1_650
                - label: Vision Cloud 800 WR308E - 800 m2
                  value: wr308e_800
                - label: Vision Cloud 1200 WR312E - 1200 m2
                  value: wr312e_1200
                - label: Vision Cloud 1800 WR318E - 1800 m2
                  value: wr318e_1800
                - label: Vision Cloud 3000 WR330E - 3000 m2
                  value: wr330e_3000
                - label: Vision Cloud 1/4 acre WR310/WR310.1
                  value: wr310_1012
                - label: Vision Cloud 1/2 acre WR320/WR320.1
                  value: wr320_2023
                - label: Vision Cloud 1 acre WR340
                  value: wr340_us_4047
                - label: Vision Cloud 4WD 600 WR340E - 600 m2
                  value: wr340e_600
                - label: Vision Cloud 4WD 1000 WR341E - 1000 m2
                  value: wr341e_1000
                - label: Vision Cloud 4WD 2000 WR342E - 2000 m2
                  value: wr342e_2000
                - label: Vision Cloud 4WD 4000 WR344E - 4000 m2
                  value: wr344e_4000
                - label: Vision Cloud 4WD 1/4 acre WR341/WR341.1
                  value: wr341_us_1012
                - label: Vision Cloud 4WD 1 acre WR344
                  value: wr344_us_4047
        lawn_area_m2:
          name: Powierzchnia trawnika
          description: Powierzchnia robocza trawnika w metrach kwadratowych.
          default: 500
          selector:
            number:
              min: 20
              max: 5000
              step: 10
              unit_of_measurement: m2
              mode: box
        growth_threshold_mode:
          name: Moment startu koszenia
          description: Automatyczny tryb dobiera niski prog startu dla robota koszacego. Zasada 1/3 zdzbla jest traktowana tylko jako limit bezpieczenstwa, a nie jako prog startu.
          default: auto_cutting_height
          selector:
            select:
              mode: dropdown
              options:
                - label: Automatycznie dla robota
                  value: auto_cutting_height
                - label: Reczny prog wzrostu
                  value: manual
        cutting_height_mm:
          name: Wysokosc koszenia
          description: Docelowa wysokosc trawy ustawiona w kosiarce. Automatyzacja uzywa jej do dobrania malego progu startu i limitu bezpiecznego koszenia.
          default: 40
          selector:
            number:
              min: 20
              max: 60
              step: 1
              unit_of_measurement: mm
              mode: slider
        planning_mode:
          name: Tryb wyboru godziny
          description: Automatycznie wybiera najlepsza godzine z prognozy albo trzyma sie stalej godziny.
          default: auto
          selector:
            select:
              mode: dropdown
              options:
                - label: Automatycznie z prognozy pogody
                  value: auto
                - label: Stala godzina
                  value: fixed
        mowing_window_preset:
          name: Preferowane okno koszenia
          description: Automatyzacja najpierw szuka bezpiecznej godziny w tym oknie. Jeżeli pogoda na to nie pozwala, może wybrać godzinę poza oknem jeszcze tego samego dnia. Opcja "Wlasne godziny" używa godzin ustawionych poniżej.
          default: before_noon
          selector:
            select:
              mode: dropdown
              options:
                - label: Rano (07:00 - 10:00)
                  value: morning
                - label: Przed poludniem (09:00 - 12:00)
                  value: before_noon
                - label: Poludnie (11:00 - 14:00)
                  value: noon
                - label: Popoludnie (14:00 - 17:00)
                  value: afternoon
                - label: Wieczor (17:00 - 20:00)
                  value: evening
                - label: Noc (22:00 - 05:00)
                  value: night
                - label: Wlasne godziny
                  value: custom
        fiatlux_installed:
          name: Czy robot ma zamontowane akcesorium FiatLux?
          description: Zaznacz tylko wtedy, gdy robot ma oswietlenie FiatLux. Jest wymagane dla okna nocnego 22:00-05:00.
          default: false
          selector:
            boolean:
        primary_start_time:
          name: Wlasny poczatek okna
          description: Uzywane przy opcji "Wlasne godziny". W trybie stalej godziny to glowny start.
          default: "10:00:00"
          selector:
            time:
        backup_start_time:
          name: Wlasny koniec okna
          description: Uzywane przy opcji "Wlasne godziny". W trybie stalej godziny to druga proba.
          default: "16:30:00"
          selector:
            time:
        automatic_irrigation_enabled:
          name: Automatyczne nawadnianie
          description: Wlacz, jesli trawnik jest regularnie podlewany automatycznie.
          default: false
          selector:
            boolean:
        fertilization_enabled:
          name: Trawnik nawozony
          description: Wlacz, jesli trawnik jest regularnie nawozony.
          default: false
          selector:
            boolean:
    advanced_growth_section:
      name: Zaawansowane - wzrost trawy
      icon: mdi:sprout
      collapsed: true
      input:
        growth_threshold_mm:
          name: Reczny prog startu koszenia
          description: Uzywany tylko wtedy, gdy moment startu koszenia ustawiono na "Reczny prog wzrostu".
          default: 3
          selector:
            number:
              min: 1
              max: 12
              step: 0.5
              unit_of_measurement: mm
              mode: slider
        high_growth_threshold_mm:
          name: Prog intensywnego koszenia
          description: W trybie automatycznym jest wyliczany z progu startu i limitu 1/3 wysokosci koszenia. Ten suwak dziala tylko przy recznym progu wzrostu.
          default: 6
          selector:
            number:
              min: 2
              max: 25
              step: 0.5
              unit_of_measurement: mm
              mode: slider
        irrigation_growth_adjustment_percent:
          name: Korekta wzrostu przy nawadnianiu
          description: Uzywane tylko przy wlaczonym automatycznym nawadnianiu.
          default: 140
          selector:
            number:
              min: 100
              max: 220
              step: 5
              unit_of_measurement: "%"
              mode: slider
        fertilization_growth_adjustment_percent:
          name: Korekta wzrostu przy nawozeniu
          description: Uzywane tylko przy wlaczonym nawozeniu.
          default: 125
          selector:
            number:
              min: 100
              max: 180
              step: 5
              unit_of_measurement: "%"
              mode: slider
        min_days_between_mows:
          name: Minimalna przerwa miedzy koszeniami
          description: Zabezpieczenie przed zbyt czestym uruchamianiem. Wartosc 1 dzien oznacza kolejny dzien kalendarzowy, zeby robot mogl kosic codziennie, gdy wzrost i pogoda sa odpowiednie.
          default: 1
          selector:
            number:
              min: 0
              max: 7
              step: 0.5
              unit_of_measurement: d
              mode: slider
    advanced_runtime_section:
      name: Zaawansowane - starsze roboty z przewodem
      icon: mdi:timer-cog
      collapsed: true
      input:
        mower_capacity_m2_per_hour:
          name: Ręczna wydajność kosiarki
          description: Używane tylko przy typie "Starszy Worx z przewodem granicznym" i modelu "Ręcznie / inny model".
          default: 80
          selector:
            number:
              min: 20
              max: 250
              step: 5
              unit_of_measurement: m2/h
              mode: slider
        model_capacity_adjustment_percent:
          name: Korekta wydajnosci modelu
          description: Dla starszych robotów z przewodem pozwala skorygować wyliczony czas pracy przy wąskich przejazdach, wielu strefach albo prostym trawniku.
          default: 100
          selector:
            number:
              min: 50
              max: 150
              step: 5
              unit_of_measurement: "%"
              mode: slider
        min_runtime_minutes:
          name: Minimalny czas koszenia dla robota przewodowego
          default: 45
          selector:
            number:
              min: 10
              max: 180
              step: 5
              unit_of_measurement: min
              mode: slider
        max_runtime_minutes:
          name: Maksymalny czas koszenia dla robota przewodowego
          default: 120
          selector:
            number:
              min: 30
              max: 120
              step: 15
              unit_of_measurement: min
              mode: slider
    advanced_safety_section:
      name: Zaawansowane - bezpieczenstwo
      icon: mdi:shield-check
      collapsed: true
      input:
        growth_update_time:
          name: Godzina przeliczenia przyrostu
          default: "05:30:00"
          selector:
            time:
        min_battery_percent:
          name: Minimalna bateria do startu
          default: 45
          selector:
            number:
              min: 10
              max: 100
              step: 5
              unit_of_measurement: "%"
              mode: slider
        min_mowing_temperature_c:
          name: Minimalna temperatura koszenia
          description: Ponizej tej temperatury koszenie zostanie przelozone na cieplejszy termin.
          default: 10
          selector:
            number:
              min: 0
              max: 20
              step: 1
              unit_of_measurement: "°C"
              mode: slider
        max_mowing_temperature_c:
          name: Maksymalna temperatura koszenia
          description: Powyzej tej temperatury koszenie zostanie przelozone na chlodniejszy termin.
          default: 25
          selector:
            number:
              min: 20
              max: 40
              step: 1
              unit_of_measurement: "°C"
              mode: slider
        max_rain_24h_mm:
          name: Próg intensywnego opadu
          description: Po przekroczeniu tej zmierzonej wartości automatyzacja podwaja czas schnięcia trawy. Sam opad nie blokuje koszenia przez całą dobę.
          default: 3
          selector:
            number:
              min: 0
              max: 30
              step: 0.5
              unit_of_measurement: mm
              mode: slider
        max_soil_moisture_percent:
          name: Maksymalna wilgotnosc gleby dla startu
          description: "Ustaw ponizej 100%, jesli wilgotnosc gleby ma blokowac start. Domyslnie wilgotnosc sluzy tylko do liczenia przyrostu trawy."
          default: 100
          selector:
            number:
              min: 20
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: slider
        mowing_start_confirm_timeout_minutes:
          name: Maksymalny czas potwierdzenia startu koszenia
          description: Ile minut automatyzacja czeka na wyjazd po komendzie normalnego koszenia albo przycinania krawedzi.
          default: 5
          selector:
            number:
              min: 2
              max: 20
              step: 1
              unit_of_measurement: min
              mode: slider

mode: single
max_exceeded: silent

triggers:
  - trigger: time
    id: update_growth
    at: !input growth_update_time
  - trigger: time
    id: start_scheduled
    at: !input next_mow_helper
  - trigger: time_pattern
    id: start_due_check
    minutes: "/5"
  - trigger: state
    id: external_mowing_started
    entity_id: !input mower_entity
    to: mowing
    for: "00:10:00"

variables:
  mower_entity: !input mower_entity
  battery_sensor: !input battery_sensor
  rain_binary_sensor: !input rain_binary_sensor
  temperature_source_entity: !input temperature_source_entity
  rain_source_entity: !input rain_source_entity
  forecast_weather_entity_input: !input forecast_weather_entity
  outdoor_humidity_sensor: !input outdoor_humidity_sensor
  soil_moisture_sensor: !input soil_moisture_sensor
  sunlight_source_entity: !input sunlight_source_entity
  growth_helper: !input growth_helper
  last_mow_helper: !input last_mow_helper
  next_mow_helper: !input next_mow_helper
  mower_cycle_type: !input mower_cycle_type
  mower_model: !input mower_model
  lawn_area_m2: !input lawn_area_m2
  manual_mower_capacity_m2_per_hour: !input mower_capacity_m2_per_hour
  model_capacity_adjustment_percent: !input model_capacity_adjustment_percent
  growth_threshold_mode: !input growth_threshold_mode
  cutting_height_mm: !input cutting_height_mm
  manual_growth_threshold_mm: !input growth_threshold_mm
  growth_threshold_mm: >-
    {% if growth_threshold_mode == 'auto_cutting_height' %}
      {% set height = cutting_height_mm | float(40) %}
      {% set threshold = height * 0.075 %}
      {% if threshold < 2 %}2{% elif threshold > 4.5 %}4.5{% else %}{{ threshold | round(1) }}{% endif %}
    {% else %}
      {{ manual_growth_threshold_mm }}
    {% endif %}
  automatic_irrigation_enabled: !input automatic_irrigation_enabled
  irrigation_growth_adjustment_percent: !input irrigation_growth_adjustment_percent
  fertilization_enabled: !input fertilization_enabled
  fertilization_growth_adjustment_percent: !input fertilization_growth_adjustment_percent
  manual_high_growth_threshold_mm: !input high_growth_threshold_mm
  high_growth_threshold_mm: >-
    {% if growth_threshold_mode == 'auto_cutting_height' %}
      {% set safe_limit = (cutting_height_mm | float(40)) / 3 %}
      {% set intensive = (growth_threshold_mm | float(3)) * 2 %}
      {% if intensive > safe_limit %}{{ safe_limit | round(1) }}{% else %}{{ intensive | round(1) }}{% endif %}
    {% else %}
      {{ manual_high_growth_threshold_mm }}
    {% endif %}
  min_days_between_mows: !input min_days_between_mows
  min_battery_percent: !input min_battery_percent
  min_mowing_temperature_c: !input min_mowing_temperature_c
  max_mowing_temperature_c: !input max_mowing_temperature_c
  post_edge_battery_percent: 80
  vision_completion_battery_percent: 95
  vision_completion_stable_minutes: 15
  max_rain_24h_mm: !input max_rain_24h_mm
  max_soil_moisture_percent: !input max_soil_moisture_percent
  min_runtime_minutes: !input min_runtime_minutes
  max_runtime_minutes: !input max_runtime_minutes
  mowing_start_confirm_timeout_minutes: !input mowing_start_confirm_timeout_minutes
  planning_mode: !input planning_mode
  mowing_window_preset: !input mowing_window_preset
  fiatlux_installed: !input fiatlux_installed
  custom_primary_start_time_value: !input primary_start_time
  custom_backup_start_time_value: !input backup_start_time
  primary_start_time_value: >-
    {% if mowing_window_preset == 'morning' %}07:00:00
    {% elif mowing_window_preset == 'before_noon' %}09:00:00
    {% elif mowing_window_preset == 'noon' %}11:00:00
    {% elif mowing_window_preset == 'afternoon' %}14:00:00
    {% elif mowing_window_preset == 'evening' %}17:00:00
    {% elif mowing_window_preset == 'night' %}22:00:00
    {% else %}{{ custom_primary_start_time_value }}{% endif %}
  backup_start_time_value: >-
    {% if mowing_window_preset == 'morning' %}10:00:00
    {% elif mowing_window_preset == 'before_noon' %}12:00:00
    {% elif mowing_window_preset == 'noon' %}14:00:00
