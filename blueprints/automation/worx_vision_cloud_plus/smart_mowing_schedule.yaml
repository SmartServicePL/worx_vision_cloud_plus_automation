      {% set m = now().month %}
      {% set base = 72 if m in [12, 1, 2] else (58 if m in [3, 4, 10, 11] else 45) %}
      {% set temp_drying = -8 if temp < 5 else (-3 if temp < 12 else (4 if temp < 20 else (10 if temp < 26 else (18 if temp < 32 else 25)))) %}
      {% set raw = base + rain * 7 - temp_drying - sun * 1.8 %}
