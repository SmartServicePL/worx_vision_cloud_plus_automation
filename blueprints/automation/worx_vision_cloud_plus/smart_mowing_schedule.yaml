                  - stop: Warunki koszenia nie sa spelnione; przesunieto nastepne koszenie.
          - variables:
              mowing_cycle_started_at: "{{ now().strftime('%d.%m %H:%M') }}"
              mowing_cycle_started_ts: "{{ as_timestamp(now()) }}"
          - action: worx_vision_cloud.start_one_time_mowing
            alias: Uruchom samo przycinanie krawedzi
            data:
              entity_id: !input mower_entity
              runtime: 0
              edge_cut: true
              zones: []
          - alias: Poczekaj na potwierdzenie wyjazdu do krawedzi
            repeat:
              while:
                - condition: template
                  value_template: >-
                    {{ states(mower_entity) in ['docked', 'paused']
                       and is_state(rain_binary_sensor, 'off')
                       and repeat.index <= ((mowing_start_confirm_timeout_minutes | int(5)) * 6) }}
              sequence:
                - delay: "00:00:10"
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ is_state(rain_binary_sensor, 'on') }}"
                sequence:
                  - action: lawn_mower.dock
                    target:
                      entity_id: !input mower_entity
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ (next_mow_helper | default('', true) | length) > 0 }}"
                        sequence:
                          - action: input_datetime.set_datetime
                            target:
                              entity_id: "{{ next_mow_helper }}"
                            data:
                              datetime: "{{ planned_retry_mow_datetime | trim }}"
                  - action: persistent_notification.create
                    data:
                      notification_id: "{{ notification_id }}"
                      title: "Worx: koszenie przełożone"
                      message: >-
                        Powód: deszcz podczas uruchamiania krawędzi.
                        Robot wraca do bazy.
                        {{ retry_notification_details | trim }}
                  - stop: Przycinanie krawedzi przerwane przez deszcz.
              - conditions:
                  - condition: template
                    value_template: "{{ states(mower_entity) in ['docked', 'paused'] }}"
                sequence:
                  - action: worx_vision_cloud.start_one_time_mowing
                    alias: Ponow samo przycinanie krawedzi
                    data:
                      entity_id: !input mower_entity
                      runtime: 0
                      edge_cut: true
                      zones: []
                  - alias: Poczekaj na potwierdzenie drugiego startu krawedzi
                    repeat:
                      while:
                        - condition: template
                          value_template: >-
                            {{ states(mower_entity) in ['docked', 'paused']
                               and is_state(rain_binary_sensor, 'off')
                               and repeat.index <= ((mowing_start_confirm_timeout_minutes | int(5)) * 6) }}
                      sequence:
                        - delay: "00:00:10"
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ is_state(rain_binary_sensor, 'on') }}"
                sequence:
                  - action: lawn_mower.dock
                    target:
                      entity_id: !input mower_entity
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ (next_mow_helper | default('', true) | length) > 0 }}"
                        sequence:
                          - action: input_datetime.set_datetime
                            target:
                              entity_id: "{{ next_mow_helper }}"
                            data:
                              datetime: "{{ planned_retry_mow_datetime | trim }}"
                  - action: persistent_notification.create
                    data:
                      notification_id: "{{ notification_id }}"
                      title: "Worx: koszenie przełożone"
                      message: >-
                        Powód: deszcz podczas ponownego uruchamiania krawędzi.
                        Robot wraca do bazy.
                        {{ retry_notification_details | trim }}
                  - stop: Przycinanie krawedzi przerwane przez deszcz po ponowieniu.
              - conditions:
                  - condition: template
                    value_template: "{{ states(mower_entity) in ['docked', 'paused'] }}"
                sequence:
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ (next_mow_helper | default('', true) | length) > 0 }}"
                        sequence:
                          - action: input_datetime.set_datetime
                            target:
                              entity_id: "{{ next_mow_helper }}"
                            data:
                              datetime: "{{ planned_retry_mow_datetime | trim }}"
                  - action: persistent_notification.create
                    data:
                      notification_id: "{{ notification_id }}"
                      title: "Worx: koszenie przełożone"
                      message: >-
                        Powód: robot nie potwierdził startu krawędzi po dwóch
                        próbach. {{ retry_notification_details | trim }}
                  - stop: Nie potwierdzono startu przycinania krawedzi po dwoch probach.
          - condition: template
            alias: Przycinanie krawedzi rozpoczete
            value_template: "{{ states(mower_entity) not in ['docked', 'paused', 'unavailable', 'unknown'] }}"
          - variables:
              edge_mowing_started_ts: "{{ as_timestamp(now()) }}"
          - action: persistent_notification.create
