    {% set context = state_attr(entity, 'smart_service_context') if entity | length > 0 else none %}
    {% set current = context.get('current', {}) if context is mapping else {} %}
    {{ current.get('rain_today', 0) | float(0) if current is mapping else 0 }}
  model_capacity_m2_per_hour: >-
    {% set model = mower_model %}
