       or (smart_weather_current_temperature_available | string | lower) == 'true' %}
    {% if states(mower_entity) != 'docked' %}
      kosiarka nie jest w bazie, aktualny stan: {{ states(mower_entity) }}. Stare reczne koszenie nie bedzie wznawiane automatycznie
    {% elif mowing_window_preset == 'night' and not (fiatlux_installed | bool) %}
      wybrano koszenie nocne, ale nie potwierdzono zamontowanego akcesorium FiatLux
    {% elif (states(battery_sensor) | float(0)) < (min_battery_percent | float) %}
      bateria ma {{ states(battery_sensor) }}%, a wymagane minimum to {{ min_battery_percent }}%
    {% elif not temperature_available %}
      nie mozna odczytac aktualnej temperatury zewnetrznej
    {% elif (temp_c | float) < (min_mowing_temperature_c | float) %}
      temperatura wynosi {{ temp_c | round(1) }} st. C i jest nizsza od minimalnej temperatury koszenia {{ min_mowing_temperature_c }} st. C
    {% elif (temp_c | float) > (max_mowing_temperature_c | float) %}
      temperatura wynosi {{ temp_c | round(1) }} st. C i przekracza maksymalna temperature koszenia {{ max_mowing_temperature_c }} st. C
    {% elif (rain_observation_available | string | lower) != 'true' %}
      nie można odczytać aktualnego stanu opadu ani z czujnika, ani z MeteoFusion HA
    {% elif state_attr(mower_entity, 'rain_delay') == true %}
      chmura Worx zgłasza aktywne opóźnienie po deszczu
    {% elif (rain_active_now | string | lower) == 'true' %}
      lokalny pomiar lub MeteoFusion HA wskazuje trwający opad
    {% elif (rain_drying_required | string | lower) == 'true' %}
      trawa jeszcze schnie po deszczu; wymagane jest około {{ rain_drying_hours | float(3) | round(0, 'ceil') | int }} godz. od ustania opadu{% if (rain_mm | float(0)) > (max_rain_24h_mm | float(3)) %}, ponieważ opad {{ rain_mm }} mm przekroczył próg intensywnego deszczu {{ max_rain_24h_mm }} mm{% endif %}. Najwcześniejszy start po wyschnięciu: {{ rain_drying_ready_label | trim }}
    {% elif (outdoor_humidity_available | string | lower) == 'true'
          and (outdoor_humidity_percent | float(60)) > (wet_grass_humidity_percent | float(88)) %}
      wilgotność powietrza wynosi {{ outdoor_humidity_percent | round(0) }}%, więc trawa może być mokra od rosy lub mgły
    {% elif (soil_moisture | float) > (max_soil_moisture_percent | float) %}
      gleba jest zbyt mokra: {{ soil_moisture }}%
    {% elif (estimated_growth_mm | float) < (growth_threshold_mm | float) %}
      szacowany przyrost trawy to {{ estimated_growth_mm }} mm, a prog startu robota to {{ growth_threshold_mm }} mm{% if growth_threshold_mode == 'auto_cutting_height' %} (czeste koszenie po trochu; limit 1/3 to okolo {{ ((cutting_height_mm | float(40)) / 3) | round(1) }} mm){% endif %}
    {% elif (mowing_gap_ready_ts | float(0)) > as_timestamp(now()) %}
      od ostatniego koszenia nie minela minimalna przerwa; najwczesniej {{ (mowing_gap_ready_ts | float(0)) | timestamp_custom('%Y-%m-%d %H:%M', true) }}
    {% else %}
      {{ '' }}
    {% endif %}

actions:
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'external_mowing_started' }}"
          - condition: template
            value_template: "{{ state_attr(mower_entity, 'rtk_at_station') != true }}"
          - condition: template
            value_template: "{{ state_attr(mower_entity, 'status_id') | int(-1) != 32 }}"
        sequence:
          - variables:
              manual_mow_started_ts: "{{ as_timestamp(trigger.to_state.last_changed) }}"
              manual_mow_started_at: >-
                {{ as_timestamp(trigger.to_state.last_changed) | timestamp_custom('%d.%m %H:%M', true) }}
          - alias: Monitoruj reczne koszenie, lacznie z doładowaniem Vision / RTK
            repeat:
              while:
                - condition: template
                  value_template: >-
                    {% set mower_changed_ts = as_timestamp(states[mower_entity].last_changed) %}
                    {% set battery_changed_ts = as_timestamp(states[battery_sensor].last_changed) %}
                    {% set stable_since_ts = [mower_changed_ts, battery_changed_ts] | max %}
                    {% set vision_complete = is_state(mower_entity, 'docked')
                        and (states(battery_sensor) | float(0)) >= (vision_completion_battery_percent | float(95))
                        and state_attr(mower_entity, 'rain_delay') != true
                        and (as_timestamp(now()) - stable_since_ts) >= ((vision_completion_stable_minutes | int(15)) * 60) %}
                    {% set completed = vision_complete if mower_cycle_type == 'vision_rtk'
                        else is_state(mower_entity, 'docked') %}
                    {{ not completed
                       and repeat.index <= (normal_mowing_monitor_limit_minutes | int(480)) }}
              sequence:
                - delay: "00:01:00"
          - choose:
              - conditions:
                  - condition: template
                    value_template: >-
                      {% set mower_changed_ts = as_timestamp(states[mower_entity].last_changed) %}
                      {% set battery_changed_ts = as_timestamp(states[battery_sensor].last_changed) %}
                      {% set stable_since_ts = [mower_changed_ts, battery_changed_ts] | max %}
                      {% set vision_complete = is_state(mower_entity, 'docked')
                          and (states(battery_sensor) | float(0)) >= (vision_completion_battery_percent | float(95))
                          and state_attr(mower_entity, 'rain_delay') != true
                          and (as_timestamp(now()) - stable_since_ts) >= ((vision_completion_stable_minutes | int(15)) * 60) %}
                      {{ not (vision_complete if mower_cycle_type == 'vision_rtk'
                          else is_state(mower_entity, 'docked')) }}
                sequence:
                  - action: persistent_notification.create
                    data:
                      notification_id: "{{ notification_id }}"
                      title: "Worx: koszenie ręczne przerwane"
                      message: |
                        Robot nie potwierdził zakończenia pełnego koszenia.

                        Stan robota:
                        {{ states(mower_entity) }}.

                        Trawa:
                        Skumulowany przyrost pozostaje bez zmian: {{ estimated_growth_mm }} mm.
                  - stop: Reczne koszenie nie zostalo potwierdzone jako zakonczone.
          - variables:
              manual_mow_finished_ts: "{{ as_timestamp(states[mower_entity].last_changed) }}"
              manual_mow_finished_at: >-
                {{ (manual_mow_finished_ts | float) | timestamp_custom('%Y-%m-%d %H:%M:%S', true) }}
              manual_mow_finished_label: >-
                {{ (manual_mow_finished_ts | float) | timestamp_custom('%d.%m %H:%M', true) }}
              manual_mow_duration_minutes: >-
                {{ ((((manual_mow_finished_ts | float) - (manual_mow_started_ts | float)) / 60) | round(0)) | int }}
              manual_next_mow_datetime: "{{ next_mow_after_reset_datetime | trim }}"
              manual_next_mow_label: >-
                {% set raw = next_mow_after_reset_datetime | trim %}
                {% set ts = as_timestamp(raw) %}
                {% set target_midnight = as_timestamp((ts | timestamp_custom('%Y-%m-%d', true)) ~ ' 00:00:00') %}
                {% set today_midnight = as_timestamp(today_at('00:00:00')) %}
                {% set days = ((target_midnight - today_midnight) / 86400) | round(0) | int %}
                {% if days <= 0 %}dziś o {{ ts | timestamp_custom('%H:%M', true) }}
                {% elif days == 1 %}jutro o {{ ts | timestamp_custom('%H:%M', true) }}
                {% elif days == 2 %}za 2 dni o {{ ts | timestamp_custom('%H:%M', true) }}
                {% else %}za {{ days }} dni o {{ ts | timestamp_custom('%H:%M', true) }}{% endif %}
          - action: input_datetime.set_datetime
            alias: Zapisz reczne koszenie jako ostatnie koszenie
            target:
              entity_id: !input last_mow_helper
            data:
              datetime: "{{ manual_mow_finished_at }}"
          - action: input_number.set_value
            alias: Wyzeruj przyrost po recznym koszeniu
            target:
              entity_id: !input growth_helper
            data:
              value: 0
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ (next_mow_helper | default('', true) | length) > 0 }}"
                sequence:
                  - action: input_datetime.set_datetime
                    alias: Przelicz nastepne koszenie po recznym koszeniu
                    target:
                      entity_id: "{{ next_mow_helper }}"
                    data:
                      datetime: "{{ manual_next_mow_datetime }}"
          - action: persistent_notification.create
            data:
              notification_id: "{{ notification_id }}"
              title: "Worx: koszenie ręczne zakończone"
              message: |
                Czas:
                Start: {{ manual_mow_started_at }}
                Koniec: {{ manual_mow_finished_label }}
                Cały cykl do końcowego powrotu: {{ manual_mow_duration_minutes }} min.

                Następne koszenie:
                {{ manual_next_mow_label | trim }}

      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'update_growth' }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ (forecast_weather_entity | trim | length) > 0 }}"
                sequence:
                  - action: weather.get_forecasts
                    continue_on_error: true
                    target:
                      entity_id: "{{ forecast_weather_entity | trim }}"
                    data:
                      type: hourly
                    response_variable: weather_forecast
          - variables:
              planned_next_mow_datetime: >-
                {%- set fallback = stable_next_mow_datetime | trim -%}
                {%- set step = auto_planning_step_seconds | int(900) -%}
                {%- set earliest_allowed_ts = [as_timestamp(fallback), as_timestamp(now()) + 300, rain_drying_ready_ts | float(0)] | max -%}
                {%- set fallback_check_ts = ((earliest_allowed_ts / step) | round(0, 'ceil') | int) * step -%}
                {%- set candidate_date = earliest_allowed_ts | timestamp_custom('%Y-%m-%d', true) -%}
                {%- set preferred_start = as_timestamp(candidate_date ~ ' ' ~ primary_start_time_value) -%}
                {%- set raw_preferred_end = as_timestamp(candidate_date ~ ' ' ~ backup_start_time_value) -%}
                {%- if backup_start_time_value <= primary_start_time_value and (earliest_allowed_ts | timestamp_custom('%H:%M:%S', true)) < backup_start_time_value -%}
                  {%- set preferred_start = preferred_start - 86400 -%}
                  {%- set preferred_end = raw_preferred_end -%}
                {%- else -%}
                  {%- set preferred_end = raw_preferred_end if raw_preferred_end > preferred_start else raw_preferred_end + 86400 -%}
                {%- endif -%}
                {%- if earliest_allowed_ts <= preferred_start -%}
                  {%- set preferred_candidate_ts = preferred_start -%}
                {%- elif earliest_allowed_ts <= preferred_end -%}
                  {%- set preferred_candidate_ts = fallback_check_ts -%}
                {%- else -%}
                  {%- set preferred_candidate_ts = preferred_start + 86400 -%}
                {%- endif -%}
                {%- if planning_mode != 'auto' or weather_forecast is not defined or weather_forecast is not mapping -%}
                  {{ preferred_candidate_ts | timestamp_custom('%Y-%m-%d %H:%M:%S', true) }}
                {%- else -%}
                  {%- set items = weather_forecast.get(forecast_weather_entity | trim, {}).get('forecast', []) -%}
                  {%- set limited_items = items[:(weather_forecast_max_items | int(120))] -%}
                  {%- set bad = ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'snowy', 'hail'] -%}
                  {%- set horizon = namespace(max=0) -%}
                  {%- set conditional = namespace(earliest=earliest_allowed_ts) -%}
                  {%- for item in limited_items -%}
                    {%- set item_ts = as_timestamp(item.datetime) -%}
                    {%- if item_ts > horizon.max -%}
                      {%- set horizon.max = item_ts -%}
                    {%- endif -%}
                    {%- if item_ts >= earliest_allowed_ts -%}
                      {%- set item_rain = item.precipitation | default(0) | float(0) -%}
                      {%- set item_probability = item.precipitation_probability | default(0) | float(0) -%}
                      {%- set item_temp = item.temperature | default(temp_c) | float(temp_c) -%}
                      {%- set item_humidity = item.humidity | default(60) | float(60) -%}
                      {%- set item_condition = item.condition | default('') -%}
                      {%- if ((forecast_rain_is_advisory | string | lower) != 'true'
                              and (item_rain > (forecast_rain_block_mm | float(0.2))
                                   or item_probability > (high_rain_probability_percent | float(75))
                                   or item_condition in bad))
                          or item_temp < (min_mowing_temperature_c | float(10))
                          or item_temp > (max_mowing_temperature_c | float(25))
                          or item_humidity > (wet_grass_humidity_percent | float(88)) -%}
                        {%- set recovered_ts = item_ts + ((dry_after_rain_hours | int(3)) * 3600) -%}
                        {%- if recovered_ts > conditional.earliest -%}
                          {%- set conditional.earliest = recovered_ts -%}
                        {%- endif -%}
                      {%- endif -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {%- set conditional_check_ts = ((conditional.earliest / step) | round(0, 'ceil') | int) * step -%}
                  {%- set conditional_date = conditional.earliest | timestamp_custom('%Y-%m-%d', true) -%}
                  {%- set conditional_start = as_timestamp(conditional_date ~ ' ' ~ primary_start_time_value) -%}
                  {%- set conditional_raw_end = as_timestamp(conditional_date ~ ' ' ~ backup_start_time_value) -%}
                  {%- if backup_start_time_value <= primary_start_time_value and (conditional.earliest | timestamp_custom('%H:%M:%S', true)) < backup_start_time_value -%}
                    {%- set conditional_start = conditional_start - 86400 -%}
                    {%- set conditional_end = conditional_raw_end -%}
                  {%- else -%}
                    {%- set conditional_end = conditional_raw_end if conditional_raw_end > conditional_start else conditional_raw_end + 86400 -%}
                  {%- endif -%}
                  {%- if conditional.earliest <= conditional_start -%}
                    {%- set conditional_candidate_ts = conditional_start -%}
                  {%- elif conditional.earliest <= conditional_end -%}
                    {%- set conditional_candidate_ts = conditional_check_ts -%}
                  {%- else -%}
                    {%- set conditional_candidate_ts = conditional_start + 86400 -%}
                  {%- endif -%}
                  {%- if horizon.max > 0 -%}
                    {%- set ns = namespace(selected_ts=0) -%}
                    {%- set first_day_ts = earliest_allowed_ts -%}
                    {%- set earliest_clock = earliest_allowed_ts | timestamp_custom('%H:%M:%S', true) -%}
                    {%- if backup_start_time_value <= primary_start_time_value and earliest_clock < backup_start_time_value -%}
                      {%- set first_day_ts = earliest_allowed_ts - 86400 -%}
                    {%- endif -%}
                    {%- set first_day = first_day_ts | timestamp_custom('%Y-%m-%d', true) -%}
                    {%- for day in range(0, weather_search_days | int(4)) -%}
                      {%- set day_ns = namespace(preferred_ts=0, preferred_score=999999, fallback_ts=0, fallback_score=999999) -%}
                      {%- set day_ts = as_timestamp(first_day ~ ' 00:00:00') + (day * 86400) -%}
                      {%- set target_date = day_ts | timestamp_custom('%Y-%m-%d', true) -%}
                      {%- set preferred_start = as_timestamp(target_date ~ ' ' ~ primary_start_time_value) -%}
                      {%- set raw_preferred_end = as_timestamp(target_date ~ ' ' ~ backup_start_time_value) -%}
                      {%- set preferred_end = raw_preferred_end if raw_preferred_end > preferred_start else raw_preferred_end + 86400 -%}
                      {%- if mowing_window_preset == 'night' -%}
                        {%- set search_start = preferred_start -%}
                        {%- set raw_search_end = preferred_end -%}
                      {%- else -%}
                        {%- set search_start = as_timestamp(target_date ~ ' 06:00:00') -%}
                        {%- if fiatlux_installed | bool -%}
                          {%- set raw_search_end = as_timestamp(target_date ~ ' 05:00:00') + 86400 -%}
                        {%- else -%}
                          {%- set raw_search_end = as_timestamp(target_date ~ ' 22:00:00') -%}
                        {%- endif -%}
                      {%- endif -%}
                      {%- set search_end = [raw_search_end, horizon.max + 3600] | min -%}
                      {%- set start_ts = [search_start, earliest_allowed_ts] | max -%}
                      {%- if start_ts <= search_end -%}
                        {%- set window_mid = ((preferred_start + preferred_end) / 2) -%}
                        {%- set first_slot = ((start_ts / step) | round(0, 'ceil') | int) * step -%}
                        {%- set slots = [(((search_end - first_slot) / step) | round(0, 'floor') | int) + 1, 0] | max -%}
                        {%- for slot in range(0, slots) -%}
                          {%- set ts = first_slot + (slot * step) -%}
                          {%- set fc = namespace(seen=0, rain=0, probability=0, temp=temp_c | float(10), wind=0, humidity=60, condition='', confidence=70) -%}
                          {%- set recent = namespace(rain=0, heavy_window_rain=0, bad=0) -%}
                          {%- set future = namespace(seen=0, rain=0, probability=0, unsafe=0) -%}
                          {%- for item in limited_items -%}
                            {%- set item_ts = as_timestamp(item.datetime) -%}
                            {%- if item_ts <= ts and item_ts > (ts - 3600) -%}
                              {%- set fc.seen = 1 -%}
                              {%- set fc.rain = item.precipitation | default(0) | float(0) -%}
                              {%- set fc.probability = item.precipitation_probability | default(0) | float(0) -%}
                              {%- set fc.temp = item.temperature | default(temp_c) | float(temp_c) -%}
                              {%- set fc.wind = item.wind_speed | default(0) | float(0) -%}
                              {%- set fc.humidity = item.humidity | default(60) | float(60) -%}
                              {%- set fc.condition = item.condition | default('') -%}
                              {%- set fc.confidence = item.confidence | default(70) | float(70) -%}
                            {%- endif -%}
                            {%- if item_ts <= ts and item_ts > (ts - ((dry_after_rain_hours | int(3)) * 3600)) -%}
                              {%- set recent_rain = item.precipitation | default(0) | float(0) -%}
                              {%- set recent_condition = item.condition | default('') -%}
                              {%- set recent.rain = recent.rain + recent_rain -%}
                              {%- if recent_condition in bad -%}
                                {%- set recent.bad = 1 -%}
                              {%- endif -%}
                            {%- endif -%}
                            {%- if item_ts <= ts and item_ts > (ts - ((dry_after_rain_hours | int(3)) * 7200)) -%}
                              {%- set recent.heavy_window_rain = recent.heavy_window_rain + (item.precipitation | default(0) | float(0)) -%}
                            {%- endif -%}
                            {%- if item_ts > ts and item_ts <= (ts + ((forecast_dry_horizon_hours | int(3)) * 3600)) -%}
                              {%- set future.seen = future.seen + 1 -%}
                              {%- set future_rain = item.precipitation | default(0) | float(0) -%}
                              {%- set future_probability = item.precipitation_probability | default(0) | float(0) -%}
                              {%- set future_temp = item.temperature | default(temp_c) | float(temp_c) -%}
                              {%- set future_humidity = item.humidity | default(60) | float(60) -%}
                              {%- set future_condition = item.condition | default('') -%}
                              {%- set future.rain = future.rain + future_rain -%}
                              {%- if future_probability > future.probability -%}
                                {%- set future.probability = future_probability -%}
                              {%- endif -%}
                              {%- if ((forecast_rain_is_advisory | string | lower) != 'true'
                                      and future_condition in bad)
                                  or future_temp < (min_mowing_temperature_c | float(10))
                                  or future_temp > (max_mowing_temperature_c | float(25))
                                  or future_humidity > (wet_grass_humidity_percent | float(88)) -%}
                                {%- set future.unsafe = 1 -%}
                              {%- endif -%}
                            {%- endif -%}
                          {%- endfor -%}
                          {%- set recent_wet = recent.rain > (forecast_rain_block_mm | float(0.2))
                              or recent.bad == 1
                              or recent.heavy_window_rain > (max_rain_24h_mm | float(3)) -%}
                          {%- if (forecast_rain_is_advisory | string | lower) != 'true'
                              and (future.rain > (forecast_rain_block_mm | float(0.2))
                                   or future.probability > (high_rain_probability_percent | float(75))) -%}
                            {%- set future.unsafe = 1 -%}
                          {%- endif -%}
                          {%- set rain_score = 0 if (forecast_rain_is_advisory | string | lower) == 'true'
                              else ((fc.rain * 500) + (future.rain * 300) + (fc.probability * 3) + (future.probability * 1.5)) -%}
                          {%- set score = rain_score + (((fc.temp - 20) | abs) * 2) + (fc.wind * 0.8) + ((100 - fc.confidence) * 0.4) + ((((ts - window_mid) | abs) / 3600) * 1.2) + (((ts - earliest_allowed_ts) / 86400) * (forecast_delay_penalty_per_day | float(8))) -%}
                          {%- if fc.seen == 0 -%}
                            {%- set score = score + 120 -%}
                          {%- endif -%}
                          {%- if (forecast_rain_is_advisory | string | lower) != 'true'
                              and (fc.rain > (forecast_rain_block_mm | float(0.2)) or fc.condition in bad) -%}
                            {%- set score = score + 10000 -%}
                          {%- endif -%}
                          {%- if (forecast_rain_is_advisory | string | lower) != 'true'
                              and fc.probability > (high_rain_probability_percent | float(75)) -%}
                            {%- set score = score + 2000 -%}
                          {%- endif -%}
                          {%- if recent_wet and (forecast_rain_is_advisory | string | lower) != 'true' -%}
                            {%- set score = score + 1800 + (recent.rain * 200) + (recent.heavy_window_rain * 100) -%}
                          {%- endif -%}
                          {%- if future.unsafe == 1 or future.seen < (forecast_min_future_hours | int(2)) -%}
                            {%- set score = score + 6000 -%}
                          {%- endif -%}
                          {%- if fc.humidity > (wet_grass_humidity_percent | float(88)) -%}
                            {%- set score = score + 250 -%}
                          {%- elif fc.humidity > 82 -%}
                            {%- set score = score + 80 -%}
                          {%- endif -%}
                          {%- set safe = fc.seen == 1
                              and fc.temp >= (min_mowing_temperature_c | float(10))
                              and fc.temp <= (max_mowing_temperature_c | float(25))
                              and ((forecast_rain_is_advisory | string | lower) == 'true'
                                   or ((fc.rain + future.rain) <= (forecast_rain_block_mm | float(0.2))
                                       and fc.condition not in bad
                                       and fc.probability <= (high_rain_probability_percent | float(75))
                                       and not recent_wet))
                              and future.unsafe == 0
                              and future.seen >= (forecast_min_future_hours | int(2))
                              and fc.humidity <= (wet_grass_humidity_percent | float(88))
                              and (mowing_window_preset != 'night' or (fiatlux_installed | bool)) -%}
                          {%- if safe and score < day_ns.fallback_score -%}
                            {%- set day_ns.fallback_score = score -%}
                            {%- set day_ns.fallback_ts = ts -%}
                          {%- endif -%}
                          {%- if safe and ts >= preferred_start and ts <= preferred_end and score < day_ns.preferred_score -%}
                            {%- set day_ns.preferred_score = score -%}
                            {%- set day_ns.preferred_ts = ts -%}
                          {%- endif -%}
                        {%- endfor -%}
                      {%- endif -%}
                      {%- if ns.selected_ts == 0 -%}
                        {%- if day_ns.preferred_ts > 0 -%}
                          {%- set ns.selected_ts = day_ns.preferred_ts -%}
                        {%- elif day_ns.fallback_ts > 0 -%}
                          {%- set ns.selected_ts = day_ns.fallback_ts -%}
                        {%- endif -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {%- if ns.selected_ts > 0 -%}
                      {{ ns.selected_ts | timestamp_custom('%Y-%m-%d %H:%M:%S', true) }}
                    {%- else -%}
                      {{ conditional_candidate_ts | timestamp_custom('%Y-%m-%d %H:%M:%S', true) }}
                    {%- endif -%}
                  {%- else -%}
                    {{ preferred_candidate_ts | timestamp_custom('%Y-%m-%d %H:%M:%S', true) }}
                  {%- endif -%}
                {%- endif -%}
          - variables:
              planned_next_mow_future_status: >-
                {% if weather_forecast is not defined or weather_forecast is not mapping %}
                  unknown
                {% else %}
                  {% set items = weather_forecast.get(forecast_weather_entity | trim, {}).get('forecast', []) %}
                  {% set limited_items = items[:(weather_forecast_max_items | int(120))] %}
                  {% set ts = as_timestamp(planned_next_mow_datetime | trim) %}
                  {% set bad = ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'snowy', 'hail'] %}
                  {% set future = namespace(seen=0, rain=0, probability=0, unsafe=0) %}
                  {% for item in limited_items %}
                    {% set item_ts = as_timestamp(item.datetime) %}
                    {% if item_ts > ts and item_ts <= (ts + ((forecast_dry_horizon_hours | int(3)) * 3600)) %}
                      {% set future.seen = future.seen + 1 %}
                      {% set future.rain = future.rain + (item.precipitation | default(0) | float(0)) %}
                      {% set item_probability = item.precipitation_probability | default(0) | float(0) %}
                      {% if item_probability > future.probability %}
                        {% set future.probability = item_probability %}
                      {% endif %}
                      {% if ((forecast_rain_is_advisory | string | lower) != 'true'
                              and (item.condition | default('')) in bad)
                          or (item.temperature | default(temp_c) | float(temp_c)) < (min_mowing_temperature_c | float(10))
                          or (item.temperature | default(temp_c) | float(temp_c)) > (max_mowing_temperature_c | float(25))
                          or (item.humidity | default(60) | float(60)) > (wet_grass_humidity_percent | float(88)) %}
                        {% set future.unsafe = 1 %}
                      {% endif %}
                    {% endif %}
                  {% endfor %}
                  {% if (forecast_rain_is_advisory | string | lower) != 'true'
                      and (future.rain > (forecast_rain_block_mm | float(0.2))
                           or future.probability > (high_rain_probability_percent | float(75))) %}
                    {% set future.unsafe = 1 %}
                  {% endif %}
                  {{ 'safe' if future.unsafe == 0 and future.seen >= (forecast_min_future_hours | int(2)) else 'unsafe' }}
                {% endif %}
          - variables:
              planned_next_mow_label: >-
                {% set raw = planned_next_mow_datetime | trim %}
                {% set ts = as_timestamp(raw) %}
                {% set target_midnight = as_timestamp((ts | timestamp_custom('%Y-%m-%d', true)) ~ ' 00:00:00') %}
                {% set today_midnight = as_timestamp(today_at('00:00:00')) %}
                {% set days = ((target_midnight - today_midnight) / 86400) | round(0) | int %}
                {% if days <= 0 %}dziś o {{ ts | timestamp_custom('%H:%M', true) }}
                {% elif days == 1 %}jutro o {{ ts | timestamp_custom('%H:%M', true) }}
                {% elif days == 2 %}za 2 dni o {{ ts | timestamp_custom('%H:%M', true) }}
                {% else %}za {{ days }} dni o {{ ts | timestamp_custom('%H:%M', true) }}{% endif %}
              planned_next_mow_reason: >-
                {% if planning_mode != 'auto' or weather_forecast is not defined or weather_forecast is not mapping %}
                  wybrano termin z ustawionego okna koszenia, bez oceny prognozy godzinowej
                {% else %}
                  {% set items = weather_forecast.get(forecast_weather_entity | trim, {}).get('forecast', []) %}
                  {% set limited_items = items[:(weather_forecast_max_items | int(120))] %}
                  {% set ts = as_timestamp(planned_next_mow_datetime | trim) %}
                  {% set bad = ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'snowy', 'hail'] %}
                  {% set urgent_growth = (planning_growth_mm | float(0)) >= (high_growth_threshold_mm | float(999)) %}
                  {% set fc = namespace(seen=0, rain=0, probability=0, temp=temp_c | float(10), wind=0, humidity=60, condition='') %}
                  {% set recent = namespace(rain=0, heavy_window_rain=0, bad=0) %}
                  {% set future = namespace(rain=0, probability=0) %}
                  {% for item in limited_items %}
                    {% set item_ts = as_timestamp(item.datetime) %}
                    {% if item_ts <= ts and item_ts > (ts - 3600) %}
                      {% set fc.seen = 1 %}
                      {% set fc.rain = item.precipitation | default(0) | float(0) %}
                      {% set fc.probability = item.precipitation_probability | default(0) | float(0) %}
                      {% set fc.temp = item.temperature | default(temp_c) | float(temp_c) %}
                      {% set fc.wind = item.wind_speed | default(0) | float(0) %}
                      {% set fc.humidity = item.humidity | default(60) | float(60) %}
                      {% set fc.condition = item.condition | default('') %}
                    {% endif %}
                    {% if item_ts <= ts and item_ts > (ts - ((dry_after_rain_hours | int(3)) * 3600)) %}
                      {% set recent_rain = item.precipitation | default(0) | float(0) %}
                      {% set recent_condition = item.condition | default('') %}
                      {% set recent.rain = recent.rain + recent_rain %}
                      {% if recent_condition in bad %}
                        {% set recent.bad = 1 %}
                      {% endif %}
                    {% endif %}
                    {% if item_ts <= ts and item_ts > (ts - ((dry_after_rain_hours | int(3)) * 7200)) %}
                      {% set recent.heavy_window_rain = recent.heavy_window_rain + (item.precipitation | default(0) | float(0)) %}
                    {% endif %}
                    {% if item_ts > ts and item_ts <= (ts + ((forecast_dry_horizon_hours | int(3)) * 3600)) %}
                      {% set future.rain = future.rain + (item.precipitation | default(0) | float(0)) %}
                      {% set item_probability = item.precipitation_probability | default(0) | float(0) %}
                      {% if item_probability > future.probability %}
                        {% set future.probability = item_probability %}
                      {% endif %}
                    {% endif %}
                  {% endfor %}
                  {% set recent_wet = recent.rain > (forecast_rain_block_mm | float(0.2))
                      or recent.bad == 1
                      or recent.heavy_window_rain > (max_rain_24h_mm | float(3)) %}
                  {% set selected_clock = ts | timestamp_custom('%H:%M:%S', true) %}
                  {% if backup_start_time_value <= primary_start_time_value %}
                    {% set inside_preferred_window = selected_clock >= primary_start_time_value or selected_clock <= backup_start_time_value %}
                  {% else %}
                    {% set inside_preferred_window = selected_clock >= primary_start_time_value and selected_clock <= backup_start_time_value %}
                  {% endif %}
                  {% if fc.seen == 0 %}
                    to najbliższy sensowny termin, ale prognoza godzinowa nie ma już dokładnych danych dla tej godziny
                  {% elif fc.temp < (min_mowing_temperature_c | float(10)) %}
                    prognozowana temperatura {{ fc.temp | round(1) }} st. C jest nizsza od zalecanego minimum {{ min_mowing_temperature_c }} st. C, wiec termin moze zostac przesuniety
                  {% elif fc.temp > (max_mowing_temperature_c | float(25)) %}
                    prognozowana temperatura {{ fc.temp | round(1) }} st. C przekracza zalecane maksimum {{ max_mowing_temperature_c }} st. C, wiec termin moze zostac przesuniety
                  {% elif (forecast_rain_is_advisory | string | lower) == 'true'
                        and ((fc.rain + future.rain) > (forecast_rain_block_mm | float(0.2)) or fc.condition in bad) %}
                    prognoza zapowiada opad, ale rzeczywisty czujnik ma pierwszeństwo; robot wystartuje, jeśli w chwili startu czujnik nadal będzie suchy
                  {% elif (forecast_rain_is_advisory | string | lower) != 'true'
                        and ((fc.rain + future.rain) > (forecast_rain_block_mm | float(0.2)) or fc.condition in bad) %}
                    to najbezpieczniejszy dostępny termin w prognozie, ale suma prognozowanego opadu podczas koszenia wynosi {{ (fc.rain + future.rain) | round(2) }} mm
                  {% elif (planned_next_mow_future_status | trim) != 'safe' %}
                    prognoza nie potwierdza bezpiecznych warunków przez kolejne {{ forecast_dry_horizon_hours }} godz., więc termin może zostać ponownie przesunięty
                  {% elif not inside_preferred_window %}
                    to najbliższa bezpieczna godzina poza preferowanym oknem; w wybranym oknie nie ma warunków spełniających temperaturę, opad i wilgotność
                  {% elif urgent_growth and not recent_wet and fc.humidity <= (wet_grass_humidity_percent | float(88)) %}
                    przyrost trawy jest wysoki, więc automatyzacja wybrała najbliższe bezpieczne okno zamiast czekać na idealniejsze warunki kolejnego dnia
                  {% elif recent_wet and (forecast_rain_is_advisory | string | lower) != 'true' %}
                    to pierwsze sensowne okno po deszczu; automatyzacja odczekała, żeby trawnik nie był świeżo mokry
                  {% elif fc.humidity > (wet_grass_humidity_percent | float(88)) %}
                    to najlepszy dostępny termin, ale wilgotność nadal jest wysoka, więc start może zostać ponownie przesunięty
                  {% else %}
                    prognoza pokazuje brak deszczu, przerwę po opadach i najniższe ryzyko mokrej trawy w wybranym oknie
                  {% endif %}
                {% endif %}
              planned_next_mow_forecast: >-
                {% if weather_forecast is not defined or weather_forecast is not mapping %}
                  unknown;brak prognozy godzinowej dla wskazanego terminu
                {% else %}
                  {% set items = weather_forecast.get(forecast_weather_entity | trim, {}).get('forecast', []) %}
                  {% set limited_items = items[:(weather_forecast_max_items | int(120))] %}
                  {% set ts = as_timestamp(planned_next_mow_datetime | trim) %}
                  {% set bad = ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'snowy', 'hail'] %}
                  {% set fc = namespace(seen=0, rain=0, probability=0, temp=temp_c | float(10), humidity=60, condition='', confidence=70) %}
                  {% set recent = namespace(rain=0, heavy_window_rain=0, bad=0) %}
                  {% set future = namespace(rain=0, probability=0) %}
                  {% for item in limited_items %}
                    {% set item_ts = as_timestamp(item.datetime) %}
                    {% if item_ts <= ts and item_ts > (ts - 3600) %}
                      {% set fc.seen = 1 %}
                      {% set fc.rain = item.precipitation | default(0) | float(0) %}
                      {% set fc.probability = item.precipitation_probability | default(0) | float(0) %}
                      {% set fc.temp = item.temperature | default(temp_c) | float(temp_c) %}
                      {% set fc.humidity = item.humidity | default(60) | float(60) %}
                      {% set fc.condition = item.condition | default('') %}
                      {% set fc.confidence = item.confidence | default(70) | float(70) %}
                    {% endif %}
                    {% if item_ts <= ts and item_ts > (ts - ((dry_after_rain_hours | int(3)) * 3600)) %}
                      {% set recent.rain = recent.rain + (item.precipitation | default(0) | float(0)) %}
                      {% if (item.condition | default('')) in bad %}
                        {% set recent.bad = 1 %}
                      {% endif %}
                    {% endif %}
                    {% if item_ts <= ts and item_ts > (ts - ((dry_after_rain_hours | int(3)) * 7200)) %}
                      {% set recent.heavy_window_rain = recent.heavy_window_rain + (item.precipitation | default(0) | float(0)) %}
                    {% endif %}
                    {% if item_ts > ts and item_ts <= (ts + ((forecast_dry_horizon_hours | int(3)) * 3600)) %}
                      {% set future.rain = future.rain + (item.precipitation | default(0) | float(0)) %}
                      {% set item_probability = item.precipitation_probability | default(0) | float(0) %}
                      {% if item_probability > future.probability %}
                        {% set future.probability = item_probability %}
                      {% endif %}
                    {% endif %}
                  {% endfor %}
                  {% set recent_wet = recent.rain > (forecast_rain_block_mm | float(0.2))
                      or recent.bad == 1
                      or recent.heavy_window_rain > (max_rain_24h_mm | float(3)) %}
                  {% set safe = fc.seen == 1
                      and fc.temp >= (min_mowing_temperature_c | float(10))
                      and fc.temp <= (max_mowing_temperature_c | float(25))
                      and ((forecast_rain_is_advisory | string | lower) == 'true'
                           or ((fc.rain + future.rain) <= (forecast_rain_block_mm | float(0.2))
                               and fc.condition not in bad
                               and fc.probability <= (high_rain_probability_percent | float(75))
                               and not recent_wet))
                      and (planned_next_mow_future_status | trim) == 'safe'
                      and fc.humidity <= (wet_grass_humidity_percent | float(88))
                      and (mowing_window_preset != 'night' or (fiatlux_installed | bool)) %}
                  {% set condition_names = {
                    'clear-night': 'bezchmurnie',
                    'cloudy': 'pochmurno',
                    'exceptional': 'nietypowe warunki',
                    'fog': 'mgła',
                    'hail': 'grad',
                    'lightning': 'burze',
                    'lightning-rainy': 'burze z deszczem',
                    'partlycloudy': 'częściowe zachmurzenie',
                    'pouring': 'ulewny deszcz',
                    'rainy': 'deszcz',
                    'snowy': 'śnieg',
                    'snowy-rainy': 'deszcz ze śniegiem',
                    'sunny': 'słonecznie',
                    'windy': 'wietrznie',
                    'windy-variant': 'wietrznie z zachmurzeniem'
                  } %}
                  {% set condition_label = condition_names.get(fc.condition, fc.condition if fc.condition else 'brak opisu') %}
                  {{ 'safe' if safe else 'unsafe' }};{{ condition_label }}, temperatura {{ fc.temp | round(1) }} st. C, opad w godzinie startu {{ fc.rain | round(2) }} mm, opad przez kolejne {{ forecast_dry_horizon_hours }} godz. {{ future.rain | round(2) }} mm, najwyższe ryzyko deszczu {{ [fc.probability, future.probability] | max | round(0) }}%, wilgotność {{ fc.humidity | round(0) }}%{% if (smart_weather_context_available | string | lower) == 'true' %}, pewność MeteoFusion {{ fc.confidence | round(0) }}%{% endif %}
                {% endif %}
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ trigger.id == 'update_growth' }}"
                sequence:
                  - action: input_number.set_value
                    target:
                      entity_id: !input growth_helper
                    data:
                      value: "{{ new_growth_mm }}"
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ (next_mow_helper | default('', true) | length) > 0 }}"
                sequence:
                  - action: input_datetime.set_datetime
                    target:
                      entity_id: "{{ next_mow_helper }}"
                    data:
                      datetime: "{{ planned_next_mow_datetime | trim }}"
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ trigger.id == 'update_growth' }}"
                sequence:
                  - action: persistent_notification.create
                    data:
                      notification_id: "{{ notification_id }}"
                      title: "Worx: przeliczono przyrost"
                      message: |
                        Skumulowany przyrost: {{ new_growth_mm }} mm
                        (próg {{ growth_threshold_mm }} mm).
                        {% set planned_date = (as_timestamp(planned_next_mow_datetime | trim) | timestamp_custom('%Y-%m-%d', true)) %}
                        {% set today_date = now().strftime('%Y-%m-%d') %}

                        Dzisiejsza decyzja:
                        {% if planned_date == today_date %}
                        Kosiarka ma dziś zaplanowane koszenie.
                        {% else %}
                        Według aktualnych warunków kosiarka nie będzie dziś kosiła.
                        {% endif %}

                        {% if (planned_next_mow_forecast | trim).startswith('safe;') %}
                        Planowane koszenie:
                        {{ planned_next_mow_label | trim }}.

                        Prognoza podczas koszenia:
                        {{ (planned_next_mow_forecast | trim).split(';', 1)[1] }}.

                        Powód wyboru: {{ planned_next_mow_reason | trim }}.

                        Termin został zapisany i nie będzie zmieniany w tle przed startem.
                        W podanej godzinie automatyzacja sprawdzi rzeczywisty deszcz i temperaturę.
                        {% else %}
                        Wyznaczony termin kontroli:
                        {{ planned_next_mow_label | trim }}.

                        Status terminu:
                        Prognoza nie potwierdza całego bezpiecznego cyklu.

                        Prognoza dla tej godziny:
                        {{ (planned_next_mow_forecast | trim).split(';', 1)[1] }}.

                        Powód wyboru: {{ planned_next_mow_reason | trim }}.

                        Termin nie będzie przesuwany w tle. W tej godzinie automatyzacja
                        sprawdzi rzeczywiste warunki i w razie blokady poda nową konkretną godzinę.
                        {% endif %}
      - conditions:
          - condition: template
            value_template: "{{ trigger.id in ['start_scheduled', 'start_due_check'] and scheduled_start_due | trim == 'on' }}"
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ (forecast_weather_entity | trim | length) > 0 }}"
                sequence:
                  - action: weather.get_forecasts
                    continue_on_error: true
                    target:
                      entity_id: "{{ forecast_weather_entity | trim }}"
                    data:
                      type: hourly
                    response_variable: weather_forecast_at_start
          - variables:
              effective_start_block_reason: >-
                {{ start_block_reason | trim }}
          - variables:
              planned_retry_mow_datetime: >-
                {%- set fallback = next_mow_datetime | trim -%}
                {%- set step = auto_planning_step_seconds | int(900) -%}
                {%- set retry_base_ts = as_timestamp(now()) + 300
                    if planning_mode == 'auto' else as_timestamp(fallback) -%}
                {%- set earliest_allowed_ts = [retry_base_ts, rain_drying_ready_ts | float(0)] | max -%}
                {%- set fallback_check_ts = ((earliest_allowed_ts / step) | round(0, 'ceil') | int) * step -%}
                {%- if planning_mode != 'auto' or weather_forecast_at_start is not defined or weather_forecast_at_start is not mapping -%}
                  {{ fallback_check_ts | timestamp_custom('%Y-%m-%d %H:%M:%S', true) }}
                {%- else -%}
                  {%- set items = weather_forecast_at_start.get(forecast_weather_entity | trim, {}).get('forecast', []) -%}
                  {%- set limited_items = items[:(weather_forecast_max_items | int(120))] -%}
                  {%- set horizon = namespace(max=0) -%}
                  {%- for item in limited_items -%}
                    {%- set item_ts = as_timestamp(item.datetime) -%}
                    {%- if item_ts > horizon.max -%}
                      {%- set horizon.max = item_ts -%}
                    {%- endif -%}
                  {%- endfor -%}
                  {%- if horizon.max > 0 -%}
                    {%- set bad = ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'snowy', 'hail'] -%}
                    {%- set ns = namespace(selected_ts=0) -%}
                    {%- set first_day_ts = earliest_allowed_ts -%}
                    {%- set earliest_clock = earliest_allowed_ts | timestamp_custom('%H:%M:%S', true) -%}
                    {%- if backup_start_time_value <= primary_start_time_value and earliest_clock < backup_start_time_value -%}
                      {%- set first_day_ts = earliest_allowed_ts - 86400 -%}
                    {%- endif -%}
                    {%- set first_day = first_day_ts | timestamp_custom('%Y-%m-%d', true) -%}
                    {%- for day in range(0, weather_search_days | int(4)) -%}
                      {%- set day_ns = namespace(preferred_ts=0, preferred_score=999999, fallback_ts=0, fallback_score=999999) -%}
                      {%- set day_ts = as_timestamp(first_day ~ ' 00:00:00') + (day * 86400) -%}
                      {%- set target_date = day_ts | timestamp_custom('%Y-%m-%d', true) -%}
                      {%- set preferred_start = as_timestamp(target_date ~ ' ' ~ primary_start_time_value) -%}
                      {%- set raw_preferred_end = as_timestamp(target_date ~ ' ' ~ backup_start_time_value) -%}
                      {%- set preferred_end = raw_preferred_end if raw_preferred_end > preferred_start else raw_preferred_end + 86400 -%}
                      {%- if mowing_window_preset == 'night' -%}
                        {%- set search_start = preferred_start -%}
                        {%- set raw_search_end = preferred_end -%}
                      {%- else -%}
                        {%- set search_start = as_timestamp(target_date ~ ' 06:00:00') -%}
                        {%- if fiatlux_installed | bool -%}
                          {%- set raw_search_end = as_timestamp(target_date ~ ' 05:00:00') + 86400 -%}
                        {%- else -%}
                          {%- set raw_search_end = as_timestamp(target_date ~ ' 22:00:00') -%}
                        {%- endif -%}
                      {%- endif -%}
                      {%- set search_end = [raw_search_end, horizon.max + 3600] | min -%}
                      {%- set start_ts = [search_start, earliest_allowed_ts] | max -%}
                      {%- if start_ts <= search_end -%}
                        {%- set window_mid = ((preferred_start + preferred_end) / 2) -%}
                        {%- set first_slot = ((start_ts / step) | round(0, 'ceil') | int) * step -%}
                        {%- set slots = [(((search_end - first_slot) / step) | round(0, 'floor') | int) + 1, 0] | max -%}
                        {%- for slot in range(0, slots) -%}
                          {%- set ts = first_slot + (slot * step) -%}
                          {%- set fc = namespace(seen=0, rain=0, probability=0, temp=temp_c | float(10), wind=0, humidity=60, condition='', confidence=70) -%}
                          {%- set recent = namespace(rain=0, heavy_window_rain=0, bad=0) -%}
                          {%- set future = namespace(seen=0, rain=0, probability=0, unsafe=0) -%}
                          {%- for item in limited_items -%}
                            {%- set item_ts = as_timestamp(item.datetime) -%}
                            {%- if item_ts <= ts and item_ts > (ts - 3600) -%}
                              {%- set fc.seen = 1 -%}
                              {%- set fc.rain = item.precipitation | default(0) | float(0) -%}
                              {%- set fc.probability = item.precipitation_probability | default(0) | float(0) -%}
                              {%- set fc.temp = item.temperature | default(temp_c) | float(temp_c) -%}
                              {%- set fc.wind = item.wind_speed | default(0) | float(0) -%}
                              {%- set fc.humidity = item.humidity | default(60) | float(60) -%}
                              {%- set fc.condition = item.condition | default('') -%}
                              {%- set fc.confidence = item.confidence | default(70) | float(70) -%}
                            {%- endif -%}
                            {%- if item_ts <= ts and item_ts > (ts - ((dry_after_rain_hours | int(3)) * 3600)) -%}
                              {%- set recent_rain = item.precipitation | default(0) | float(0) -%}
                              {%- set recent_condition = item.condition | default('') -%}
                              {%- set recent.rain = recent.rain + recent_rain -%}
                              {%- if recent_condition in bad -%}
                                {%- set recent.bad = 1 -%}
                              {%- endif -%}
                            {%- endif -%}
                            {%- if item_ts <= ts and item_ts > (ts - ((dry_after_rain_hours | int(3)) * 7200)) -%}
                              {%- set recent.heavy_window_rain = recent.heavy_window_rain + (item.precipitation | default(0) | float(0)) -%}
                            {%- endif -%}
                            {%- if item_ts > ts and item_ts <= (ts + ((forecast_dry_horizon_hours | int(3)) * 3600)) -%}
                              {%- set future.seen = future.seen + 1 -%}
                              {%- set future_rain = item.precipitation | default(0) | float(0) -%}
                              {%- set future_probability = item.precipitation_probability | default(0) | float(0) -%}
                              {%- set future_temp = item.temperature | default(temp_c) | float(temp_c) -%}
                              {%- set future_humidity = item.humidity | default(60) | float(60) -%}
                              {%- set future_condition = item.condition | default('') -%}
                              {%- set future.rain = future.rain + future_rain -%}
                              {%- if future_probability > future.probability -%}
                                {%- set future.probability = future_probability -%}
                              {%- endif -%}
                              {%- if ((forecast_rain_is_advisory | string | lower) != 'true'
                                      and future_condition in bad)
                                  or future_temp < (min_mowing_temperature_c | float(10))
                                  or future_temp > (max_mowing_temperature_c | float(25))
                                  or future_humidity > (wet_grass_humidity_percent | float(88)) -%}
                                {%- set future.unsafe = 1 -%}
                              {%- endif -%}
                            {%- endif -%}
                          {%- endfor -%}
                          {%- set recent_wet = recent.rain > (forecast_rain_block_mm | float(0.2))
                              or recent.bad == 1
                              or recent.heavy_window_rain > (max_rain_24h_mm | float(3)) -%}
                          {%- if (forecast_rain_is_advisory | string | lower) != 'true'
                              and (future.rain > (forecast_rain_block_mm | float(0.2))
                                   or future.probability > (high_rain_probability_percent | float(75))) -%}
                            {%- set future.unsafe = 1 -%}
                          {%- endif -%}
                          {%- set rain_score = 0 if (forecast_rain_is_advisory | string | lower) == 'true'
                              else ((fc.rain * 500) + (future.rain * 300) + (fc.probability * 3) + (future.probability * 1.5)) -%}
                          {%- set score = rain_score + (((fc.temp - 20) | abs) * 2) + (fc.wind * 0.8) + ((100 - fc.confidence) * 0.4) + ((((ts - window_mid) | abs) / 3600) * 1.2) + (((ts - earliest_allowed_ts) / 86400) * (forecast_delay_penalty_per_day | float(8))) -%}
                          {%- if fc.seen == 0 -%}
                            {%- set score = score + 120 -%}
                          {%- endif -%}
                          {%- if (forecast_rain_is_advisory | string | lower) != 'true'
                              and (fc.rain > (forecast_rain_block_mm | float(0.2)) or fc.condition in bad) -%}
                            {%- set score = score + 10000 -%}
                          {%- endif -%}
                          {%- if (forecast_rain_is_advisory | string | lower) != 'true'
                              and fc.probability > (high_rain_probability_percent | float(75)) -%}
                            {%- set score = score + 2000 -%}
                          {%- endif -%}
                          {%- if recent_wet and (forecast_rain_is_advisory | string | lower) != 'true' -%}
                            {%- set score = score + 1800 + (recent.rain * 200) + (recent.heavy_window_rain * 100) -%}
                          {%- endif -%}
                          {%- if future.unsafe == 1 or future.seen < (forecast_min_future_hours | int(2)) -%}
                            {%- set score = score + 6000 -%}
                          {%- endif -%}
                          {%- if fc.humidity > (wet_grass_humidity_percent | float(88)) -%}
                            {%- set score = score + 250 -%}
                          {%- elif fc.humidity > 82 -%}
                            {%- set score = score + 80 -%}
                          {%- endif -%}
                          {%- set safe = fc.seen == 1
                              and fc.temp >= (min_mowing_temperature_c | float(10))
                              and fc.temp <= (max_mowing_temperature_c | float(25))
                              and ((forecast_rain_is_advisory | string | lower) == 'true'
                                   or ((fc.rain + future.rain) <= (forecast_rain_block_mm | float(0.2))
                                       and fc.condition not in bad
                                       and fc.probability <= (high_rain_probability_percent | float(75))
                                       and not recent_wet))
                              and future.unsafe == 0
                              and future.seen >= (forecast_min_future_hours | int(2))
                              and fc.humidity <= (wet_grass_humidity_percent | float(88))
                              and (mowing_window_preset != 'night' or (fiatlux_installed | bool)) -%}
                          {%- if safe and score < day_ns.fallback_score -%}
                            {%- set day_ns.fallback_score = score -%}
                            {%- set day_ns.fallback_ts = ts -%}
                          {%- endif -%}
                          {%- if safe and ts >= preferred_start and ts <= preferred_end and score < day_ns.preferred_score -%}
                            {%- set day_ns.preferred_score = score -%}
                            {%- set day_ns.preferred_ts = ts -%}
                          {%- endif -%}
                        {%- endfor -%}
                      {%- endif -%}
                      {%- if ns.selected_ts == 0 -%}
                        {%- if day_ns.preferred_ts > 0 -%}
                          {%- set ns.selected_ts = day_ns.preferred_ts -%}
                        {%- elif day_ns.fallback_ts > 0 -%}
                          {%- set ns.selected_ts = day_ns.fallback_ts -%}
                        {%- endif -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {%- if ns.selected_ts > 0 -%}
                      {{ ns.selected_ts | timestamp_custom('%Y-%m-%d %H:%M:%S', true) }}
                    {%- else -%}
                      {{ fallback_check_ts | timestamp_custom('%Y-%m-%d %H:%M:%S', true) }}
                    {%- endif -%}
                  {%- else -%}
                    {{ fallback_check_ts | timestamp_custom('%Y-%m-%d %H:%M:%S', true) }}
                  {%- endif -%}
                {%- endif -%}
              quick_retry_mow_datetime: >-
                {%- set delay_seconds = 30 * 60 -%}
                {%- set step = auto_planning_step_seconds | int(900) -%}
                {%- set candidate_ts = as_timestamp(now()) + delay_seconds -%}
                {%- set rounded_ts = ((candidate_ts / step) | round(0, 'ceil') | int) * step -%}
                {{ rounded_ts | timestamp_custom('%Y-%m-%d %H:%M:%S', true) }}
              technical_retry_allowed: >-
                {%- set candidate_ts = as_timestamp(quick_retry_mow_datetime | trim) -%}
