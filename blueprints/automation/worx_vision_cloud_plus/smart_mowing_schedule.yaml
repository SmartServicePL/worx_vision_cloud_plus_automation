                    data:
                      notification_id: "{{ notification_id }}"
                      title: "Worx: koszenie przełożone"
                      message: >-
                        Start: {{ mowing_cycle_started_at }}.
                        Powód: deszcz przed startem zwykłego koszenia.
                        {{ retry_notification_details | trim }}
                  - stop: Start koszenia przerwany przez deszcz.
              - conditions:
                  - condition: template
                    value_template: "{{ states(mower_entity) in ['docked', 'paused'] }}"
                sequence:
                  - action: worx_vision_cloud.start_one_time_mowing
                    alias: Ponow normalne koszenie jednorazowe
                    data:
                      entity_id: !input mower_entity
                      runtime: "{{ normal_mowing_runtime_minutes }}"
