                {%- set window_start = as_timestamp(candidate_date ~ ' ' ~ primary_start_time_value) -%}
                {%- set raw_window_end = as_timestamp(candidate_date ~ ' ' ~ backup_start_time_value) -%}
                {%- set window_end = raw_window_end if raw_window_end > window_start else raw_window_end + 86400 -%}
                {%- if backup_start_time_value <= primary_start_time_value and candidate_ts < raw_window_end -%}
                  {%- set window_start = window_start - 86400 -%}
                  {%- set window_end = raw_window_end -%}
                {%- endif -%}
                {%- set within_window = candidate_ts >= window_start and candidate_ts <= window_end -%}
                {%- set at_station = is_state(mower_entity, 'docked') -%}
                {{ (planning_mode == 'auto' or within_window)
                   and at_station
                   and (
                     (states(rain_binary_sensor) not in ['unknown', 'unavailable', 'none', '']
                      and not is_state(rain_binary_sensor, 'on'))
                     or
                     (states(rain_binary_sensor) in ['unknown', 'unavailable', 'none', '']
                      and (state_attr(forecast_weather_entity | trim, 'rain_rate') | float(0)) <= 0.05
                      and states(forecast_weather_entity | trim) not in ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'hail'])
