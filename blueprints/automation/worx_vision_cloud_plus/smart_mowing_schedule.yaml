    {% else %}
      starszy robot z przewodem używa wyliczonego czasu {{ normal_mowing_runtime_minutes }} min
    {% endif %}
  start_block_code: >-
    {% if states(mower_entity) != 'docked' %}mower_away
    {% elif mowing_window_preset == 'night' and not (fiatlux_installed | bool) %}config
    {% elif (states(battery_sensor) | float(0)) < (min_battery_percent | float) %}battery
    {% elif (temperature_available | string | lower) != 'true' %}sensor
    {% elif (temp_c | float) < (min_mowing_temperature_c | float) or (temp_c | float) > (max_mowing_temperature_c | float) %}temperature
    {% elif (rain_observation_available | string | lower) != 'true' %}sensor
    {% elif state_attr(mower_entity, 'rain_delay') == true %}rain_delay
    {% elif (rain_active_now | string | lower) == 'true' %}rain
    {% elif (rain_drying_ready_ts | float(0)) > as_timestamp(now()) %}drying
    {% elif (outdoor_humidity_available | string | lower) == 'true'
          and (outdoor_humidity_percent | float(60)) > (wet_grass_humidity_percent | float(88)) %}humidity
    {% elif (soil_moisture | float) > (max_soil_moisture_percent | float) %}soil
    {% elif (estimated_growth_mm | float) < (growth_threshold_mm | float) %}growth
    {% elif (mowing_gap_ready_ts | float(0)) > as_timestamp(now()) %}gap
    {% else %}{{ '' }}{% endif %}
  start_block_reason: >-
    {% set code = start_block_code | trim %}
    {% if code == 'mower_away' %}
      kosiarka nie jest w bazie (stan: {{ mower_state_names.get(states(mower_entity), states(mower_entity)) }})
    {% elif code == 'config' %}
      wybrano koszenie nocne, ale nie potwierdzono zamontowanego akcesorium FiatLux
    {% elif code == 'battery' %}
      bateria ma {{ states(battery_sensor) }}%, a wymagane minimum to {{ min_battery_percent }}%
    {% elif code == 'sensor' and (temperature_available | string | lower) != 'true' %}
      nie można odczytać aktualnej temperatury zewnętrznej
    {% elif code == 'sensor' %}
      nie można odczytać aktualnego stanu opadu ani z czujnika, ani z MeteoFusion HA
    {% elif code == 'temperature' and (temp_c | float) < (min_mowing_temperature_c | float) %}
      temperatura wynosi {{ temp_c | float | round(0) | int }} °C, a minimum do koszenia to {{ min_mowing_temperature_c | int }} °C
    {% elif code == 'temperature' %}
      temperatura wynosi {{ temp_c | float | round(0) | int }} °C, a maksimum do koszenia to {{ max_mowing_temperature_c | int }} °C
    {% elif code == 'rain_delay' %}
      chmura Worx zgłasza aktywne opóźnienie po deszczu
    {% elif code == 'rain' %}
      lokalny pomiar lub MeteoFusion HA wskazuje trwający opad
    {% elif code == 'drying' %}
      trawa schnie po deszczu; bezpieczny start najwcześniej o {{ (rain_drying_ready_ts | float(0)) | timestamp_custom('%H:%M', true) }}
    {% elif code == 'humidity' %}
      wilgotność powietrza wynosi {{ outdoor_humidity_percent | float | round(0) | int }}%, więc trawa może być mokra od rosy lub mgły
    {% elif code == 'soil' %}
      gleba jest zbyt mokra: {{ soil_moisture }}%
    {% elif code == 'growth' %}
      trawa urosła dopiero o {{ estimated_growth_mm | float(0) | round(1) | string | replace('.', ',') }} mm, a koszenie zaczyna się od {{ growth_threshold_mm | float(3) | round(1) | string | replace('.', ',') }} mm
    {% elif code == 'gap' %}
      od ostatniego koszenia nie minęła minimalna przerwa; najwcześniej {{ (mowing_gap_ready_ts | float(0)) | timestamp_custom('%d.%m %H:%M', true) }}
    {% else %}
      {{ '' }}
    {% endif %}
  # Minimalne odsunięcie kolejnej próby zależnie od przyczyny blokady, żeby ta sama
  # przeszkoda nie powodowała prób i powiadomień co kilkanaście minut.
  start_block_delay_minutes: >-
    {% set code = start_block_code | trim %}
    {% set with_forecast = (forecast_available | string | lower) == 'true' and planning_mode == 'auto' %}
    {% set delays = {
      'mower_away': 120,
      'config': 720,
      'battery': 60,
      'sensor': 60,
      'temperature': 30 if with_forecast else 60,
      'rain_delay': 60,
      'rain': 0,
      'drying': 0,
      'humidity': 60,
      'soil': 180,
      'growth': 0,
      'gap': 0
    } %}
    {{ delays.get(code, 60) }}

actions:
  - choose:
      - alias: Odtwórz plan, gdy zapisany termin jest nieaktualny
        conditions:
          - condition: template
            value_template: >-
              {% set planned = state_attr(next_mow_helper, 'timestamp') %}
              {{ trigger.id == 'start_due_check'
                 and (cycle_running | string | lower) != 'true'
                 and (planned is none
                      or (planned | float(0)) < as_timestamp(now()) - ((missed_start_grace_minutes | int(30)) * 60)) }}
        sequence:
          - event: worx_smart_mowing_replan
            event_data:
              mower_entity: "{{ mower_entity }}"
              kind: recovery
      - alias: Przelicz przyrost i zaplanuj koszenie (z prognozą)
        conditions:
          - condition: template
            value_template: "{{ trigger.id in ['update_growth', 'replan'] and (forecast_available | string | lower) == 'true' }}"
        sequence:
          - action: weather.get_forecasts
            continue_on_error: true
            target:
              entity_id: "{{ forecast_weather_entity | trim }}"
            data:
              type: hourly
            response_variable: plan_forecast
          - sequence: &plan_sequence
              - variables:
                  plan_kind: >-
                    {{ 'daily' if trigger.id == 'update_growth' else (trigger.event.data.kind | default('recovery')) }}
                  plan_event: >-
                    {{ trigger.event.data if trigger.id == 'replan' else {} }}
                  fc_items: >-
                    {%- set ns = namespace(items=[]) -%}
                    {%- if plan_forecast is defined and plan_forecast is mapping -%}
                      {%- set bad = ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'snowy', 'hail'] -%}
                      {%- set raw = plan_forecast.get(forecast_weather_entity | trim, {}).get('forecast', []) -%}
                      {%- for item in raw[:(weather_forecast_max_items | int(120))] if item is mapping -%}
                        {%- set t = as_timestamp(item.get('datetime'), 0) | float(0) -%}
                        {%- if t > 0 -%}
                          {%- set condition = item.get('condition') -%}
                          {%- set ns.items = ns.items + [{
                            't': t,
                            'temp': item.get('temperature') | float(none),
                            'rain': item.get('precipitation') | float(0),
                            'prob': item.get('precipitation_probability') | float(0),
                            'hum': item.get('humidity') | float(none),
                            'wind': item.get('wind_speed') | float(0),
                            'uv': item.get('uv_index') | float(none),
                            'conf': item.get('confidence') | float(70),
                            'cond': (condition | string) if condition is not none else '',
                            'bad': condition in bad
                          }] -%}
                        {%- endif -%}
                      {%- endfor -%}
                    {%- endif -%}
                    {{ ns.items | sort(attribute='t') }}
                  day_items: >-
                    {%- set start = as_timestamp(now()) - 1800 -%}
                    {{ fc_items | selectattr('t', '>=', start) | selectattr('t', '<', start + 86400) | list }}
                  growth_temp_c: >-
                    {% set temps = day_items | map(attribute='temp') | reject('none') | list %}
                    {% if temps | length >= 12 %}
                      {{ ((temps | sum) / (temps | length)) | round(1) }}
                    {% else %}
                      {{ temp_c | float(10) }}
                    {% endif %}
                  growth_uv_index: >-
                    {% set values = day_items | map(attribute='uv') | reject('none') | list %}
                    {% set seasonal = {1: 1, 2: 1.5, 3: 2.5, 4: 4, 5: 5.5, 6: 6.5, 7: 6.5, 8: 5.5, 9: 4, 10: 2.5, 11: 1.2, 12: 0.8} %}
                    {% if values | length > 0 %}
                      {{ values | max }}
                    {% elif (sunlight_index | float(0)) >= 1 %}
                      {{ sunlight_index | float(5) }}
                    {% else %}
                      {{ seasonal[now().month] }}
                    {% endif %}
                  growth_rain_mm: >-
                    {% set forecast_rain = day_items | map(attribute='rain') | sum %}
                    {{ [rain_mm | float(0), forecast_rain] | max | round(2) }}
                  growth_soil_moisture: >-
                    {% set sensor_value = soil_sensor_value | float(-1) %}
                    {% if sensor_value >= 0 %}
                      {{ sensor_value }}
                    {% else %}
                      {% set rain = growth_rain_mm | float(0) %}
                      {% set temp = growth_temp_c | float(10) %}
                      {% set sun = growth_uv_index | float(5) %}
                      {% set m = now().month %}
                      {% set base = 72 if m in [12, 1, 2] else (58 if m in [3, 4, 10, 11] else 45) %}
                      {% set temp_drying = -8 if temp < 5 else (-3 if temp < 12 else (4 if temp < 20 else (10 if temp < 26 else (18 if temp < 32 else 25)))) %}
                      {% set raw = base + rain * 7 - temp_drying - sun * 1.8 %}
                      {% if raw < 15 %}15{% elif raw > 95 %}95{% else %}{{ raw | round(0) }}{% endif %}
                    {% endif %}
                  growth_daily_mm: >-
                    {% set t = growth_temp_c | float(10) %}
                    {% if t < 3 %}
                      {% set temp_factor = 0 %}
                    {% else %}
                      {% set gp = 2.718281828459045 ** (-0.5 * (((t - 20) / 5.5) ** 2)) %}
                      {% set temp_factor = 0.02 if gp < 0.02 else ([gp, 1] | min) %}
                    {% endif %}
                    {% set r = growth_rain_mm | float(0) %}
                    {% set rain_factor = 0.75 if r < 0.2 else (0.9 if r < 2 else (1 if r < 10 else (0.9 if r < 25 else 0.7))) %}
                    {% if automatic_irrigation_enabled and rain_factor < 0.95 %}{% set rain_factor = 0.95 %}{% endif %}
                    {% set s = growth_soil_moisture | float(50) %}
                    {% set soil_factor = 0.35 if s < 20 else (0.65 if s < 35 else (1 if s <= 80 else (0.9 if s <= 95 else 0.75))) %}
                    {% if automatic_irrigation_enabled and s < 80 and soil_factor < 0.95 %}{% set soil_factor = 0.95 %}{% endif %}
                    {% set u = growth_uv_index | float(5) %}
                    {% set sun_factor = 0.35 if u < 1 else (0.65 if u < 3 else (1 if u <= 8 else 0.85)) %}
                    {% set m = now().month %}
                    {% set season_factor = 0.15 if m in [12, 1, 2] else (0.65 if m in [3, 11] else (0.9 if m in [4, 10] else 1)) %}
                    {% set irrigation_factor = (1 + (((irrigation_growth_adjustment_percent | float(140)) - 100) / 100) * 0.35) if automatic_irrigation_enabled else 1 %}
                    {% set fertilization_factor = (1 + (((fertilization_growth_adjustment_percent | float(125)) - 100) / 100) * 0.4) if fertilization_enabled else 1 %}
                    {% set raw = 8.5 * temp_factor * rain_factor * soil_factor * sun_factor * season_factor * irrigation_factor * fertilization_factor %}
                    {% if raw < 0 %}0{% elif raw > 12 %}12{% else %}{{ raw | round(1) }}{% endif %}
                  growth_inputs_label: >-
                    średnio {{ growth_temp_c | float | round(1) }} °C, UV maks. {{ growth_uv_index | float | round(1) }}, opad {{ growth_rain_mm | float | round(1) }} mm{% if (soil_sensor_value | float(-1)) < 0 %}, szacowana wilgotność gleby {{ growth_soil_moisture | float | round(0) | int }}%{% else %}, wilgotność gleby {{ growth_soil_moisture | float | round(0) | int }}%{% endif %}
                  plan_growth_mm: >-
                    {% set before = states(growth_helper) | float(0) %}
                    {% set raw = before + ((growth_daily_mm | float(0)) if plan_kind == 'daily' else 0) %}
                    {% if raw < 0 %}0{% elif raw > 40 %}40{% else %}{{ raw | round(1) }}{% endif %}
              - if:
                  - condition: template
                    value_template: "{{ plan_kind == 'daily' }}"
                then:
                  - action: input_number.set_value
                    target:
                      entity_id: !input growth_helper
                    data:
                      value: "{{ plan_growth_mm }}"
              - if:
                  - condition: template
                    value_template: "{{ plan_kind == 'daily' and (cycle_running | string | lower) == 'true' }}"
                then:
                  - stop: Trwa cykl koszenia; termin wyznaczy jego zakończenie albo przerwanie.
              - variables:
                  next_update_ts: >-
                    {% set today_update = as_timestamp(today_at(growth_update_time_value)) %}
                    {{ today_update if as_timestamp(now()) < today_update else as_timestamp(today_at(growth_update_time_value) + timedelta(days=1)) }}
                  growth_ready_ts: >-
                    {% set threshold = growth_threshold_mm | float(3) %}
                    {% set growth = plan_growth_mm | float(0) %}
                    {% if growth >= threshold %}
                      0
                    {% else %}
                      {% set daily = growth_daily_mm | float(0) %}
                      {% set days = 7 if daily <= 0.1 else ([((threshold - growth) / daily) | round(0, 'ceil') | int, 14] | min) %}
                      {% set offset = 0 if as_timestamp(now()) < as_timestamp(today_at(growth_update_time_value)) else 1 %}
                      {{ as_timestamp(today_at(growth_update_time_value) + timedelta(days=offset + days - 1)) }}
                    {% endif %}
                  plan_min_delay_seconds: >-
                    {{ ((plan_event.get('min_delay_minutes', 0) if plan_event is mapping else 0) | float(0)) * 60 }}
                  plan_earliest_ts: >-
                    {% set now_value = as_timestamp(now()) %}
                    {{ [now_value + 300,
                        growth_ready_ts | float(0),
                        mowing_gap_ready_ts | float(0),
                        rain_drying_ready_ts | float(0),
                        now_value + (plan_min_delay_seconds | float(0))] | max }}
                  plan_constraint: >-
                    {% set now_value = as_timestamp(now()) %}
                    {% set earliest = plan_earliest_ts | float %}
                    {% if earliest <= now_value + 301 %}none
                    {% elif earliest == (growth_ready_ts | float(0)) %}growth
                    {% elif earliest == (mowing_gap_ready_ts | float(0)) %}gap
                    {% elif earliest == (rain_drying_ready_ts | float(0)) %}drying
                    {% else %}delay{% endif %}
              - variables:
                  plan_result: >-
                    {%- set step = auto_planning_step_seconds | int(900) -%}
                    {%- set earliest = plan_earliest_ts | float -%}
                    {%- set primary = primary_start_time_value | trim -%}
                    {%- set backup = backup_start_time_value | trim -%}
                    {%- set crosses = backup <= primary -%}
                    {%- set fiatlux = fiatlux_installed | bool -%}
                    {%- set night = mowing_window_preset == 'night' -%}
                    {%- set today = now().date() -%}
                    {%- set earliest_local = earliest | as_datetime | as_local -%}
                    {%- set earliest_day = (earliest_local.date() - today).days -%}
                    {%- set earliest_clock = earliest_local.strftime('%H:%M:%S') -%}
                    {%- set base_day = earliest_day - 1 if ((crosses and earliest_clock < backup)
                        or (fiatlux and not night and earliest_clock < fiatlux_search_end)) else earliest_day -%}
                    {%- set items = fc_items -%}
                    {%- set last_t = (items | map(attribute='t') | max) if items | length > 0 else 0 -%}
                    {%- set urgent = (plan_growth_mm | float(0)) >= (high_growth_threshold_mm | float(999)) -%}
                    {%- set per_hour = 20 if urgent else 2 -%}
                    {%- set tmin = min_mowing_temperature_c | float(10) -%}
                    {%- set tmax = max_mowing_temperature_c | float(25) -%}
                    {%- set wet = wet_grass_humidity_percent | float(88) -%}
                    {%- set block = forecast_rain_block_mm | float(0.2) -%}
                    {%- set high = high_rain_probability_percent | float(60) -%}
                    {%- set dry_s = (dry_after_rain_hours | float(3)) * 3600 -%}
                    {%- set horizon_s = (forecast_dry_horizon_hours | float(3)) * 3600 -%}
                    {%- set min_future = forecast_min_future_hours | int(2) -%}
                    {%- set heavy_mm = max_rain_24h_mm | float(3) -%}
                    {%- set result = namespace(ts=0, source='', in_window=false, window_checked=false, fb_ts=0, fb_score=99999999, fb_in_window=false, fb_source='') -%}
                    {%- if planning_mode == 'auto' and items | length > 0 -%}
                      {%- for d in range(base_day, base_day + (weather_search_days | int(4))) -%}
                        {%- if result.ts == 0 -%}
                          {%- set ps = as_timestamp(today_at(primary) + timedelta(days=d)) -%}
                          {%- set pe = as_timestamp(today_at(backup) + timedelta(days=d + (1 if crosses else 0))) -%}
                          {%- if night -%}
                            {%- set rs = ps -%}
                            {%- set re = pe -%}
                          {%- else -%}
                            {%- set rs = [as_timestamp(today_at(daytime_search_start) + timedelta(days=d)), ps] | min -%}
                            {%- set re_default = as_timestamp(today_at(fiatlux_search_end) + timedelta(days=d + 1)) if fiatlux else as_timestamp(today_at(daytime_search_end) + timedelta(days=d)) -%}
                            {%- set re = [re_default, pe] | max -%}
                          {%- endif -%}
                          {%- set mid = (ps + pe) / 2 -%}
                          {%- set first = ((([rs, earliest] | max) / step) | round(0, 'ceil') | int) * step -%}
                          {%- set last = [re, last_t] | min -%}
                          {%- set day = namespace(pref_ts=0, pref_score=99999999, any_ts=0, any_score=99999999, window_checked=false) -%}
                          {%- if first > last_t -%}
                            {%- set candidate = ps if earliest <= ps else (first if first <= pe else 0) -%}
                            {%- if candidate > 0 -%}
                              {%- set candidate_score = 2500 + ((candidate - earliest) / 3600) * per_hour -%}
                              {%- if candidate_score < result.fb_score -%}
                                {%- set result.fb_score = candidate_score -%}
                                {%- set result.fb_ts = candidate -%}
                                {%- set result.fb_in_window = true -%}
                                {%- set result.fb_source = 'beyond_forecast' -%}
                              {%- endif -%}
                            {%- endif -%}
                          {%- elif first <= last -%}
                            {%- for slot in range(0, (((last - first) / step) | round(0, 'floor') | int) + 1) -%}
                              {%- set ts = first + slot * step -%}
                              {%- set fc = namespace(seen=false, rain=0, prob=0, temp=none, hum=none, wind=0, bad=false, conf=70) -%}
                              {%- set rec = namespace(rain=0, bad=false, heavy=0) -%}
                              {%- set fut = namespace(seen=0, rain=0, prob=0, unsafe=false) -%}
                              {%- for it in items -%}
                                {%- if it.t <= ts -%}
                                  {%- if it.t > ts - 3600 -%}
                                    {%- set fc.seen = true -%}
                                    {%- set fc.rain = it.rain -%}
                                    {%- set fc.prob = it.prob -%}
                                    {%- set fc.temp = it.temp -%}
                                    {%- set fc.hum = it.hum -%}
                                    {%- set fc.wind = it.wind -%}
                                    {%- set fc.bad = it.bad -%}
                                    {%- set fc.conf = it.conf -%}
                                  {%- endif -%}
                                  {%- if it.t > ts - dry_s -%}
                                    {%- set rec.rain = rec.rain + it.rain -%}
                                    {%- if it.bad -%}
                                      {%- set rec.bad = true -%}
                                    {%- endif -%}
                                  {%- endif -%}
                                  {%- if it.t > ts - 2 * dry_s -%}
                                    {%- set rec.heavy = rec.heavy + it.rain -%}
                                  {%- endif -%}
                                {%- elif it.t <= ts + horizon_s -%}
                                  {%- set fut.seen = fut.seen + 1 -%}
                                  {%- set fut.rain = fut.rain + it.rain -%}
                                  {%- if it.prob > fut.prob -%}
                                    {%- set fut.prob = it.prob -%}
                                  {%- endif -%}
                                  {%- if it.bad
                                      or (it.temp is not none and (it.temp < tmin or it.temp > tmax))
                                      or (it.hum is not none and it.hum > wet) -%}
                                    {%- set fut.unsafe = true -%}
                                  {%- endif -%}
                                {%- endif -%}
                              {%- endfor -%}
                              {%- set rec_wet = rec.rain > block or rec.bad or rec.heavy > heavy_mm -%}
                              {%- set temp_ok = fc.temp is none or (fc.temp >= tmin and fc.temp <= tmax) -%}
                              {%- set hum_ok = fc.hum is none or fc.hum <= wet -%}
                              {%- set rain_ok = (fc.rain + fut.rain) <= block and not fc.bad and fc.prob <= high and fut.prob <= high -%}
                              {%- set data_ok = fc.seen and fut.seen >= min_future -%}
                              {%- set safe = data_ok and temp_ok and hum_ok and rain_ok and not rec_wet and not fut.unsafe -%}
                              {%- set in_window = ts >= ps and ts <= pe -%}
                              {%- if in_window -%}
                                {%- set day.window_checked = true -%}
                              {%- endif -%}
                              {%- set score = fc.prob * 1.5 + fut.prob + (fc.rain + fut.rain) * 300
                                  + ((((fc.temp - 20) | abs) * 2) if fc.temp is not none else 10)
                                  + ((([fc.hum - 75, 0] | max) * 3) if fc.hum is not none else 0)
                                  + fc.wind * 0.8 + (100 - fc.conf) * 0.4
                                  + (((ts - mid) | abs) / 3600) * 1.2
                                  + ((ts - earliest) / 3600) * per_hour -%}
                              {%- if safe -%}
                                {%- if in_window and score < day.pref_score -%}
                                  {%- set day.pref_score = score -%}
                                  {%- set day.pref_ts = ts -%}
                                {%- endif -%}
                                {%- if score < day.any_score -%}
                                  {%- set day.any_score = score -%}
                                  {%- set day.any_ts = ts -%}
                                {%- endif -%}
                              {%- else -%}
                                {%- set penalty = (0 if data_ok else 6000) + (0 if rain_ok else 10000)
                                    + (1800 if rec_wet else 0) + (6000 if fut.unsafe else 0)
                                    + (0 if temp_ok else 3000) + (0 if hum_ok else 1500) -%}
                                {%- if score + penalty < result.fb_score -%}
                                  {%- set result.fb_score = score + penalty -%}
                                  {%- set result.fb_ts = ts -%}
                                  {%- set result.fb_in_window = in_window -%}
                                  {%- set result.fb_source = 'best_effort' -%}
                                {%- endif -%}
                              {%- endif -%}
                            {%- endfor -%}
                          {%- endif -%}
                          {%- if day.pref_ts > 0 -%}
                            {%- set result.ts = day.pref_ts -%}
                            {%- set result.source = 'forecast' -%}
                            {%- set result.in_window = true -%}
                          {%- elif day.any_ts > 0 -%}
                            {%- set result.ts = day.any_ts -%}
                            {%- set result.source = 'forecast' -%}
                            {%- set result.in_window = false -%}
                            {%- set result.window_checked = day.window_checked -%}
                          {%- endif -%}
                        {%- endif -%}
                      {%- endfor -%}
                      {%- if result.ts == 0 and result.fb_ts > 0 -%}
                        {%- set result.ts = result.fb_ts -%}
                        {%- set result.source = result.fb_source -%}
                        {%- set result.in_window = result.fb_in_window -%}
                      {%- endif -%}
                    {%- endif -%}
                    {%- if result.ts == 0 and planning_mode != 'auto' -%}
                      {%- set fixed = namespace(best=0) -%}
                      {%- for d in range(earliest_day - 1, earliest_day + 9) -%}
                        {%- set first_try = as_timestamp(today_at(primary) + timedelta(days=d)) -%}
                        {%- set second_try = as_timestamp(today_at(backup) + timedelta(days=d + (1 if crosses else 0))) -%}
                        {%- for candidate in [first_try, second_try] -%}
                          {%- if candidate >= earliest and (fixed.best == 0 or candidate < fixed.best) -%}
                            {%- set fixed.best = candidate -%}
                          {%- endif -%}
                        {%- endfor -%}
                      {%- endfor -%}
                      {%- set result.ts = fixed.best -%}
                      {%- set result.source = 'fixed' -%}
                      {%- set result.in_window = true -%}
                    {%- endif -%}
                    {%- if result.ts == 0 -%}
                      {%- set window = namespace(best=0) -%}
                      {%- for d in range(base_day, base_day + 9) -%}
                        {%- if window.best == 0 -%}
                          {%- set ps = as_timestamp(today_at(primary) + timedelta(days=d)) -%}
                          {%- set pe = as_timestamp(today_at(backup) + timedelta(days=d + (1 if crosses else 0))) -%}
                          {%- if earliest <= ps -%}
                            {%- set window.best = ps -%}
                          {%- elif earliest <= pe -%}
                            {%- set window.best = ((earliest / step) | round(0, 'ceil') | int) * step -%}
                          {%- endif -%}
                        {%- endif -%}
                      {%- endfor -%}
                      {%- set result.ts = window.best if window.best > 0 else ((earliest / step) | round(0, 'ceil') | int) * step -%}
                      {%- set result.source = 'window' -%}
                      {%- set result.in_window = window.best > 0 -%}
                    {%- endif -%}
                    {{ {'ts': result.ts, 'source': result.source, 'in_window': result.in_window, 'window_checked': result.window_checked} }}
              - variables:
                  plan_ts: "{{ plan_result.ts | float(0) }}"
                  plan_details: >-
                    {%- set ts = plan_result.ts | float(0) -%}
                    {%- set items = fc_items -%}
                    {%- set tmin = min_mowing_temperature_c | float(10) -%}
                    {%- set tmax = max_mowing_temperature_c | float(25) -%}
                    {%- set wet = wet_grass_humidity_percent | float(88) -%}
                    {%- set block = forecast_rain_block_mm | float(0.2) -%}
                    {%- set high = high_rain_probability_percent | float(60) -%}
                    {%- set dry_s = (dry_after_rain_hours | float(3)) * 3600 -%}
                    {%- set horizon_s = (forecast_dry_horizon_hours | float(3)) * 3600 -%}
                    {%- set fc = namespace(seen=false, rain=0, prob=0, temp=none, hum=none, bad=false, conf=70, cond='') -%}
                    {%- set rec = namespace(rain=0, bad=false, heavy=0) -%}
                    {%- set fut = namespace(seen=0, rain=0, prob=0, unsafe=false) -%}
                    {%- for it in items -%}
                      {%- if it.t <= ts -%}
                        {%- if it.t > ts - 3600 -%}
                          {%- set fc.seen = true -%}
                          {%- set fc.rain = it.rain -%}
                          {%- set fc.prob = it.prob -%}
                          {%- set fc.temp = it.temp -%}
                          {%- set fc.hum = it.hum -%}
                          {%- set fc.bad = it.bad -%}
                          {%- set fc.conf = it.conf -%}
                          {%- set fc.cond = it.cond -%}
                        {%- endif -%}
                        {%- if it.t > ts - dry_s -%}
                          {%- set rec.rain = rec.rain + it.rain -%}
                          {%- if it.bad -%}
                            {%- set rec.bad = true -%}
                          {%- endif -%}
                        {%- endif -%}
                        {%- if it.t > ts - 2 * dry_s -%}
                          {%- set rec.heavy = rec.heavy + it.rain -%}
                        {%- endif -%}
                      {%- elif it.t <= ts + horizon_s -%}
                        {%- set fut.seen = fut.seen + 1 -%}
                        {%- set fut.rain = fut.rain + it.rain -%}
                        {%- if it.prob > fut.prob -%}
                          {%- set fut.prob = it.prob -%}
                        {%- endif -%}
                        {%- if it.bad
                            or (it.temp is not none and (it.temp < tmin or it.temp > tmax))
                            or (it.hum is not none and it.hum > wet) -%}
                          {%- set fut.unsafe = true -%}
                        {%- endif -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {%- set rec_wet = rec.rain > block or rec.bad or rec.heavy > (max_rain_24h_mm | float(3)) -%}
                    {%- set safe = fc.seen
                        and fut.seen >= (forecast_min_future_hours | int(2))
                        and (fc.temp is none or (fc.temp >= tmin and fc.temp <= tmax))
                        and (fc.hum is none or fc.hum <= wet)
                        and (fc.rain + fut.rain) <= block and not fc.bad
                        and fc.prob <= high and fut.prob <= high
                        and not rec_wet and not fut.unsafe -%}
                    {{ {'seen': fc.seen, 'safe': safe, 'rain': fc.rain, 'fut_rain': fut.rain,
                        'prob': [fc.prob, fut.prob] | max, 'temp': fc.temp, 'hum': fc.hum,
                        'cond': fc.cond, 'conf': fc.conf, 'rec_wet': rec_wet} }}
              - action: input_datetime.set_datetime
                alias: Zapisz wyznaczony termin koszenia
                target:
                  entity_id: !input next_mow_helper
                data:
                  timestamp: "{{ plan_ts | float(0) | int }}"
              - variables:
                  plan_is_today: >-
                    {{ ((plan_ts | float(0)) | as_datetime | as_local).date() == now().date() }}
                  plan_label: >-
                    {% set local = (plan_ts | float(0)) | as_datetime | as_local %}
                    {% set days = (local.date() - now().date()).days %}
                    {% set names = ['poniedziałek', 'wtorek', 'środa', 'czwartek', 'piątek', 'sobota', 'niedziela'] %}
                    {% if days <= 0 %}dziś o {{ local.strftime('%H:%M') }}
                    {% elif days == 1 %}jutro o {{ local.strftime('%H:%M') }}
                    {% else %}{{ names[local.weekday()] }} {{ local.strftime('%d.%m') }} o {{ local.strftime('%H:%M') }}{% endif %}
                  plan_config_problem: >-
                    {{ mowing_window_preset == 'night' and not (fiatlux_installed | bool) }}
                  plan_confirmed: >-
                    {{ plan_details.seen and plan_details.safe and (plan_config_problem | string | lower) != 'true' }}
                  plan_heading: >-
                    {% if (plan_confirmed | string | lower) == 'true' %}
                      Termin koszenia: {{ plan_label | trim }}
                    {% else %}
                      Termin ponownego sprawdzenia: {{ plan_label | trim }}
                    {% endif %}
                  plan_reason: >-
                    {% set d = plan_details %}
                    {% set bad = ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'snowy', 'hail'] %}
                    {% set tmin = min_mowing_temperature_c | float(10) %}
                    {% set tmax = max_mowing_temperature_c | float(25) %}
                    {% if (plan_confirmed | string | lower) == 'true' %}
                      {{ '' }}
                    {% elif (plan_config_problem | string | lower) == 'true' %}
                      zmień okno koszenia albo potwierdź akcesorium FiatLux w ustawieniach automatyzacji
                    {% elif (forecast_available | string | lower) != 'true' or planning_mode != 'auto' %}
                      bez prognozy godzinowej warunki można sprawdzić dopiero w chwili startu
                    {% elif fc_items | length == 0 %}
                      prognoza pogody jest chwilowo niedostępna, więc warunki zostaną sprawdzone w chwili startu
                    {% elif not d.seen and (plan_constraint | trim) == 'growth' %}
                      trawa urośnie do progu koszenia około {{ ((growth_ready_ts | float(0)) | as_datetime | as_local).strftime('%d.%m') }}, a prognoza nie sięga jeszcze tego dnia
                    {% elif not d.seen %}
                      prognoza na najbliższe dni nie daje suchego terminu; warunki zostaną ocenione ponownie, gdy prognoza obejmie ten dzień
                    {% elif (d.rain + d.fut_rain) > (forecast_rain_block_mm | float(0.2)) or d.cond in bad %}
                      prognoza przewiduje deszcz w czasie koszenia, a w najbliższych dniach nie ma lepszego terminu
                    {% elif d.prob > (high_rain_probability_percent | float(60)) %}
                      duże ryzyko deszczu ({{ d.prob | round(0) | int }}%), a w najbliższych dniach nie ma lepszego terminu
                    {% elif d.rec_wet %}
                      trawa może być jeszcze mokra po deszczu, a w najbliższych dniach nie ma lepszego terminu
                    {% elif d.hum is not none and d.hum > (wet_grass_humidity_percent | float(88)) %}
                      wysoka wilgotność powietrza ({{ d.hum | round(0) | int }}%), więc trawa może być mokra od rosy
                    {% elif d.temp is not none and (d.temp < tmin or d.temp > tmax) %}
                      prognozowana temperatura {{ d.temp | round(0) | int }} °C jest poza dozwolonym zakresem {{ tmin | int }}–{{ tmax | int }} °C
                    {% else %}
                      prognoza nie potwierdza dobrych warunków przez cały czas koszenia
                    {% endif %}
                  plan_forecast_line: >-
                    {% set d = plan_details %}
                    {% set names = {
                      'clear-night': 'bezchmurnie',
                      'cloudy': 'pochmurno',
                      'exceptional': 'nietypowe warunki',
                      'fog': 'mgła',
                      'hail': 'grad',
                      'lightning': 'burze',
                      'lightning-rainy': 'burze z deszczem',
                      'partlycloudy': 'częściowe zachmurzenie',
                      'pouring': 'ulewa',
                      'rainy': 'deszcz',
                      'snowy': 'śnieg',
                      'snowy-rainy': 'deszcz ze śniegiem',
                      'sunny': 'słonecznie',
                      'windy': 'wietrznie',
                      'windy-variant': 'wietrznie'
                    } %}
                    {% if d.seen %}
                      {% set parts = namespace(items=[]) %}
                      {% if d.cond %}{% set parts.items = parts.items + [names.get(d.cond, d.cond)] %}{% endif %}
                      {% if d.temp is not none %}{% set parts.items = parts.items + [(d.temp | round(0) | int) ~ ' °C'] %}{% endif %}
                      {% set rain_total = d.rain + d.fut_rain %}
                      {% if rain_total > (forecast_rain_block_mm | float(0.2)) %}
                        {% set parts.items = parts.items + ['opad ' ~ (rain_total | round(1) | string | replace('.', ',')) ~ ' mm'] %}
                      {% else %}
                        {% set parts.items = parts.items + ['bez opadu'] %}
                      {% endif %}
                      {% if d.prob >= 30 %}{% set parts.items = parts.items + ['ryzyko deszczu ' ~ (d.prob | round(0) | int) ~ '%'] %}{% endif %}
                      {% if d.hum is not none %}{% set parts.items = parts.items + ['wilgotność ' ~ (d.hum | round(0) | int) ~ '%'] %}{% endif %}
                      {{ parts.items | join(', ') }}
                    {% else %}
                      {{ '' }}
                    {% endif %}
                  plan_summary: |-
                    {{ plan_heading | trim }}
                    {% if (plan_reason | trim | length) > 0 %}Powód: {{ plan_reason | trim }}.
                    {% endif %}{% if (plan_forecast_line | trim | length) > 0 %}Prognoza: {{ plan_forecast_line | trim }}.{% endif %}
                  growth_line: >-
                    Trawa: {{ plan_growth_mm | float(0) | round(1) | string | replace('.', ',') }} mm (próg koszenia {{ growth_threshold_mm | float(3) | round(1) | string | replace('.', ',') }} mm)
              - choose:
                  - conditions:
                      - condition: template
                        value_template: "{{ plan_kind == 'daily' }}"
                    sequence:
                      - action: persistent_notification.create
                        data:
                          notification_id: "{{ notification_id }}"
                          title: "Worx: plan koszenia"
                          message: |-
                            {{ plan_summary | trim }}
                            {{ growth_line | trim }}, dziś przybyło {{ growth_daily_mm | float(0) | round(1) | string | replace('.', ',') }} mm.
                  - conditions:
                      - condition: template
                        value_template: "{{ plan_kind == 'blocked' }}"
                    sequence:
                      - action: persistent_notification.create
                        data:
                          notification_id: "{{ notification_id }}"
                          title: "Worx: koszenie przełożone"
                          message: |-
                            Nie rozpoczęto koszenia zaplanowanego na {{ plan_event.get('planned_label', '') }}.
                            Przyczyna: {{ plan_event.get('reason', '') }}.

                            {{ plan_summary | trim }}
                  - conditions:
                      - condition: template
                        value_template: "{{ plan_kind == 'interrupted' }}"
                    sequence:
                      - action: persistent_notification.create
                        data:
                          notification_id: "{{ notification_id }}"
                          title: "Worx: koszenie przerwane"
                          message: |-
                            Koszenie rozpoczęte {{ plan_event.get('started_at', '') }} przerwano {{ plan_event.get('finished_at', '') }}.
                            Przyczyna: {{ plan_event.get('reason', '') }}.{% if (plan_event.get('growth_note', '') | length) > 0 %}
                            {{ plan_event.get('growth_note') }}{% endif %}

                            {{ plan_summary | trim }}
                  - conditions:
                      - condition: template
                        value_template: "{{ plan_kind in ['completed', 'manual_completed'] }}"
                    sequence:
                      - action: persistent_notification.create
                        data:
                          notification_id: "{{ notification_id }}"
                          title: >-
                            {{ 'Worx: koszenie ręczne zakończone' if plan_kind == 'manual_completed' else 'Worx: koszenie zakończone' }}
                          message: |-
                            Koszenie trwało od {{ plan_event.get('started_at', '') }} do {{ plan_event.get('finished_at', '') }} ({{ plan_event.get('duration_label', '') }} razem z ładowaniem).

                            {{ plan_summary | trim }}
      - alias: Przelicz przyrost i zaplanuj koszenie (bez prognozy)
        conditions:
          - condition: template
            value_template: "{{ trigger.id in ['update_growth', 'replan'] }}"
        sequence:
          - sequence: *plan_sequence
      - alias: Rozpocznij zaplanowany cykl koszenia
        conditions:
          - condition: template
            value_template: >-
              {% set planned = state_attr(next_mow_helper, 'timestamp') | float(0) %}
              {% set diff = as_timestamp(now()) - planned %}
              {% set grace = (missed_start_grace_minutes | int(30)) * 60 %}
              {{ trigger.id in ['start_scheduled', 'start_due_check']
                 and (cycle_running | string | lower) != 'true'
                 and planned > 0
                 and ((trigger.id == 'start_scheduled' and diff >= -60 and diff <= grace)
                      or (trigger.id == 'start_due_check' and diff >= 60 and diff <= grace)) }}
        sequence:
          - variables:
              planned_start_label: >-
                {% set local = (state_attr(next_mow_helper, 'timestamp') | float(0)) | as_datetime | as_local %}
                {{ ('dziś' if local.date() == now().date() else local.strftime('%d.%m')) ~ ' o ' ~ local.strftime('%H:%M') }}
          - if:
              - condition: template
                alias: Start koszenia jest zablokowany
                value_template: "{{ (start_block_reason | trim | length) > 0 }}"
            then:
              - event: worx_smart_mowing_replan
                event_data:
                  mower_entity: "{{ mower_entity }}"
                  kind: blocked
                  reason: "{{ start_block_reason | trim }}"
                  planned_label: "{{ planned_start_label | trim }}"
                  min_delay_minutes: "{{ start_block_delay_minutes | int(60) }}"
              - stop: Warunki koszenia nie są spełnione; wyznaczono nowy termin.
          - variables:
              mowing_cycle_started_at: "{{ now().strftime('%d.%m o %H:%M') }}"
              mowing_cycle_started_ts: "{{ as_timestamp(now()) }}"
          - action: worx_vision_cloud.start_one_time_mowing
            alias: Uruchom samo przycinanie krawędzi
            data:
              entity_id: !input mower_entity
              runtime: 0
              edge_cut: true
              zones: []
          - alias: Poczekaj na potwierdzenie wyjazdu do krawędzi
            repeat:
              while:
                - condition: template
                  value_template: >-
                    {{ states(mower_entity) in ['docked', 'paused']
                       and (
                         (states(rain_binary_sensor) not in ['unknown', 'unavailable', 'none', '']
                          and not is_state(rain_binary_sensor, 'on'))
                         or
                         (states(rain_binary_sensor) in ['unknown', 'unavailable', 'none', '']
                          and (state_attr(forecast_weather_entity | trim, 'rain_rate') | float(0)) <= 0.05
                          and states(forecast_weather_entity | trim) not in ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'hail'])
                       )
                       and state_attr(mower_entity, 'rain_delay') != true
                       and repeat.index <= ((mowing_start_confirm_timeout_minutes | int(5)) * 6) }}
              sequence:
                - delay: "00:00:10"
          - if:
              - condition: template
                value_template: >-
                  {{ (states(rain_binary_sensor) not in ['unknown', 'unavailable', 'none', '']
                      and is_state(rain_binary_sensor, 'on'))
                     or
                     (states(rain_binary_sensor) in ['unknown', 'unavailable', 'none', '']
                      and ((state_attr(forecast_weather_entity | trim, 'rain_rate') | float(0)) > 0.05
                           or states(forecast_weather_entity | trim) in ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'hail']))
                     or state_attr(mower_entity, 'rain_delay') == true }}
            then:
              - action: lawn_mower.dock
                continue_on_error: true
                target:
                  entity_id: !input mower_entity
              - event: worx_smart_mowing_replan
                event_data:
                  mower_entity: "{{ mower_entity }}"
                  kind: blocked
                  reason: deszcz albo opóźnienie po deszczu w chwili startu przycinania krawędzi
                  planned_label: "{{ planned_start_label | trim }}"
                  min_delay_minutes: 0
              - stop: Przycinanie krawędzi przerwane przez deszcz.
          - if:
              - condition: template
                value_template: "{{ states(mower_entity) in ['docked', 'paused'] }}"
            then:
              - action: worx_vision_cloud.start_one_time_mowing
                alias: Ponów samo przycinanie krawędzi
                data:
                  entity_id: !input mower_entity
                  runtime: 0
                  edge_cut: true
                  zones: []
              - alias: Poczekaj na potwierdzenie drugiego startu krawędzi
                repeat:
                  while:
                    - condition: template
                      value_template: >-
                        {{ states(mower_entity) in ['docked', 'paused']
                           and (
                             (states(rain_binary_sensor) not in ['unknown', 'unavailable', 'none', '']
                              and not is_state(rain_binary_sensor, 'on'))
                             or
                             (states(rain_binary_sensor) in ['unknown', 'unavailable', 'none', '']
                              and (state_attr(forecast_weather_entity | trim, 'rain_rate') | float(0)) <= 0.05
                              and states(forecast_weather_entity | trim) not in ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'hail'])
                           )
                           and state_attr(mower_entity, 'rain_delay') != true
                           and repeat.index <= ((mowing_start_confirm_timeout_minutes | int(5)) * 6) }}
                  sequence:
                    - delay: "00:00:10"
          - if:
              - condition: template
                value_template: >-
                  {{ (states(rain_binary_sensor) not in ['unknown', 'unavailable', 'none', '']
                      and is_state(rain_binary_sensor, 'on'))
                     or
                     (states(rain_binary_sensor) in ['unknown', 'unavailable', 'none', '']
                      and ((state_attr(forecast_weather_entity | trim, 'rain_rate') | float(0)) > 0.05
                           or states(forecast_weather_entity | trim) in ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'hail']))
                     or state_attr(mower_entity, 'rain_delay') == true }}
            then:
              - action: lawn_mower.dock
                continue_on_error: true
                target:
                  entity_id: !input mower_entity
              - event: worx_smart_mowing_replan
                event_data:
                  mower_entity: "{{ mower_entity }}"
                  kind: blocked
                  reason: deszcz albo opóźnienie po deszczu podczas ponownego startu przycinania krawędzi
                  planned_label: "{{ planned_start_label | trim }}"
                  min_delay_minutes: 0
              - stop: Przycinanie krawędzi przerwane przez deszcz po ponowieniu.
          - if:
              - condition: template
                value_template: "{{ states(mower_entity) in ['docked', 'paused', 'unavailable', 'unknown'] }}"
            then:
              - event: worx_smart_mowing_replan
                event_data:
                  mower_entity: "{{ mower_entity }}"
                  kind: blocked
                  reason: >-
                    robot nie wyjechał do przycinania krawędzi mimo dwóch komend (stan: {{ mower_state_names.get(states(mower_entity), states(mower_entity)) }})
                  planned_label: "{{ planned_start_label | trim }}"
                  min_delay_minutes: 30
              - stop: Nie potwierdzono startu przycinania krawędzi po dwóch próbach.
          - action: persistent_notification.create
            data:
              notification_id: "{{ notification_id }}"
              title: "Worx: koszenie rozpoczęte"
              message: |-
                Koszenie rozpoczęło się {{ mowing_cycle_started_at }}.
                Najpierw robot przytnie krawędzie, potem naładuje baterię do {{ post_edge_battery_percent }}% i skosi cały trawnik.
          - wait_template: >-
              {{ (states(rain_binary_sensor) not in ['unknown', 'unavailable', 'none', '']
                  and is_state(rain_binary_sensor, 'on'))
                 or
                 (states(rain_binary_sensor) in ['unknown', 'unavailable', 'none', '']
                  and ((state_attr(forecast_weather_entity | trim, 'rain_rate') | float(0)) > 0.05
                       or states(forecast_weather_entity | trim) in ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'hail']))
                 or state_attr(mower_entity, 'rain_delay') == true
                 or is_state(mower_entity, 'docked') }}
            alias: Poczekaj na zakończenie krawędzi i powrót do bazy
            timeout: "02:00:00"
            continue_on_timeout: true
          - if:
              - condition: template
                value_template: >-
                  {{ ((states(rain_binary_sensor) not in ['unknown', 'unavailable', 'none', '']
                       and not is_state(rain_binary_sensor, 'on'))
                      or
                      (states(rain_binary_sensor) in ['unknown', 'unavailable', 'none', '']
                       and (state_attr(forecast_weather_entity | trim, 'rain_rate') | float(0)) <= 0.05
                       and states(forecast_weather_entity | trim) not in ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'hail']))
                     and state_attr(mower_entity, 'rain_delay') != true }}
            then:
              - delay: "00:01:00"
                alias: Ustabilizuj potwierdzenie bazy po krawędziach
              - wait_template: >-
                  {{ (states(rain_binary_sensor) not in ['unknown', 'unavailable', 'none', '']
                      and is_state(rain_binary_sensor, 'on'))
                     or
                     (states(rain_binary_sensor) in ['unknown', 'unavailable', 'none', '']
                      and ((state_attr(forecast_weather_entity | trim, 'rain_rate') | float(0)) > 0.05
                           or states(forecast_weather_entity | trim) in ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'hail']))
                     or state_attr(mower_entity, 'rain_delay') == true
                     or is_state(mower_entity, 'docked') }}
                alias: Potwierdź stabilny powrót do bazy po krawędziach
                timeout: "00:02:00"
                continue_on_timeout: true
          - choose:
              - conditions:
                  - condition: template
                    value_template: >-
                      {{ (states(rain_binary_sensor) not in ['unknown', 'unavailable', 'none', '']
                          and is_state(rain_binary_sensor, 'on'))
                         or
                         (states(rain_binary_sensor) in ['unknown', 'unavailable', 'none', '']
                          and ((state_attr(forecast_weather_entity | trim, 'rain_rate') | float(0)) > 0.05
                               or states(forecast_weather_entity | trim) in ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'hail']))
                         or state_attr(mower_entity, 'rain_delay') == true }}
                sequence:
                  - if:
                      - condition: template
                        value_template: "{{ states(mower_entity) not in ['docked', 'unavailable', 'unknown'] }}"
                    then:
                      - action: lawn_mower.dock
                        continue_on_error: true
                        target:
                          entity_id: !input mower_entity
                  - event: worx_smart_mowing_replan
                    event_data:
                      mower_entity: "{{ mower_entity }}"
                      kind: interrupted
                      reason: deszcz przerwał przycinanie krawędzi
                      started_at: "{{ mowing_cycle_started_at }}"
                      finished_at: "{{ now().strftime('%d.%m o %H:%M') }}"
                      min_delay_minutes: 0
                  - stop: Deszcz przerwał etap krawędzi.
              - conditions:
                  - condition: template
                    value_template: "{{ not is_state(mower_entity, 'docked') }}"
                sequence:
                  - if:
                      - condition: template
                        value_template: "{{ states(mower_entity) not in ['unavailable', 'unknown'] }}"
                    then:
                      - action: lawn_mower.dock
                        continue_on_error: true
                        target:
                          entity_id: !input mower_entity
                  - event: worx_smart_mowing_replan
                    event_data:
                      mower_entity: "{{ mower_entity }}"
                      kind: interrupted
                      reason: chmura Worx nie potwierdziła powrotu robota do bazy po krawędziach
                      started_at: "{{ mowing_cycle_started_at }}"
                      finished_at: "{{ now().strftime('%d.%m o %H:%M') }}"
                      min_delay_minutes: 30
                  - stop: Chmura Worx nie potwierdziła powrotu do bazy po krawędziach.
          - wait_template: >-
              {{ (states(rain_binary_sensor) not in ['unknown', 'unavailable', 'none', '']
                  and is_state(rain_binary_sensor, 'on'))
                 or
                 (states(rain_binary_sensor) in ['unknown', 'unavailable', 'none', '']
                  and ((state_attr(forecast_weather_entity | trim, 'rain_rate') | float(0)) > 0.05
                       or states(forecast_weather_entity | trim) in ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'hail']))
                 or state_attr(mower_entity, 'rain_delay') == true
                 or not is_state(mower_entity, 'docked')
                 or (states(battery_sensor) | float(0)) >= (post_edge_battery_percent | float(80)) }}
            alias: Poczekaj w bazie na naładowanie baterii do 80 procent
            timeout: "08:00:00"
            continue_on_timeout: true
          - choose:
              - conditions:
                  - condition: template
                    value_template: >-
                      {{ (states(rain_binary_sensor) not in ['unknown', 'unavailable', 'none', '']
                          and is_state(rain_binary_sensor, 'on'))
                         or
                         (states(rain_binary_sensor) in ['unknown', 'unavailable', 'none', '']
                          and ((state_attr(forecast_weather_entity | trim, 'rain_rate') | float(0)) > 0.05
                               or states(forecast_weather_entity | trim) in ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'hail']))
                         or state_attr(mower_entity, 'rain_delay') == true }}
                sequence:
                  - event: worx_smart_mowing_replan
                    event_data:
                      mower_entity: "{{ mower_entity }}"
                      kind: interrupted
                      reason: po krawędziach, podczas ładowania, zaczął padać deszcz
                      started_at: "{{ mowing_cycle_started_at }}"
                      finished_at: "{{ now().strftime('%d.%m o %H:%M') }}"
                      min_delay_minutes: 0
                  - stop: Po krawędziach zaczął padać deszcz.
              - conditions:
                  - condition: template
                    value_template: "{{ not is_state(mower_entity, 'docked') }}"
                sequence:
                  - event: worx_smart_mowing_replan
                    event_data:
                      mower_entity: "{{ mower_entity }}"
                      kind: interrupted
                      reason: >-
                        robot opuścił bazę podczas ładowania po krawędziach (stan: {{ mower_state_names.get(states(mower_entity), states(mower_entity)) }})
                      started_at: "{{ mowing_cycle_started_at }}"
                      finished_at: "{{ now().strftime('%d.%m o %H:%M') }}"
                      min_delay_minutes: 30
                  - stop: Robot opuścił bazę podczas ładowania po krawędziach.
              - conditions:
                  - condition: template
                    value_template: >-
                      {{ (states(battery_sensor) | float(0)) < (post_edge_battery_percent | float(80)) }}
                sequence:
                  - event: worx_smart_mowing_replan
                    event_data:
                      mower_entity: "{{ mower_entity }}"
                      kind: interrupted
                      reason: >-
                        bateria nie naładowała się do {{ post_edge_battery_percent }}% w ciągu 8 godzin (aktualnie {{ states(battery_sensor) }}%)
                      started_at: "{{ mowing_cycle_started_at }}"
                      finished_at: "{{ now().strftime('%d.%m o %H:%M') }}"
                      min_delay_minutes: 60
                  - stop: Bateria nie osiągnęła 80 procent po krawędziach.
          - variables:
              temperature_after_edges_available: >-
                {% if temperature_source_entity.split('.')[0] == 'weather' %}
                  {{ state_attr(temperature_source_entity, 'temperature') is not none }}
                {% else %}
                  {{ states(temperature_source_entity) not in ['unknown', 'unavailable', 'none', ''] }}
                {% endif %}
              temperature_after_edges_c: >-
                {% if temperature_source_entity.split('.')[0] == 'weather' %}
                  {{ state_attr(temperature_source_entity, 'temperature') | float(-99) }}
                {% else %}
                  {{ states(temperature_source_entity) | float(-99) }}
                {% endif %}
              humidity_after_edges: >-
                {% set selected_humidity = outdoor_humidity_sensor | default('', true) %}
                {% if selected_humidity | length > 0 and states(selected_humidity) not in ['unknown', 'unavailable', 'none', ''] %}
                  {{ states(selected_humidity) | float(-1) }}
                {% elif (forecast_weather_entity | trim | length) > 0 and state_attr(forecast_weather_entity | trim, 'humidity') is not none %}
                  {{ state_attr(forecast_weather_entity | trim, 'humidity') | float(-1) }}
                {% else %}
                  -1
                {% endif %}
          - variables:
              post_edge_block_code: >-
                {% if (temperature_after_edges_available | string | lower) != 'true' %}sensor
                {% elif (temperature_after_edges_c | float(-99)) < (min_mowing_temperature_c | float(10))
                      or (temperature_after_edges_c | float(-99)) > (max_mowing_temperature_c | float(25)) %}temperature
                {% elif states(rain_binary_sensor) in ['unknown', 'unavailable', 'none', '']
                      and (smart_weather_rain_rate_available | string | lower) != 'true' %}sensor
                {% elif state_attr(mower_entity, 'rain_delay') == true %}rain_delay
                {% elif (states(rain_binary_sensor) not in ['unknown', 'unavailable', 'none', '']
                           and is_state(rain_binary_sensor, 'on'))
                      or
                      (states(rain_binary_sensor) in ['unknown', 'unavailable', 'none', '']
                       and ((state_attr(forecast_weather_entity | trim, 'rain_rate') | float(0)) > 0.05
                            or states(forecast_weather_entity | trim) in ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'hail'])) %}rain
                {% elif (humidity_after_edges | float(-1)) > (wet_grass_humidity_percent | float(88)) %}humidity
                {% elif not is_state(mower_entity, 'docked')
                      or (states(battery_sensor) | float(0)) < (post_edge_battery_percent | float(80)) %}mower
                {% else %}{{ '' }}{% endif %}
          - variables:
              post_edge_block_reason: >-
                {% set code = post_edge_block_code | trim %}
                {% if code == 'sensor' and (temperature_after_edges_available | string | lower) != 'true' %}
                  po krawędziach nie można odczytać aktualnej temperatury zewnętrznej
                {% elif code == 'sensor' %}
                  po krawędziach nie można odczytać aktualnego stanu opadu ani z czujnika, ani z MeteoFusion HA
                {% elif code == 'temperature' and (temperature_after_edges_c | float(-99)) < (min_mowing_temperature_c | float(10)) %}
                  po krawędziach temperatura spadła do {{ temperature_after_edges_c | float | round(0) | int }} °C, a minimum do koszenia to {{ min_mowing_temperature_c | int }} °C
                {% elif code == 'temperature' %}
                  po krawędziach temperatura wzrosła do {{ temperature_after_edges_c | float | round(0) | int }} °C, a maksimum do koszenia to {{ max_mowing_temperature_c | int }} °C
                {% elif code == 'rain_delay' %}
                  po krawędziach chmura Worx nadal zgłasza opóźnienie po deszczu
                {% elif code == 'rain' %}
                  po krawędziach lokalny pomiar lub MeteoFusion HA wskazuje trwający opad
                {% elif code == 'humidity' %}
                  po krawędziach wilgotność powietrza wynosi {{ humidity_after_edges | float | round(0) | int }}%, więc trawa może być mokra
                {% elif code == 'mower' %}
                  przed zwykłym koszeniem robot nie jest w bazie albo bateria ma mniej niż {{ post_edge_battery_percent }}% (stan: {{ mower_state_names.get(states(mower_entity), states(mower_entity)) }}, bateria {{ states(battery_sensor) }}%)
                {% else %}
                  {{ '' }}
                {% endif %}
              post_edge_block_delay_minutes: >-
                {% set code = post_edge_block_code | trim %}
                {% set with_forecast = (forecast_available | string | lower) == 'true' and planning_mode == 'auto' %}
                {{ {'sensor': 60, 'temperature': 30 if with_forecast else 60, 'rain_delay': 60, 'rain': 0, 'humidity': 60, 'mower': 30}.get(code, 30) }}
          - if:
              - condition: template
                value_template: "{{ (post_edge_block_code | trim | length) > 0 }}"
            then:
              - event: worx_smart_mowing_replan
                event_data:
                  mower_entity: "{{ mower_entity }}"
                  kind: interrupted
                  reason: "{{ post_edge_block_reason | trim }}"
                  started_at: "{{ mowing_cycle_started_at }}"
                  finished_at: "{{ now().strftime('%d.%m o %H:%M') }}"
                  min_delay_minutes: "{{ post_edge_block_delay_minutes | int(30) }}"
              - stop: Warunki po krawędziach nie pozwalają uruchomić normalnego koszenia.
          - action: worx_vision_cloud.start_one_time_mowing
            alias: Uruchom normalne koszenie jednorazowe
            data:
              entity_id: !input mower_entity
              runtime: "{{ normal_mowing_command_runtime_minutes }}"
              edge_cut: false
              zones: []
          - alias: Poczekaj na potwierdzenie wyjazdu do koszenia
            repeat:
              while:
                - condition: template
                  value_template: >-
                    {{ states(mower_entity) in ['docked', 'paused']
                       and (
                         (states(rain_binary_sensor) not in ['unknown', 'unavailable', 'none', '']
                          and not is_state(rain_binary_sensor, 'on'))
                         or
                         (states(rain_binary_sensor) in ['unknown', 'unavailable', 'none', '']
                          and (state_attr(forecast_weather_entity | trim, 'rain_rate') | float(0)) <= 0.05
                          and states(forecast_weather_entity | trim) not in ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'hail'])
                       )
                       and state_attr(mower_entity, 'rain_delay') != true
                       and repeat.index <= ((mowing_start_confirm_timeout_minutes | int(5)) * 6) }}
              sequence:
                - delay: "00:00:10"
          - if:
              - condition: template
                value_template: >-
                  {{ (states(rain_binary_sensor) not in ['unknown', 'unavailable', 'none', '']
                      and is_state(rain_binary_sensor, 'on'))
                     or
                     (states(rain_binary_sensor) in ['unknown', 'unavailable', 'none', '']
                      and ((state_attr(forecast_weather_entity | trim, 'rain_rate') | float(0)) > 0.05
                           or states(forecast_weather_entity | trim) in ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'hail']))
                     or state_attr(mower_entity, 'rain_delay') == true }}
            then:
              - action: lawn_mower.dock
                continue_on_error: true
                target:
                  entity_id: !input mower_entity
              - event: worx_smart_mowing_replan
                event_data:
                  mower_entity: "{{ mower_entity }}"
                  kind: interrupted
                  reason: deszcz tuż przed startem koszenia
                  started_at: "{{ mowing_cycle_started_at }}"
                  finished_at: "{{ now().strftime('%d.%m o %H:%M') }}"
                  min_delay_minutes: 0
              - stop: Start koszenia przerwany przez deszcz.
          - if:
              - condition: template
                value_template: "{{ states(mower_entity) in ['docked', 'paused'] }}"
            then:
              - action: worx_vision_cloud.start_one_time_mowing
                alias: Ponów normalne koszenie jednorazowe
                data:
                  entity_id: !input mower_entity
                  runtime: "{{ normal_mowing_command_runtime_minutes }}"
                  edge_cut: false
                  zones: []
              - alias: Poczekaj na potwierdzenie drugiego startu koszenia
                repeat:
                  while:
                    - condition: template
                      value_template: >-
                        {{ states(mower_entity) in ['docked', 'paused']
                           and (
                             (states(rain_binary_sensor) not in ['unknown', 'unavailable', 'none', '']
                              and not is_state(rain_binary_sensor, 'on'))
                             or
                             (states(rain_binary_sensor) in ['unknown', 'unavailable', 'none', '']
                              and (state_attr(forecast_weather_entity | trim, 'rain_rate') | float(0)) <= 0.05
                              and states(forecast_weather_entity | trim) not in ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'hail'])
                           )
                           and state_attr(mower_entity, 'rain_delay') != true
                           and repeat.index <= ((mowing_start_confirm_timeout_minutes | int(5)) * 6) }}
                  sequence:
                    - delay: "00:00:10"
          - if:
              - condition: template
                value_template: >-
                  {{ (states(rain_binary_sensor) not in ['unknown', 'unavailable', 'none', '']
                      and is_state(rain_binary_sensor, 'on'))
                     or
                     (states(rain_binary_sensor) in ['unknown', 'unavailable', 'none', '']
                      and ((state_attr(forecast_weather_entity | trim, 'rain_rate') | float(0)) > 0.05
                           or states(forecast_weather_entity | trim) in ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'hail']))
                     or state_attr(mower_entity, 'rain_delay') == true }}
            then:
              - action: lawn_mower.dock
                continue_on_error: true
                target:
                  entity_id: !input mower_entity
              - event: worx_smart_mowing_replan
                event_data:
                  mower_entity: "{{ mower_entity }}"
                  kind: interrupted
                  reason: deszcz podczas ponownego startu koszenia
                  started_at: "{{ mowing_cycle_started_at }}"
                  finished_at: "{{ now().strftime('%d.%m o %H:%M') }}"
                  min_delay_minutes: 0
              - stop: Start koszenia przerwany przez deszcz po ponowieniu.
          - if:
              - condition: template
                value_template: "{{ states(mower_entity) in ['docked', 'paused', 'unavailable', 'unknown'] }}"
            then:
              - event: worx_smart_mowing_replan
                event_data:
                  mower_entity: "{{ mower_entity }}"
                  kind: interrupted
                  reason: >-
                    robot nie rozpoczął koszenia mimo dwóch komend (stan: {{ mower_state_names.get(states(mower_entity), states(mower_entity)) }})
                  started_at: "{{ mowing_cycle_started_at }}"
                  finished_at: "{{ now().strftime('%d.%m o %H:%M') }}"
                  min_delay_minutes: 30
              - stop: Nie potwierdzono startu koszenia po dwóch próbach.
          - alias: Koszenie do powrotu robota albo limitu bezpieczeństwa
            repeat:
              while:
                - condition: template
                  value_template: >-
                    {% set mower_changed_ts = as_timestamp(states[mower_entity].last_changed) %}
                    {% set battery_changed_ts = as_timestamp(states[battery_sensor].last_changed) %}
                    {% set stable_since_ts = [mower_changed_ts, battery_changed_ts] | max %}
                    {% set vision_complete = is_state(mower_entity, 'docked')
                        and (states(battery_sensor) | float(0)) >= (vision_completion_battery_percent | float(95))
                        and state_attr(mower_entity, 'rain_delay') != true
                        and (as_timestamp(now()) - stable_since_ts) >= ((vision_completion_stable_minutes | int(15)) * 60) %}
                    {% set completed = vision_complete if mower_cycle_type == 'vision_rtk'
                        else is_state(mower_entity, 'docked') %}
                    {{ ((states(rain_binary_sensor) not in ['unknown', 'unavailable', 'none', '']
                         and not is_state(rain_binary_sensor, 'on'))
                        or
                        (states(rain_binary_sensor) in ['unknown', 'unavailable', 'none', '']
                         and (state_attr(forecast_weather_entity | trim, 'rain_rate') | float(0)) <= 0.05
                         and states(forecast_weather_entity | trim) not in ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'hail']))
                       and state_attr(mower_entity, 'rain_delay') != true
                       and not completed
                       and repeat.index <= (normal_mowing_monitor_limit_minutes | int(720)) }}
              sequence:
                - delay: "00:01:00"
          - variables:
              normal_mowing_finished_ts: >-
                {% if is_state(mower_entity, 'docked') %}
                  {{ as_timestamp(states[mower_entity].last_changed) }}
                {% else %}
                  {{ as_timestamp(now()) }}
                {% endif %}
          - if:
              - condition: template
                value_template: "{{ states(mower_entity) not in ['docked', 'paused', 'unavailable', 'unknown'] }}"
            then:
              - action: lawn_mower.dock
                continue_on_error: true
                target:
                  entity_id: !input mower_entity
          - wait_template: >-
              {{ (states(rain_binary_sensor) not in ['unknown', 'unavailable', 'none', '']
                  and is_state(rain_binary_sensor, 'on'))
                 or
                 (states(rain_binary_sensor) in ['unknown', 'unavailable', 'none', '']
                  and ((state_attr(forecast_weather_entity | trim, 'rain_rate') | float(0)) > 0.05
                       or states(forecast_weather_entity | trim) in ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'hail']))
                 or state_attr(mower_entity, 'rain_delay') == true
                 or is_state(mower_entity, 'docked') }}
            alias: Poczekaj na powrót do bazy po normalnym koszeniu
            timeout: "00:30:00"
            continue_on_timeout: true
          - if:
              - condition: template
                value_template: >-
                  {{ ((states(rain_binary_sensor) not in ['unknown', 'unavailable', 'none', '']
                       and not is_state(rain_binary_sensor, 'on'))
                      or
                      (states(rain_binary_sensor) in ['unknown', 'unavailable', 'none', '']
                       and (state_attr(forecast_weather_entity | trim, 'rain_rate') | float(0)) <= 0.05
                       and states(forecast_weather_entity | trim) not in ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'hail']))
                     and state_attr(mower_entity, 'rain_delay') != true }}
            then:
              - delay: "00:01:00"
                alias: Ustabilizuj potwierdzenie bazy po normalnym koszeniu
              - wait_template: >-
                  {{ (states(rain_binary_sensor) not in ['unknown', 'unavailable', 'none', '']
                      and is_state(rain_binary_sensor, 'on'))
                     or
                     (states(rain_binary_sensor) in ['unknown', 'unavailable', 'none', '']
                      and ((state_attr(forecast_weather_entity | trim, 'rain_rate') | float(0)) > 0.05
                           or states(forecast_weather_entity | trim) in ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'hail']))
                     or state_attr(mower_entity, 'rain_delay') == true
                     or is_state(mower_entity, 'docked') }}
                alias: Potwierdź stabilny powrót do bazy po normalnym koszeniu
                timeout: "00:02:00"
                continue_on_timeout: true
          - variables:
              mowing_cycle_finished_at: >-
                {{ (normal_mowing_finished_ts | float) | timestamp_custom('%d.%m o %H:%M', true) }}
              whole_cycle_duration_label: >-
                {% set total = ((((normal_mowing_finished_ts | float) - (mowing_cycle_started_ts | float)) / 60) | round(0)) | int %}
                {% if total >= 60 %}{{ total // 60 }} godz. {{ total % 60 }} min{% else %}{{ total }} min{% endif %}
              rain_after_mowing: >-
                {{ (states(rain_binary_sensor) not in ['unknown', 'unavailable', 'none', '']
                    and is_state(rain_binary_sensor, 'on'))
                   or
                   (states(rain_binary_sensor) in ['unknown', 'unavailable', 'none', '']
                    and ((state_attr(forecast_weather_entity | trim, 'rain_rate') | float(0)) > 0.05
                         or states(forecast_weather_entity | trim) in ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'hail']))
                   or state_attr(mower_entity, 'rain_delay') == true }}
              mowing_completed: >-
                {% set mower_changed_ts = as_timestamp(states[mower_entity].last_changed) %}
                {% set battery_changed_ts = as_timestamp(states[battery_sensor].last_changed) %}
                {% set stable_since_ts = [mower_changed_ts, battery_changed_ts] | max %}
                {% set vision_complete = is_state(mower_entity, 'docked')
                    and (states(battery_sensor) | float(0)) >= (vision_completion_battery_percent | float(95))
                    and state_attr(mower_entity, 'rain_delay') != true
                    and (as_timestamp(now()) - stable_since_ts) >= ((vision_completion_stable_minutes | int(15)) * 60) %}
                {% set rain_now = (states(rain_binary_sensor) not in ['unknown', 'unavailable', 'none', '']
                    and is_state(rain_binary_sensor, 'on'))
                    or (states(rain_binary_sensor) in ['unknown', 'unavailable', 'none', '']
                        and ((state_attr(forecast_weather_entity | trim, 'rain_rate') | float(0)) > 0.05
                             or states(forecast_weather_entity | trim) in ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'hail']))
                    or state_attr(mower_entity, 'rain_delay') == true %}
                {{ not rain_now and (vision_complete if mower_cycle_type == 'vision_rtk' else is_state(mower_entity, 'docked')) }}
          - if:
              - condition: template
                value_template: "{{ (mowing_completed | string | lower) == 'true' }}"
            then:
              - action: input_datetime.set_datetime
                alias: Zapisz zakończone koszenie jako ostatnie koszenie
                target:
                  entity_id: !input last_mow_helper
                data:
                  timestamp: "{{ normal_mowing_finished_ts | float | int }}"
              - action: input_number.set_value
                alias: Wyzeruj przyrost po pełnym koszeniu
                target:
                  entity_id: !input growth_helper
                data:
                  value: 0
              - event: worx_smart_mowing_replan
                event_data:
                  mower_entity: "{{ mower_entity }}"
                  kind: completed
                  started_at: "{{ mowing_cycle_started_at }}"
                  finished_at: "{{ mowing_cycle_finished_at | trim }}"
                  duration_label: "{{ whole_cycle_duration_label | trim }}"
                  min_delay_minutes: 0
            else:
              - variables:
                  reduced_growth_mm: "{{ ((states(growth_helper) | float(0)) * 0.7) | round(1) }}"
              - action: input_number.set_value
                alias: Zmniejsz przyrost po częściowym koszeniu
                target:
                  entity_id: !input growth_helper
                data:
                  value: "{{ reduced_growth_mm }}"
              - event: worx_smart_mowing_replan
                event_data:
                  mower_entity: "{{ mower_entity }}"
                  kind: interrupted
                  reason: >-
                    {{ 'deszcz podczas koszenia' if (rain_after_mowing | string | lower) == 'true' else 'robot nie potwierdził zakończenia koszenia i powrotu do bazy' }}
                  started_at: "{{ mowing_cycle_started_at }}"
                  finished_at: "{{ mowing_cycle_finished_at | trim }}"
                  growth_note: Trawnik skoszono częściowo, więc szacowany przyrost trawy zmniejszono o 30%.
                  min_delay_minutes: "{{ 0 if (rain_after_mowing | string | lower) == 'true' else 30 }}"
      - alias: Śledź koszenie uruchomione poza automatyzacją
        conditions:
          - condition: template
            value_template: "{{ trigger.id == 'external_mowing_started' }}"
          - condition: template
            value_template: "{{ (cycle_running | string | lower) != 'true' }}"
          - condition: template
            value_template: "{{ state_attr(mower_entity, 'rtk_at_station') != true }}"
          - condition: template
            value_template: "{{ state_attr(mower_entity, 'status_id') | int(-1) != 32 }}"
        sequence:
          - variables:
              manual_mow_started_ts: "{{ as_timestamp(trigger.to_state.last_changed) }}"
              manual_mow_started_at: >-
                {{ as_timestamp(trigger.to_state.last_changed) | timestamp_custom('%d.%m o %H:%M', true) }}
          - alias: Monitoruj ręczne koszenie, łącznie z doładowaniem Vision / RTK
            repeat:
              while:
                - condition: template
                  value_template: >-
                    {% set mower_changed_ts = as_timestamp(states[mower_entity].last_changed) %}
                    {% set battery_changed_ts = as_timestamp(states[battery_sensor].last_changed) %}
                    {% set stable_since_ts = [mower_changed_ts, battery_changed_ts] | max %}
                    {% set vision_complete = is_state(mower_entity, 'docked')
                        and (states(battery_sensor) | float(0)) >= (vision_completion_battery_percent | float(95))
                        and state_attr(mower_entity, 'rain_delay') != true
                        and (as_timestamp(now()) - stable_since_ts) >= ((vision_completion_stable_minutes | int(15)) * 60) %}
                    {% set completed = vision_complete if mower_cycle_type == 'vision_rtk'
                        else is_state(mower_entity, 'docked') %}
                    {{ not completed
                       and repeat.index <= (normal_mowing_monitor_limit_minutes | int(720)) }}
              sequence:
                - delay: "00:01:00"
          - variables:
              manual_mow_completed: >-
                {% set mower_changed_ts = as_timestamp(states[mower_entity].last_changed) %}
                {% set battery_changed_ts = as_timestamp(states[battery_sensor].last_changed) %}
                {% set stable_since_ts = [mower_changed_ts, battery_changed_ts] | max %}
                {% set vision_complete = is_state(mower_entity, 'docked')
                    and (states(battery_sensor) | float(0)) >= (vision_completion_battery_percent | float(95))
                    and state_attr(mower_entity, 'rain_delay') != true
                    and (as_timestamp(now()) - stable_since_ts) >= ((vision_completion_stable_minutes | int(15)) * 60) %}
                {{ vision_complete if mower_cycle_type == 'vision_rtk' else is_state(mower_entity, 'docked') }}
          - if:
              - condition: template
                value_template: "{{ (manual_mow_completed | string | lower) != 'true' }}"
            then:
              - action: persistent_notification.create
                data:
                  notification_id: "{{ notification_id }}"
                  title: "Worx: koszenie ręczne przerwane"
                  message: |-
                    Koszenie uruchomione ręcznie {{ manual_mow_started_at | trim }} nie zakończyło się pełnym cyklem (stan robota: {{ mower_state_names.get(states(mower_entity), states(mower_entity)) }}).
                    Szacowany przyrost trawy pozostaje bez zmian: {{ states(growth_helper) | float(0) | round(1) | string | replace('.', ',') }} mm.
              - stop: Ręczne koszenie nie zostało potwierdzone jako zakończone.
          - variables:
              manual_mow_finished_ts: "{{ as_timestamp(states[mower_entity].last_changed) }}"
          - action: input_datetime.set_datetime
            alias: Zapisz ręczne koszenie jako ostatnie koszenie
            target:
              entity_id: !input last_mow_helper
            data:
              timestamp: "{{ manual_mow_finished_ts | float | int }}"
          - action: input_number.set_value
            alias: Wyzeruj przyrost po ręcznym koszeniu
            target:
              entity_id: !input growth_helper
            data:
              value: 0
          - event: worx_smart_mowing_replan
            event_data:
              mower_entity: "{{ mower_entity }}"
              kind: manual_completed
              started_at: "{{ manual_mow_started_at | trim }}"
              finished_at: "{{ (manual_mow_finished_ts | float) | timestamp_custom('%d.%m o %H:%M', true) }}"
              duration_label: >-
                {% set total = ((((manual_mow_finished_ts | float) - (manual_mow_started_ts | float)) / 60) | round(0)) | int %}
                {% if total >= 60 %}{{ total // 60 }} godz. {{ total % 60 }} min{% else %}{{ total }} min{% endif %}
              min_delay_minutes: 0
