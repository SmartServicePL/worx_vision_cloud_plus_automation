         or (weather_entity | length > 0 and states(weather_entity) in wet_conditions) }}
    {% endif %}
  rain_drying_hours: >-
    {% set base = dry_after_rain_hours | float(3) %}
    {{ base * (2 if (rain_mm | float(0)) > (max_rain_24h_mm | float(3)) else 1) }}
  # Chwila, od której trawa jest uznawana za suchą. Trwający opad liczy się od teraz,
  # a zakończony opad od chwili przejścia czujnika w stan suchy, ale tylko gdy od
