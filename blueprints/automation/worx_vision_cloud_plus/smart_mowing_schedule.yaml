       if (smart_weather_rain_today_available | string | lower) == 'true'
       else 0 %}
    {{ [configured, smart] | max | round(2) }}
  local_rain_sensor_available: >-
    {{ states(rain_binary_sensor) not in ['unknown', 'unavailable', 'none', ''] }}
  rain_observation_available: >-
    {{ (local_rain_sensor_available | string | lower) == 'true'
       or (smart_weather_rain_rate_available | string | lower) == 'true' }}
  rain_active_now: >-
    {% set weather_entity = forecast_weather_entity | trim %}
    {% set wet_conditions = ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'hail'] %}
    {% if (local_rain_sensor_available | string | lower) == 'true' %}
