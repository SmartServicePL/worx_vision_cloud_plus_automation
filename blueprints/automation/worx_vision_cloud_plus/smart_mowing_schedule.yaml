                        koszenia. {{ retry_notification_details | trim }}
                  - stop: Start koszenia przerwany przez deszcz po ponowieniu.
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ states(mower_entity) in ['docked', 'paused'] }}"
                sequence:
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ (next_mow_helper | default('', true) | length) > 0 }}"
                        sequence:
                          - action: input_datetime.set_datetime
                            alias: Zapisz kolejna probe po braku startu
                            target:
                              entity_id: "{{ next_mow_helper }}"
                            data:
                              datetime: "{{ planned_retry_mow_datetime | trim }}"
                  - action: persistent_notification.create
                    data:
                      notification_id: "{{ notification_id }}"
                      title: "Worx: koszenie przełożone"
                      message: >-
                        Start: {{ mowing_cycle_started_at }}.
                        Powód: zwykłe koszenie nie wystartowało po dwóch
                        próbach (stan: {{ states(mower_entity) }}).
                        {{ retry_notification_details | trim }}
                  - stop: Nie potwierdzono startu koszenia po dwoch probach.
          - condition: template
            alias: Normalne koszenie rozpoczete
            value_template: "{{ states(mower_entity) not in ['docked', 'paused'] }}"
          - variables:
              normal_mowing_started_at: "{{ now().strftime('%d.%m %H:%M') }}"
              normal_mowing_started_ts: "{{ as_timestamp(now()) }}"
          - action: persistent_notification.create
            data:
              notification_id: "{{ notification_id }}"
              title: "Worx: trwa koszenie"
              message: >-
                Start cyklu: {{ mowing_cycle_started_at }}.
                Krawędzie zakończone.
                Zwykłe koszenie rozpoczęte: {{ normal_mowing_started_at }}.
                Bateria: {{ states(battery_sensor) }}%.
          - alias: Koszenie przez wyliczony czas albo do deszczu
            repeat:
              while:
                - condition: template
                  value_template: >-
                    {{ is_state(rain_binary_sensor, 'off')
                       and states(mower_entity) not in ['docked', 'paused', 'unavailable', 'unknown']
                       and repeat.index <= (normal_mowing_runtime_minutes | int(60)) }}
              sequence:
                - delay: "00:01:00"
          - variables:
              normal_mowing_finished_ts: "{{ as_timestamp(now()) }}"
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ states(mower_entity) not in ['docked', 'paused', 'unavailable', 'unknown'] }}"
                sequence:
                  - action: lawn_mower.dock
                    target:
                      entity_id: !input mower_entity
          - wait_template: "{{ is_state(mower_entity, 'docked') or is_state(rain_binary_sensor, 'on') }}"
            alias: Poczekaj na powrot do bazy po normalnym koszeniu
            timeout: "00:30:00"
            continue_on_timeout: true
          - variables:
              mowing_cycle_finished_at: "{{ now().strftime('%d.%m %H:%M') }}"
              edge_mowing_minutes: >-
                {{ ((((edge_mowing_finished_ts | float) - (edge_mowing_started_ts | float)) / 60) | round(0)) | int }}
              normal_mowing_minutes: >-
                {{ ((((normal_mowing_finished_ts | float) - (normal_mowing_started_ts | float)) / 60) | round(0)) | int }}
              whole_cycle_minutes: >-
                {{ ((((as_timestamp(now()) | float) - (mowing_cycle_started_ts | float)) / 60) | round(0)) | int }}
          - variables:
              mowing_duration_label: >-
                {% set total = (edge_mowing_minutes | int) + (normal_mowing_minutes | int) %}
                {% if total >= 60 %}
                  {{ total // 60 }} godz. {{ total % 60 }} min
                {% else %}
                  {{ total }} min
                {% endif %}
              whole_cycle_duration_label: >-
                {% set total = whole_cycle_minutes | int %}
                {% if total >= 60 %}
                  {{ total // 60 }} godz. {{ total % 60 }} min
                {% else %}
                  {{ total }} min
                {% endif %}
          - choose:
              - conditions:
                  - condition: template
                    value_template: >-
                      {{ is_state(rain_binary_sensor, 'off')
                         and is_state(mower_entity, 'docked') }}
                sequence:
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ rain_source_entity.split('.')[0] == 'weather' }}"
                        sequence:
                          - action: weather.get_forecasts
                            target:
                              entity_id: !input rain_source_entity
                            data:
                              type: hourly
                            response_variable: weather_forecast_after_mow
                  - variables:
                      planned_next_after_reset_datetime: >-
                        {% set fallback = next_mow_after_reset_datetime | trim %}
                        {% if planning_mode != 'auto' or weather_forecast_after_mow is not defined %}
                          {{ fallback }}
                        {% else %}
                          {% set items = weather_forecast_after_mow.get(rain_source_entity, {}).get('forecast', []) %}
                          {% set step = auto_planning_step_seconds | int(900) %}
                          {% set earliest_allowed_ts = [as_timestamp(fallback), as_timestamp(now()) + 300] | max %}
                          {% set horizon = namespace(max=0) %}
                          {% for item in items %}
                            {% set item_ts = as_timestamp(item.datetime) %}
                            {% if item_ts > horizon.max %}
                              {% set horizon.max = item_ts %}
                            {% endif %}
                          {% endfor %}
                          {% if horizon.max > 0 %}
                            {% set bad = ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'snowy', 'hail'] %}
                            {% set ns = namespace(preferred_ts=0, preferred_score=999999, fallback_ts=0, fallback_score=999999) %}
                            {% set first_day_ts = earliest_allowed_ts %}
                            {% set earliest_clock = earliest_allowed_ts | timestamp_custom('%H:%M:%S', true) %}
                            {% if backup_start_time_value <= primary_start_time_value and earliest_clock < backup_start_time_value %}
                              {% set first_day_ts = earliest_allowed_ts - 86400 %}
                            {% endif %}
                            {% set first_day = first_day_ts | timestamp_custom('%Y-%m-%d', true) %}
                            {% for day in range(0, weather_search_days | int(4)) %}
                              {% set day_ts = as_timestamp(first_day ~ ' 00:00:00') + (day * 86400) %}
                              {% set target_date = day_ts | timestamp_custom('%Y-%m-%d', true) %}
                              {% set preferred_start = as_timestamp(target_date ~ ' ' ~ primary_start_time_value) %}
                              {% set raw_preferred_end = as_timestamp(target_date ~ ' ' ~ backup_start_time_value) %}
                              {% set preferred_end = raw_preferred_end if raw_preferred_end > preferred_start else raw_preferred_end + 86400 %}
                              {% if mowing_window_preset == 'night' %}
                                {% set search_start = preferred_start %}
                                {% set raw_search_end = preferred_end %}
                              {% else %}
                                {% set search_start = as_timestamp(target_date ~ ' 06:00:00') %}
                                {% set raw_search_end = as_timestamp(target_date ~ ' 22:00:00') %}
                              {% endif %}
                              {% set search_end = [raw_search_end, horizon.max + 3600] | min %}
                              {% set start_ts = [search_start, earliest_allowed_ts] | max %}
                              {% if start_ts <= search_end %}
                                {% set window_mid = ((preferred_start + preferred_end) / 2) %}
                                {% set first_slot = ((start_ts / step) | round(0, 'ceil') | int) * step %}
                                {% set slots = [(((search_end - first_slot) / step) | round(0, 'floor') | int) + 1, 0] | max %}
                                {% for slot in range(0, slots) %}
                                  {% set ts = first_slot + (slot * step) %}
                                  {% set fc = namespace(seen=0, rain=0, probability=0, temp=temp_c | float(10), wind=0, humidity=60, condition='') %}
                                  {% set recent = namespace(rain=0, wet=0) %}
                                  {% for item in items %}
                                    {% set item_ts = as_timestamp(item.datetime) %}
                                    {% if item_ts <= ts and item_ts > (ts - 3600) %}
                                      {% set fc.seen = 1 %}
                                      {% set fc.rain = item.precipitation | default(0) | float(0) %}
                                      {% set fc.probability = item.precipitation_probability | default(0) | float(0) %}
                                      {% set fc.temp = item.temperature | default(temp_c) | float(temp_c) %}
                                      {% set fc.wind = item.wind_speed | default(0) | float(0) %}
                                      {% set fc.humidity = item.humidity | default(60) | float(60) %}
                                      {% set fc.condition = item.condition | default('') %}
                                    {% endif %}
                                    {% if item_ts <= ts and item_ts > (ts - ((dry_after_rain_hours | int(3)) * 3600)) %}
                                      {% set recent_rain = item.precipitation | default(0) | float(0) %}
                                      {% set recent_condition = item.condition | default('') %}
                                      {% if recent_rain > 0.05 or recent_condition in bad %}
                                        {% set recent.rain = recent.rain + recent_rain %}
                                        {% set recent.wet = 1 %}
                                      {% endif %}
                                    {% endif %}
                                  {% endfor %}
                                  {% set score = (fc.rain * 500) + (fc.probability * 3) + (((fc.temp - 20) | abs) * 2) + (fc.wind * 0.8) + ((((ts - window_mid) | abs) / 3600) * 1.2) + (((ts - earliest_allowed_ts) / 86400) * 8) %}
                                  {% if fc.seen == 0 %}
                                    {% set score = score + 120 %}
                                  {% endif %}
                                  {% if fc.rain > 0.05 or fc.condition in bad %}
                                    {% set score = score + 10000 %}
                                  {% endif %}
                                  {% if fc.probability > (high_rain_probability_percent | float(60)) %}
                                    {% set score = score + 2000 %}
                                  {% endif %}
                                  {% if recent.wet == 1 %}
                                    {% set score = score + 1800 + (recent.rain * 200) %}
                                  {% endif %}
                                  {% if fc.humidity > (wet_grass_humidity_percent | float(88)) %}
                                    {% set score = score + 250 %}
                                  {% elif fc.humidity > 82 %}
                                    {% set score = score + 80 %}
                                  {% endif %}
                                  {% set safe = fc.seen == 1
                                      and fc.temp >= (min_mowing_temperature_c | float(10))
                                      and fc.temp <= (max_mowing_temperature_c | float(25))
                                      and fc.rain <= 0.05
                                      and fc.condition not in bad
                                      and fc.probability <= (high_rain_probability_percent | float(60))
                                      and recent.wet == 0
                                      and fc.humidity <= (wet_grass_humidity_percent | float(88))
                                      and (mowing_window_preset != 'night' or (fiatlux_installed | bool)) %}
                                  {% if safe and score < ns.fallback_score %}
                                    {% set ns.fallback_score = score %}
                                    {% set ns.fallback_ts = ts %}
                                  {% endif %}
                                  {% if safe and ts >= preferred_start and ts <= preferred_end and score < ns.preferred_score %}
                                    {% set ns.preferred_score = score %}
                                    {% set ns.preferred_ts = ts %}
                                  {% endif %}
                                {% endfor %}
                              {% endif %}
                            {% endfor %}
                            {% if ns.preferred_ts > 0 %}
                              {{ ns.preferred_ts | timestamp_custom('%Y-%m-%d %H:%M:%S', true) }}
                            {% elif ns.fallback_ts > 0 %}
                              {{ ns.fallback_ts | timestamp_custom('%Y-%m-%d %H:%M:%S', true) }}
                            {% else %}
                              {{ fallback }}
                            {% endif %}
                          {% else %}
                            {{ fallback }}
                          {% endif %}
                        {% endif %}
                  - variables:
                      planned_next_after_reset_label: >-
                        {% set raw = planned_next_after_reset_datetime | trim %}
                        {% set ts = as_timestamp(raw) %}
                        {% set target_midnight = as_timestamp((ts | timestamp_custom('%Y-%m-%d', true)) ~ ' 00:00:00') %}
                        {% set today_midnight = as_timestamp(today_at('00:00:00')) %}
                        {% set days = ((target_midnight - today_midnight) / 86400) | round(0) | int %}
                        {% if days <= 0 %}dziś o {{ ts | timestamp_custom('%H:%M', true) }}
                        {% elif days == 1 %}jutro o {{ ts | timestamp_custom('%H:%M', true) }}
                        {% elif days == 2 %}za 2 dni o {{ ts | timestamp_custom('%H:%M', true) }}
                        {% else %}za {{ days }} dni o {{ ts | timestamp_custom('%H:%M', true) }}{% endif %}
                      planned_next_after_reset_reason: >-
                        {% if planning_mode != 'auto' or weather_forecast_after_mow is not defined %}
                          wybrano kolejny termin z ustawionego okna koszenia, bez oceny prognozy godzinowej
                        {% else %}
                          {% set items = weather_forecast_after_mow.get(rain_source_entity, {}).get('forecast', []) %}
                          {% set ts = as_timestamp(planned_next_after_reset_datetime | trim) %}
                          {% set bad = ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'snowy', 'hail'] %}
                          {% set fc = namespace(seen=0, rain=0, probability=0, temp=temp_c | float(10), wind=0, humidity=60, condition='') %}
                          {% set recent = namespace(rain=0, wet=0) %}
                          {% for item in items %}
                            {% set item_ts = as_timestamp(item.datetime) %}
                            {% if item_ts <= ts and item_ts > (ts - 3600) %}
                              {% set fc.seen = 1 %}
                              {% set fc.rain = item.precipitation | default(0) | float(0) %}
                              {% set fc.probability = item.precipitation_probability | default(0) | float(0) %}
                              {% set fc.temp = item.temperature | default(temp_c) | float(temp_c) %}
                              {% set fc.wind = item.wind_speed | default(0) | float(0) %}
                              {% set fc.humidity = item.humidity | default(60) | float(60) %}
                              {% set fc.condition = item.condition | default('') %}
                            {% endif %}
                            {% if item_ts <= ts and item_ts > (ts - ((dry_after_rain_hours | int(3)) * 3600)) %}
                              {% set recent_rain = item.precipitation | default(0) | float(0) %}
                              {% set recent_condition = item.condition | default('') %}
                              {% if recent_rain > 0.05 or recent_condition in bad %}
                                {% set recent.rain = recent.rain + recent_rain %}
                                {% set recent.wet = 1 %}
                              {% endif %}
                            {% endif %}
                          {% endfor %}
                          {% set selected_clock = ts | timestamp_custom('%H:%M:%S', true) %}
                          {% if backup_start_time_value <= primary_start_time_value %}
                            {% set inside_preferred_window = selected_clock >= primary_start_time_value or selected_clock <= backup_start_time_value %}
                          {% else %}
                            {% set inside_preferred_window = selected_clock >= primary_start_time_value and selected_clock <= backup_start_time_value %}
                          {% endif %}
                          {% if fc.seen == 0 %}
                            to najbliższy sensowny termin, ale prognoza godzinowa nie ma już dokładnych danych dla tej godziny
                          {% elif fc.temp < (min_mowing_temperature_c | float(10)) %}
                            prognozowana temperatura {{ fc.temp | round(1) }} st. C jest nizsza od zalecanego minimum {{ min_mowing_temperature_c }} st. C, wiec termin moze zostac przesuniety
                          {% elif fc.temp > (max_mowing_temperature_c | float(25)) %}
                            prognozowana temperatura {{ fc.temp | round(1) }} st. C przekracza zalecane maksimum {{ max_mowing_temperature_c }} st. C, wiec termin moze zostac przesuniety
                          {% elif fc.rain > 0.05 or fc.condition in bad %}
                            to najbezpieczniejszy dostępny termin w prognozie, mimo że nadal widać ryzyko opadu
                          {% elif not inside_preferred_window %}
                            to najbliższa bezpieczna godzina poza preferowanym oknem; w wybranym oknie nie ma warunków spełniających temperaturę, opad i wilgotność
                          {% elif recent.wet == 1 %}
                            automatyzacja odczeka po deszczu, żeby kolejne koszenie nie weszło na świeżo mokry trawnik
                          {% elif fc.humidity > (wet_grass_humidity_percent | float(88)) %}
                            to najlepszy dostępny termin, ale wilgotność nadal jest wysoka, więc start może zostać ponownie przesunięty
                          {% else %}
                            prognoza pokazuje brak deszczu, przerwę po opadach i najniższe ryzyko mokrej trawy w wybranym oknie
                          {% endif %}
                        {% endif %}
                      planned_next_after_reset_forecast: >-
                        {% if weather_forecast_after_mow is not defined %}
                          unknown;brak prognozy godzinowej dla wskazanego terminu
                        {% else %}
                          {% set items = weather_forecast_after_mow.get(rain_source_entity, {}).get('forecast', []) %}
                          {% set ts = as_timestamp(planned_next_after_reset_datetime | trim) %}
                          {% set bad = ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'snowy', 'hail'] %}
                          {% set fc = namespace(seen=0, rain=0, probability=0, temp=temp_c | float(10), humidity=60, condition='') %}
                          {% set recent = namespace(wet=0) %}
                          {% for item in items %}
                            {% set item_ts = as_timestamp(item.datetime) %}
                            {% if item_ts <= ts and item_ts > (ts - 3600) %}
                              {% set fc.seen = 1 %}
                              {% set fc.rain = item.precipitation | default(0) | float(0) %}
                              {% set fc.probability = item.precipitation_probability | default(0) | float(0) %}
                              {% set fc.temp = item.temperature | default(temp_c) | float(temp_c) %}
                              {% set fc.humidity = item.humidity | default(60) | float(60) %}
                              {% set fc.condition = item.condition | default('') %}
                            {% endif %}
                            {% if item_ts <= ts and item_ts > (ts - ((dry_after_rain_hours | int(3)) * 3600)) %}
                              {% if (item.precipitation | default(0) | float(0)) > 0.05 or (item.condition | default('')) in bad %}
                                {% set recent.wet = 1 %}
                              {% endif %}
                            {% endif %}
                          {% endfor %}
                          {% set safe = fc.seen == 1
                              and fc.temp >= (min_mowing_temperature_c | float(10))
                              and fc.temp <= (max_mowing_temperature_c | float(25))
                              and fc.rain <= 0.05
                              and fc.condition not in bad
                              and fc.probability <= (high_rain_probability_percent | float(60))
                              and recent.wet == 0
                              and fc.humidity <= (wet_grass_humidity_percent | float(88))
                              and (mowing_window_preset != 'night' or (fiatlux_installed | bool)) %}
                          {% set condition_names = {
                            'clear-night': 'bezchmurnie',
                            'cloudy': 'pochmurno',
                            'exceptional': 'nietypowe warunki',
                            'fog': 'mgła',
                            'hail': 'grad',
                            'lightning': 'burze',
                            'lightning-rainy': 'burze z deszczem',
                            'partlycloudy': 'częściowe zachmurzenie',
                            'pouring': 'ulewny deszcz',
                            'rainy': 'deszcz',
                            'snowy': 'śnieg',
                            'snowy-rainy': 'deszcz ze śniegiem',
                            'sunny': 'słonecznie',
                            'windy': 'wietrznie',
                            'windy-variant': 'wietrznie z zachmurzeniem'
                          } %}
                          {% set condition_label = condition_names.get(fc.condition, fc.condition if fc.condition else 'brak opisu') %}
                          {{ 'safe' if safe else 'unsafe' }};{{ condition_label }}, temperatura {{ fc.temp | round(1) }} st. C, opad {{ fc.rain | round(1) }} mm, ryzyko deszczu {{ fc.probability | round(0) }}%, wilgotność {{ fc.humidity | round(0) }}%
                        {% endif %}
                  - action: input_datetime.set_datetime
                    target:
                      entity_id: !input last_mow_helper
                    data:
                      datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
                  - action: input_number.set_value
                    target:
                      entity_id: !input growth_helper
                    data:
                      value: 0
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ (next_mow_helper | default('', true) | length) > 0 }}"
                        sequence:
                          - action: input_datetime.set_datetime
                            target:
                              entity_id: "{{ next_mow_helper }}"
                            data:
                              datetime: "{{ planned_next_after_reset_datetime | trim }}"
                  - action: persistent_notification.create
                    data:
                      notification_id: "{{ notification_id }}"
                      title: "Worx: koszenie zakończone"
                      message: >-
                        Start: {{ mowing_cycle_started_at }}.
                        Koniec: {{ mowing_cycle_finished_at }}.
                        Czas koszenia: {{ mowing_duration_label | trim }}
                        (krawędzie {{ edge_mowing_minutes }} min, zwykłe
                        {{ normal_mowing_minutes }} min).
                        Cały cykl z ładowaniem: {{ whole_cycle_duration_label | trim }}.
                        Skumulowany przyrost: 0 mm.
                        {% if (planned_next_after_reset_forecast | trim).startswith('safe;') %}
                        Następne koszenie:
                        {{ planned_next_after_reset_label | trim }}.
                        Prognozowane warunki podczas koszenia:
                        {{ (planned_next_after_reset_forecast | trim).split(';', 1)[1] }}.
                        {% else %}
                        Następna ocena warunków:
                        {{ planned_next_after_reset_label | trim }}.
                        {% endif %}
            default:
              - action: input_number.set_value
                target:
                  entity_id: !input growth_helper
                data:
                  value: "{{ ((estimated_growth_mm | float) * 0.7) | round(1) }}"
              - choose:
                  - conditions:
                      - condition: template
                        value_template: "{{ (next_mow_helper | default('', true) | length) > 0 }}"
                    sequence:
                      - action: input_datetime.set_datetime
                        target:
                          entity_id: "{{ next_mow_helper }}"
                        data:
                          datetime: "{{ planned_retry_mow_datetime | trim }}"
              - action: persistent_notification.create
                data:
                  notification_id: "{{ notification_id }}"
                  title: "Worx: koszenie przerwane"
                  message: >-
                    Start: {{ mowing_cycle_started_at }}.
                    Koniec: {{ mowing_cycle_finished_at }}.
                    Czas pracy: {{ mowing_duration_label | trim }}.
                    {% if is_state(rain_binary_sensor, 'on') %}
                    Powód: deszcz.
                    {% else %}
                    Powód: robot nie potwierdził powrotu do bazy.
                    {% endif %}
                    {{ retry_notification_details | trim }}
