                     or (garden_check_enabled and garden_sensors | select('is_state', 'on') | list | length > 0) }}
                alias: Auf Ende des Kantenschnitts und Rückkehr zur Ladestation warten
                timeout: "02:00:00"
                continue_on_timeout: true
              - if:
                  - condition: template
                    value_template: >-
                      {{ ((states(rain_binary_sensor) not in ['unknown', 'unavailable', 'none', '']
                           and not is_state(rain_binary_sensor, 'on'))
                          or
                          (states(rain_binary_sensor) in ['unknown', 'unavailable', 'none', '']
                           and (state_attr(forecast_weather_entity | trim, 'rain_rate') | float(0)) <= 0.05
                           and states(forecast_weather_entity | trim) not in ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'hail']))
                         and state_attr(mower_entity, 'rain_delay') != true
                         and not (is_state(mower_entity, 'error') and (as_timestamp(now()) - as_timestamp(states[mower_entity].last_changed)) >= (mower_fault_minutes | int(5)) * 60) }}
                then:
                  - delay: "00:01:00"
                    alias: Bestätigung der Ladestation nach dem Kantenschnitt stabilisieren
                  - wait_template: >-
                      {{ (states(rain_binary_sensor) not in ['unknown', 'unavailable', 'none', '']
                          and is_state(rain_binary_sensor, 'on'))
                         or
                         (states(rain_binary_sensor) in ['unknown', 'unavailable', 'none', '']
                          and ((state_attr(forecast_weather_entity | trim, 'rain_rate') | float(0)) > 0.05
                               or states(forecast_weather_entity | trim) in ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'hail']))
                         or state_attr(mower_entity, 'rain_delay') == true
                         or is_state(mower_entity, 'docked') }}
                    alias: Stabile Rückkehr zur Ladestation nach dem Kantenschnitt bestätigen
                    timeout: "00:02:00"
                    continue_on_timeout: true
              - choose:
                  - conditions:
                      - condition: template
                        alias: Jemand hat während des Kantenschnitts den Garten betreten
                        value_template: "{{ (garden_check_enabled and garden_sensors | length > 0 and (garden_sensors | select('is_state', 'on') | list | length > 0 or garden_sensors | expand | selectattr('state', 'eq', 'off') | selectattr('last_changed', 'gt', now() - timedelta(minutes=5)) | list | length > 0)) }}"
                    sequence:
                      - if:
                          - condition: template
                            value_template: "{{ states(mower_entity) not in ['docked', 'unavailable', 'unknown', 'error'] }}"
                        then:
                          - action: lawn_mower.dock
                            continue_on_error: true
                            target:
                              entity_id: !input mower_entity
                      - event: worx_smart_mowing_replan
                        event_data:
                          mower_entity: "{{ mower_entity }}"
                          kind: interrupted
                          reason: jemand hat während des Kantenschnitts den Garten betreten
                          started_at: "{{ mowing_cycle_started_at }}"
                          finished_at: "{{ now().strftime('%d.%m. um %H:%M') }}"
                          min_delay_minutes: 30
                      - stop: Jemand hat während des Kantenschnitts den Garten betreten.
                  - conditions:
                      - condition: template
                        value_template: >-
                          {{ (states(rain_binary_sensor) not in ['unknown', 'unavailable', 'none', '']
                              and is_state(rain_binary_sensor, 'on'))
                             or
                             (states(rain_binary_sensor) in ['unknown', 'unavailable', 'none', '']
                              and ((state_attr(forecast_weather_entity | trim, 'rain_rate') | float(0)) > 0.05
                                   or states(forecast_weather_entity | trim) in ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'hail']))
                             or state_attr(mower_entity, 'rain_delay') == true }}
                    sequence:
                      - if:
                          - condition: template
                            value_template: "{{ states(mower_entity) not in ['docked', 'unavailable', 'unknown', 'error'] }}"
                        then:
                          - action: lawn_mower.dock
                            continue_on_error: true
                            target:
                              entity_id: !input mower_entity
                      - event: worx_smart_mowing_replan
                        event_data:
                          mower_entity: "{{ mower_entity }}"
                          kind: interrupted
                          reason: Regen hat den Kantenschnitt unterbrochen
                          started_at: "{{ mowing_cycle_started_at }}"
                          finished_at: "{{ now().strftime('%d.%m. um %H:%M') }}"
                          min_delay_minutes: 0
                      - stop: Regen hat den Kantenschnitt unterbrochen.
                  - conditions:
                      - condition: template
                        value_template: "{{ is_state(mower_entity, 'error') }}"
                    sequence:
                      - event: worx_smart_mowing_replan
                        event_data:
                          mower_entity: "{{ mower_entity }}"
                          kind: interrupted
                          reason: >-
                            {% set raw = state_attr(mower_entity, 'error_description') | default('', true) | string %}{% set raw = '' if raw | lower in ['no error', 'unknown', 'none'] else raw %}Mähroboter meldet einen Fehler{% if raw %}: {{ mower_error_names.get(raw | lower, raw) }} ({{ raw }}){% endif %}. Prüfe den Mähroboter auf dem Rasen
                          started_at: "{{ mowing_cycle_started_at }}"
                          finished_at: "{{ now().strftime('%d.%m. um %H:%M') }}"
                          min_delay_minutes: 120
                      - stop: Mähroboter hat während des Kantenschnitts einen Fehler gemeldet.
                  - conditions:
                      - condition: template
                        value_template: "{{ not is_state(mower_entity, 'docked') }}"
                    sequence:
                      - if:
                          - condition: template
                            value_template: "{{ states(mower_entity) not in ['unavailable', 'unknown'] }}"
                        then:
                          - action: lawn_mower.dock
                            continue_on_error: true
                            target:
                              entity_id: !input mower_entity
                      - event: worx_smart_mowing_replan
                        event_data:
                          mower_entity: "{{ mower_entity }}"
                          kind: interrupted
                          reason: Worx Cloud hat die Rückkehr des Mähroboters zur Ladestation nach dem Kantenschnitt nicht bestätigt
                          started_at: "{{ mowing_cycle_started_at }}"
                          finished_at: "{{ now().strftime('%d.%m. um %H:%M') }}"
                          min_delay_minutes: 30
                      - stop: Worx Cloud hat die Rückkehr zur Ladestation nach dem Kantenschnitt nicht bestätigt.
              - wait_template: >-
                  {{ (states(rain_binary_sensor) not in ['unknown', 'unavailable', 'none', '']
                      and is_state(rain_binary_sensor, 'on'))
                     or
                     (states(rain_binary_sensor) in ['unknown', 'unavailable', 'none', '']
                      and ((state_attr(forecast_weather_entity | trim, 'rain_rate') | float(0)) > 0.05
                           or states(forecast_weather_entity | trim) in ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'hail']))
                     or state_attr(mower_entity, 'rain_delay') == true
                     or not is_state(mower_entity, 'docked')
                     or (states(battery_sensor) | float(0)) >= (post_edge_battery_percent | float(80)) }}
                alias: In der Ladestation auf Laden des Akkus vor dem normalen Mähen warten
                timeout: "08:00:00"
                continue_on_timeout: true
              - choose:
                  - conditions:
                      - condition: template
                        value_template: >-
                          {{ (states(rain_binary_sensor) not in ['unknown', 'unavailable', 'none', '']
                              and is_state(rain_binary_sensor, 'on'))
                             or
                             (states(rain_binary_sensor) in ['unknown', 'unavailable', 'none', '']
                              and ((state_attr(forecast_weather_entity | trim, 'rain_rate') | float(0)) > 0.05
                                   or states(forecast_weather_entity | trim) in ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'hail']))
                             or state_attr(mower_entity, 'rain_delay') == true }}
                    sequence:
                      - event: worx_smart_mowing_replan
                        event_data:
                          mower_entity: "{{ mower_entity }}"
                          kind: interrupted
                          reason: nach dem Kantenschnitt hat während des Ladens Regen eingesetzt
                          started_at: "{{ mowing_cycle_started_at }}"
                          finished_at: "{{ now().strftime('%d.%m. um %H:%M') }}"
                          min_delay_minutes: 0
                      - stop: Nach dem Kantenschnitt hat Regen eingesetzt.
                  - conditions:
                      - condition: template
                        value_template: "{{ not is_state(mower_entity, 'docked') }}"
                    sequence:
                      - event: worx_smart_mowing_replan
                        event_data:
                          mower_entity: "{{ mower_entity }}"
                          kind: interrupted
                          reason: >-
                            {% if is_state(mower_entity, 'error') %}{% set raw = state_attr(mower_entity, 'error_description') | default('', true) | string %}{% set raw = '' if raw | lower in ['no error', 'unknown', 'none'] else raw %}Mähroboter meldet einen Fehler{% if raw %}: {{ mower_error_names.get(raw | lower, raw) }} ({{ raw }}){% endif %}. Prüfe den Mähroboter auf dem Rasen{% else %}Mähroboter hat die Ladestation während des Ladens nach dem Kantenschnitt verlassen (Status: {{ mower_state_names.get(states(mower_entity), states(mower_entity)) }}){% endif %}
                          started_at: "{{ mowing_cycle_started_at }}"
                          finished_at: "{{ now().strftime('%d.%m. um %H:%M') }}"
                          min_delay_minutes: 30
                      - stop: Mähroboter hat die Ladestation während des Ladens nach dem Kantenschnitt verlassen.
                  - conditions:
                      - condition: template
                        value_template: >-
                          {{ (states(battery_sensor) | float(0)) < (post_edge_battery_percent | float(80)) }}
                    sequence:
                      - event: worx_smart_mowing_replan
                        event_data:
                          mower_entity: "{{ mower_entity }}"
                          kind: interrupted
                          reason: >-
                            Akku wurde innerhalb von 8 Stunden nicht auf {{ post_edge_battery_percent }}% geladen (aktuell {{ states(battery_sensor) }}%)
                          started_at: "{{ mowing_cycle_started_at }}"
                          finished_at: "{{ now().strftime('%d.%m. um %H:%M') }}"
                          min_delay_minutes: 60
                      - stop: Akku wurde nach dem Kantenschnitt nicht auf den erforderlichen Stand geladen.
              - variables:
                  temperature_after_edges_available: >-
                    {% if temperature_source_entity.split('.')[0] == 'weather' %}
                      {{ state_attr(temperature_source_entity, 'temperature') is not none }}
                    {% else %}
                      {{ states(temperature_source_entity) not in ['unknown', 'unavailable', 'none', ''] }}
                    {% endif %}
                  temperature_after_edges_c: >-
                    {% if temperature_source_entity.split('.')[0] == 'weather' %}
                      {{ state_attr(temperature_source_entity, 'temperature') | float(-99) }}
                    {% else %}
                      {{ states(temperature_source_entity) | float(-99) }}
                    {% endif %}
                  humidity_after_edges: >-
                    {% set selected_humidity = outdoor_humidity_sensor | default('', true) %}
                    {% if selected_humidity | length > 0 and states(selected_humidity) not in ['unknown', 'unavailable', 'none', ''] %}
                      {{ states(selected_humidity) | float(-1) }}
                    {% elif (forecast_weather_entity | trim | length) > 0 and state_attr(forecast_weather_entity | trim, 'humidity') is not none %}
                      {{ state_attr(forecast_weather_entity | trim, 'humidity') | float(-1) }}
                    {% else %}
                      -1
                    {% endif %}
              - variables:
                  spread_after_edges: >-
                    {% set t = temperature_after_edges_c | float(-99) %}
                    {% set rh = humidity_after_edges | float(-1) %}
                    {% if t > -90 and rh > 0 %}
                      {% set g = (([rh, 100] | min) / 100) | log + 17.62 * t / (243.12 + t) %}
                      {{ (t - 243.12 * g / (17.62 - g)) | round(1) }}
                    {% else %}
                      99
                    {% endif %}
              - variables:
                  post_edge_block_code: >-
                    {% if (temperature_after_edges_available | string | lower) != 'true' %}sensor
                    {% elif (temperature_after_edges_c | float(-99)) < (min_mowing_temperature_c | float(10))
                          or (temperature_after_edges_c | float(-99)) > (max_mowing_temperature_c | float(25)) %}temperature
                    {% elif states(rain_binary_sensor) in ['unknown', 'unavailable', 'none', '']
                          and (smart_weather_rain_rate_available | string | lower) != 'true' %}sensor
                    {% elif state_attr(mower_entity, 'rain_delay') == true %}rain_delay
                    {% elif (states(rain_binary_sensor) not in ['unknown', 'unavailable', 'none', '']
                               and is_state(rain_binary_sensor, 'on'))
                          or
                          (states(rain_binary_sensor) in ['unknown', 'unavailable', 'none', '']
                           and ((state_attr(forecast_weather_entity | trim, 'rain_rate') | float(0)) > 0.05
                                or states(forecast_weather_entity | trim) in ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'hail'])) %}rain
                    {% elif (spread_after_edges | float(99)) < (min_dew_point_spread_c | float(2.5)) %}humidity
                    {% elif (garden_check_enabled and garden_sensors | length > 0 and (garden_sensors | select('is_state', 'on') | list | length > 0 or garden_sensors | expand | selectattr('state', 'eq', 'off') | selectattr('last_changed', 'gt', now() - timedelta(minutes=5)) | list | length > 0)) %}garden
                    {% elif not is_state(mower_entity, 'docked')
                          or (states(battery_sensor) | float(0)) < (post_edge_battery_percent | float(80)) %}mower
                    {% else %}{{ '' }}{% endif %}
              - variables:
                  post_edge_block_reason: >-
                    {% set code = post_edge_block_code | trim %}
                    {% if code == 'sensor' and (temperature_after_edges_available | string | lower) != 'true' %}
                      nach dem Kantenschnitt kann die aktuelle Außentemperatur nicht gelesen werden
                    {% elif code == 'sensor' %}
                      nach dem Kantenschnitt kann der aktuelle Niederschlagsstatus weder vom Sensor noch von MeteoFusion HA gelesen werden
                    {% elif code == 'temperature' and (temperature_after_edges_c | float(-99)) < (min_mowing_temperature_c | float(10)) %}
                      nach dem Kantenschnitt ist die Temperatur auf {{ temperature_after_edges_c | float | round(0) | int }} °C gefallen, Minimum zum Mähen ist {{ min_mowing_temperature_c | int }} °C
                    {% elif code == 'temperature' %}
                      nach dem Kantenschnitt ist die Temperatur auf {{ temperature_after_edges_c | float | round(0) | int }} °C gestiegen, Maximum zum Mähen ist {{ max_mowing_temperature_c | int }} °C
                    {% elif code == 'rain_delay' %}
                      nach dem Kantenschnitt meldet die Worx Cloud weiterhin eine Regenverzögerung
                    {% elif code == 'rain' %}
                      nach dem Kantenschnitt zeigt die lokale Messung oder MeteoFusion HA laufenden Niederschlag
                    {% elif code == 'humidity' %}
                      nach dem Kantenschnitt ist die Luft nur {{ spread_after_edges | float(0) | round(1) | string | replace('.', ',') }} °C wärmer als der Taupunkt (Luftfeuchte {{ humidity_after_edges | float | round(0) | int }}%), daher ist das Gras noch nass
                    {% elif code == 'garden' %}
                      jemand ist im Garten
                    {% elif code == 'mower' %}
                      vor dem normalen Mähen ist der Mähroboter nicht in der Ladestation oder der Akku hat weniger als {{ post_edge_battery_percent }}% (Status: {{ mower_state_names.get(states(mower_entity), states(mower_entity)) }}, Akku {{ states(battery_sensor) }}%)
                    {% else %}
                      {{ '' }}
                    {% endif %}
                  post_edge_block_delay_minutes: >-
                    {% set code = post_edge_block_code | trim %}
                    {% set with_forecast = (forecast_available | string | lower) == 'true' and planning_mode == 'auto' %}
                    {{ {'sensor': 60, 'temperature': 30 if with_forecast else 60, 'rain_delay': 60, 'rain': 0, 'humidity': 60, 'garden': 30, 'mower': 30}.get(code, 30) }}
              - if:
                  - condition: template
                    value_template: "{{ (post_edge_block_code | trim | length) > 0 }}"
                then:
                  - event: worx_smart_mowing_replan
                    event_data:
                      mower_entity: "{{ mower_entity }}"
                      kind: interrupted
                      reason: "{{ post_edge_block_reason | trim }}"
                      started_at: "{{ mowing_cycle_started_at }}"
                      finished_at: "{{ now().strftime('%d.%m. um %H:%M') }}"
                      min_delay_minutes: "{{ post_edge_block_delay_minutes | int(30) }}"
                  - stop: Die Bedingungen nach dem Kantenschnitt erlauben kein normales Mähen.
              - action: worx_vision_cloud.start_one_time_mowing
                alias: Normales einmaliges Mähen starten
                data:
                  entity_id: !input mower_entity
                  runtime: "{{ normal_mowing_command_runtime_minutes }}"
                  edge_cut: false
                  zones: []
              - alias: Auf Bestätigung der Abfahrt zum Mähen warten
                repeat:
                  while:
                    - condition: template
                      value_template: >-
                        {{ states(mower_entity) in ['docked', 'paused']
                           and (
                             (states(rain_binary_sensor) not in ['unknown', 'unavailable', 'none', '']
                              and not is_state(rain_binary_sensor, 'on'))
                             or
                             (states(rain_binary_sensor) in ['unknown', 'unavailable', 'none', '']
                              and (state_attr(forecast_weather_entity | trim, 'rain_rate') | float(0)) <= 0.05
                              and states(forecast_weather_entity | trim) not in ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'hail'])
                           )
                           and state_attr(mower_entity, 'rain_delay') != true
                           and repeat.index <= ((mowing_start_confirm_timeout_minutes | int(5)) * 6) }}
                  sequence:
                    - delay: "00:00:10"
              - if:
                  - condition: template
                    value_template: >-
                      {{ (states(rain_binary_sensor) not in ['unknown', 'unavailable', 'none', '']
                          and is_state(rain_binary_sensor, 'on'))
                         or
                         (states(rain_binary_sensor) in ['unknown', 'unavailable', 'none', '']
                          and ((state_attr(forecast_weather_entity | trim, 'rain_rate') | float(0)) > 0.05
                               or states(forecast_weather_entity | trim) in ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'hail']))
                         or state_attr(mower_entity, 'rain_delay') == true }}
                then:
                  - action: lawn_mower.dock
                    continue_on_error: true
                    target:
                      entity_id: !input mower_entity
                  - event: worx_smart_mowing_replan
                    event_data:
                      mower_entity: "{{ mower_entity }}"
                      kind: interrupted
                      reason: Regen kurz vor dem Mähstart
                      started_at: "{{ mowing_cycle_started_at }}"
                      finished_at: "{{ now().strftime('%d.%m. um %H:%M') }}"
                      min_delay_minutes: 0
                  - stop: Mähstart wegen Regen abgebrochen.
              - if:
                  - condition: template
                    value_template: "{{ states(mower_entity) in ['docked', 'paused'] }}"
                then:
                  - action: worx_vision_cloud.start_one_time_mowing
                    alias: Normales einmaliges Mähen erneut starten
                    data:
                      entity_id: !input mower_entity
                      runtime: "{{ normal_mowing_command_runtime_minutes }}"
                      edge_cut: false
                      zones: []
                  - alias: Auf Bestätigung des zweiten Mähstarts warten
                    repeat:
                      while:
                        - condition: template
                          value_template: >-
                            {{ states(mower_entity) in ['docked', 'paused']
                               and (
                                 (states(rain_binary_sensor) not in ['unknown', 'unavailable', 'none', '']
                                  and not is_state(rain_binary_sensor, 'on'))
                                 or
                                 (states(rain_binary_sensor) in ['unknown', 'unavailable', 'none', '']
                                  and (state_attr(forecast_weather_entity | trim, 'rain_rate') | float(0)) <= 0.05
                                  and states(forecast_weather_entity | trim) not in ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'hail'])
                               )
                               and state_attr(mower_entity, 'rain_delay') != true
                               and repeat.index <= ((mowing_start_confirm_timeout_minutes | int(5)) * 6) }}
                      sequence:
                        - delay: "00:00:10"
              - if:
                  - condition: template
                    value_template: >-
                      {{ (states(rain_binary_sensor) not in ['unknown', 'unavailable', 'none', '']
                          and is_state(rain_binary_sensor, 'on'))
                         or
                         (states(rain_binary_sensor) in ['unknown', 'unavailable', 'none', '']
                          and ((state_attr(forecast_weather_entity | trim, 'rain_rate') | float(0)) > 0.05
                               or states(forecast_weather_entity | trim) in ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'hail']))
                         or state_attr(mower_entity, 'rain_delay') == true }}
                then:
                  - action: lawn_mower.dock
                    continue_on_error: true
                    target:
                      entity_id: !input mower_entity
                  - event: worx_smart_mowing_replan
                    event_data:
                      mower_entity: "{{ mower_entity }}"
                      kind: interrupted
                      reason: Regen beim erneuten Mähstart
                      started_at: "{{ mowing_cycle_started_at }}"
                      finished_at: "{{ now().strftime('%d.%m. um %H:%M') }}"
                      min_delay_minutes: 0
                  - stop: Mähstart nach erneutem Versuch wegen Regen abgebrochen.
              - if:
                  - condition: template
                    value_template: "{{ states(mower_entity) in ['docked', 'paused', 'unavailable', 'unknown'] }}"
                then:
                  - event: worx_smart_mowing_replan
                    event_data:
                      mower_entity: "{{ mower_entity }}"
                      kind: interrupted
                      reason: >-
                        Mähroboter hat trotz zweier Befehle nicht mit dem Mähen begonnen (Status: {{ mower_state_names.get(states(mower_entity), states(mower_entity)) }})
                      started_at: "{{ mowing_cycle_started_at }}"
                      finished_at: "{{ now().strftime('%d.%m. um %H:%M') }}"
                      min_delay_minutes: 30
                  - stop: Mähstart nach zwei Versuchen nicht bestätigt.
              - sequence: &normal_mowing_cycle
                  - variables:
                      aborted_by_error: false
                      aborted_error_text: ""
                  - alias: Mähen bis zur Rückkehr des Mähroboters oder bis zur Sicherheitsgrenze
                    repeat:
                      while:
                        - condition: template
                          value_template: >-
                            {% set mower_changed_ts = as_timestamp(states[mower_entity].last_changed) %}
                            {% set battery_changed_ts = as_timestamp(states[battery_sensor].last_changed) %}
                            {% set stable_since_ts = [mower_changed_ts, battery_changed_ts] | max %}
                            {% set vision_complete = is_state(mower_entity, 'docked')
                                and (states(battery_sensor) | float(0)) >= (vision_completion_battery_percent | float(95))
                                and state_attr(mower_entity, 'rain_delay') != true
                                and (as_timestamp(now()) - stable_since_ts) >= ((vision_completion_stable_minutes | int(15)) * 60) %}
                            {% set completed = vision_complete if mower_cycle_type == 'vision_rtk'
                                else is_state(mower_entity, 'docked') %}
                            {{ ((states(rain_binary_sensor) not in ['unknown', 'unavailable', 'none', '']
                                 and not is_state(rain_binary_sensor, 'on'))
                                or
                                (states(rain_binary_sensor) in ['unknown', 'unavailable', 'none', '']
                                 and (state_attr(forecast_weather_entity | trim, 'rain_rate') | float(0)) <= 0.05
                                 and states(forecast_weather_entity | trim) not in ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'hail']))
                               and state_attr(mower_entity, 'rain_delay') != true
                               and not completed
                               and not (is_state(mower_entity, 'error') and (as_timestamp(now()) - as_timestamp(states[mower_entity].last_changed)) >= (mower_fault_minutes | int(5)) * 60)
                               and not ((garden_check_enabled and garden_sensors | length > 0 and (garden_sensors | select('is_state', 'on') | list | length > 0 or garden_sensors | expand | selectattr('state', 'eq', 'off') | selectattr('last_changed', 'gt', now() - timedelta(minutes=5)) | list | length > 0)))
                               and not ((aborted_by_error | string | lower) == 'true' and is_state(mower_entity, 'docked'))
                               and repeat.index <= (normal_mowing_monitor_limit_minutes | int(720)) }}
                      sequence:
                        - wait_for_trigger:
                            - trigger: state
                              entity_id: !input mower_entity
                              to: error
                          timeout: "00:01:00"
                          continue_on_timeout: true
                        - if:
                            - condition: template
                              value_template: "{{ wait.trigger is not none }}"
                          then:
                            - variables:
                                seen_error_text: >-
                                  {% set raw = wait.trigger.to_state.attributes.get('error_description', '') | default('', true) | string %}{% set raw = '' if raw | lower in ['no error', 'unknown', 'none'] else raw %}{{ (mower_error_names.get(raw | lower, raw) ~ ' (' ~ raw ~ ')') if raw else 'ohne Beschreibung' }}
                            - wait_template: "{{ states(mower_entity) in ['mowing', 'returning', 'docked'] }}"
                              timeout: "00:03:00"
                              continue_on_timeout: true
                            - if:
                                - condition: template
                                  value_template: "{{ states(mower_entity) in ['returning', 'docked'] }}"
                              then:
                                - variables:
                                    aborted_by_error: true
                                    aborted_error_text: "{{ seen_error_text }}"
                  - if:
                      - condition: template
                        alias: Mähroboter hat beim Mähen einen Fehler gemeldet
                        value_template: "{{ (is_state(mower_entity, 'error') and (as_timestamp(now()) - as_timestamp(states[mower_entity].last_changed)) >= (mower_fault_minutes | int(5)) * 60) }}"
                    then:
                      - variables:
                          reduced_growth_mm: "{{ ((states(growth_helper) | float(0)) * 0.7) | round(1) }}"
                      - action: input_number.set_value
                        alias: Wachstum nach teilweisem Mähen verringern
                        target:
                          entity_id: !input growth_helper
                        data:
                          value: "{{ reduced_growth_mm }}"
                      - event: worx_smart_mowing_replan
                        event_data:
                          mower_entity: "{{ mower_entity }}"
                          kind: interrupted
                          reason: >-
                            {% set raw = state_attr(mower_entity, 'error_description') | default('', true) | string %}{% set raw = '' if raw | lower in ['no error', 'unknown', 'none'] else raw %}Mähroboter meldet einen Fehler{% if raw %}: {{ mower_error_names.get(raw | lower, raw) }} ({{ raw }}){% endif %}. Prüfe den Mähroboter auf dem Rasen
                          started_at: "{{ mowing_cycle_started_at }}"
                          finished_at: "{{ now().strftime('%d.%m. um %H:%M') }}"
                          growth_note: Der Rasen wurde teilweise gemäht, daher wurde das geschätzte Graswachstum um 30% verringert.
                          min_delay_minutes: 120
                      - stop: Mähroboter hat beim Mähen einen Fehler gemeldet.
                  - if:
                      - condition: template
                        alias: Jemand hat während des Mähens den Garten betreten
                        value_template: "{{ (garden_check_enabled and garden_sensors | length > 0 and (garden_sensors | select('is_state', 'on') | list | length > 0 or garden_sensors | expand | selectattr('state', 'eq', 'off') | selectattr('last_changed', 'gt', now() - timedelta(minutes=5)) | list | length > 0)) }}"
                    then:
                      - if:
                          - condition: template
                            value_template: "{{ states(mower_entity) not in ['docked', 'unavailable', 'unknown', 'error'] }}"
                          - condition: template
                            value_template: "{{ garden_reaction != 'pause' }}"
                        then:
                          - action: lawn_mower.dock
                            continue_on_error: true
                            target:
                              entity_id: !input mower_entity
                      - variables:
                          reduced_growth_mm: "{{ ((states(growth_helper) | float(0)) * 0.7) | round(1) }}"
                      - action: input_number.set_value
                        alias: Wachstum nach teilweisem Mähen verringern
                        target:
                          entity_id: !input growth_helper
                        data:
                          value: "{{ reduced_growth_mm }}"
                      - event: worx_smart_mowing_replan
                        event_data:
                          mower_entity: "{{ mower_entity }}"
                          kind: interrupted
                          reason: >-
                            jemand hat den Garten betreten{{ ' - Mähroboter wartet auf dem Rasen, setze ihn manuell fort oder schicke ihn zur Ladestation' if garden_reaction == 'pause' else '' }}
                          started_at: "{{ mowing_cycle_started_at }}"
                          finished_at: "{{ now().strftime('%d.%m. um %H:%M') }}"
                          growth_note: Der Rasen wurde teilweise gemäht, daher wurde das geschätzte Graswachstum um 30% verringert.
                          min_delay_minutes: 30
                      - stop: Jemand hat während des Mähens den Garten betreten.
                  - variables:
                      normal_mowing_finished_ts: >-
                        {% if is_state(mower_entity, 'docked') %}
                          {{ as_timestamp(states[mower_entity].last_changed) }}
                        {% else %}
                          {{ as_timestamp(now()) }}
                        {% endif %}
                  - if:
                      - condition: template
                        value_template: "{{ states(mower_entity) not in ['docked', 'paused', 'unavailable', 'unknown'] }}"
                    then:
                      - action: lawn_mower.dock
                        continue_on_error: true
                        target:
                          entity_id: !input mower_entity
                  - wait_template: >-
                      {{ (states(rain_binary_sensor) not in ['unknown', 'unavailable', 'none', '']
                          and is_state(rain_binary_sensor, 'on'))
                         or
                         (states(rain_binary_sensor) in ['unknown', 'unavailable', 'none', '']
                          and ((state_attr(forecast_weather_entity | trim, 'rain_rate') | float(0)) > 0.05
                               or states(forecast_weather_entity | trim) in ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'hail']))
                         or state_attr(mower_entity, 'rain_delay') == true
                         or is_state(mower_entity, 'docked') }}
                    alias: Auf Rückkehr zur Ladestation nach dem normalen Mähen warten
                    timeout: "00:30:00"
                    continue_on_timeout: true
                  - if:
                      - condition: template
                        value_template: >-
                          {{ ((states(rain_binary_sensor) not in ['unknown', 'unavailable', 'none', '']
                               and not is_state(rain_binary_sensor, 'on'))
                              or
                              (states(rain_binary_sensor) in ['unknown', 'unavailable', 'none', '']
                               and (state_attr(forecast_weather_entity | trim, 'rain_rate') | float(0)) <= 0.05
                               and states(forecast_weather_entity | trim) not in ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'hail']))
                             and state_attr(mower_entity, 'rain_delay') != true }}
                    then:
                      - delay: "00:01:00"
                        alias: Bestätigung der Ladestation nach dem normalen Mähen stabilisieren
                      - wait_template: >-
                          {{ (states(rain_binary_sensor) not in ['unknown', 'unavailable', 'none', '']
                              and is_state(rain_binary_sensor, 'on'))
                             or
                             (states(rain_binary_sensor) in ['unknown', 'unavailable', 'none', '']
                              and ((state_attr(forecast_weather_entity | trim, 'rain_rate') | float(0)) > 0.05
                                   or states(forecast_weather_entity | trim) in ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'hail']))
                             or state_attr(mower_entity, 'rain_delay') == true
                             or is_state(mower_entity, 'docked') }}
                        alias: Stabile Rückkehr zur Ladestation nach dem normalen Mähen bestätigen
                        timeout: "00:02:00"
                        continue_on_timeout: true
                  - variables:
                      mowing_cycle_finished_at: >-
                        {{ (normal_mowing_finished_ts | float) | timestamp_custom('%d.%m. um %H:%M', true) }}
                      whole_cycle_duration_label: >-
                        {% set total = ((((normal_mowing_finished_ts | float) - (mowing_cycle_started_ts | float)) / 60) | round(0)) | int %}
                        {% if total >= 60 %}{{ total // 60 }} Std. {{ total % 60 }} Min.{% else %}{{ total }} Min.{% endif %}
                      rain_after_mowing: >-
                        {{ (states(rain_binary_sensor) not in ['unknown', 'unavailable', 'none', '']
                            and is_state(rain_binary_sensor, 'on'))
                           or
                           (states(rain_binary_sensor) in ['unknown', 'unavailable', 'none', '']
                            and ((state_attr(forecast_weather_entity | trim, 'rain_rate') | float(0)) > 0.05
                                 or states(forecast_weather_entity | trim) in ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'hail']))
                           or state_attr(mower_entity, 'rain_delay') == true }}
                      mowing_completed: >-
                        {% set mower_changed_ts = as_timestamp(states[mower_entity].last_changed) %}
                        {% set battery_changed_ts = as_timestamp(states[battery_sensor].last_changed) %}
                        {% set stable_since_ts = [mower_changed_ts, battery_changed_ts] | max %}
                        {% set vision_complete = is_state(mower_entity, 'docked')
                            and (states(battery_sensor) | float(0)) >= (vision_completion_battery_percent | float(95))
                            and state_attr(mower_entity, 'rain_delay') != true
                            and (as_timestamp(now()) - stable_since_ts) >= ((vision_completion_stable_minutes | int(15)) * 60) %}
                        {% set rain_now = (states(rain_binary_sensor) not in ['unknown', 'unavailable', 'none', '']
                            and is_state(rain_binary_sensor, 'on'))
                            or (states(rain_binary_sensor) in ['unknown', 'unavailable', 'none', '']
                                and ((state_attr(forecast_weather_entity | trim, 'rain_rate') | float(0)) > 0.05
                                     or states(forecast_weather_entity | trim) in ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'hail']))
                            or state_attr(mower_entity, 'rain_delay') == true %}
                        {{ not rain_now and (aborted_by_error | string | lower) != 'true'
                           and (vision_complete if mower_cycle_type == 'vision_rtk' else is_state(mower_entity, 'docked')) }}
                  - if:
                      - condition: template
                        value_template: "{{ (mowing_completed | string | lower) == 'true' }}"
                    then:
                      - action: input_datetime.set_datetime
                        alias: Abgeschlossenes Mähen als letztes Mähen speichern
                        target:
                          entity_id: !input last_mow_helper
                        data:
                          timestamp: "{{ normal_mowing_finished_ts | float | int }}"
                      - action: input_number.set_value
                        alias: Wachstum nach vollständigem Mähen zurücksetzen
                        target:
                          entity_id: !input growth_helper
                        data:
                          value: 0
                      - event: worx_smart_mowing_replan
                        event_data:
                          mower_entity: "{{ mower_entity }}"
                          kind: completed
                          started_at: "{{ mowing_cycle_started_at }}"
                          finished_at: "{{ mowing_cycle_finished_at | trim }}"
                          duration_label: "{{ whole_cycle_duration_label | trim }}"
                          min_delay_minutes: 0
                    else:
                      - variables:
                          reduced_growth_mm: "{{ ((states(growth_helper) | float(0)) * 0.7) | round(1) }}"
                      - action: input_number.set_value
                        alias: Wachstum nach teilweisem Mähen verringern
                        target:
                          entity_id: !input growth_helper
                        data:
                          value: "{{ reduced_growth_mm }}"
                      - event: worx_smart_mowing_replan
                        event_data:
                          mower_entity: "{{ mower_entity }}"
                          kind: interrupted
                          reason: >-
                            {% if (rain_after_mowing | string | lower) == 'true' %}Regen während des Mähens
                            {%- elif (aborted_by_error | string | lower) == 'true' %}Mähroboter hat das Mähen wegen eines Fehlers ({{ aborted_error_text }}) abgebrochen und ist zur Ladestation zurückgekehrt
                            {%- else %}Mähroboter hat Ende des Mähens und Rückkehr zur Ladestation nicht bestätigt{% endif %}
                          started_at: "{{ mowing_cycle_started_at }}"
                          finished_at: "{{ mowing_cycle_finished_at | trim }}"
                          growth_note: Der Rasen wurde teilweise gemäht, daher wurde das geschätzte Graswachstum um 30% verringert.
                          min_delay_minutes: >-
                            {{ 0 if (rain_after_mowing | string | lower) == 'true' else (60 if (aborted_by_error | string | lower) == 'true' else 30) }}
      - alias: Jemand hat den Garten betreten - Mähroboter anhalten
        conditions:
          - condition: template
            value_template: >-
              {{ trigger.id == 'garden_entered' and garden_check_enabled
                 and states(mower_entity) in ['mowing', 'returning'] }}
        sequence:
          - if:
              - condition: template
                value_template: "{{ garden_reaction == 'pause' and is_state(mower_entity, 'mowing') }}"
            then:
              - action: lawn_mower.pause
                continue_on_error: true
                target:
                  entity_id: !input mower_entity
            else:
              - action: lawn_mower.dock
                continue_on_error: true
                target:
                  entity_id: !input mower_entity
      - alias: Außerhalb der Automatisierung gestartetes Mähen verfolgen
        conditions:
          - condition: template
            value_template: "{{ trigger.id == 'external_mowing_started' }}"
          - condition: template
            value_template: "{{ (cycle_running | string | lower) != 'true' }}"
          - condition: template
            value_template: "{{ state_attr(mower_entity, 'rtk_at_station') != true }}"
          - condition: template
            value_template: "{{ state_attr(mower_entity, 'status_id') | int(-1) != 32 }}"
        sequence:
          - variables:
              manual_mow_started_ts: "{{ as_timestamp(trigger.to_state.last_changed) }}"
              manual_mow_started_at: >-
                {{ as_timestamp(trigger.to_state.last_changed) | timestamp_custom('%d.%m. um %H:%M', true) }}
          - sequence: &manual_mowing_tracking
              - variables:
                  aborted_by_error: false
                  aborted_error_text: ""
              - alias: Manuelles Mähen überwachen, einschließlich Nachladen bei Vision / RTK
                repeat:
                  while:
                    - condition: template
                      value_template: >-
                        {% set mower_changed_ts = as_timestamp(states[mower_entity].last_changed) %}
                        {% set battery_changed_ts = as_timestamp(states[battery_sensor].last_changed) %}
                        {% set stable_since_ts = [mower_changed_ts, battery_changed_ts] | max %}
                        {% set vision_complete = is_state(mower_entity, 'docked')
                            and (states(battery_sensor) | float(0)) >= (vision_completion_battery_percent | float(95))
                            and state_attr(mower_entity, 'rain_delay') != true
                            and (as_timestamp(now()) - stable_since_ts) >= ((vision_completion_stable_minutes | int(15)) * 60) %}
                        {% set completed = vision_complete if mower_cycle_type == 'vision_rtk'
                            else is_state(mower_entity, 'docked') %}
                        {{ not completed
                           and not (is_state(mower_entity, 'error') and (as_timestamp(now()) - as_timestamp(states[mower_entity].last_changed)) >= (mower_fault_minutes | int(5)) * 60)
                           and not ((garden_check_enabled and garden_sensors | length > 0 and (garden_sensors | select('is_state', 'on') | list | length > 0 or garden_sensors | expand | selectattr('state', 'eq', 'off') | selectattr('last_changed', 'gt', now() - timedelta(minutes=5)) | list | length > 0)))
                           and not ((aborted_by_error | string | lower) == 'true' and is_state(mower_entity, 'docked'))
                           and repeat.index <= (normal_mowing_monitor_limit_minutes | int(720)) }}
                  sequence:
                    - wait_for_trigger:
                        - trigger: state
                          entity_id: !input mower_entity
                          to: error
                      timeout: "00:01:00"
                      continue_on_timeout: true
                    - if:
                        - condition: template
                          value_template: "{{ wait.trigger is not none }}"
                      then:
                        - variables:
                            seen_error_text: >-
                              {% set raw = wait.trigger.to_state.attributes.get('error_description', '') | default('', true) | string %}{% set raw = '' if raw | lower in ['no error', 'unknown', 'none'] else raw %}{{ (mower_error_names.get(raw | lower, raw) ~ ' (' ~ raw ~ ')') if raw else 'ohne Beschreibung' }}
                        - wait_template: "{{ states(mower_entity) in ['mowing', 'returning', 'docked'] }}"
                          timeout: "00:03:00"
                          continue_on_timeout: true
                        - if:
                            - condition: template
                              value_template: "{{ states(mower_entity) in ['returning', 'docked'] }}"
                          then:
                            - variables:
                                aborted_by_error: true
                                aborted_error_text: "{{ seen_error_text }}"
              - variables:
                  manual_mow_completed: >-
                    {% set mower_changed_ts = as_timestamp(states[mower_entity].last_changed) %}
                    {% set battery_changed_ts = as_timestamp(states[battery_sensor].last_changed) %}
                    {% set stable_since_ts = [mower_changed_ts, battery_changed_ts] | max %}
                    {% set vision_complete = is_state(mower_entity, 'docked')
                        and (states(battery_sensor) | float(0)) >= (vision_completion_battery_percent | float(95))
                        and state_attr(mower_entity, 'rain_delay') != true
                        and (as_timestamp(now()) - stable_since_ts) >= ((vision_completion_stable_minutes | int(15)) * 60) %}
                    {% set garden = (garden_check_enabled and garden_sensors | length > 0 and (garden_sensors | select('is_state', 'on') | list | length > 0 or garden_sensors | expand | selectattr('state', 'eq', 'off') | selectattr('last_changed', 'gt', now() - timedelta(minutes=5)) | list | length > 0)) %}
                    {{ not garden and (aborted_by_error | string | lower) != 'true'
                       and (vision_complete if mower_cycle_type == 'vision_rtk' else is_state(mower_entity, 'docked')) }}
              - if:
                  - condition: template
                    value_template: "{{ (manual_mow_completed | string | lower) != 'true' }}"
                then:
                  - variables:
                      tytul: "Worx: manuelles Mähen unterbrochen"
                      tresc: |-
                        Das am {{ manual_mow_started_at | trim }} manuell gestartete Mähen wurde nicht mit einem vollständigen Zyklus beendet.
                        {% if garden_check_enabled and garden_sensors | select('is_state', 'on') | list | length > 0 %}Ursache: jemand ist im Garten.{% elif (aborted_by_error | string | lower) == 'true' %}Ursache: Mähroboter hat das Mähen wegen eines Fehlers ({{ aborted_error_text }}) abgebrochen und ist zur Ladestation zurückgekehrt.{% elif is_state(mower_entity, 'error') %}Ursache: {% set raw = state_attr(mower_entity, 'error_description') | default('', true) | string %}{% set raw = '' if raw | lower in ['no error', 'unknown', 'none'] else raw %}Mähroboter meldet einen Fehler{% if raw %}: {{ mower_error_names.get(raw | lower, raw) }} ({{ raw }}){% endif %}. Prüfe den Mähroboter auf dem Rasen.{% else %}Status des Mähroboters: {{ mower_state_names.get(states(mower_entity), states(mower_entity)) }}.{% endif %}
                        Das geschätzte Graswachstum bleibt unverändert: {{ states(growth_helper) | float(0) | round(1) | string | replace('.', ',') }} mm.
                  - action: persistent_notification.create
                    data:
                      notification_id: "{{ notification_id }}"
                      title: "{{ tytul }}"
                      message: "{{ tresc }}"
                  - sequence: !input notify_actions
                  - stop: Manuelles Mähen wurde nicht als beendet bestätigt.
              - variables:
                  manual_mow_finished_ts: "{{ as_timestamp(states[mower_entity].last_changed) }}"
              - action: input_datetime.set_datetime
                alias: Manuelles Mähen als letztes Mähen speichern
                target:
                  entity_id: !input last_mow_helper
                data:
                  timestamp: "{{ manual_mow_finished_ts | float | int }}"
              - action: input_number.set_value
                alias: Wachstum nach manuellem Mähen zurücksetzen
                target:
                  entity_id: !input growth_helper
                data:
                  value: 0
              - event: worx_smart_mowing_replan
                event_data:
                  mower_entity: "{{ mower_entity }}"
                  kind: manual_completed
                  started_at: "{{ manual_mow_started_at | trim }}"
                  finished_at: "{{ (manual_mow_finished_ts | float) | timestamp_custom('%d.%m. um %H:%M', true) }}"
                  duration_label: >-
                    {% set total = ((((manual_mow_finished_ts | float) - (manual_mow_started_ts | float)) / 60) | round(0)) | int %}
                    {% if total >= 60 %}{{ total // 60 }} Std. {{ total % 60 }} Min.{% else %}{{ total }} Min.{% endif %}
                  min_delay_minutes: 0
      - alias: Laufenden Zyklus nach Neustart von Home Assistant übernehmen
        conditions:
          - condition: template
            value_template: "{{ trigger.id == 'restart_recovery' and (cycle_running | string | lower) != 'true' }}"
        sequence:
          - wait_template: "{{ states(mower_entity) not in ['unavailable', 'unknown'] }}"
            alias: Auf Verbindung mit der Worx Cloud warten
            timeout: "00:10:00"
            continue_on_timeout: true
          - delay: "00:02:00"
            alias: Status des Mähroboters nach dem Neustart stabilisieren
          - if:
              - condition: template
                alias: Mähroboter mäht nicht
                value_template: >-
                  {{ states(mower_entity) not in ['mowing', 'returning']
                     or state_attr(mower_entity, 'rtk_at_station') == true }}
            then:
              - stop: Nach dem Neustart mäht der Mähroboter nicht; kein Zyklus zu übernehmen.
          - variables:
              restart_planned_ts: "{{ state_attr(next_mow_helper, 'timestamp') | float(0) }}"
              restart_scheduled_cycle: >-
                {% set planned = state_attr(next_mow_helper, 'timestamp') | float(0) %}
                {% set now_ts = as_timestamp(now()) %}
                {{ planned > 0 and planned <= now_ts
                   and (state_attr(last_mow_helper, 'timestamp') | float(0)) < planned
                   and (now_ts - planned) <= (normal_mowing_monitor_limit_minutes | int(720)) * 60 }}
          - variables:
              restart_edge_phase: >-
                {{ (restart_scheduled_cycle | string | lower) == 'true'
                   and (state_attr(mower_entity, 'status_id') | int(-1) == 32
                        or (is_state(mower_entity, 'returning')
                            and as_timestamp(now()) - (restart_planned_ts | float(0)) < 3600)) }}
              mowing_cycle_started_ts: "{{ restart_planned_ts }}"
              mowing_cycle_started_at: "{{ (restart_planned_ts | float(0)) | timestamp_custom('%d.%m. um %H:%M', true) }}"
          - choose:
              - conditions:
                  - condition: template
                    alias: Neustart während des Kantenschnitts
                    value_template: "{{ (restart_edge_phase | string | lower) == 'true' }}"
                sequence:
                  - sequence: *after_edges_cycle
              - conditions:
                  - condition: template
                    alias: Neustart während des normalen Mähens aus dem Zeitplan
                    value_template: "{{ (restart_scheduled_cycle | string | lower) == 'true' }}"
                sequence:
                  - sequence: *normal_mowing_cycle
            default:
              - variables:
                  manual_mow_started_ts: "{{ as_timestamp(now()) }}"
                  manual_mow_started_at: "{{ now().strftime('%d.%m. um %H:%M') }} (nach Neustart von Home Assistant übernommen)"
              - sequence: *manual_mowing_tracking
