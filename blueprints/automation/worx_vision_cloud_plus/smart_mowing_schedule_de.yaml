                  planned_label: "{{ planned_start_label | trim }}"
                  min_delay_minutes: 30
              - stop: Start des Kantenschnitts nach zwei Versuchen nicht bestätigt.
          - variables:
              tytul: "Worx: Mähen gestartet"
              tresc: |-
                Das Mähen hat am {{ mowing_cycle_started_at }} begonnen.
                Zuerst macht der Mähroboter den Kantenschnitt, lädt dann den Akku auf {{ post_edge_battery_percent }}% und mäht den ganzen Rasen.
          - action: persistent_notification.create
            data:
              notification_id: "{{ notification_id }}"
              title: "{{ tytul }}"
              message: "{{ tresc }}"
          - sequence: !input notify_actions
          - sequence: &after_edges_cycle
              - wait_template: >-
                  {{ (states(rain_binary_sensor) not in ['unknown', 'unavailable', 'none', '']
                      and is_state(rain_binary_sensor, 'on'))
                     or
                     (states(rain_binary_sensor) in ['unknown', 'unavailable', 'none', '']
                      and ((state_attr(forecast_weather_entity | trim, 'rain_rate') | float(0)) > 0.05
                           or states(forecast_weather_entity | trim) in ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'hail']))
                     or state_attr(mower_entity, 'rain_delay') == true
                     or is_state(mower_entity, 'docked')
