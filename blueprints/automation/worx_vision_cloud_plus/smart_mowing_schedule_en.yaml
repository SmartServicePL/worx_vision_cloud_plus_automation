blueprint:
  name: Worx Vision Cloud PLUS - smart mowing schedule
  description: |
    Smart mowing schedule for Worx robot mowers, controlled from Home
    Assistant instead of a fixed schedule in the WORX app.

    What the automation does:
    - estimates daily grass growth with the Growth Potential (GP) model based on
      conditions over the whole day (average temperature, maximum UV and rainfall from the forecast
      for the next 24 hours), not a single reading at dawn,
    - takes into account weather, rainfall, temperature, sun, optional soil moisture,
      irrigation and fertilization,
    - prefers the selected time window, but looks for a safe time outside it if needed,
    - avoids rain, a freshly wet lawn and temperatures outside the set range,
    - detects dew from the difference between air temperature and dew point: grass
      is considered dry when the air is at least 2.5 °C warmer than the dew point,
    - sends a notification right away when the mower gets trapped or reports another error during a cycle,
    - prefers frequent, light robot mowing over waiting for tall grass.

    Weather source:
    - your own weather station or local sensors provide real measurements,
    - the recommended MeteoFusion HA integration provides a locally corrected hourly
      forecast, current rainfall and a forecast quality rating,
    - you can also use another weather entity, e.g. Tomorrow.io,
    - all mowing times (daily plan, retry after a block or interruption,
      next time after a finished mowing) are calculated by the same planner, so notifications
      always show the same, current time,
    - a time planned for today is not moved later by periodic forecast
      changes; a time on later days is re-evaluated at the daily recalculation,
    - at start time real sensors take priority: in dry weather
      the mower starts, and when actual rain is detected it returns to the dock,
    - after rain the automation waits for the grass to dry, counted from the moment
      the rain sensor switched to dry,
    - without a forecast the automation uses the selected window and checks actual
      conditions right before the start.

    How a mowing cycle works:
    1. Home Assistant starts a separate edge cut.
    2. The automation waits for the mower to return to the dock.
    3. The mower charges its battery to at least 80%.
    4. Temperature, rain and humidity are checked again.
    5. Only then does normal one-time mowing start.
    Every interruption of the cycle sets a new mowing time counted from the interruption.
    Restarting Home Assistant or reloading automations during a cycle does not
    lose the mowing: the automation takes over the running stage (edge pass or normal
    mowing), waits for it to finish and records the mowing instead of planning
    another one on the same day.

    Mower type:
    - Worx Vision / RTK finishes mowing on its own based on the map or zone. You
      do not need to set a full mowing duration. Returning with a low battery, charging
      and automatic resume are treated as one cycle.
    - Older Worx mowers with a boundary wire still use a calculated
      run time, because their one-time mowing mode requires it.

    Operating modes:
    - automatic mode picks the best time from the hourly forecast,
    - when it is too hot, it looks for a cooler time on the same
      day; with FiatLux it can also use night hours until 05:00,
    - fixed time mode works like a classic schedule with a second start attempt,
    - night mowing 22:00-05:00 is available only after confirming the accessory
      FiatLux.

    Extra options (off by default):
    - mowing only on selected days of the week,
    - mowing only in daylight, with a margin of minutes after sunrise and before sunset
      (protects hedgehogs and other small animals that forage after dark),
    - pausing mowing when someone is in the garden (motion sensors, gate,
      a "kids/dogs in the garden" switch); the mower returns to the dock or stops,
      and the cycle counts as interrupted,
    - phone notifications or other actions (e.g. notify.mobile_app_...).

    Notifications:
    - after the daily grass growth recalculation,
    - after a start is postponed,
    - after a mowing cycle starts,
    - after a cycle finishes or is interrupted following an actual start.
    When the forecast confirms good conditions, the notification shows "Mowing time".
    Otherwise it shows "Next check" and a short reason.

    Requirements:
    - Worx Vision Cloud PLUS integration 1.3.1 or newer,
    - three Home Assistant helpers: grass growth, last mowing and next
      planned mowing,
    - the mowing schedule in the WORX app turned off.
  domain: automation
  author: Smart Service
  homeassistant:
    min_version: 2025.4.0
  source_url: https://github.com/SmartServicePL/worx_vision_cloud_plus_automation/blob/main/blueprints/automation/worx_vision_cloud_plus/smart_mowing_schedule_en.yaml
  input:
    mower_section:
      name: Mower
      icon: mdi:robot-mower
      input:
        mower_entity:
          name: Mower
          description: The lawn_mower entity from the Worx Vision Cloud PLUS integration.
          selector:
            entity:
              filter:
                - domain: lawn_mower
        battery_sensor:
          name: Battery
          description: Mower battery percentage sensor.
          selector:
            entity:
              filter:
                - domain: sensor
        rain_binary_sensor:
          name: Current rain state
          description: Binary sensor that shows whether it is raining right now. It can come from the mower or a local weather station. When available, its real measurement takes priority over the rain forecast. The drying time (3 h, 6 h after heavy rain) is counted from the moment the sensor switches to dry, only when at least 0.2 mm of rain has been measured since midnight.
          selector:
            entity:
              filter:
                - domain: binary_sensor
    weather_section:
      name: Weather
      icon: mdi:weather-partly-rainy
      input:
        temperature_source_entity:
          name: Temperature
          description: Outdoor temperature sensor or a weather entity with a temperature attribute. Used to check start conditions. Daily grass growth is calculated from the average temperature of the hourly forecast for the next 24 hours; without a forecast this reading is used, so a daily average sensor (e.g. the statistics integration) is recommended in that case.
          selector:
            entity:
              filter:
                - domain: sensor
                - domain: weather
        rain_source_entity:
          name: Measured rainfall
          description: Rainfall total sensor for the current day or the last 24 hours, or a weather entity. Do not select an instantaneous rain rate. With MeteoFusion HA the rainfall total is read automatically.
          selector:
            entity:
              filter:
                - domain: sensor
                - domain: weather
        forecast_weather_entity:
          name: Hourly forecast (optional)
          description: A weather entity from the MeteoFusion HA integration is recommended. The automation picks a specific dry hour with a safe temperature from its forecast and uses it to calculate grass growth conditions for the next 24 hours. Regular weather entities, e.g. Tomorrow.io, are also supported. Without a forecast the selected window is used and current conditions are checked at start time.
          default: ""
          selector:
            entity:
              filter:
                - domain: weather
        outdoor_humidity_sensor:
          name: Air humidity (optional)
          description: Local outdoor humidity sensor. Together with the temperature it is used to calculate the dew point; a start is possible when the air is at least 2.5 °C warmer than the dew point, i.e. when the dew has evaporated. Without this sensor the automation uses the humidity from the weather entity, if available.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
        sunlight_source_entity:
          name: Sunlight / UV
          description: UV/sunlight sensor or a weather entity with a uv_index attribute. Daily growth uses the maximum UV from the hourly forecast for the next 24 hours. When the forecast has no UV, this reading is used, and a night reading (below 1) is replaced with a typical value for the season.
          selector:
            entity:
              filter:
                - domain: sensor
                - domain: weather
        soil_moisture_sensor:
          name: Soil moisture (optional)
          description: You can leave this empty. The automation will then calculate a virtual soil moisture from the weather.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
    helpers_section:
      name: Helpers
      icon: mdi:database-clock
      input:
        growth_helper:
          name: Grass growth
          description: input_number helper that stores the estimated grass growth since the last full mowing.
          selector:
            entity:
              filter:
                - domain: input_number
        last_mow_helper:
          name: Last mowing
          description: input_datetime helper updated after a full mowing cycle.
          selector:
            entity:
              filter:
                - domain: input_datetime
        next_mow_helper:
          name: Next mowing
          description: input_datetime helper where the automation stores the expected time of the next mowing.
          selector:
            entity:
              filter:
                - domain: input_datetime
    simple_settings_section:
      name: Basic settings
      icon: mdi:tune-variant
      input:
        mower_cycle_type:
          name: Mower type
          description: With Worx Vision / RTK the mower finishes mowing on its own based on the map. For older mowers with a boundary wire the automation uses a calculated run time.
          default: vision_rtk
          selector:
            select:
              mode: dropdown
              options:
                - label: Worx Vision / RTK
                  value: vision_rtk
                - label: Older Worx with boundary wire
                  value: wired_timed
        mower_model:
          name: Mower model
          description: Select a WORX Vision / Vision Cloud model, or manual mode for another model.
          default: custom
          selector:
            select:
              mode: dropdown
              options:
                - label: Manual / other model
                  value: custom
                - label: Vision AI S250 WR202E - 250 m2
                  value: wr202e_250
                - label: Vision AI M600 WR206E - 600 m2
                  value: wr206e_600
                - label: Vision AI M800 WR208E - 800 m2
                  value: wr208e_800
                - label: Vision AI L1300 WR213E - 1300 m2
                  value: wr213e_1300
                - label: Vision AI L1600 WR216E - 1600 m2
                  value: wr216e_1600
                - label: Vision AI WR220 - 1/2 acre
                  value: wr220_2023
                - label: Vision Cloud 300 WR303E - 300 m2
                  value: wr303e_300
                - label: Vision Cloud 500 WR305E - 500 m2
                  value: wr305e_500
                - label: Vision Cloud 650 WR365E - 650 m2
                  value: wr365e_650
                - label: Vision Cloud 650 WR365E.1 Cut-to-Zero - 650 m2
                  value: wr365e1_650
                - label: Vision Cloud 800 WR308E - 800 m2
                  value: wr308e_800
                - label: Vision Cloud 1200 WR312E - 1200 m2
                  value: wr312e_1200
                - label: Vision Cloud 1800 WR318E - 1800 m2
                  value: wr318e_1800
                - label: Vision Cloud 3000 WR330E - 3000 m2
                  value: wr330e_3000
                - label: Vision Cloud 1/4 acre WR310/WR310.1
                  value: wr310_1012
                - label: Vision Cloud 1/2 acre WR320/WR320.1
                  value: wr320_2023
                - label: Vision Cloud 1 acre WR340
                  value: wr340_us_4047
                - label: Vision Cloud 4WD 600 WR340E - 600 m2
                  value: wr340e_600
                - label: Vision Cloud 4WD 1000 WR341E - 1000 m2
                  value: wr341e_1000
                - label: Vision Cloud 4WD 2000 WR342E - 2000 m2
                  value: wr342e_2000
                - label: Vision Cloud 4WD 4000 WR344E - 4000 m2
                  value: wr344e_4000
                - label: Vision Cloud 4WD 1/4 acre WR341/WR341.1
                  value: wr341_us_1012
                - label: Vision Cloud 4WD 1 acre WR344
                  value: wr344_us_4047
        lawn_area_m2:
          name: Lawn area
          description: Mowable lawn area in square meters.
          default: 500
          selector:
            number:
              min: 20
              max: 5000
              step: 10
              unit_of_measurement: m2
              mode: box
        growth_threshold_mode:
          name: When to start mowing
          description: Automatic mode picks a low start threshold suited to a robot mower. The 1/3 grass blade rule is treated only as a safety limit, not as a start threshold.
          default: auto_cutting_height
          selector:
            select:
              mode: dropdown
              options:
                - label: Automatic for robot mower
                  value: auto_cutting_height
                - label: Manual growth threshold
                  value: manual
        cutting_height_mm:
          name: Cutting height
          description: Target grass height set on the mower. The automation uses it to choose a small start threshold and a safe mowing limit.
          default: 40
          selector:
            number:
              min: 20
              max: 60
              step: 1
              unit_of_measurement: mm
              mode: slider
        planning_mode:
          name: Time selection mode
          description: Automatically picks the best time from the forecast, or sticks to a fixed time.
          default: auto
          selector:
            select:
              mode: dropdown
              options:
                - label: Automatic from weather forecast
                  value: auto
                - label: Fixed time
                  value: fixed
        mowing_window_preset:
          name: Preferred mowing window
          description: The automation first looks for a safe time in this window. If the weather does not allow it, it may pick a time outside the window on the same day. The "Custom hours" option uses the hours set below.
          default: before_noon
          selector:
            select:
              mode: dropdown
              options:
                - label: Morning (07:00 - 10:00)
                  value: morning
                - label: Late morning (09:00 - 12:00)
                  value: before_noon
                - label: Midday (11:00 - 14:00)
                  value: noon
                - label: Afternoon (14:00 - 17:00)
                  value: afternoon
                - label: Evening (17:00 - 20:00)
                  value: evening
                - label: Night (22:00 - 05:00)
                  value: night
                - label: Custom hours
                  value: custom
        fiatlux_installed:
          name: Is the FiatLux accessory installed on the mower?
          description: Enable only if the mower has FiatLux lights. Required for the 22:00-05:00 night window.
          default: false
          selector:
            boolean:
        primary_start_time:
          name: Custom window start
          description: Used with the "Custom hours" option. In fixed time mode this is the main start.
          default: "10:00:00"
          selector:
            time:
        backup_start_time:
          name: Custom window end
          description: Used with the "Custom hours" option. In fixed time mode this is the second attempt.
          default: "16:30:00"
          selector:
            time:
        automatic_irrigation_enabled:
          name: Automatic irrigation
          description: Enable if the lawn is regularly watered by automatic irrigation.
          default: false
          selector:
            boolean:
        fertilization_enabled:
          name: Fertilized lawn
          description: Enable if the lawn is fertilized regularly.
          default: false
          selector:
            boolean:
    advanced_growth_section:
      name: Advanced - grass growth
      icon: mdi:sprout
      collapsed: true
      input:
        growth_threshold_mm:
          name: Manual mowing start threshold
          description: Used only when "When to start mowing" is set to "Manual growth threshold".
          default: 3
          selector:
            number:
              min: 1
              max: 12
              step: 0.5
              unit_of_measurement: mm
              mode: slider
        high_growth_threshold_mm:
          name: Heavy mowing threshold
          description: In automatic mode it is calculated from the start threshold and the 1/3 cutting height limit. This slider only works with the manual growth threshold.
          default: 6
          selector:
            number:
              min: 2
              max: 25
              step: 0.5
              unit_of_measurement: mm
              mode: slider
        irrigation_growth_adjustment_percent:
          name: Growth adjustment for irrigation
          description: Used only when automatic irrigation is enabled.
          default: 140
          selector:
            number:
              min: 100
              max: 220
              step: 5
              unit_of_measurement: "%"
              mode: slider
        fertilization_growth_adjustment_percent:
          name: Growth adjustment for fertilization
          description: Used only when fertilization is enabled.
          default: 125
          selector:
            number:
              min: 100
              max: 180
              step: 5
              unit_of_measurement: "%"
              mode: slider
        min_days_between_mows:
          name: Minimum gap between mowings
          description: Protection against starting too often. A value of 1 day means the next calendar day, so the mower can mow every day when growth and weather allow.
          default: 1
          selector:
            number:
              min: 0
              max: 7
              step: 0.5
              unit_of_measurement: d
              mode: slider
    advanced_runtime_section:
      name: Advanced - older wired mowers
      icon: mdi:timer-cog
      collapsed: true
      input:
        mower_capacity_m2_per_hour:
          name: Manual mower capacity
          description: Used only with the "Older Worx with boundary wire" type and the "Manual / other model" model.
          default: 80
          selector:
            number:
              min: 20
              max: 250
              step: 5
              unit_of_measurement: m2/h
              mode: slider
        model_capacity_adjustment_percent:
          name: Model capacity adjustment
          description: For older wired mowers, lets you adjust the calculated run time for narrow passages, many zones or a simple lawn.
          default: 100
          selector:
            number:
              min: 50
              max: 150
              step: 5
              unit_of_measurement: "%"
              mode: slider
        min_runtime_minutes:
          name: Minimum mowing time for a wired mower
          default: 45
          selector:
            number:
              min: 10
              max: 180
              step: 5
              unit_of_measurement: min
              mode: slider
        max_runtime_minutes:
          name: Maximum mowing time for a wired mower
          default: 120
          selector:
            number:
              min: 30
              max: 120
              step: 15
              unit_of_measurement: min
              mode: slider
    advanced_safety_section:
      name: Advanced - safety
      icon: mdi:shield-check
      collapsed: true
      input:
        growth_update_time:
          name: Growth recalculation time
          description: At this time the automation adds the daily grass growth and re-evaluates the mowing time with the current forecast.
          default: "05:30:00"
          selector:
            time:
        min_battery_percent:
          name: Minimum battery to start
          default: 45
          selector:
            number:
              min: 10
              max: 100
              step: 5
              unit_of_measurement: "%"
              mode: slider
        min_mowing_temperature_c:
          name: Minimum mowing temperature
          description: Below this temperature mowing is postponed to a warmer time.
          default: 10
          selector:
            number:
              min: 0
              max: 20
              step: 1
              unit_of_measurement: "°C"
              mode: slider
        max_mowing_temperature_c:
          name: Maximum mowing temperature
          description: Above this temperature mowing is postponed to a cooler time.
          default: 25
          selector:
            number:
              min: 20
              max: 40
              step: 1
              unit_of_measurement: "°C"
              mode: slider
        max_rain_24h_mm:
          name: Heavy rain threshold
          description: When this measured value is exceeded, the automation doubles the grass drying time. Rain by itself does not block mowing for the whole day.
          default: 3
          selector:
            number:
              min: 0
              max: 30
              step: 0.5
              unit_of_measurement: mm
              mode: slider
        max_soil_moisture_percent:
          name: Maximum soil moisture to start
          description: "Set below 100% if soil moisture should block the start. By default soil moisture is only used to calculate grass growth."
          default: 100
          selector:
            number:
              min: 20
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: slider
        mowing_start_confirm_timeout_minutes:
          name: Maximum mowing start confirmation time
          description: How many minutes the automation waits for the mower to leave the dock after a normal mowing or edge cut command.
          default: 5
          selector:
            number:
              min: 2
              max: 20
              step: 1
              unit_of_measurement: min
              mode: slider
    extra_options_section:
      name: Extra options (off by default)
      icon: mdi:calendar-check
      collapsed: true
      input:
        allowed_days_enabled:
          name: Mow only on selected days
          description: Off = the planner can pick any day of the week.
          default: false
          selector:
            boolean:
        allowed_days:
          name: Mowing days
          description: Used only when the option above is enabled.
          default: [mon, tue, wed, thu, fri, sat, sun]
          selector:
            select:
              multiple: true
              options:
                - label: Monday
                  value: mon
                - label: Tuesday
                  value: tue
                - label: Wednesday
                  value: wed
                - label: Thursday
                  value: thu
                - label: Friday
                  value: fri
                - label: Saturday
                  value: sat
                - label: Sunday
                  value: sun
        daylight_only:
          name: Mow only in daylight
          description: >-
            Start only between sunrise and sunset (sun.sun entity), with the margin set below.
            Recommended: hedgehogs and other small animals forage after dark. Takes priority over the FiatLux night window.
          default: false
          selector:
            boolean:
        daylight_margin_minutes:
          name: Margin after sunrise and before sunset
          description: Used only when "Mow only in daylight" is enabled.
          default: 30
          selector:
            number:
              min: 0
              max: 120
              step: 5
              unit_of_measurement: min
              mode: slider
        garden_check_enabled:
          name: Do not mow when someone is in the garden
          description: >-
            When any of the sensors below is "on", mowing does not start, and ongoing mowing
            is interrupted and rescheduled (no earlier than 30 minutes later).
          default: false
          selector:
            boolean:
        garden_sensors:
          name: Sensors for "someone in the garden"
          description: Motion or presence sensors in the garden, a gate, a "kids/dogs in the garden" switch. State "on" = someone is there.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: binary_sensor
                - domain: input_boolean
        garden_reaction:
          name: When someone enters the garden during mowing
          default: dock
          selector:
            select:
              options:
                - label: Send the mower to the dock
                  value: dock
                - label: Stop the mower on the lawn
                  value: pause
    notifications_section:
      name: Phone notifications (optional)
      icon: mdi:cellphone-message
      collapsed: true
      input:
        notify_actions:
          name: Notification actions
          description: >-
            Run together with the Home Assistant notification, e.g. notify.mobile_app_phone.
            Available variables: {{ tytul }} and {{ tresc }}. Empty = Home Assistant notification only.
          default: []
          selector:
            action: {}
        notify_daily_plan:
          name: Also send the daily mowing plan
          description: Off = only mowing start, postponement, interruption and completion are sent to the phone.
          default: false
          selector:
            boolean:

mode: parallel
max: 10
max_exceeded: silent

triggers:
  - trigger: time
    id: update_growth
    at: !input growth_update_time
  - trigger: time
    id: start_scheduled
    at: !input next_mow_helper
  - trigger: time_pattern
    id: start_due_check
    minutes: "/5"
  - trigger: state
    id: external_mowing_started
    entity_id: !input mower_entity
    to: mowing
    for: "00:10:00"
  - trigger: event
    id: replan
    event_type: worx_smart_mowing_replan
    event_data:
      mower_entity: !input mower_entity
  - trigger: state
    id: garden_entered
    entity_id: !input garden_sensors
    from: "off"
    to: "on"
  - trigger: homeassistant
    id: restart_recovery
    event: start
  - trigger: event
    id: restart_recovery
    event_type: automation_reloaded

variables:
  mower_entity: !input mower_entity
  battery_sensor: !input battery_sensor
  rain_binary_sensor: !input rain_binary_sensor
  temperature_source_entity: !input temperature_source_entity
  rain_source_entity: !input rain_source_entity
  forecast_weather_entity_input: !input forecast_weather_entity
  outdoor_humidity_sensor: !input outdoor_humidity_sensor
  soil_moisture_sensor: !input soil_moisture_sensor
  sunlight_source_entity: !input sunlight_source_entity
  growth_helper: !input growth_helper
  last_mow_helper: !input last_mow_helper
  next_mow_helper: !input next_mow_helper
  allowed_days_enabled: !input allowed_days_enabled
  allowed_days: !input allowed_days
  daylight_only: !input daylight_only
  daylight_margin_minutes: !input daylight_margin_minutes
  garden_check_enabled: !input garden_check_enabled
  garden_sensors: !input garden_sensors
  garden_reaction: !input garden_reaction
  notify_daily_plan: !input notify_daily_plan
  # Sunrise and sunset as seconds since midnight (local time) from sun.sun; -1 = no data.
  # For planning later days the times from today are enough: the shift of a few minutes per day
  # is smaller than the margin, and the condition is checked again before the start.
  sun_rise_s: >-
    {% set r = state_attr('sun.sun', 'next_rising') %}
    {% if r %}{% set l = as_local(as_datetime(r)) %}{{ l.hour * 3600 + l.minute * 60 }}{% else %}-1{% endif %}
  sun_set_s: >-
    {% set r = state_attr('sun.sun', 'next_setting') %}
    {% if r %}{% set l = as_local(as_datetime(r)) %}{{ l.hour * 3600 + l.minute * 60 }}{% else %}-1{% endif %}
  daylight_now: >-
    {% set sod = now().hour * 3600 + now().minute * 60 %}
    {% set m = (daylight_margin_minutes | float(30)) * 60 %}
    {{ (sun_rise_s | float(-1)) >= 0 and (sun_set_s | float(-1)) >= 0
       and sod >= (sun_rise_s | float) + m and sod <= (sun_set_s | float) - m }}
  garden_occupied: >-
    {{ garden_sensors | select('is_state', 'on') | list | length > 0 }}
  mower_cycle_type: !input mower_cycle_type
  mower_model: !input mower_model
  lawn_area_m2: !input lawn_area_m2
  manual_mower_capacity_m2_per_hour: !input mower_capacity_m2_per_hour
  model_capacity_adjustment_percent: !input model_capacity_adjustment_percent
  growth_threshold_mode: !input growth_threshold_mode
  cutting_height_mm: !input cutting_height_mm
  manual_growth_threshold_mm: !input growth_threshold_mm
  growth_threshold_mm: >-
    {% if growth_threshold_mode == 'auto_cutting_height' %}
      {% set height = cutting_height_mm | float(40) %}
      {% set threshold = height * 0.075 %}
      {% if threshold < 2 %}2{% elif threshold > 4.5 %}4.5{% else %}{{ threshold | round(1) }}{% endif %}
    {% else %}
      {{ manual_growth_threshold_mm }}
    {% endif %}
  automatic_irrigation_enabled: !input automatic_irrigation_enabled
  irrigation_growth_adjustment_percent: !input irrigation_growth_adjustment_percent
  fertilization_enabled: !input fertilization_enabled
  fertilization_growth_adjustment_percent: !input fertilization_growth_adjustment_percent
