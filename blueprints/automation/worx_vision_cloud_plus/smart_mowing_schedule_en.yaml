      'rain': 0,
      'drying': 0,
      'humidity': 60,
      'soil': 180,
      'growth': 0,
      'gap': 0
    } %}
    {{ delays.get(code, 60) }}

actions:
  - choose:
      - alias: Rebuild the plan when the saved time is outdated
        conditions:
          - condition: template
            value_template: >-
              {% set planned = state_attr(next_mow_helper, 'timestamp') %}
              {{ trigger.id == 'start_due_check'
                 and (cycle_running | string | lower) != 'true'
                 and (planned is none
                      or (planned | float(0)) < as_timestamp(now()) - ((missed_start_grace_minutes | int(30)) * 60)) }}
        sequence:
          - event: worx_smart_mowing_replan
            event_data:
              mower_entity: "{{ mower_entity }}"
              kind: recovery
      - alias: Recalculate growth and plan mowing (with forecast)
        conditions:
          - condition: template
            value_template: "{{ trigger.id in ['update_growth', 'replan'] and (forecast_available | string | lower) == 'true' }}"
        sequence:
          - action: weather.get_forecasts
            continue_on_error: true
            target:
              entity_id: "{{ forecast_weather_entity | trim }}"
            data:
              type: hourly
            response_variable: plan_forecast
          - sequence: &plan_sequence
              - variables:
                  plan_kind: >-
                    {{ 'daily' if trigger.id == 'update_growth' else (trigger.event.data.kind | default('recovery')) }}
                  plan_event: >-
                    {{ trigger.event.data if trigger.id == 'replan' else {} }}
                  fc_items: >-
                    {%- set ns = namespace(items=[]) -%}
                    {%- if plan_forecast is defined and plan_forecast is mapping -%}
                      {%- set bad = ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'snowy', 'hail'] -%}
                      {%- set raw = plan_forecast.get(forecast_weather_entity | trim, {}).get('forecast', []) -%}
                      {%- for item in raw[:(weather_forecast_max_items | int(120))] if item is mapping -%}
                        {%- set t = as_timestamp(item.get('datetime'), 0) | float(0) -%}
                        {%- if t > 0 -%}
                          {%- set condition = item.get('condition') -%}
                          {%- set item_temp = item.get('temperature') | float(none) -%}
                          {%- set item_hum = item.get('humidity') | float(none) -%}
                          {%- if item_temp is not none and item_hum is not none and item_hum > 0 -%}
                            {%- set g = (([item_hum, 100] | min) / 100) | log + 17.62 * item_temp / (243.12 + item_temp) -%}
                            {%- set item_spread = (item_temp - 243.12 * g / (17.62 - g)) | round(1) -%}
                          {%- else -%}
                            {%- set item_spread = none -%}
                          {%- endif -%}
                          {%- set ns.items = ns.items + [{
                            't': t,
                            'temp': item.get('temperature') | float(none),
                            'rain': item.get('precipitation') | float(0),
                            'prob': item.get('precipitation_probability') | float(0),
                            'hum': item.get('humidity') | float(none),
                            'wind': item.get('wind_speed') | float(0),
                            'uv': item.get('uv_index') | float(none),
                            'conf': item.get('confidence') | float(70),
                            'cond': (condition | string) if condition is not none else '',
                            'bad': condition in bad,
                            'spread': item_spread,
                            'wet': (item_spread < (min_dew_point_spread_c | float(2.5))) if item_spread is not none
                                   else (item_hum is not none and item_hum > (wet_grass_humidity_percent | float(88)))
                          }] -%}
                        {%- endif -%}
                      {%- endfor -%}
                    {%- endif -%}
                    {{ ns.items | sort(attribute='t') }}
                  day_items: >-
                    {%- set start = as_timestamp(now()) - 1800 -%}
                    {{ fc_items | selectattr('t', '>=', start) | selectattr('t', '<', start + 86400) | list }}
                  growth_temp_c: >-
                    {% set temps = day_items | map(attribute='temp') | reject('none') | list %}
                    {% if temps | length >= 12 %}
                      {{ ((temps | sum) / (temps | length)) | round(1) }}
                    {% else %}
                      {{ temp_c | float(10) }}
                    {% endif %}
                  growth_uv_index: >-
                    {% set values = day_items | map(attribute='uv') | reject('none') | list %}
                    {% set seasonal = {1: 1, 2: 1.5, 3: 2.5, 4: 4, 5: 5.5, 6: 6.5, 7: 6.5, 8: 5.5, 9: 4, 10: 2.5, 11: 1.2, 12: 0.8} %}
                    {% if values | length > 0 %}
                      {{ values | max }}
                    {% elif (sunlight_index | float(0)) >= 1 %}
                      {{ sunlight_index | float(5) }}
                    {% else %}
                      {{ seasonal[now().month] }}
                    {% endif %}
                  growth_rain_mm: >-
                    {% set forecast_rain = day_items | map(attribute='rain') | sum %}
                    {{ [rain_mm | float(0), forecast_rain] | max | round(2) }}
                  growth_soil_moisture: >-
                    {% set sensor_value = soil_sensor_value | float(-1) %}
                    {% if sensor_value >= 0 %}
                      {{ sensor_value }}
                    {% else %}
                      {% set rain = growth_rain_mm | float(0) %}
                      {% set temp = growth_temp_c | float(10) %}
                      {% set sun = growth_uv_index | float(5) %}
                      {% set m = now().month %}
                      {% set base = 72 if m in [12, 1, 2] else (58 if m in [3, 4, 10, 11] else 45) %}
                      {% set temp_drying = -8 if temp < 5 else (-3 if temp < 12 else (4 if temp < 20 else (10 if temp < 26 else (18 if temp < 32 else 25)))) %}
                      {% set raw = base + rain * 7 - temp_drying - sun * 1.8 %}
                      {% if raw < 15 %}15{% elif raw > 95 %}95{% else %}{{ raw | round(0) }}{% endif %}
                    {% endif %}
                  growth_daily_mm: >-
                    {% set t = growth_temp_c | float(10) %}
                    {% if t < 3 %}
                      {% set temp_factor = 0 %}
                    {% else %}
                      {% set gp = 2.718281828459045 ** (-0.5 * (((t - 20) / 5.5) ** 2)) %}
                      {% set temp_factor = 0.02 if gp < 0.02 else ([gp, 1] | min) %}
                    {% endif %}
                    {% set r = growth_rain_mm | float(0) %}
                    {% set rain_factor = 0.75 if r < 0.2 else (0.9 if r < 2 else (1 if r < 10 else (0.9 if r < 25 else 0.7))) %}
                    {% if automatic_irrigation_enabled and rain_factor < 0.95 %}{% set rain_factor = 0.95 %}{% endif %}
                    {% set s = growth_soil_moisture | float(50) %}
                    {% set soil_factor = 0.35 if s < 20 else (0.65 if s < 35 else (1 if s <= 80 else (0.9 if s <= 95 else 0.75))) %}
                    {% if automatic_irrigation_enabled and s < 80 and soil_factor < 0.95 %}{% set soil_factor = 0.95 %}{% endif %}
                    {% set u = growth_uv_index | float(5) %}
                    {% set sun_factor = 0.35 if u < 1 else (0.65 if u < 3 else (1 if u <= 8 else 0.85)) %}
                    {% set m = now().month %}
                    {% set season_factor = 0.15 if m in [12, 1, 2] else (0.65 if m in [3, 11] else (0.9 if m in [4, 10] else 1)) %}
                    {% set irrigation_factor = (1 + (((irrigation_growth_adjustment_percent | float(140)) - 100) / 100) * 0.35) if automatic_irrigation_enabled else 1 %}
                    {% set fertilization_factor = (1 + (((fertilization_growth_adjustment_percent | float(125)) - 100) / 100) * 0.4) if fertilization_enabled else 1 %}
                    {% set raw = 8.5 * temp_factor * rain_factor * soil_factor * sun_factor * season_factor * irrigation_factor * fertilization_factor %}
                    {% if raw < 0 %}0{% elif raw > 12 %}12{% else %}{{ raw | round(1) }}{% endif %}
                  growth_inputs_label: >-
                    average {{ growth_temp_c | float | round(1) }} °C, max UV {{ growth_uv_index | float | round(1) }}, rain {{ growth_rain_mm | float | round(1) }} mm{% if (soil_sensor_value | float(-1)) < 0 %}, estimated soil moisture {{ growth_soil_moisture | float | round(0) | int }}%{% else %}, soil moisture {{ growth_soil_moisture | float | round(0) | int }}%{% endif %}
                  plan_growth_mm: >-
                    {% set before = states(growth_helper) | float(0) %}
                    {% set raw = before + ((growth_daily_mm | float(0)) if plan_kind == 'daily' else 0) %}
                    {% if raw < 0 %}0{% elif raw > 40 %}40{% else %}{{ raw | round(1) }}{% endif %}
              - if:
                  - condition: template
                    value_template: "{{ plan_kind == 'daily' }}"
                then:
                  - action: input_number.set_value
                    target:
                      entity_id: !input growth_helper
                    data:
                      value: "{{ plan_growth_mm }}"
              - if:
                  - condition: template
                    value_template: "{{ plan_kind == 'daily' and (cycle_running | string | lower) == 'true' }}"
                then:
                  - stop: Mowing cycle in progress; its end or interruption will set the next time.
              - variables:
                  next_update_ts: >-
                    {% set today_update = as_timestamp(today_at(growth_update_time_value)) %}
                    {{ today_update if as_timestamp(now()) < today_update else as_timestamp(today_at(growth_update_time_value) + timedelta(days=1)) }}
                  growth_ready_ts: >-
                    {% set threshold = growth_threshold_mm | float(3) %}
                    {% set growth = plan_growth_mm | float(0) %}
                    {% if growth >= threshold %}
                      0
                    {% else %}
                      {% set daily = growth_daily_mm | float(0) %}
                      {% set days = 7 if daily <= 0.1 else ([((threshold - growth) / daily) | round(0, 'ceil') | int, 14] | min) %}
                      {% set offset = 0 if as_timestamp(now()) < as_timestamp(today_at(growth_update_time_value)) else 1 %}
                      {{ as_timestamp(today_at(growth_update_time_value) + timedelta(days=offset + days - 1)) }}
                    {% endif %}
                  plan_min_delay_seconds: >-
                    {{ ((plan_event.get('min_delay_minutes', 0) if plan_event is mapping else 0) | float(0)) * 60 }}
                  plan_earliest_ts: >-
                    {% set now_value = as_timestamp(now()) %}
                    {{ [now_value + 300,
                        growth_ready_ts | float(0),
                        mowing_gap_ready_ts | float(0),
                        rain_drying_ready_ts | float(0),
                        now_value + (plan_min_delay_seconds | float(0))] | max }}
                  plan_constraint: >-
                    {% set now_value = as_timestamp(now()) %}
                    {% set earliest = plan_earliest_ts | float %}
                    {% if earliest <= now_value + 301 %}none
                    {% elif earliest == (growth_ready_ts | float(0)) %}growth
                    {% elif earliest == (mowing_gap_ready_ts | float(0)) %}gap
                    {% elif earliest == (rain_drying_ready_ts | float(0)) %}drying
                    {% else %}delay{% endif %}
              - variables:
                  plan_result: >-
                    {%- macro dozwolony(ts) -%}
                      {%- set l = ts | as_datetime | as_local -%}
                      {%- set sod = l.hour * 3600 + l.minute * 60 -%}
                      {%- set m = (daylight_margin_minutes | float(30)) * 60 -%}
                      {{- (not allowed_days_enabled
                            or ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'][l.weekday()] in allowed_days)
                          and (not daylight_only
                            or ((sun_rise_s | float(-1)) >= 0 and sod >= (sun_rise_s | float) + m
                                and sod <= (sun_set_s | float) - m)) -}}
                    {%- endmacro -%}
                    {%- set step = auto_planning_step_seconds | int(900) -%}
                    {%- set earliest = plan_earliest_ts | float -%}
                    {%- set primary = primary_start_time_value | trim -%}
                    {%- set backup = backup_start_time_value | trim -%}
                    {%- set crosses = backup <= primary -%}
                    {%- set fiatlux = fiatlux_installed | bool -%}
                    {%- set night = mowing_window_preset == 'night' -%}
                    {%- set today = now().date() -%}
                    {%- set earliest_local = earliest | as_datetime | as_local -%}
                    {%- set earliest_day = (earliest_local.date() - today).days -%}
                    {%- set earliest_clock = earliest_local.strftime('%H:%M:%S') -%}
                    {%- set base_day = earliest_day - 1 if ((crosses and earliest_clock < backup)
                        or (fiatlux and not night and earliest_clock < fiatlux_search_end)) else earliest_day -%}
                    {%- set items = fc_items -%}
                    {%- set last_t = (items | map(attribute='t') | max) if items | length > 0 else 0 -%}
                    {%- set urgent = (plan_growth_mm | float(0)) >= (high_growth_threshold_mm | float(999)) -%}
                    {%- set per_hour = 20 if urgent else 2 -%}
                    {%- set tmin = min_mowing_temperature_c | float(10) -%}
                    {%- set tmax = max_mowing_temperature_c | float(25) -%}
                    {%- set wet = wet_grass_humidity_percent | float(88) -%}
                    {%- set block = forecast_rain_block_mm | float(0.2) -%}
                    {%- set high = high_rain_probability_percent | float(60) -%}
                    {%- set dry_s = (dry_after_rain_hours | float(3)) * 3600 -%}
                    {%- set horizon_s = (forecast_dry_horizon_hours | float(3)) * 3600 -%}
                    {%- set min_future = forecast_min_future_hours | int(2) -%}
                    {%- set heavy_mm = max_rain_24h_mm | float(3) -%}
                    {%- set result = namespace(ts=0, source='', in_window=false, window_checked=false, why=[], shifted=false, fb_ts=0, fb_score=99999999, fb_in_window=false, fb_source='') -%}
                    {%- if planning_mode == 'auto' and items | length > 0 -%}
                      {%- for d in range(base_day, base_day + (weather_search_days | int(4))) -%}
                        {%- if result.ts == 0 -%}
                          {%- set ps = as_timestamp(today_at(primary) + timedelta(days=d)) -%}
                          {%- set pe = as_timestamp(today_at(backup) + timedelta(days=d + (1 if crosses else 0))) -%}
                          {%- if night -%}
                            {%- set rs = ps -%}
                            {%- set re = pe -%}
                          {%- else -%}
                            {%- set rs = [as_timestamp(today_at(daytime_search_start) + timedelta(days=d)), ps] | min -%}
                            {%- set re_default = as_timestamp(today_at(fiatlux_search_end) + timedelta(days=d + 1)) if fiatlux else as_timestamp(today_at(daytime_search_end) + timedelta(days=d)) -%}
                            {%- set re = [re_default, pe] | max -%}
                          {%- endif -%}
                          {%- set mid = (ps + pe) / 2 -%}
                          {%- set first = ((([rs, earliest] | max) / step) | round(0, 'ceil') | int) * step -%}
                          {%- set last = [re, last_t] | min -%}
                          {%- set day = namespace(pref_ts=0, pref_score=99999999, any_ts=0, any_score=99999999, window_checked=false, why=[]) -%}
                          {%- if first > last_t -%}
                            {%- set candidate = ps if earliest <= ps else (first if first <= pe else 0) -%}
                            {%- if candidate > 0 -%}
                              {%- set candidate_score = 2500 + ((candidate - earliest) / 3600) * per_hour -%}
                              {%- if candidate_score < result.fb_score -%}
                                {%- set result.fb_score = candidate_score -%}
                                {%- set result.fb_ts = candidate -%}
                                {%- set result.fb_in_window = true -%}
                                {%- set result.fb_source = 'beyond_forecast' -%}
                              {%- endif -%}
                            {%- endif -%}
                          {%- elif first <= last -%}
                            {%- for slot in range(0, (((last - first) / step) | round(0, 'floor') | int) + 1) -%}
                              {%- set ts = first + slot * step -%}
                              {%- if dozwolony(ts) == 'True' -%}
                              {%- set fc = namespace(seen=false, rain=0, prob=0, temp=none, hum=none, wind=0, bad=false, conf=70, wet=false) -%}
                              {%- set rec = namespace(rain=0, bad=false, heavy=0) -%}
                              {%- set fut = namespace(seen=0, rain=0, prob=0, unsafe=false) -%}
                              {%- for it in items -%}
                                {%- if it.t <= ts -%}
                                  {%- if it.t > ts - 3600 -%}
                                    {%- set fc.seen = true -%}
                                    {%- set fc.rain = it.rain -%}
                                    {%- set fc.prob = it.prob -%}
                                    {%- set fc.temp = it.temp -%}
                                    {%- set fc.hum = it.hum -%}
                                    {%- set fc.wet = it.wet -%}
                                    {%- set fc.wind = it.wind -%}
                                    {%- set fc.bad = it.bad -%}
                                    {%- set fc.conf = it.conf -%}
                                  {%- endif -%}
                                  {%- if it.t > ts - dry_s -%}
                                    {%- set rec.rain = rec.rain + it.rain -%}
                                    {%- if it.bad -%}
                                      {%- set rec.bad = true -%}
                                    {%- endif -%}
                                  {%- endif -%}
                                  {%- if it.t > ts - 2 * dry_s -%}
                                    {%- set rec.heavy = rec.heavy + it.rain -%}
                                  {%- endif -%}
                                {%- elif it.t <= ts + horizon_s -%}
                                  {%- set fut.seen = fut.seen + 1 -%}
                                  {%- set fut.rain = fut.rain + it.rain -%}
                                  {%- if it.prob > fut.prob -%}
                                    {%- set fut.prob = it.prob -%}
                                  {%- endif -%}
                                  {%- if it.bad
                                      or (it.temp is not none and (it.temp < tmin or it.temp > tmax))
                                      or it.wet -%}
                                    {%- set fut.unsafe = true -%}
                                  {%- endif -%}
                                {%- endif -%}
                              {%- endfor -%}
                              {%- set rec_wet = rec.rain > block or rec.bad or rec.heavy > heavy_mm -%}
                              {%- set temp_ok = fc.temp is none or (fc.temp >= tmin and fc.temp <= tmax) -%}
                              {%- set hum_ok = not fc.wet -%}
                              {%- set rain_ok = (fc.rain + fut.rain) <= block and not fc.bad and fc.prob <= high and fut.prob <= high -%}
                              {%- set data_ok = fc.seen and fut.seen >= min_future -%}
                              {%- set safe = data_ok and temp_ok and hum_ok and rain_ok and not rec_wet and not fut.unsafe -%}
                              {%- set in_window = ts >= ps and ts <= pe -%}
                              {%- if in_window -%}
                                {%- set day.window_checked = true -%}
                              {%- endif -%}
                              {%- set score = fc.prob * 1.5 + fut.prob + (fc.rain + fut.rain) * 300
                                  + ((((fc.temp - 20) | abs) * 2) if fc.temp is not none else 10)
                                  + ((([fc.hum - 75, 0] | max) * 3) if fc.hum is not none else 0)
                                  + fc.wind * 0.8 + (100 - fc.conf) * 0.4
                                  + (((ts - mid) | abs) / 3600) * 1.2
                                  + ((ts - earliest) / 3600) * per_hour -%}
                              {%- if safe -%}
                                {%- if in_window and score < day.pref_score -%}
                                  {%- set day.pref_score = score -%}
                                  {%- set day.pref_ts = ts -%}
                                {%- endif -%}
                                {%- if score < day.any_score -%}
                                  {%- set day.any_score = score -%}
                                  {%- set day.any_ts = ts -%}
                                {%- endif -%}
                              {%- else -%}
                                {%- if in_window -%}
                                  {%- set day.why = day.why + (['rain'] if not rain_ok else [])
                                      + (['wet_after_rain'] if rec_wet else []) + (['dew'] if not hum_ok else [])
                                      + (['temperature'] if not temp_ok else []) + (['data'] if not data_ok else [])
                                      + (['later'] if fut.unsafe and rain_ok and not rec_wet and hum_ok and temp_ok and data_ok else []) -%}
                                {%- endif -%}
                                {%- set penalty = (0 if data_ok else 6000) + (0 if rain_ok else 10000)
                                    + (1800 if rec_wet else 0) + (6000 if fut.unsafe else 0)
                                    + (0 if temp_ok else 3000) + (0 if hum_ok else 1500) -%}
                                {%- if score + penalty < result.fb_score -%}
                                  {%- set result.fb_score = score + penalty -%}
                                  {%- set result.fb_ts = ts -%}
                                  {%- set result.fb_in_window = in_window -%}
                                  {%- set result.fb_source = 'best_effort' -%}
                                {%- endif -%}
                              {%- endif -%}
                              {%- endif -%}
                            {%- endfor -%}
                          {%- endif -%}
                          {%- if day.pref_ts > 0 -%}
                            {%- set result.ts = day.pref_ts -%}
                            {%- set result.source = 'forecast' -%}
                            {%- set result.in_window = true -%}
                          {%- elif day.any_ts > 0 -%}
                            {%- set result.ts = day.any_ts -%}
                            {%- set result.source = 'forecast' -%}
                            {%- set result.in_window = false -%}
                            {%- set result.window_checked = day.window_checked -%}
                            {%- set result.why = day.why | unique | list -%}
                          {%- endif -%}
                        {%- endif -%}
                      {%- endfor -%}
                      {%- if result.ts == 0 and result.fb_ts > 0 -%}
                        {%- set result.ts = result.fb_ts -%}
                        {%- set result.source = result.fb_source -%}
                        {%- set result.in_window = result.fb_in_window -%}
                      {%- endif -%}
                    {%- endif -%}
                    {%- if result.ts == 0 and planning_mode != 'auto' -%}
                      {%- set fixed = namespace(best=0) -%}
                      {%- for d in range(earliest_day - 1, earliest_day + 9) -%}
                        {%- set first_try = as_timestamp(today_at(primary) + timedelta(days=d)) -%}
                        {%- set second_try = as_timestamp(today_at(backup) + timedelta(days=d + (1 if crosses else 0))) -%}
                        {%- for candidate in [first_try, second_try] -%}
                          {%- if candidate >= earliest and (fixed.best == 0 or candidate < fixed.best) -%}
                            {%- set fixed.best = candidate -%}
                          {%- endif -%}
                        {%- endfor -%}
                      {%- endfor -%}
                      {%- set result.ts = fixed.best -%}
                      {%- set result.source = 'fixed' -%}
                      {%- set result.in_window = true -%}
                    {%- endif -%}
                    {%- if result.ts == 0 -%}
                      {%- set window = namespace(best=0) -%}
                      {%- for d in range(base_day, base_day + 9) -%}
                        {%- if window.best == 0 -%}
                          {%- set ps = as_timestamp(today_at(primary) + timedelta(days=d)) -%}
                          {%- set pe = as_timestamp(today_at(backup) + timedelta(days=d + (1 if crosses else 0))) -%}
                          {%- if earliest <= ps -%}
                            {%- set window.best = ps -%}
                          {%- elif earliest <= pe -%}
                            {%- set window.best = ((earliest / step) | round(0, 'ceil') | int) * step -%}
                          {%- endif -%}
                        {%- endif -%}
                      {%- endfor -%}
                      {%- set result.ts = window.best if window.best > 0 else ((earliest / step) | round(0, 'ceil') | int) * step -%}
                      {%- set result.source = 'window' -%}
                      {%- set result.in_window = window.best > 0 -%}
                    {%- endif -%}
                    {%- if (allowed_days_enabled or daylight_only) and result.ts > 0 and dozwolony(result.ts) != 'True' -%}
                      {%- set shift = namespace(ts=0) -%}
                      {%- set base = ((result.ts / step) | round(0, 'ceil') | int) * step -%}
                      {%- for k in range(1, 14 * 96 + 1) -%}
                        {%- if shift.ts == 0 and dozwolony(base + k * step) == 'True' -%}
                          {%- set shift.ts = base + k * step -%}
                        {%- endif -%}
                      {%- endfor -%}
                      {%- if shift.ts > 0 -%}
                        {%- set result.ts = shift.ts -%}
                        {%- set result.in_window = false -%}
                        {%- set result.shifted = true -%}
                      {%- endif -%}
                    {%- endif -%}
                    {{ {'ts': result.ts, 'source': result.source, 'in_window': result.in_window, 'window_checked': result.window_checked,
                        'why': result.why, 'shifted': result.shifted} }}
              - variables:
                  plan_ts: "{{ plan_result.ts | float(0) }}"
                  plan_details: >-
                    {%- set ts = plan_result.ts | float(0) -%}
                    {%- set items = fc_items -%}
                    {%- set tmin = min_mowing_temperature_c | float(10) -%}
                    {%- set tmax = max_mowing_temperature_c | float(25) -%}
                    {%- set wet = wet_grass_humidity_percent | float(88) -%}
                    {%- set block = forecast_rain_block_mm | float(0.2) -%}
                    {%- set high = high_rain_probability_percent | float(60) -%}
                    {%- set dry_s = (dry_after_rain_hours | float(3)) * 3600 -%}
                    {%- set horizon_s = (forecast_dry_horizon_hours | float(3)) * 3600 -%}
                    {%- set fc = namespace(seen=false, rain=0, prob=0, temp=none, hum=none, bad=false, conf=70, cond='', wet=false, spread=none) -%}
                    {%- set rec = namespace(rain=0, bad=false, heavy=0) -%}
                    {%- set fut = namespace(seen=0, rain=0, prob=0, unsafe=false) -%}
                    {%- for it in items -%}
                      {%- if it.t <= ts -%}
                        {%- if it.t > ts - 3600 -%}
                          {%- set fc.seen = true -%}
                          {%- set fc.rain = it.rain -%}
                          {%- set fc.prob = it.prob -%}
                          {%- set fc.temp = it.temp -%}
                          {%- set fc.hum = it.hum -%}
                          {%- set fc.wet = it.wet -%}
                          {%- set fc.spread = it.spread -%}
                          {%- set fc.bad = it.bad -%}
                          {%- set fc.conf = it.conf -%}
                          {%- set fc.cond = it.cond -%}
                        {%- endif -%}
                        {%- if it.t > ts - dry_s -%}
                          {%- set rec.rain = rec.rain + it.rain -%}
                          {%- if it.bad -%}
                            {%- set rec.bad = true -%}
                          {%- endif -%}
                        {%- endif -%}
                        {%- if it.t > ts - 2 * dry_s -%}
                          {%- set rec.heavy = rec.heavy + it.rain -%}
                        {%- endif -%}
                      {%- elif it.t <= ts + horizon_s -%}
                        {%- set fut.seen = fut.seen + 1 -%}
                        {%- set fut.rain = fut.rain + it.rain -%}
                        {%- if it.prob > fut.prob -%}
                          {%- set fut.prob = it.prob -%}
                        {%- endif -%}
                        {%- if it.bad
                            or (it.temp is not none and (it.temp < tmin or it.temp > tmax))
                            or it.wet -%}
                          {%- set fut.unsafe = true -%}
                        {%- endif -%}
                      {%- endif -%}
                    {%- endfor -%}
                    {%- set rec_wet = rec.rain > block or rec.bad or rec.heavy > (max_rain_24h_mm | float(3)) -%}
                    {%- set safe = fc.seen
                        and fut.seen >= (forecast_min_future_hours | int(2))
                        and (fc.temp is none or (fc.temp >= tmin and fc.temp <= tmax))
                        and not fc.wet
                        and (fc.rain + fut.rain) <= block and not fc.bad
                        and fc.prob <= high and fut.prob <= high
                        and not rec_wet and not fut.unsafe -%}
                    {{ {'seen': fc.seen, 'safe': safe, 'rain': fc.rain, 'fut_rain': fut.rain,
                        'prob': [fc.prob, fut.prob] | max, 'temp': fc.temp, 'hum': fc.hum,
                        'cond': fc.cond, 'conf': fc.conf, 'rec_wet': rec_wet, 'wet': fc.wet,
                        'spread': fc.spread, 'fut_unsafe': fut.unsafe} }}
              - action: input_datetime.set_datetime
                alias: Save the calculated mowing time
                target:
                  entity_id: !input next_mow_helper
                data:
                  timestamp: "{{ plan_ts | float(0) | int }}"
              - variables:
                  plan_is_today: >-
                    {{ ((plan_ts | float(0)) | as_datetime | as_local).date() == now().date() }}
                  plan_label: >-
                    {% set local = (plan_ts | float(0)) | as_datetime | as_local %}
                    {% set days = (local.date() - now().date()).days %}
                    {% set names = {0: 'Monday', 1: 'Tuesday', 2: 'Wednesday', 3: 'Thursday', 4: 'Friday', 5: 'Saturday', 6: 'Sunday'} %}
                    {% if days <= 0 %}today at {{ local.strftime('%H:%M') }}
                    {% elif days == 1 %}tomorrow at {{ local.strftime('%H:%M') }}
                    {% else %}{{ names[local.weekday()] }} {{ local.strftime('%d.%m') }} at {{ local.strftime('%H:%M') }}{% endif %}
                  plan_config_problem: >-
                    {{ mowing_window_preset == 'night' and not (fiatlux_installed | bool) }}
                  plan_confirmed: >-
                    {{ plan_details.seen and plan_details.safe and (plan_config_problem | string | lower) != 'true' }}
                  plan_heading: >-
                    {% if (plan_confirmed | string | lower) == 'true' %}
                      Mowing time: {{ plan_label | trim }}
                    {% else %}
                      Next check: {{ plan_label | trim }}
                    {% endif %}
                  plan_reason: >-
                    {% set d = plan_details %}
                    {% set bad = ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'snowy', 'hail'] %}
                    {% set tmin = min_mowing_temperature_c | float(10) %}
                    {% set tmax = max_mowing_temperature_c | float(25) %}
                    {% if (plan_confirmed | string | lower) == 'true' %}
                      {{ '' }}
                    {% elif (plan_config_problem | string | lower) == 'true' %}
                      change the mowing window or confirm the FiatLux accessory in the automation settings
                    {% elif (forecast_available | string | lower) != 'true' or planning_mode != 'auto' %}
                      without an hourly forecast, conditions can only be checked at start time
                    {% elif fc_items | length == 0 %}
                      the weather forecast is temporarily unavailable, so conditions will be checked at start time
                    {% elif not d.seen and (plan_constraint | trim) == 'growth' %}
                      grass will reach the mowing threshold around {{ ((growth_ready_ts | float(0)) | as_datetime | as_local).strftime('%d.%m') }}, and the forecast does not reach that day yet
                    {% elif not d.seen %}
                      the forecast for the next few days has no dry slot; conditions will be re-evaluated once the forecast covers that day
                    {% elif (d.rain + d.fut_rain) > (forecast_rain_block_mm | float(0.2)) or d.cond in bad %}
                      the forecast predicts rain during mowing, and there is no better time in the next few days
                    {% elif d.prob > (high_rain_probability_percent | float(60)) %}
                      high risk of rain ({{ d.prob | round(0) | int }}%), and there is no better time in the next few days
                    {% elif d.rec_wet %}
                      the grass may still be wet after rain, and there is no better time in the next few days
                    {% elif d.wet and d.spread is not none %}
                      in the forecast the air is only {{ d.spread | round(1) | string | replace('.', '.') }} °C warmer than the dew point (humidity {{ (d.hum | round(0) | int) if d.hum is not none else '?' }}%), so the grass may still be wet from dew
                    {% elif d.wet %}
                      high air humidity ({{ (d.hum | round(0) | int) if d.hum is not none else '?' }}%), so the grass may be wet from dew
                    {% elif d.temp is not none and (d.temp < tmin or d.temp > tmax) %}
                      forecast temperature {{ d.temp | round(0) | int }} °C is outside the allowed range {{ tmin | int }}–{{ tmax | int }} °C
                    {% else %}
                      the forecast does not confirm good conditions for the whole mowing time
                    {% endif %}
                  plan_window_note: >-
                    {% set r = plan_result %}
                    {% set window = (primary_start_time_value | trim)[:5] ~ '–' ~ (backup_start_time_value | trim)[:5] %}
                    {% set names = {'rain': 'rain', 'wet_after_rain': 'wet grass after rain',
                                    'dew': 'dew', 'temperature': 'temperature out of range ' ~ (min_mowing_temperature_c | int) ~ '–' ~ (max_mowing_temperature_c | int) ~ ' °C',
                                    'data': 'forecast too short', 'later': 'weather getting worse during mowing'} %}
                    {% if (plan_confirmed | string | lower) != 'true' or r.in_window or planning_mode != 'auto' or r.source != 'forecast' %}
                      {{ '' }}
                    {% elif r.shifted %}
                      outside the {{ window }} window, because mowing is allowed only on selected days or in daylight
                    {% elif r.window_checked and (r.why | length) > 0 %}
                      {% set labels = namespace(items=[]) %}
                      {% for key in r.why %}{% set labels.items = labels.items + [names.get(key, key)] %}{% endfor %}
                      outside the {{ window }} window, because in the window the forecast shows: {{ labels.items | join(', ') }}
                    {% elif (plan_constraint | trim) == 'growth' %}
                      outside the {{ window }} window, because the grass reaches the mowing threshold only after the window
                    {% elif (plan_constraint | trim) == 'gap' %}
                      outside the {{ window }} window, because the minimum gap since the last mowing ends after the window
                    {% elif (plan_constraint | trim) == 'drying' %}
                      outside the {{ window }} window, because the grass takes longer to dry after rain than the window lasts
                    {% else %}
                      outside the {{ window }} window, because the window for today has already passed or has no safe time
                    {% endif %}
                  plan_forecast_line: >-
                    {% set d = plan_details %}
                    {% set names = {
                      'clear-night': 'clear',
                      'cloudy': 'cloudy',
                      'exceptional': 'exceptional conditions',
                      'fog': 'fog',
                      'hail': 'hail',
                      'lightning': 'thunderstorms',
                      'lightning-rainy': 'thunderstorms with rain',
                      'partlycloudy': 'partly cloudy',
                      'pouring': 'heavy rain',
                      'rainy': 'rain',
                      'snowy': 'snow',
                      'snowy-rainy': 'sleet',
                      'sunny': 'sunny',
                      'windy': 'windy',
                      'windy-variant': 'windy'
                    } %}
                    {% if d.seen %}
                      {% set parts = namespace(items=[]) %}
                      {% if d.cond %}{% set parts.items = parts.items + [names.get(d.cond, d.cond)] %}{% endif %}
                      {% if d.temp is not none %}{% set parts.items = parts.items + [(d.temp | round(0) | int) ~ ' °C'] %}{% endif %}
                      {% set rain_total = d.rain + d.fut_rain %}
                      {% if rain_total > (forecast_rain_block_mm | float(0.2)) %}
                        {% set parts.items = parts.items + ['rain ' ~ (rain_total | round(1) | string | replace('.', '.')) ~ ' mm'] %}
                      {% else %}
                        {% set parts.items = parts.items + ['no rain'] %}
                      {% endif %}
                      {% if d.prob >= 30 %}{% set parts.items = parts.items + ['rain risk ' ~ (d.prob | round(0) | int) ~ '%'] %}{% endif %}
                      {% if d.hum is not none %}{% set parts.items = parts.items + ['humidity ' ~ (d.hum | round(0) | int) ~ '%'] %}{% endif %}
                      {{ parts.items | join(', ') }}
                    {% else %}
                      {{ '' }}
                    {% endif %}
                  plan_summary: |-
                    {{ plan_heading | trim }}
                    {% if (plan_reason | trim | length) > 0 %}Reason: {{ plan_reason | trim }}.
                    {% endif %}{% if (plan_window_note | trim | length) > 0 %}Time {{ plan_window_note | trim }}.
                    {% endif %}{% if (plan_forecast_line | trim | length) > 0 %}Forecast: {{ plan_forecast_line | trim }}.{% endif %}
                  growth_line: >-
                    Grass: {{ plan_growth_mm | float(0) | round(1) | string | replace('.', '.') }} mm (mowing threshold {{ growth_threshold_mm | float(3) | round(1) | string | replace('.', '.') }} mm)
              - choose:
                  - conditions:
                      - condition: template
                        value_template: "{{ plan_kind == 'daily' }}"
                    sequence:
                      - variables:
                          tytul: "Worx: mowing plan"
                          tresc: |-
                            {{ plan_summary | trim }}
                            {{ growth_line | trim }}, grew {{ growth_daily_mm | float(0) | round(1) | string | replace('.', '.') }} mm today.
                      - action: persistent_notification.create
                        data:
                          notification_id: "{{ notification_id }}"
                          title: "{{ tytul }}"
                          message: "{{ tresc }}"
                      - if:
                          - condition: template
                            value_template: "{{ notify_daily_plan }}"
                        then:
                          - sequence: !input notify_actions
                  - conditions:
                      - condition: template
                        value_template: "{{ plan_kind == 'blocked' }}"
                    sequence:
                      - variables:
                          tytul: "Worx: mowing postponed"
                          tresc: |-
                            Mowing planned for {{ plan_event.get('planned_label', '') }} was not started.
                            Cause: {{ plan_event.get('reason', '') }}.

                            {{ plan_summary | trim }}
                      - action: persistent_notification.create
                        data:
                          notification_id: "{{ notification_id }}"
                          title: "{{ tytul }}"
                          message: "{{ tresc }}"
                      - sequence: !input notify_actions
                  - conditions:
                      - condition: template
                        value_template: "{{ plan_kind == 'interrupted' }}"
                    sequence:
                      - variables:
                          tytul: "Worx: mowing interrupted"
                          tresc: |-
                            Mowing started on {{ plan_event.get('started_at', '') }} was interrupted on {{ plan_event.get('finished_at', '') }}.
                            Cause: {{ plan_event.get('reason', '') }}.{% if (plan_event.get('growth_note', '') | length) > 0 %}
                            {{ plan_event.get('growth_note') }}{% endif %}

                            {{ plan_summary | trim }}
                      - action: persistent_notification.create
                        data:
                          notification_id: "{{ notification_id }}"
                          title: "{{ tytul }}"
                          message: "{{ tresc }}"
                      - sequence: !input notify_actions
                  - conditions:
                      - condition: template
                        value_template: "{{ plan_kind in ['completed', 'manual_completed'] }}"
                    sequence:
                      - variables:
                          tytul: >-
                            {{ 'Worx: manual mowing finished' if plan_kind == 'manual_completed' else 'Worx: mowing finished' }}
                          tresc: |-
                            Mowing ran from {{ plan_event.get('started_at', '') }} to {{ plan_event.get('finished_at', '') }} ({{ plan_event.get('duration_label', '') }} including charging).

                            {{ plan_summary | trim }}
                      - action: persistent_notification.create
                        data:
                          notification_id: "{{ notification_id }}"
                          title: "{{ tytul }}"
                          message: "{{ tresc }}"
                      - sequence: !input notify_actions
      - alias: Recalculate growth and plan mowing (without forecast)
        conditions:
          - condition: template
            value_template: "{{ trigger.id in ['update_growth', 'replan'] }}"
        sequence:
          - sequence: *plan_sequence
      - alias: Start the planned mowing cycle
        conditions:
          - condition: template
            value_template: >-
              {% set planned = state_attr(next_mow_helper, 'timestamp') | float(0) %}
              {% set diff = as_timestamp(now()) - planned %}
              {% set grace = (missed_start_grace_minutes | int(30)) * 60 %}
              {{ trigger.id in ['start_scheduled', 'start_due_check']
                 and (cycle_running | string | lower) != 'true'
                 and planned > 0
                 and ((trigger.id == 'start_scheduled' and diff >= -60 and diff <= grace)
                      or (trigger.id == 'start_due_check' and diff >= 60 and diff <= grace)) }}
        sequence:
          - variables:
              planned_start_label: >-
                {% set local = (state_attr(next_mow_helper, 'timestamp') | float(0)) | as_datetime | as_local %}
                {% set days = (local.date() - now().date()).days %}
                {{ {0: 'today', 1: 'tomorrow', -1: 'yesterday'}.get(days, local.strftime('%d.%m')) ~ ' at ' ~ local.strftime('%H:%M') }}
          - if:
              - condition: template
                alias: Mowing start is blocked
                value_template: "{{ (start_block_reason | trim | length) > 0 }}"
            then:
              - event: worx_smart_mowing_replan
                event_data:
                  mower_entity: "{{ mower_entity }}"
                  kind: blocked
                  reason: "{{ start_block_reason | trim }}"
                  planned_label: "{{ planned_start_label | trim }}"
                  min_delay_minutes: "{{ start_block_delay_minutes | int(60) }}"
              - stop: Mowing conditions are not met; a new time has been set.
          - variables:
              mowing_cycle_started_at: "{{ now().strftime('%d.%m at %H:%M') }}"
              mowing_cycle_started_ts: "{{ as_timestamp(now()) }}"
          - action: worx_vision_cloud.start_one_time_mowing
            alias: Start the edge cut only
            data:
              entity_id: !input mower_entity
              runtime: 0
              edge_cut: true
              zones: []
          - alias: Wait for confirmation that the mower left for the edge cut
            repeat:
              while:
                - condition: template
                  value_template: >-
                    {{ states(mower_entity) in ['docked', 'paused']
                       and (
                         (states(rain_binary_sensor) not in ['unknown', 'unavailable', 'none', '']
                          and not is_state(rain_binary_sensor, 'on'))
                         or
                         (states(rain_binary_sensor) in ['unknown', 'unavailable', 'none', '']
                          and (state_attr(forecast_weather_entity | trim, 'rain_rate') | float(0)) <= 0.05
                          and states(forecast_weather_entity | trim) not in ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'hail'])
                       )
                       and state_attr(mower_entity, 'rain_delay') != true
                       and repeat.index <= ((mowing_start_confirm_timeout_minutes | int(5)) * 6) }}
              sequence:
                - delay: "00:00:10"
          - if:
              - condition: template
                value_template: >-
                  {{ (states(rain_binary_sensor) not in ['unknown', 'unavailable', 'none', '']
                      and is_state(rain_binary_sensor, 'on'))
                     or
                     (states(rain_binary_sensor) in ['unknown', 'unavailable', 'none', '']
                      and ((state_attr(forecast_weather_entity | trim, 'rain_rate') | float(0)) > 0.05
                           or states(forecast_weather_entity | trim) in ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'hail']))
                     or state_attr(mower_entity, 'rain_delay') == true }}
            then:
              - action: lawn_mower.dock
                continue_on_error: true
                target:
                  entity_id: !input mower_entity
              - event: worx_smart_mowing_replan
                event_data:
                  mower_entity: "{{ mower_entity }}"
                  kind: blocked
                  reason: rain or rain delay at the start of the edge cut
                  planned_label: "{{ planned_start_label | trim }}"
                  min_delay_minutes: 0
              - stop: Edge cut interrupted by rain.
          - if:
              - condition: template
                value_template: "{{ states(mower_entity) in ['docked', 'paused'] }}"
            then:
              - action: worx_vision_cloud.start_one_time_mowing
                alias: Retry the edge cut only
                data:
                  entity_id: !input mower_entity
                  runtime: 0
                  edge_cut: true
                  zones: []
              - alias: Wait for confirmation of the second edge cut start
                repeat:
                  while:
                    - condition: template
                      value_template: >-
                        {{ states(mower_entity) in ['docked', 'paused']
                           and (
                             (states(rain_binary_sensor) not in ['unknown', 'unavailable', 'none', '']
                              and not is_state(rain_binary_sensor, 'on'))
                             or
                             (states(rain_binary_sensor) in ['unknown', 'unavailable', 'none', '']
                              and (state_attr(forecast_weather_entity | trim, 'rain_rate') | float(0)) <= 0.05
                              and states(forecast_weather_entity | trim) not in ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'hail'])
                           )
                           and state_attr(mower_entity, 'rain_delay') != true
                           and repeat.index <= ((mowing_start_confirm_timeout_minutes | int(5)) * 6) }}
                  sequence:
                    - delay: "00:00:10"
          - if:
              - condition: template
                value_template: >-
                  {{ (states(rain_binary_sensor) not in ['unknown', 'unavailable', 'none', '']
                      and is_state(rain_binary_sensor, 'on'))
                     or
                     (states(rain_binary_sensor) in ['unknown', 'unavailable', 'none', '']
                      and ((state_attr(forecast_weather_entity | trim, 'rain_rate') | float(0)) > 0.05
                           or states(forecast_weather_entity | trim) in ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'hail']))
                     or state_attr(mower_entity, 'rain_delay') == true }}
            then:
              - action: lawn_mower.dock
                continue_on_error: true
                target:
                  entity_id: !input mower_entity
              - event: worx_smart_mowing_replan
                event_data:
                  mower_entity: "{{ mower_entity }}"
                  kind: blocked
                  reason: rain or rain delay during the edge cut restart
                  planned_label: "{{ planned_start_label | trim }}"
                  min_delay_minutes: 0
              - stop: Edge cut interrupted by rain after the retry.
          - if:
              - condition: template
                value_template: "{{ states(mower_entity) in ['docked', 'paused', 'unavailable', 'unknown'] }}"
            then:
              - event: worx_smart_mowing_replan
                event_data:
                  mower_entity: "{{ mower_entity }}"
                  kind: blocked
                  reason: >-
                    mower did not leave for the edge cut despite two commands (state: {{ mower_state_names.get(states(mower_entity), states(mower_entity)) }})
                  planned_label: "{{ planned_start_label | trim }}"
                  min_delay_minutes: 30
              - stop: Edge cut start not confirmed after two attempts.
          - variables:
              tytul: "Worx: mowing started"
              tresc: |-
                Mowing started on {{ mowing_cycle_started_at }}.
                The mower will first cut the edges, then charge the battery to {{ post_edge_battery_percent }}% and mow the whole lawn.
          - action: persistent_notification.create
            data:
              notification_id: "{{ notification_id }}"
              title: "{{ tytul }}"
              message: "{{ tresc }}"
          - sequence: !input notify_actions
          - sequence: &after_edges_cycle
              - wait_template: >-
                  {{ (states(rain_binary_sensor) not in ['unknown', 'unavailable', 'none', '']
                      and is_state(rain_binary_sensor, 'on'))
                     or
                     (states(rain_binary_sensor) in ['unknown', 'unavailable', 'none', '']
                      and ((state_attr(forecast_weather_entity | trim, 'rain_rate') | float(0)) > 0.05
                           or states(forecast_weather_entity | trim) in ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'hail']))
                     or state_attr(mower_entity, 'rain_delay') == true
                     or is_state(mower_entity, 'docked')
                     or (is_state(mower_entity, 'error') and (as_timestamp(now()) - as_timestamp(states[mower_entity].last_changed)) >= (mower_fault_minutes | int(5)) * 60)
                     or (garden_check_enabled and garden_sensors | select('is_state', 'on') | list | length > 0) }}
                alias: Wait for the edge cut to finish and the mower to return to the dock
                timeout: "02:00:00"
                continue_on_timeout: true
              - if:
                  - condition: template
                    value_template: >-
                      {{ ((states(rain_binary_sensor) not in ['unknown', 'unavailable', 'none', '']
                           and not is_state(rain_binary_sensor, 'on'))
                          or
                          (states(rain_binary_sensor) in ['unknown', 'unavailable', 'none', '']
                           and (state_attr(forecast_weather_entity | trim, 'rain_rate') | float(0)) <= 0.05
                           and states(forecast_weather_entity | trim) not in ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'hail']))
                         and state_attr(mower_entity, 'rain_delay') != true
                         and not (is_state(mower_entity, 'error') and (as_timestamp(now()) - as_timestamp(states[mower_entity].last_changed)) >= (mower_fault_minutes | int(5)) * 60) }}
                then:
                  - delay: "00:01:00"
                    alias: Stabilize the dock confirmation after the edge cut
                  - wait_template: >-
                      {{ (states(rain_binary_sensor) not in ['unknown', 'unavailable', 'none', '']
                          and is_state(rain_binary_sensor, 'on'))
                         or
                         (states(rain_binary_sensor) in ['unknown', 'unavailable', 'none', '']
                          and ((state_attr(forecast_weather_entity | trim, 'rain_rate') | float(0)) > 0.05
                               or states(forecast_weather_entity | trim) in ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'hail']))
                         or state_attr(mower_entity, 'rain_delay') == true
                         or is_state(mower_entity, 'docked') }}
                    alias: Confirm a stable return to the dock after the edge cut
                    timeout: "00:02:00"
                    continue_on_timeout: true
              - choose:
                  - conditions:
                      - condition: template
                        alias: Someone entered the garden during the edge cut
                        value_template: "{{ (garden_check_enabled and garden_sensors | length > 0 and (garden_sensors | select('is_state', 'on') | list | length > 0 or garden_sensors | expand | selectattr('state', 'eq', 'off') | selectattr('last_changed', 'gt', now() - timedelta(minutes=5)) | list | length > 0)) }}"
                    sequence:
                      - if:
                          - condition: template
                            value_template: "{{ states(mower_entity) not in ['docked', 'unavailable', 'unknown', 'error'] }}"
                        then:
                          - action: lawn_mower.dock
                            continue_on_error: true
                            target:
                              entity_id: !input mower_entity
                      - event: worx_smart_mowing_replan
                        event_data:
                          mower_entity: "{{ mower_entity }}"
                          kind: interrupted
                          reason: someone entered the garden during the edge cut
                          started_at: "{{ mowing_cycle_started_at }}"
                          finished_at: "{{ now().strftime('%d.%m at %H:%M') }}"
                          min_delay_minutes: 30
                      - stop: Someone entered the garden during the edge cut.
                  - conditions:
                      - condition: template
                        value_template: >-
                          {{ (states(rain_binary_sensor) not in ['unknown', 'unavailable', 'none', '']
                              and is_state(rain_binary_sensor, 'on'))
                             or
                             (states(rain_binary_sensor) in ['unknown', 'unavailable', 'none', '']
                              and ((state_attr(forecast_weather_entity | trim, 'rain_rate') | float(0)) > 0.05
                                   or states(forecast_weather_entity | trim) in ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'hail']))
                             or state_attr(mower_entity, 'rain_delay') == true }}
                    sequence:
                      - if:
                          - condition: template
                            value_template: "{{ states(mower_entity) not in ['docked', 'unavailable', 'unknown', 'error'] }}"
                        then:
                          - action: lawn_mower.dock
                            continue_on_error: true
                            target:
                              entity_id: !input mower_entity
                      - event: worx_smart_mowing_replan
                        event_data:
                          mower_entity: "{{ mower_entity }}"
                          kind: interrupted
                          reason: rain interrupted the edge cut
                          started_at: "{{ mowing_cycle_started_at }}"
                          finished_at: "{{ now().strftime('%d.%m at %H:%M') }}"
                          min_delay_minutes: 0
                      - stop: Rain interrupted the edge cut stage.
                  - conditions:
                      - condition: template
                        value_template: "{{ is_state(mower_entity, 'error') }}"
                    sequence:
                      - event: worx_smart_mowing_replan
                        event_data:
                          mower_entity: "{{ mower_entity }}"
                          kind: interrupted
                          reason: >-
                            {% set raw = state_attr(mower_entity, 'error_description') | default('', true) | string %}{% set raw = '' if raw | lower in ['no error', 'unknown', 'none'] else raw %}mower reported an error{% if raw %}: {{ mower_error_names.get(raw | lower, raw) }} ({{ raw }}){% endif %}. Check the mower on the lawn
                          started_at: "{{ mowing_cycle_started_at }}"
                          finished_at: "{{ now().strftime('%d.%m at %H:%M') }}"
                          min_delay_minutes: 120
                      - stop: Mower reported an error during the edge cut.
                  - conditions:
                      - condition: template
                        value_template: "{{ not is_state(mower_entity, 'docked') }}"
                    sequence:
                      - if:
                          - condition: template
                            value_template: "{{ states(mower_entity) not in ['unavailable', 'unknown'] }}"
                        then:
                          - action: lawn_mower.dock
                            continue_on_error: true
                            target:
                              entity_id: !input mower_entity
                      - event: worx_smart_mowing_replan
                        event_data:
                          mower_entity: "{{ mower_entity }}"
                          kind: interrupted
                          reason: Worx Cloud did not confirm that the mower returned to the dock after the edge cut
                          started_at: "{{ mowing_cycle_started_at }}"
                          finished_at: "{{ now().strftime('%d.%m at %H:%M') }}"
                          min_delay_minutes: 30
                      - stop: Worx Cloud did not confirm the return to the dock after the edge cut.
              - wait_template: >-
                  {{ (states(rain_binary_sensor) not in ['unknown', 'unavailable', 'none', '']
                      and is_state(rain_binary_sensor, 'on'))
                     or
                     (states(rain_binary_sensor) in ['unknown', 'unavailable', 'none', '']
                      and ((state_attr(forecast_weather_entity | trim, 'rain_rate') | float(0)) > 0.05
                           or states(forecast_weather_entity | trim) in ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'hail']))
                     or state_attr(mower_entity, 'rain_delay') == true
                     or not is_state(mower_entity, 'docked')
                     or (states(battery_sensor) | float(0)) >= (post_edge_battery_percent | float(80)) }}
                alias: Wait at the dock for the battery to charge before normal mowing
                timeout: "08:00:00"
                continue_on_timeout: true
              - choose:
                  - conditions:
                      - condition: template
                        value_template: >-
                          {{ (states(rain_binary_sensor) not in ['unknown', 'unavailable', 'none', '']
                              and is_state(rain_binary_sensor, 'on'))
                             or
                             (states(rain_binary_sensor) in ['unknown', 'unavailable', 'none', '']
                              and ((state_attr(forecast_weather_entity | trim, 'rain_rate') | float(0)) > 0.05
                                   or states(forecast_weather_entity | trim) in ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'hail']))
                             or state_attr(mower_entity, 'rain_delay') == true }}
                    sequence:
                      - event: worx_smart_mowing_replan
                        event_data:
                          mower_entity: "{{ mower_entity }}"
                          kind: interrupted
                          reason: after the edge cut, it started raining while charging
                          started_at: "{{ mowing_cycle_started_at }}"
                          finished_at: "{{ now().strftime('%d.%m at %H:%M') }}"
                          min_delay_minutes: 0
                      - stop: It started raining after the edge cut.
                  - conditions:
                      - condition: template
                        value_template: "{{ not is_state(mower_entity, 'docked') }}"
                    sequence:
                      - event: worx_smart_mowing_replan
                        event_data:
                          mower_entity: "{{ mower_entity }}"
                          kind: interrupted
                          reason: >-
                            {% if is_state(mower_entity, 'error') %}{% set raw = state_attr(mower_entity, 'error_description') | default('', true) | string %}{% set raw = '' if raw | lower in ['no error', 'unknown', 'none'] else raw %}mower reported an error{% if raw %}: {{ mower_error_names.get(raw | lower, raw) }} ({{ raw }}){% endif %}. Check the mower on the lawn{% else %}mower left the dock while charging after the edge cut (state: {{ mower_state_names.get(states(mower_entity), states(mower_entity)) }}){% endif %}
                          started_at: "{{ mowing_cycle_started_at }}"
                          finished_at: "{{ now().strftime('%d.%m at %H:%M') }}"
                          min_delay_minutes: 30
                      - stop: Mower left the dock while charging after the edge cut.
                  - conditions:
                      - condition: template
                        value_template: >-
                          {{ (states(battery_sensor) | float(0)) < (post_edge_battery_percent | float(80)) }}
                    sequence:
                      - event: worx_smart_mowing_replan
                        event_data:
                          mower_entity: "{{ mower_entity }}"
                          kind: interrupted
                          reason: >-
                            battery did not charge to {{ post_edge_battery_percent }}% within 8 hours (currently {{ states(battery_sensor) }}%)
                          started_at: "{{ mowing_cycle_started_at }}"
                          finished_at: "{{ now().strftime('%d.%m at %H:%M') }}"
                          min_delay_minutes: 60
                      - stop: Battery did not charge to the required level after the edge cut.
              - variables:
                  temperature_after_edges_available: >-
                    {% if temperature_source_entity.split('.')[0] == 'weather' %}
                      {{ state_attr(temperature_source_entity, 'temperature') is not none }}
                    {% else %}
                      {{ states(temperature_source_entity) not in ['unknown', 'unavailable', 'none', ''] }}
                    {% endif %}
                  temperature_after_edges_c: >-
                    {% if temperature_source_entity.split('.')[0] == 'weather' %}
                      {{ state_attr(temperature_source_entity, 'temperature') | float(-99) }}
                    {% else %}
                      {{ states(temperature_source_entity) | float(-99) }}
                    {% endif %}
                  humidity_after_edges: >-
                    {% set selected_humidity = outdoor_humidity_sensor | default('', true) %}
                    {% if selected_humidity | length > 0 and states(selected_humidity) not in ['unknown', 'unavailable', 'none', ''] %}
                      {{ states(selected_humidity) | float(-1) }}
                    {% elif (forecast_weather_entity | trim | length) > 0 and state_attr(forecast_weather_entity | trim, 'humidity') is not none %}
                      {{ state_attr(forecast_weather_entity | trim, 'humidity') | float(-1) }}
                    {% else %}
                      -1
                    {% endif %}
              - variables:
                  spread_after_edges: >-
                    {% set t = temperature_after_edges_c | float(-99) %}
                    {% set rh = humidity_after_edges | float(-1) %}
                    {% if t > -90 and rh > 0 %}
                      {% set g = (([rh, 100] | min) / 100) | log + 17.62 * t / (243.12 + t) %}
                      {{ (t - 243.12 * g / (17.62 - g)) | round(1) }}
                    {% else %}
                      99
                    {% endif %}
              - variables:
                  post_edge_block_code: >-
                    {% if (temperature_after_edges_available | string | lower) != 'true' %}sensor
                    {% elif (temperature_after_edges_c | float(-99)) < (min_mowing_temperature_c | float(10))
                          or (temperature_after_edges_c | float(-99)) > (max_mowing_temperature_c | float(25)) %}temperature
                    {% elif states(rain_binary_sensor) in ['unknown', 'unavailable', 'none', '']
                          and (smart_weather_rain_rate_available | string | lower) != 'true' %}sensor
                    {% elif state_attr(mower_entity, 'rain_delay') == true %}rain_delay
                    {% elif (states(rain_binary_sensor) not in ['unknown', 'unavailable', 'none', '']
                               and is_state(rain_binary_sensor, 'on'))
                          or
                          (states(rain_binary_sensor) in ['unknown', 'unavailable', 'none', '']
                           and ((state_attr(forecast_weather_entity | trim, 'rain_rate') | float(0)) > 0.05
                                or states(forecast_weather_entity | trim) in ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'hail'])) %}rain
                    {% elif (spread_after_edges | float(99)) < (min_dew_point_spread_c | float(2.5)) %}humidity
                    {% elif (garden_check_enabled and garden_sensors | length > 0 and (garden_sensors | select('is_state', 'on') | list | length > 0 or garden_sensors | expand | selectattr('state', 'eq', 'off') | selectattr('last_changed', 'gt', now() - timedelta(minutes=5)) | list | length > 0)) %}garden
                    {% elif not is_state(mower_entity, 'docked')
                          or (states(battery_sensor) | float(0)) < (post_edge_battery_percent | float(80)) %}mower
                    {% else %}{{ '' }}{% endif %}
              - variables:
                  post_edge_block_reason: >-
                    {% set code = post_edge_block_code | trim %}
                    {% if code == 'sensor' and (temperature_after_edges_available | string | lower) != 'true' %}
                      after the edge cut, cannot read the current outdoor temperature
                    {% elif code == 'sensor' %}
                      after the edge cut, cannot read the current rain state from either the sensor or MeteoFusion HA
                    {% elif code == 'temperature' and (temperature_after_edges_c | float(-99)) < (min_mowing_temperature_c | float(10)) %}
                      after the edge cut the temperature dropped to {{ temperature_after_edges_c | float | round(0) | int }} °C, and the minimum for mowing is {{ min_mowing_temperature_c | int }} °C
                    {% elif code == 'temperature' %}
                      after the edge cut the temperature rose to {{ temperature_after_edges_c | float | round(0) | int }} °C, and the maximum for mowing is {{ max_mowing_temperature_c | int }} °C
                    {% elif code == 'rain_delay' %}
                      after the edge cut, Worx Cloud still reports a rain delay
                    {% elif code == 'rain' %}
                      after the edge cut, local measurement or MeteoFusion HA shows ongoing rain
                    {% elif code == 'humidity' %}
                      after the edge cut the air is only {{ spread_after_edges | float(0) | round(1) | string | replace('.', '.') }} °C warmer than the dew point (humidity {{ humidity_after_edges | float | round(0) | int }}%), so the grass is still wet
                    {% elif code == 'garden' %}
                      someone is in the garden
                    {% elif code == 'mower' %}
                      before normal mowing the mower is not docked or the battery is below {{ post_edge_battery_percent }}% (state: {{ mower_state_names.get(states(mower_entity), states(mower_entity)) }}, battery {{ states(battery_sensor) }}%)
                    {% else %}
                      {{ '' }}
                    {% endif %}
                  post_edge_block_delay_minutes: >-
                    {% set code = post_edge_block_code | trim %}
                    {% set with_forecast = (forecast_available | string | lower) == 'true' and planning_mode == 'auto' %}
                    {{ {'sensor': 60, 'temperature': 30 if with_forecast else 60, 'rain_delay': 60, 'rain': 0, 'humidity': 60, 'garden': 30, 'mower': 30}.get(code, 30) }}
              - if:
                  - condition: template
                    value_template: "{{ (post_edge_block_code | trim | length) > 0 }}"
                then:
                  - event: worx_smart_mowing_replan
                    event_data:
                      mower_entity: "{{ mower_entity }}"
                      kind: interrupted
                      reason: "{{ post_edge_block_reason | trim }}"
                      started_at: "{{ mowing_cycle_started_at }}"
                      finished_at: "{{ now().strftime('%d.%m at %H:%M') }}"
                      min_delay_minutes: "{{ post_edge_block_delay_minutes | int(30) }}"
                  - stop: Conditions after the edge cut do not allow normal mowing to start.
              - action: worx_vision_cloud.start_one_time_mowing
                alias: Start normal one-time mowing
                data:
                  entity_id: !input mower_entity
                  runtime: "{{ normal_mowing_command_runtime_minutes }}"
                  edge_cut: false
                  zones: []
              - alias: Wait for confirmation that the mower left to mow
                repeat:
                  while:
                    - condition: template
                      value_template: >-
                        {{ states(mower_entity) in ['docked', 'paused']
                           and (
                             (states(rain_binary_sensor) not in ['unknown', 'unavailable', 'none', '']
                              and not is_state(rain_binary_sensor, 'on'))
                             or
                             (states(rain_binary_sensor) in ['unknown', 'unavailable', 'none', '']
                              and (state_attr(forecast_weather_entity | trim, 'rain_rate') | float(0)) <= 0.05
                              and states(forecast_weather_entity | trim) not in ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'hail'])
                           )
                           and state_attr(mower_entity, 'rain_delay') != true
                           and repeat.index <= ((mowing_start_confirm_timeout_minutes | int(5)) * 6) }}
                  sequence:
                    - delay: "00:00:10"
              - if:
                  - condition: template
                    value_template: >-
                      {{ (states(rain_binary_sensor) not in ['unknown', 'unavailable', 'none', '']
                          and is_state(rain_binary_sensor, 'on'))
                         or
                         (states(rain_binary_sensor) in ['unknown', 'unavailable', 'none', '']
                          and ((state_attr(forecast_weather_entity | trim, 'rain_rate') | float(0)) > 0.05
                               or states(forecast_weather_entity | trim) in ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'hail']))
                         or state_attr(mower_entity, 'rain_delay') == true }}
                then:
                  - action: lawn_mower.dock
                    continue_on_error: true
                    target:
                      entity_id: !input mower_entity
                  - event: worx_smart_mowing_replan
                    event_data:
                      mower_entity: "{{ mower_entity }}"
                      kind: interrupted
                      reason: rain right before the mowing start
                      started_at: "{{ mowing_cycle_started_at }}"
                      finished_at: "{{ now().strftime('%d.%m at %H:%M') }}"
                      min_delay_minutes: 0
                  - stop: Mowing start interrupted by rain.
              - if:
                  - condition: template
                    value_template: "{{ states(mower_entity) in ['docked', 'paused'] }}"
                then:
                  - action: worx_vision_cloud.start_one_time_mowing
                    alias: Retry normal one-time mowing
                    data:
                      entity_id: !input mower_entity
                      runtime: "{{ normal_mowing_command_runtime_minutes }}"
                      edge_cut: false
                      zones: []
                  - alias: Wait for confirmation of the second mowing start
                    repeat:
                      while:
                        - condition: template
                          value_template: >-
                            {{ states(mower_entity) in ['docked', 'paused']
                               and (
                                 (states(rain_binary_sensor) not in ['unknown', 'unavailable', 'none', '']
                                  and not is_state(rain_binary_sensor, 'on'))
                                 or
                                 (states(rain_binary_sensor) in ['unknown', 'unavailable', 'none', '']
                                  and (state_attr(forecast_weather_entity | trim, 'rain_rate') | float(0)) <= 0.05
                                  and states(forecast_weather_entity | trim) not in ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'hail'])
                               )
                               and state_attr(mower_entity, 'rain_delay') != true
                               and repeat.index <= ((mowing_start_confirm_timeout_minutes | int(5)) * 6) }}
                      sequence:
                        - delay: "00:00:10"
              - if:
                  - condition: template
                    value_template: >-
                      {{ (states(rain_binary_sensor) not in ['unknown', 'unavailable', 'none', '']
                          and is_state(rain_binary_sensor, 'on'))
                         or
                         (states(rain_binary_sensor) in ['unknown', 'unavailable', 'none', '']
                          and ((state_attr(forecast_weather_entity | trim, 'rain_rate') | float(0)) > 0.05
                               or states(forecast_weather_entity | trim) in ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'hail']))
                         or state_attr(mower_entity, 'rain_delay') == true }}
                then:
                  - action: lawn_mower.dock
                    continue_on_error: true
                    target:
                      entity_id: !input mower_entity
                  - event: worx_smart_mowing_replan
                    event_data:
                      mower_entity: "{{ mower_entity }}"
                      kind: interrupted
                      reason: rain during the mowing restart
                      started_at: "{{ mowing_cycle_started_at }}"
                      finished_at: "{{ now().strftime('%d.%m at %H:%M') }}"
                      min_delay_minutes: 0
                  - stop: Mowing start interrupted by rain after the retry.
              - if:
                  - condition: template
                    value_template: "{{ states(mower_entity) in ['docked', 'paused', 'unavailable', 'unknown'] }}"
                then:
                  - event: worx_smart_mowing_replan
                    event_data:
                      mower_entity: "{{ mower_entity }}"
                      kind: interrupted
                      reason: >-
                        mower did not start mowing despite two commands (state: {{ mower_state_names.get(states(mower_entity), states(mower_entity)) }})
                      started_at: "{{ mowing_cycle_started_at }}"
                      finished_at: "{{ now().strftime('%d.%m at %H:%M') }}"
                      min_delay_minutes: 30
                  - stop: Mowing start not confirmed after two attempts.
              - sequence: &normal_mowing_cycle
                  - variables:
                      aborted_by_error: false
                      aborted_error_text: ""
                  - alias: Mow until the mower returns or the safety limit is reached
                    repeat:
                      while:
                        - condition: template
                          value_template: >-
                            {% set mower_changed_ts = as_timestamp(states[mower_entity].last_changed) %}
                            {% set battery_changed_ts = as_timestamp(states[battery_sensor].last_changed) %}
                            {% set stable_since_ts = [mower_changed_ts, battery_changed_ts] | max %}
                            {% set vision_complete = is_state(mower_entity, 'docked')
                                and (states(battery_sensor) | float(0)) >= (vision_completion_battery_percent | float(95))
                                and state_attr(mower_entity, 'rain_delay') != true
                                and (as_timestamp(now()) - stable_since_ts) >= ((vision_completion_stable_minutes | int(15)) * 60) %}
                            {% set completed = vision_complete if mower_cycle_type == 'vision_rtk'
                                else is_state(mower_entity, 'docked') %}
                            {{ ((states(rain_binary_sensor) not in ['unknown', 'unavailable', 'none', '']
                                 and not is_state(rain_binary_sensor, 'on'))
                                or
                                (states(rain_binary_sensor) in ['unknown', 'unavailable', 'none', '']
                                 and (state_attr(forecast_weather_entity | trim, 'rain_rate') | float(0)) <= 0.05
                                 and states(forecast_weather_entity | trim) not in ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'hail']))
                               and state_attr(mower_entity, 'rain_delay') != true
                               and not completed
                               and not (is_state(mower_entity, 'error') and (as_timestamp(now()) - as_timestamp(states[mower_entity].last_changed)) >= (mower_fault_minutes | int(5)) * 60)
                               and not ((garden_check_enabled and garden_sensors | length > 0 and (garden_sensors | select('is_state', 'on') | list | length > 0 or garden_sensors | expand | selectattr('state', 'eq', 'off') | selectattr('last_changed', 'gt', now() - timedelta(minutes=5)) | list | length > 0)))
                               and not ((aborted_by_error | string | lower) == 'true' and is_state(mower_entity, 'docked'))
                               and repeat.index <= (normal_mowing_monitor_limit_minutes | int(720)) }}
                      sequence:
                        - wait_for_trigger:
                            - trigger: state
                              entity_id: !input mower_entity
                              to: error
                          timeout: "00:01:00"
                          continue_on_timeout: true
                        - if:
                            - condition: template
                              value_template: "{{ wait.trigger is not none }}"
                          then:
                            - variables:
                                seen_error_text: >-
                                  {% set raw = wait.trigger.to_state.attributes.get('error_description', '') | default('', true) | string %}{% set raw = '' if raw | lower in ['no error', 'unknown', 'none'] else raw %}{{ (mower_error_names.get(raw | lower, raw) ~ ' (' ~ raw ~ ')') if raw else 'no description' }}
                            - wait_template: "{{ states(mower_entity) in ['mowing', 'returning', 'docked'] }}"
                              timeout: "00:03:00"
                              continue_on_timeout: true
                            - if:
                                - condition: template
                                  value_template: "{{ states(mower_entity) in ['returning', 'docked'] }}"
                              then:
                                - variables:
                                    aborted_by_error: true
                                    aborted_error_text: "{{ seen_error_text }}"
                  - if:
                      - condition: template
                        alias: Mower reported an error during mowing
                        value_template: "{{ (is_state(mower_entity, 'error') and (as_timestamp(now()) - as_timestamp(states[mower_entity].last_changed)) >= (mower_fault_minutes | int(5)) * 60) }}"
                    then:
                      - variables:
                          reduced_growth_mm: "{{ ((states(growth_helper) | float(0)) * 0.7) | round(1) }}"
                      - action: input_number.set_value
                        alias: Reduce growth after partial mowing
                        target:
                          entity_id: !input growth_helper
                        data:
                          value: "{{ reduced_growth_mm }}"
                      - event: worx_smart_mowing_replan
                        event_data:
                          mower_entity: "{{ mower_entity }}"
                          kind: interrupted
                          reason: >-
                            {% set raw = state_attr(mower_entity, 'error_description') | default('', true) | string %}{% set raw = '' if raw | lower in ['no error', 'unknown', 'none'] else raw %}mower reported an error{% if raw %}: {{ mower_error_names.get(raw | lower, raw) }} ({{ raw }}){% endif %}. Check the mower on the lawn
                          started_at: "{{ mowing_cycle_started_at }}"
                          finished_at: "{{ now().strftime('%d.%m at %H:%M') }}"
                          growth_note: The lawn was mowed only partially, so the estimated grass growth was reduced by 30%.
                          min_delay_minutes: 120
                      - stop: Mower reported an error during mowing.
                  - if:
                      - condition: template
                        alias: Someone entered the garden during mowing
                        value_template: "{{ (garden_check_enabled and garden_sensors | length > 0 and (garden_sensors | select('is_state', 'on') | list | length > 0 or garden_sensors | expand | selectattr('state', 'eq', 'off') | selectattr('last_changed', 'gt', now() - timedelta(minutes=5)) | list | length > 0)) }}"
                    then:
                      - if:
                          - condition: template
                            value_template: "{{ states(mower_entity) not in ['docked', 'unavailable', 'unknown', 'error'] }}"
                          - condition: template
                            value_template: "{{ garden_reaction != 'pause' }}"
                        then:
                          - action: lawn_mower.dock
                            continue_on_error: true
                            target:
                              entity_id: !input mower_entity
                      - variables:
                          reduced_growth_mm: "{{ ((states(growth_helper) | float(0)) * 0.7) | round(1) }}"
                      - action: input_number.set_value
                        alias: Reduce growth after partial mowing
                        target:
                          entity_id: !input growth_helper
                        data:
                          value: "{{ reduced_growth_mm }}"
                      - event: worx_smart_mowing_replan
                        event_data:
                          mower_entity: "{{ mower_entity }}"
                          kind: interrupted
                          reason: >-
                            someone entered the garden{{ ' - the mower is waiting on the lawn, resume it manually or send it to the dock' if garden_reaction == 'pause' else '' }}
                          started_at: "{{ mowing_cycle_started_at }}"
                          finished_at: "{{ now().strftime('%d.%m at %H:%M') }}"
                          growth_note: The lawn was mowed only partially, so the estimated grass growth was reduced by 30%.
                          min_delay_minutes: 30
                      - stop: Someone entered the garden during mowing.
                  - variables:
                      normal_mowing_finished_ts: >-
                        {% if is_state(mower_entity, 'docked') %}
                          {{ as_timestamp(states[mower_entity].last_changed) }}
                        {% else %}
                          {{ as_timestamp(now()) }}
                        {% endif %}
                  - if:
                      - condition: template
                        value_template: "{{ states(mower_entity) not in ['docked', 'paused', 'unavailable', 'unknown'] }}"
                    then:
                      - action: lawn_mower.dock
                        continue_on_error: true
                        target:
                          entity_id: !input mower_entity
                  - wait_template: >-
                      {{ (states(rain_binary_sensor) not in ['unknown', 'unavailable', 'none', '']
                          and is_state(rain_binary_sensor, 'on'))
                         or
                         (states(rain_binary_sensor) in ['unknown', 'unavailable', 'none', '']
                          and ((state_attr(forecast_weather_entity | trim, 'rain_rate') | float(0)) > 0.05
                               or states(forecast_weather_entity | trim) in ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'hail']))
                         or state_attr(mower_entity, 'rain_delay') == true
                         or is_state(mower_entity, 'docked') }}
                    alias: Wait for the return to the dock after normal mowing
                    timeout: "00:30:00"
                    continue_on_timeout: true
                  - if:
                      - condition: template
                        value_template: >-
                          {{ ((states(rain_binary_sensor) not in ['unknown', 'unavailable', 'none', '']
                               and not is_state(rain_binary_sensor, 'on'))
                              or
                              (states(rain_binary_sensor) in ['unknown', 'unavailable', 'none', '']
                               and (state_attr(forecast_weather_entity | trim, 'rain_rate') | float(0)) <= 0.05
                               and states(forecast_weather_entity | trim) not in ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'hail']))
                             and state_attr(mower_entity, 'rain_delay') != true }}
                    then:
                      - delay: "00:01:00"
                        alias: Stabilize the dock confirmation after normal mowing
                      - wait_template: >-
                          {{ (states(rain_binary_sensor) not in ['unknown', 'unavailable', 'none', '']
                              and is_state(rain_binary_sensor, 'on'))
                             or
                             (states(rain_binary_sensor) in ['unknown', 'unavailable', 'none', '']
                              and ((state_attr(forecast_weather_entity | trim, 'rain_rate') | float(0)) > 0.05
                                   or states(forecast_weather_entity | trim) in ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'hail']))
                             or state_attr(mower_entity, 'rain_delay') == true
                             or is_state(mower_entity, 'docked') }}
                        alias: Confirm a stable return to the dock after normal mowing
                        timeout: "00:02:00"
                        continue_on_timeout: true
                  - variables:
                      mowing_cycle_finished_at: >-
                        {{ (normal_mowing_finished_ts | float) | timestamp_custom('%d.%m at %H:%M', true) }}
                      whole_cycle_duration_label: >-
                        {% set total = ((((normal_mowing_finished_ts | float) - (mowing_cycle_started_ts | float)) / 60) | round(0)) | int %}
                        {% if total >= 60 %}{{ total // 60 }} h {{ total % 60 }} min{% else %}{{ total }} min{% endif %}
                      rain_after_mowing: >-
                        {{ (states(rain_binary_sensor) not in ['unknown', 'unavailable', 'none', '']
                            and is_state(rain_binary_sensor, 'on'))
                           or
                           (states(rain_binary_sensor) in ['unknown', 'unavailable', 'none', '']
                            and ((state_attr(forecast_weather_entity | trim, 'rain_rate') | float(0)) > 0.05
                                 or states(forecast_weather_entity | trim) in ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'hail']))
                           or state_attr(mower_entity, 'rain_delay') == true }}
                      mowing_completed: >-
                        {% set mower_changed_ts = as_timestamp(states[mower_entity].last_changed) %}
                        {% set battery_changed_ts = as_timestamp(states[battery_sensor].last_changed) %}
                        {% set stable_since_ts = [mower_changed_ts, battery_changed_ts] | max %}
                        {% set vision_complete = is_state(mower_entity, 'docked')
                            and (states(battery_sensor) | float(0)) >= (vision_completion_battery_percent | float(95))
                            and state_attr(mower_entity, 'rain_delay') != true
                            and (as_timestamp(now()) - stable_since_ts) >= ((vision_completion_stable_minutes | int(15)) * 60) %}
                        {% set rain_now = (states(rain_binary_sensor) not in ['unknown', 'unavailable', 'none', '']
                            and is_state(rain_binary_sensor, 'on'))
                            or (states(rain_binary_sensor) in ['unknown', 'unavailable', 'none', '']
                                and ((state_attr(forecast_weather_entity | trim, 'rain_rate') | float(0)) > 0.05
                                     or states(forecast_weather_entity | trim) in ['rainy', 'pouring', 'lightning-rainy', 'snowy-rainy', 'hail']))
                            or state_attr(mower_entity, 'rain_delay') == true %}
                        {{ not rain_now and (aborted_by_error | string | lower) != 'true'
                           and (vision_complete if mower_cycle_type == 'vision_rtk' else is_state(mower_entity, 'docked')) }}
                  - if:
                      - condition: template
                        value_template: "{{ (mowing_completed | string | lower) == 'true' }}"
                    then:
                      - action: input_datetime.set_datetime
                        alias: Save the finished mowing as the last mowing
                        target:
                          entity_id: !input last_mow_helper
                        data:
                          timestamp: "{{ normal_mowing_finished_ts | float | int }}"
                      - action: input_number.set_value
                        alias: Reset growth after a full mowing
                        target:
                          entity_id: !input growth_helper
                        data:
                          value: 0
                      - event: worx_smart_mowing_replan
                        event_data:
                          mower_entity: "{{ mower_entity }}"
                          kind: completed
                          started_at: "{{ mowing_cycle_started_at }}"
                          finished_at: "{{ mowing_cycle_finished_at | trim }}"
                          duration_label: "{{ whole_cycle_duration_label | trim }}"
                          min_delay_minutes: 0
                    else:
                      - variables:
                          reduced_growth_mm: "{{ ((states(growth_helper) | float(0)) * 0.7) | round(1) }}"
                      - action: input_number.set_value
                        alias: Reduce growth after partial mowing
                        target:
                          entity_id: !input growth_helper
                        data:
                          value: "{{ reduced_growth_mm }}"
                      - event: worx_smart_mowing_replan
                        event_data:
                          mower_entity: "{{ mower_entity }}"
                          kind: interrupted
                          reason: >-
                            {% if (rain_after_mowing | string | lower) == 'true' %}rain during mowing
                            {%- elif (aborted_by_error | string | lower) == 'true' %}mower stopped mowing after an error: {{ aborted_error_text }} and returned to the dock
                            {%- else %}mower did not confirm that it finished mowing and returned to the dock{% endif %}
                          started_at: "{{ mowing_cycle_started_at }}"
                          finished_at: "{{ mowing_cycle_finished_at | trim }}"
                          growth_note: The lawn was mowed only partially, so the estimated grass growth was reduced by 30%.
                          min_delay_minutes: >-
                            {{ 0 if (rain_after_mowing | string | lower) == 'true' else (60 if (aborted_by_error | string | lower) == 'true' else 30) }}
      - alias: Someone entered the garden - stop the mower
        conditions:
          - condition: template
            value_template: >-
              {{ trigger.id == 'garden_entered' and garden_check_enabled
                 and states(mower_entity) in ['mowing', 'returning'] }}
        sequence:
          - if:
              - condition: template
                value_template: "{{ garden_reaction == 'pause' and is_state(mower_entity, 'mowing') }}"
            then:
              - action: lawn_mower.pause
                continue_on_error: true
                target:
                  entity_id: !input mower_entity
            else:
              - action: lawn_mower.dock
                continue_on_error: true
                target:
                  entity_id: !input mower_entity
      - alias: Track mowing started outside the automation
        conditions:
          - condition: template
            value_template: "{{ trigger.id == 'external_mowing_started' }}"
          - condition: template
            value_template: "{{ (cycle_running | string | lower) != 'true' }}"
          - condition: template
            value_template: "{{ state_attr(mower_entity, 'rtk_at_station') != true }}"
          - condition: template
            value_template: "{{ state_attr(mower_entity, 'status_id') | int(-1) != 32 }}"
        sequence:
          - variables:
              manual_mow_started_ts: "{{ as_timestamp(trigger.to_state.last_changed) }}"
              manual_mow_started_at: >-
                {{ as_timestamp(trigger.to_state.last_changed) | timestamp_custom('%d.%m at %H:%M', true) }}
          - sequence: &manual_mowing_tracking
              - variables:
                  aborted_by_error: false
                  aborted_error_text: ""
              - alias: Monitor manual mowing, including Vision / RTK recharging
                repeat:
                  while:
                    - condition: template
                      value_template: >-
                        {% set mower_changed_ts = as_timestamp(states[mower_entity].last_changed) %}
                        {% set battery_changed_ts = as_timestamp(states[battery_sensor].last_changed) %}
                        {% set stable_since_ts = [mower_changed_ts, battery_changed_ts] | max %}
                        {% set vision_complete = is_state(mower_entity, 'docked')
                            and (states(battery_sensor) | float(0)) >= (vision_completion_battery_percent | float(95))
                            and state_attr(mower_entity, 'rain_delay') != true
                            and (as_timestamp(now()) - stable_since_ts) >= ((vision_completion_stable_minutes | int(15)) * 60) %}
                        {% set completed = vision_complete if mower_cycle_type == 'vision_rtk'
                            else is_state(mower_entity, 'docked') %}
                        {{ not completed
                           and not (is_state(mower_entity, 'error') and (as_timestamp(now()) - as_timestamp(states[mower_entity].last_changed)) >= (mower_fault_minutes | int(5)) * 60)
                           and not ((garden_check_enabled and garden_sensors | length > 0 and (garden_sensors | select('is_state', 'on') | list | length > 0 or garden_sensors | expand | selectattr('state', 'eq', 'off') | selectattr('last_changed', 'gt', now() - timedelta(minutes=5)) | list | length > 0)))
                           and not ((aborted_by_error | string | lower) == 'true' and is_state(mower_entity, 'docked'))
                           and repeat.index <= (normal_mowing_monitor_limit_minutes | int(720)) }}
                  sequence:
                    - wait_for_trigger:
                        - trigger: state
                          entity_id: !input mower_entity
                          to: error
                      timeout: "00:01:00"
                      continue_on_timeout: true
                    - if:
                        - condition: template
                          value_template: "{{ wait.trigger is not none }}"
                      then:
                        - variables:
                            seen_error_text: >-
                              {% set raw = wait.trigger.to_state.attributes.get('error_description', '') | default('', true) | string %}{% set raw = '' if raw | lower in ['no error', 'unknown', 'none'] else raw %}{{ (mower_error_names.get(raw | lower, raw) ~ ' (' ~ raw ~ ')') if raw else 'no description' }}
                        - wait_template: "{{ states(mower_entity) in ['mowing', 'returning', 'docked'] }}"
                          timeout: "00:03:00"
                          continue_on_timeout: true
                        - if:
                            - condition: template
                              value_template: "{{ states(mower_entity) in ['returning', 'docked'] }}"
                          then:
                            - variables:
                                aborted_by_error: true
                                aborted_error_text: "{{ seen_error_text }}"
              - variables:
                  manual_mow_completed: >-
                    {% set mower_changed_ts = as_timestamp(states[mower_entity].last_changed) %}
                    {% set battery_changed_ts = as_timestamp(states[battery_sensor].last_changed) %}
                    {% set stable_since_ts = [mower_changed_ts, battery_changed_ts] | max %}
                    {% set vision_complete = is_state(mower_entity, 'docked')
                        and (states(battery_sensor) | float(0)) >= (vision_completion_battery_percent | float(95))
                        and state_attr(mower_entity, 'rain_delay') != true
                        and (as_timestamp(now()) - stable_since_ts) >= ((vision_completion_stable_minutes | int(15)) * 60) %}
                    {% set garden = (garden_check_enabled and garden_sensors | length > 0 and (garden_sensors | select('is_state', 'on') | list | length > 0 or garden_sensors | expand | selectattr('state', 'eq', 'off') | selectattr('last_changed', 'gt', now() - timedelta(minutes=5)) | list | length > 0)) %}
                    {{ not garden and (aborted_by_error | string | lower) != 'true'
                       and (vision_complete if mower_cycle_type == 'vision_rtk' else is_state(mower_entity, 'docked')) }}
              - if:
                  - condition: template
                    value_template: "{{ (manual_mow_completed | string | lower) != 'true' }}"
                then:
                  - variables:
                      tytul: "Worx: manual mowing interrupted"
                      tresc: |-
                        Mowing started manually on {{ manual_mow_started_at | trim }} did not finish as a full cycle.
                        {% if garden_check_enabled and garden_sensors | select('is_state', 'on') | list | length > 0 %}Cause: someone is in the garden.{% elif (aborted_by_error | string | lower) == 'true' %}Cause: mower stopped mowing after an error: {{ aborted_error_text }} and returned to the dock.{% elif is_state(mower_entity, 'error') %}Cause: {% set raw = state_attr(mower_entity, 'error_description') | default('', true) | string %}{% set raw = '' if raw | lower in ['no error', 'unknown', 'none'] else raw %}mower reported an error{% if raw %}: {{ mower_error_names.get(raw | lower, raw) }} ({{ raw }}){% endif %}. Check the mower on the lawn.{% else %}Mower state: {{ mower_state_names.get(states(mower_entity), states(mower_entity)) }}.{% endif %}
                        Estimated grass growth remains unchanged: {{ states(growth_helper) | float(0) | round(1) | string | replace('.', '.') }} mm.
                  - action: persistent_notification.create
                    data:
                      notification_id: "{{ notification_id }}"
                      title: "{{ tytul }}"
                      message: "{{ tresc }}"
                  - sequence: !input notify_actions
                  - stop: Manual mowing was not confirmed as finished.
              - variables:
                  manual_mow_finished_ts: "{{ as_timestamp(states[mower_entity].last_changed) }}"
              - action: input_datetime.set_datetime
                alias: Save the manual mowing as the last mowing
                target:
                  entity_id: !input last_mow_helper
                data:
                  timestamp: "{{ manual_mow_finished_ts | float | int }}"
              - action: input_number.set_value
                alias: Reset growth after manual mowing
                target:
                  entity_id: !input growth_helper
                data:
                  value: 0
              - event: worx_smart_mowing_replan
                event_data:
                  mower_entity: "{{ mower_entity }}"
                  kind: manual_completed
                  started_at: "{{ manual_mow_started_at | trim }}"
                  finished_at: "{{ (manual_mow_finished_ts | float) | timestamp_custom('%d.%m at %H:%M', true) }}"
                  duration_label: >-
                    {% set total = ((((manual_mow_finished_ts | float) - (manual_mow_started_ts | float)) / 60) | round(0)) | int %}
                    {% if total >= 60 %}{{ total // 60 }} h {{ total % 60 }} min{% else %}{{ total }} min{% endif %}
                  min_delay_minutes: 0
      - alias: Take over a running cycle after a Home Assistant restart
        conditions:
          - condition: template
            value_template: "{{ trigger.id == 'restart_recovery' and (cycle_running | string | lower) != 'true' }}"
        sequence:
          - wait_template: "{{ states(mower_entity) not in ['unavailable', 'unknown'] }}"
            alias: Wait for the Worx Cloud connection
            timeout: "00:10:00"
            continue_on_timeout: true
          - delay: "00:02:00"
            alias: Stabilize the mower state after the restart
          - if:
              - condition: template
                alias: Mower is not mowing
                value_template: >-
                  {{ states(mower_entity) not in ['mowing', 'returning']
                     or state_attr(mower_entity, 'rtk_at_station') == true }}
            then:
              - stop: After the restart the mower is not mowing; there is no cycle to take over.
          - variables:
              restart_planned_ts: "{{ state_attr(next_mow_helper, 'timestamp') | float(0) }}"
              restart_scheduled_cycle: >-
                {% set planned = state_attr(next_mow_helper, 'timestamp') | float(0) %}
                {% set now_ts = as_timestamp(now()) %}
                {{ planned > 0 and planned <= now_ts
                   and (state_attr(last_mow_helper, 'timestamp') | float(0)) < planned
                   and (now_ts - planned) <= (normal_mowing_monitor_limit_minutes | int(720)) * 60 }}
          - variables:
              restart_edge_phase: >-
                {{ (restart_scheduled_cycle | string | lower) == 'true'
                   and (state_attr(mower_entity, 'status_id') | int(-1) == 32
                        or (is_state(mower_entity, 'returning')
                            and as_timestamp(now()) - (restart_planned_ts | float(0)) < 3600)) }}
              mowing_cycle_started_ts: "{{ restart_planned_ts }}"
              mowing_cycle_started_at: "{{ (restart_planned_ts | float(0)) | timestamp_custom('%d.%m at %H:%M', true) }}"
          - choose:
              - conditions:
                  - condition: template
                    alias: Restart during the edge cut
                    value_template: "{{ (restart_edge_phase | string | lower) == 'true' }}"
                sequence:
                  - sequence: *after_edges_cycle
              - conditions:
                  - condition: template
                    alias: Restart during normal scheduled mowing
                    value_template: "{{ (restart_scheduled_cycle | string | lower) == 'true' }}"
                sequence:
                  - sequence: *normal_mowing_cycle
            default:
              - variables:
                  manual_mow_started_ts: "{{ as_timestamp(now()) }}"
                  manual_mow_started_at: "{{ now().strftime('%d.%m at %H:%M') }} (taken over after a Home Assistant restart)"
              - sequence: *manual_mowing_tracking
