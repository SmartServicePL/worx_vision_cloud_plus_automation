    de: "fährt der Mähroboter los, bei tatsächlich erkanntem Regen kehrt er zur Ladestation zurück,"
  - pl: "- po deszczu automatyzacja czeka na wyschnięcie trawy, liczone od momentu,"
    en: "- after rain the automation waits for the grass to dry, counted from the moment"
    de: "- nach Regen wartet die Automatisierung, bis das Gras abgetrocknet ist, gerechnet ab dem Zeitpunkt,"
  - pl: "w którym czujnik opadu przeszedł w stan suchy,"
    en: "the rain sensor switched to dry,"
    de: "an dem der Niederschlagssensor auf trocken gewechselt hat,"
  - pl: "- bez prognozy automatyzacja używa wybranego okna i sprawdza rzeczywiste"
    en: "- without a forecast the automation uses the selected window and checks actual"
    de: "- ohne Vorhersage verwendet die Automatisierung das gewählte Zeitfenster und prüft die tatsächlichen"
  - pl: "warunki bezpośrednio przed startem."
    en: "conditions right before the start."
    de: "Bedingungen unmittelbar vor dem Start."
  - pl: "Jak wygląda cykl koszenia:"
    en: "How a mowing cycle works:"
    de: "So läuft ein Mähzyklus ab:"
  - pl: "1. Home Assistant uruchamia osobne przycinanie krawędzi."
    en: "1. Home Assistant starts a separate edge cut."
    de: "1. Home Assistant startet einen separaten Kantenschnitt."
  - pl: "2. Automatyzacja czeka, aż robot wróci do bazy."
    en: "2. The automation waits for the mower to return to the dock."
    de: "2. Die Automatisierung wartet, bis der Mähroboter zur Ladestation zurückgekehrt ist."
  - pl: "3. Robot ładuje baterię do minimum 80%."
    en: "3. The mower charges its battery to at least 80%."
    de: "3. Der Mähroboter lädt den Akku auf mindestens 80%."
  - pl: "4. Temperatura, deszcz i wilgotność są sprawdzane ponownie."
    en: "4. Temperature, rain and humidity are checked again."
    de: "4. Temperatur, Regen und Feuchtigkeit werden erneut geprüft."
  - pl: "5. Dopiero wtedy startuje normalne koszenie jednorazowe."
    en: "5. Only then does normal one-time mowing start."
    de: "5. Erst dann startet das normale einmalige Mähen."
  - pl: "Każde przerwanie cyklu wyznacza nowy termin od chwili przerwania."
    en: "Every interruption of the cycle sets a new mowing time counted from the interruption."
    de: "Jede Unterbrechung des Zyklus legt ab dem Zeitpunkt der Unterbrechung einen neuen Termin fest."
  - pl: "Restart Home Assistant albo przeładowanie automatyzacji w trakcie cyklu nie"
    en: "Restarting Home Assistant or reloading automations during a cycle does not"
    de: "Ein Neustart von Home Assistant oder ein Neuladen der Automatisierung während des Zyklus"
  - pl: "gubi koszenia: automatyzacja przejmuje trwający etap (krawędzie albo zwykłe"
    en: "lose the mowing: the automation takes over the running stage (edge pass or normal"
    de: "verliert das Mähen nicht: Die Automatisierung übernimmt den laufenden Schritt (Kantenschnitt oder normales"
  - pl: "koszenie), czeka na jego koniec i zapisuje koszenie, zamiast planować"
    en: "mowing), waits for it to finish and records the mowing instead of planning"
    de: "Mähen), wartet auf dessen Ende und speichert das Mähen, statt am selben Tag"
  - pl: "kolejne tego samego dnia."
    en: "another one on the same day."
    de: "ein weiteres zu planen."
  - pl: "Typ robota:"
