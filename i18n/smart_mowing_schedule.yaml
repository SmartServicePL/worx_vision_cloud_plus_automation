# Translations of the Polish blueprint, one entry per source line with text.
# Edit the translations, then run: python tools/blueprint_i18n.py build <blueprint> <catalog>
segments:
  - pl: "Worx Vision Cloud PLUS - inteligentny harmonogram koszenia"
    en: "Worx Vision Cloud PLUS - smart mowing schedule"
    de: "Worx Vision Cloud PLUS - intelligenter Mähzeitplan"
  - pl: "Inteligentny harmonogram koszenia dla robotów Worx, sterowany z Home"
    en: "Smart mowing schedule for Worx robot mowers, controlled from Home"
    de: "Intelligenter Mähzeitplan für Worx-Mähroboter, gesteuert von Home"
  - pl: "Assistant zamiast ze sztywnego harmonogramu w aplikacji WORX."
    en: "Assistant instead of a fixed schedule in the WORX app."
    de: "Assistant statt über einen starren Zeitplan in der WORX-App."
  - pl: "Co robi automatyzacja:"
    en: "What the automation does:"
    de: "Was die Automatisierung macht:"
  - pl: "- szacuje dzienny przyrost trawy modelem Growth Potential (GP) na podstawie"
    en: "- estimates daily grass growth with the Growth Potential (GP) model based on"
    de: "- schätzt das tägliche Graswachstum mit dem Modell Growth Potential (GP) anhand"
  - pl: "warunków całej doby (średnia temperatura, maksymalne UV i opad z prognozy"
    en: "conditions over the whole day (average temperature, maximum UV and rainfall from the forecast"
    de: "der Bedingungen des ganzen Tages (Durchschnittstemperatur, maximaler UV-Index und Niederschlag aus der Vorhersage"
  - pl: "na najbliższe 24 godziny), a nie chwilowego odczytu o świcie,"
    en: "for the next 24 hours), not a single reading at dawn,"
    de: "für die nächsten 24 Stunden) und nicht anhand eines Momentwerts bei Sonnenaufgang,"
  - pl: "- uwzględnia pogodę, opady, temperaturę, słońce, opcjonalną wilgotność gleby,"
    en: "- takes into account weather, rainfall, temperature, sun, optional soil moisture,"
    de: "- berücksichtigt Wetter, Niederschlag, Temperatur, Sonne, optional die Bodenfeuchte,"
  - pl: "podlewanie i nawożenie,"
    en: "irrigation and fertilization,"
    de: "Bewässerung und Düngung,"
  - pl: "- preferuje wybrane okno czasowe, ale w razie potrzeby szuka bezpiecznej godziny poza nim,"
    en: "- prefers the selected time window, but looks for a safe time outside it if needed,"
    de: "- bevorzugt das gewählte Zeitfenster, sucht bei Bedarf aber eine sichere Uhrzeit außerhalb davon,"
  - pl: "- omija deszcz, świeżo mokry trawnik i temperatury poza ustawionym zakresem,"
    en: "- avoids rain, a freshly wet lawn and temperatures outside the set range,"
    de: "- meidet Regen, frisch nassen Rasen und Temperaturen außerhalb des eingestellten Bereichs,"
  - pl: "- rozpoznaje rosę po różnicy między temperaturą powietrza a punktem rosy: trawa"
    en: "- detects dew from the difference between air temperature and dew point: grass"
    de: "- erkennt Tau an der Differenz zwischen Lufttemperatur und Taupunkt: Das Gras"
  - pl: "jest uznawana za suchą, gdy powietrze jest co najmniej 2,5 °C cieplejsze od punktu rosy,"
    en: "is considered dry when the air is at least 2.5 °C warmer than the dew point,"
    de: "gilt als trocken, wenn die Luft mindestens 2,5 °C wärmer als der Taupunkt ist,"
  - pl: "- gdy robot utknie lub zgłosi inny błąd w trakcie cyklu, od razu wysyła powiadomienie,"
    en: "- sends a notification right away when the mower gets trapped or reports another error during a cycle,"
    de: "- sendet sofort eine Benachrichtigung, wenn der Mähroboter während des Zyklus feststeckt oder einen anderen Fehler meldet,"
  - pl: "- preferuje częste, lekkie koszenie robotem zamiast czekania na wysoką trawę."
    en: "- prefers frequent, light robot mowing over waiting for tall grass."
    de: "- bevorzugt häufiges, leichtes Mähen mit dem Mähroboter, statt auf hohes Gras zu warten."
  - pl: "Źródło pogody:"
    en: "Weather source:"
    de: "Wetterquelle:"
  - pl: "- własna stacja pogodowa lub lokalne czujniki dostarczają rzeczywiste pomiary,"
    en: "- your own weather station or local sensors provide real measurements,"
    de: "- eine eigene Wetterstation oder lokale Sensoren liefern echte Messwerte,"
  - pl: "- zalecana integracja MeteoFusion HA dostarcza lokalnie korygowaną prognozę"
    en: "- the recommended MeteoFusion HA integration provides a locally corrected hourly"
    de: "- die empfohlene Integration MeteoFusion HA liefert eine lokal korrigierte stündliche"
  - pl: "godzinową, bieżący opad i ocenę jakości prognozy,"
    en: "forecast, current rainfall and a forecast quality rating,"
    de: "Vorhersage, den aktuellen Niederschlag und eine Bewertung der Vorhersagequalität,"
  - pl: "- można również użyć innej encji weather, np. Tomorrow.io,"
    en: "- you can also use another weather entity, e.g. Tomorrow.io,"
    de: "- du kannst auch eine andere weather-Entität verwenden, z. B. Tomorrow.io,"
  - pl: "- wszystkie terminy (plan dzienny, ponowna próba po blokadzie lub przerwaniu,"
    en: "- all mowing times (daily plan, retry after a block or interruption,"
    de: "- alle Termine (Tagesplan, erneuter Versuch nach einer Sperre oder Unterbrechung,"
