  - pl: "Moment startu koszenia"
    en: "When to start mowing"
    de: "Startzeitpunkt des Mähens"
  - pl: "Automatyczny tryb dobiera niski prog startu dla robota koszacego. Zasada 1/3 zdzbla jest traktowana tylko jako limit bezpieczenstwa, a nie jako prog startu."
    en: "Automatic mode picks a low start threshold suited to a robot mower. The 1/3 grass blade rule is treated only as a safety limit, not as a start threshold."
    de: "Der automatische Modus wählt eine niedrige Startschwelle für den Mähroboter. Die 1/3-Regel für die Halmlänge gilt nur als Sicherheitsgrenze, nicht als Startschwelle."
  - pl: "Automatycznie dla robota"
    en: "Automatic for robot mower"
    de: "Automatisch für Mähroboter"
  - pl: "Reczny prog wzrostu"
    en: "Manual growth threshold"
    de: "Manuelle Wachstumsschwelle"
  - pl: "Wysokosc koszenia"
    en: "Cutting height"
    de: "Schnitthöhe"
  - pl: "Docelowa wysokosc trawy ustawiona w kosiarce. Automatyzacja uzywa jej do dobrania malego progu startu i limitu bezpiecznego koszenia."
    en: "Target grass height set on the mower. The automation uses it to choose a small start threshold and a safe mowing limit."
    de: "Am Mähroboter eingestellte Ziel-Grashöhe. Die Automatisierung nutzt sie, um eine niedrige Startschwelle und eine Grenze für sicheres Mähen festzulegen."
  - pl: "Tryb wyboru godziny"
    en: "Time selection mode"
    de: "Auswahlmodus für die Uhrzeit"
  - pl: "Automatycznie wybiera najlepsza godzine z prognozy albo trzyma sie stalej godziny."
    en: "Automatically picks the best time from the forecast, or sticks to a fixed time."
    de: "Wählt automatisch die beste Uhrzeit aus der Vorhersage oder hält sich an eine feste Uhrzeit."
  - pl: "Automatycznie z prognozy pogody"
    en: "Automatic from weather forecast"
    de: "Automatisch aus der Wettervorhersage"
  - pl: "Stala godzina"
    en: "Fixed time"
    de: "Feste Uhrzeit"
  - pl: "Preferowane okno koszenia"
    en: "Preferred mowing window"
    de: "Bevorzugtes Mähfenster"
  - pl: "Automatyzacja najpierw szuka bezpiecznej godziny w tym oknie. Jeżeli pogoda na to nie pozwala, może wybrać godzinę poza oknem jeszcze tego samego dnia. Opcja \"Wlasne godziny\" używa godzin ustawionych poniżej."
    en: "The automation first looks for a safe time in this window. If the weather does not allow it, it may pick a time outside the window on the same day. The \"Custom hours\" option uses the hours set below."
    de: "Die Automatisierung sucht zuerst eine sichere Uhrzeit in diesem Fenster. Lässt das Wetter dies nicht zu, kann sie noch am selben Tag eine Uhrzeit außerhalb des Fensters wählen. Die Option \"Eigene Uhrzeiten\" verwendet die unten eingestellten Uhrzeiten."
  - pl: "Rano (07:00 - 10:00)"
    en: "Morning (07:00 - 10:00)"
    de: "Morgens (07:00 - 10:00)"
  - pl: "Przed poludniem (09:00 - 12:00)"
    en: "Late morning (09:00 - 12:00)"
    de: "Vormittags (09:00 - 12:00)"
  - pl: "Poludnie (11:00 - 14:00)"
    en: "Midday (11:00 - 14:00)"
    de: "Mittags (11:00 - 14:00)"
  - pl: "Popoludnie (14:00 - 17:00)"
    en: "Afternoon (14:00 - 17:00)"
    de: "Nachmittags (14:00 - 17:00)"
  - pl: "Wieczor (17:00 - 20:00)"
    en: "Evening (17:00 - 20:00)"
    de: "Abends (17:00 - 20:00)"
  - pl: "Noc (22:00 - 05:00)"
    en: "Night (22:00 - 05:00)"
    de: "Nachts (22:00 - 05:00)"
  - pl: "Wlasne godziny"
    en: "Custom hours"
    de: "Eigene Uhrzeiten"
  - pl: "Czy robot ma zamontowane akcesorium FiatLux?"
    en: "Is the FiatLux accessory installed on the mower?"
    de: "Ist am Mähroboter das Zubehör FiatLux montiert?"
  - pl: "Zaznacz tylko wtedy, gdy robot ma oswietlenie FiatLux. Jest wymagane dla okna nocnego 22:00-05:00."
    en: "Enable only if the mower has FiatLux lights. Required for the 22:00-05:00 night window."
    de: "Nur aktivieren, wenn der Mähroboter die FiatLux-Beleuchtung hat. Erforderlich für das Nachtfenster 22:00-05:00."
  - pl: "Wlasny poczatek okna"
    en: "Custom window start"
    de: "Eigener Fensterbeginn"
  - pl: "Uzywane przy opcji \"Wlasne godziny\". W trybie stalej godziny to glowny start."
    en: "Used with the \"Custom hours\" option. In fixed time mode this is the main start."
    de: "Wird bei der Option \"Eigene Uhrzeiten\" verwendet. Im Modus mit fester Uhrzeit ist dies der Hauptstart."
  - pl: "Wlasny koniec okna"
    en: "Custom window end"
    de: "Eigenes Fensterende"
  - pl: "Uzywane przy opcji \"Wlasne godziny\". W trybie stalej godziny to druga proba."
    en: "Used with the \"Custom hours\" option. In fixed time mode this is the second attempt."
    de: "Wird bei der Option \"Eigene Uhrzeiten\" verwendet. Im Modus mit fester Uhrzeit ist dies der zweite Versuch."
  - pl: "Automatyczne nawadnianie"
    en: "Automatic irrigation"
    de: "Automatische Bewässerung"
  - pl: "Wlacz, jesli trawnik jest regularnie podlewany automatycznie."
    en: "Enable if the lawn is regularly watered by automatic irrigation."
    de: "Aktivieren, wenn der Rasen regelmäßig automatisch bewässert wird."
  - pl: "Trawnik nawozony"
    en: "Fertilized lawn"
    de: "Rasen gedüngt"
  - pl: "Wlacz, jesli trawnik jest regularnie nawozony."
    en: "Enable if the lawn is fertilized regularly."
    de: "Aktivieren, wenn der Rasen regelmäßig gedüngt wird."
  - pl: "Zaawansowane - wzrost trawy"
    en: "Advanced - grass growth"
    de: "Erweitert - Graswachstum"
  - pl: "Reczny prog startu koszenia"
    en: "Manual mowing start threshold"
    de: "Manuelle Startschwelle für das Mähen"
  - pl: "Uzywany tylko wtedy, gdy moment startu koszenia ustawiono na \"Reczny prog wzrostu\"."
    en: "Used only when \"When to start mowing\" is set to \"Manual growth threshold\"."
    de: "Wird nur verwendet, wenn der Startzeitpunkt des Mähens auf \"Manuelle Wachstumsschwelle\" eingestellt ist."
  - pl: "Prog intensywnego koszenia"
    en: "Heavy mowing threshold"
    de: "Schwelle für intensives Mähen"
  - pl: "W trybie automatycznym jest wyliczany z progu startu i limitu 1/3 wysokosci koszenia. Ten suwak dziala tylko przy recznym progu wzrostu."
    en: "In automatic mode it is calculated from the start threshold and the 1/3 cutting height limit. This slider only works with the manual growth threshold."
    de: "Im automatischen Modus wird sie aus der Startschwelle und der 1/3-Grenze der Schnitthöhe berechnet. Dieser Schieberegler wirkt nur bei manueller Wachstumsschwelle."
  - pl: "Korekta wzrostu przy nawadnianiu"
    en: "Growth adjustment for irrigation"
    de: "Wachstumskorrektur bei Bewässerung"
  - pl: "Uzywane tylko przy wlaczonym automatycznym nawadnianiu."
    en: "Used only when automatic irrigation is enabled."
    de: "Wird nur bei aktivierter automatischer Bewässerung verwendet."
  - pl: "Korekta wzrostu przy nawozeniu"
    en: "Growth adjustment for fertilization"
    de: "Wachstumskorrektur bei Düngung"
  - pl: "Uzywane tylko przy wlaczonym nawozeniu."
    en: "Used only when fertilization is enabled."
    de: "Wird nur bei aktivierter Düngung verwendet."
  - pl: "Minimalna przerwa miedzy koszeniami"
    en: "Minimum gap between mowings"
    de: "Mindestabstand zwischen Mähvorgängen"
  - pl: "Zabezpieczenie przed zbyt czestym uruchamianiem. Wartosc 1 dzien oznacza kolejny dzien kalendarzowy, zeby robot mogl kosic codziennie, gdy wzrost i pogoda sa odpowiednie."
    en: "Protection against starting too often. A value of 1 day means the next calendar day, so the mower can mow every day when growth and weather allow."
    de: "Schutz vor zu häufigem Starten. Der Wert 1 Tag bedeutet den nächsten Kalendertag, damit der Mähroboter täglich mähen kann, wenn Wachstum und Wetter passen."
  - pl: "Zaawansowane - starsze roboty z przewodem"
    en: "Advanced - older wired mowers"
    de: "Erweitert - ältere Mähroboter mit Draht"
  - pl: "Ręczna wydajność kosiarki"
    en: "Manual mower capacity"
    de: "Manuelle Mähleistung"
  - pl: "Używane tylko przy typie \"Starszy Worx z przewodem granicznym\" i modelu \"Ręcznie / inny model\"."
    en: "Used only with the \"Older Worx with boundary wire\" type and the \"Manual / other model\" model."
    de: "Wird nur beim Typ \"Älterer Worx mit Begrenzungsdraht\" und Modell \"Manuell / anderes Modell\" verwendet."
  - pl: "Korekta wydajnosci modelu"
    en: "Model capacity adjustment"
    de: "Korrektur der Modellleistung"
  - pl: "Dla starszych robotów z przewodem pozwala skorygować wyliczony czas pracy przy wąskich przejazdach, wielu strefach albo prostym trawniku."
    en: "For older wired mowers, lets you adjust the calculated run time for narrow passages, many zones or a simple lawn."
    de: "Ermöglicht bei älteren Mährobotern mit Draht, die berechnete Laufzeit bei engen Durchgängen, vielen Zonen oder einem einfachen Rasen zu korrigieren."
  - pl: "Minimalny czas koszenia dla robota przewodowego"
    en: "Minimum mowing time for a wired mower"
    de: "Minimale Mähdauer für Mähroboter mit Draht"
  - pl: "Maksymalny czas koszenia dla robota przewodowego"
    en: "Maximum mowing time for a wired mower"
    de: "Maximale Mähdauer für Mähroboter mit Draht"
  - pl: "Zaawansowane - bezpieczenstwo"
    en: "Advanced - safety"
    de: "Erweitert - Sicherheit"
  - pl: "Godzina przeliczenia przyrostu"
    en: "Growth recalculation time"
    de: "Uhrzeit der Wachstumsberechnung"
  - pl: "O tej godzinie automatyzacja dodaje dzienny przyrost trawy i ponownie ocenia termin koszenia z aktualną prognozą."
    en: "At this time the automation adds the daily grass growth and re-evaluates the mowing time with the current forecast."
    de: "Zu dieser Uhrzeit addiert die Automatisierung das tägliche Graswachstum und bewertet den Mähtermin mit der aktuellen Vorhersage neu."
  - pl: "Minimalna bateria do startu"
    en: "Minimum battery to start"
    de: "Minimaler Akkustand für den Start"
  - pl: "Minimalna temperatura koszenia"
    en: "Minimum mowing temperature"
    de: "Minimale Mähtemperatur"
  - pl: "Ponizej tej temperatury koszenie zostanie przelozone na cieplejszy termin."
    en: "Below this temperature mowing is postponed to a warmer time."
    de: "Unter dieser Temperatur wird das Mähen auf einen wärmeren Termin verschoben."
  - pl: "Maksymalna temperatura koszenia"
    en: "Maximum mowing temperature"
    de: "Maximale Mähtemperatur"
  - pl: "Powyzej tej temperatury koszenie zostanie przelozone na chlodniejszy termin."
    en: "Above this temperature mowing is postponed to a cooler time."
    de: "Über dieser Temperatur wird das Mähen auf einen kühleren Termin verschoben."
  - pl: "Próg intensywnego opadu"
    en: "Heavy rain threshold"
    de: "Schwelle für starken Niederschlag"
  - pl: "Po przekroczeniu tej zmierzonej wartości automatyzacja podwaja czas schnięcia trawy. Sam opad nie blokuje koszenia przez całą dobę."
    en: "When this measured value is exceeded, the automation doubles the grass drying time. Rain by itself does not block mowing for the whole day."
    de: "Wird dieser Messwert überschritten, verdoppelt die Automatisierung die Abtrocknungszeit des Grases. Niederschlag allein sperrt das Mähen nicht für den ganzen Tag."
  - pl: "Maksymalna wilgotnosc gleby dla startu"
    en: "Maximum soil moisture to start"
    de: "Maximale Bodenfeuchte für den Start"
  - pl: "\"Ustaw ponizej 100%, jesli wilgotnosc gleby ma blokowac start. Domyslnie wilgotnosc sluzy tylko do liczenia przyrostu trawy.\""
    en: "\"Set below 100% if soil moisture should block the start. By default soil moisture is only used to calculate grass growth.\""
    de: "\"Unter 100% einstellen, wenn die Bodenfeuchte den Start sperren soll. Standardmäßig dient die Bodenfeuchte nur zur Berechnung des Graswachstums.\""
  - pl: "Maksymalny czas potwierdzenia startu koszenia"
    en: "Maximum mowing start confirmation time"
    de: "Maximale Wartezeit auf Bestätigung des Mähstarts"
  - pl: "Ile minut automatyzacja czeka na wyjazd po komendzie normalnego koszenia albo przycinania krawedzi."
    en: "How many minutes the automation waits for the mower to leave the dock after a normal mowing or edge cut command."
    de: "Wie viele Minuten die Automatisierung nach dem Befehl für normales Mähen oder Kantenschnitt auf die Abfahrt wartet."
  - pl: "Opcje dodatkowe (domyślnie wyłączone)"
    en: "Extra options (off by default)"
    de: "Zusätzliche Optionen (standardmäßig deaktiviert)"
  - pl: "Kosić tylko w wybrane dni"
    en: "Mow only on selected days"
    de: "Nur an ausgewählten Tagen mähen"
  - pl: "Wyłączone = planer może wybrać każdy dzień tygodnia."
    en: "Off = the planner can pick any day of the week."
    de: "Deaktiviert = der Planer kann jeden Wochentag wählen."
  - pl: "Dni koszenia"
    en: "Mowing days"
    de: "Mähtage"
  - pl: "Używane tylko po włączeniu opcji powyżej."
