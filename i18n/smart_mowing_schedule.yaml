    de: "Betriebsmodi:"
  - pl: "- tryb automatyczny wybiera najlepszy termin z prognozy godzinowej,"
    en: "- automatic mode picks the best time from the hourly forecast,"
    de: "- der automatische Modus wählt den besten Termin aus der stündlichen Vorhersage,"
  - pl: "- przy zbyt wysokiej temperaturze szuka chłodniejszej godziny tego samego"
    en: "- when it is too hot, it looks for a cooler time on the same"
    de: "- bei zu hoher Temperatur sucht er eine kühlere Uhrzeit am selben"
  - pl: "dnia; z FiatLux może wykorzystać także godziny nocne do 05:00,"
    en: "day; with FiatLux it can also use night hours until 05:00,"
    de: "Tag; mit FiatLux kann er auch Nachtstunden bis 05:00 nutzen,"
  - pl: "- tryb stałej godziny działa jak klasyczny harmonogram z drugą próbą startu,"
    en: "- fixed time mode works like a classic schedule with a second start attempt,"
    de: "- der Modus mit fester Uhrzeit funktioniert wie ein klassischer Zeitplan mit zweitem Startversuch,"
  - pl: "- koszenie nocne 22:00-05:00 jest dostępne tylko po potwierdzeniu akcesorium"
    en: "- night mowing 22:00-05:00 is available only after confirming the accessory"
    de: "- nächtliches Mähen 22:00-05:00 ist nur nach Bestätigung des Zubehörs"
  - pl: "FiatLux."
    en: "FiatLux."
    de: "FiatLux verfügbar."
  - pl: "Opcje dodatkowe (domyślnie wyłączone):"
    en: "Extra options (off by default):"
    de: "Zusätzliche Optionen (standardmäßig deaktiviert):"
  - pl: "- koszenie tylko w wybrane dni tygodnia,"
    en: "- mowing only on selected days of the week,"
    de: "- Mähen nur an ausgewählten Wochentagen,"
  - pl: "- koszenie tylko za dnia, z zapasem minut po wschodzie i przed zachodem słońca"
    en: "- mowing only in daylight, with a margin of minutes after sunrise and before sunset"
    de: "- Mähen nur bei Tageslicht, mit einem Puffer in Minuten nach Sonnenaufgang und vor Sonnenuntergang"
  - pl: "(chroni jeże i inne małe zwierzęta, które żerują po zmroku),"
    en: "(protects hedgehogs and other small animals that forage after dark),"
    de: "(schützt Igel und andere kleine Tiere, die nach Einbruch der Dunkelheit auf Nahrungssuche gehen),"
  - pl: "- wstrzymanie koszenia, gdy ktoś jest w ogrodzie (czujniki ruchu, furtka,"
    en: "- pausing mowing when someone is in the garden (motion sensors, gate,"
    de: "- Mähen pausieren, wenn jemand im Garten ist (Bewegungsmelder, Gartentor,"
  - pl: "przełącznik \"dzieci/psy w ogrodzie\"); robot wraca do bazy albo staje,"
    en: "a \"kids/dogs in the garden\" switch); the mower returns to the dock or stops,"
    de: "Schalter \"Kinder/Hunde im Garten\"); der Mähroboter kehrt zur Ladestation zurück oder hält an,"
  - pl: "a cykl jest liczony jako przerwany,"
    en: "and the cycle counts as interrupted,"
    de: "und der Zyklus gilt als unterbrochen,"
  - pl: "- powiadomienia na telefon lub inne akcje (np. notify.mobile_app_...)."
    en: "- phone notifications or other actions (e.g. notify.mobile_app_...)."
    de: "- Benachrichtigungen aufs Handy oder andere Aktionen (z. B. notify.mobile_app_...)."
  - pl: "Powiadomienia:"
    en: "Notifications:"
    de: "Benachrichtigungen:"
  - pl: "- po dziennym przeliczeniu przyrostu trawy,"
    en: "- after the daily grass growth recalculation,"
    de: "- nach der täglichen Neuberechnung des Graswachstums,"
  - pl: "- po przełożeniu startu,"
    en: "- after a start is postponed,"
    de: "- nach dem Verschieben des Starts,"
  - pl: "- po rozpoczęciu cyklu koszenia,"
    en: "- after a mowing cycle starts,"
    de: "- nach dem Beginn eines Mähzyklus,"
  - pl: "- po zakończeniu albo przerwaniu cyklu po realnym starcie."
    en: "- after a cycle finishes or is interrupted following an actual start."
    de: "- nach dem Ende oder der Unterbrechung eines Zyklus nach einem tatsächlichen Start."
  - pl: "Gdy prognoza potwierdza dobre warunki, powiadomienie podaje \"Termin koszenia\"."
    en: "When the forecast confirms good conditions, the notification shows \"Mowing time\"."
    de: "Wenn die Vorhersage gute Bedingungen bestätigt, nennt die Benachrichtigung den \"Mähtermin\"."
  - pl: "W przeciwnym razie podaje \"Termin ponownego sprawdzenia\" i krótki powód."
    en: "Otherwise it shows \"Next check\" and a short reason."
    de: "Andernfalls nennt sie die \"Nächste Prüfung\" und einen kurzen Grund."
  - pl: "Wymagania:"
    en: "Requirements:"
    de: "Voraussetzungen:"
  - pl: "- integracja Worx Vision Cloud PLUS 1.3.1 lub nowsza,"
    en: "- Worx Vision Cloud PLUS integration 1.3.1 or newer,"
    de: "- Integration Worx Vision Cloud PLUS 1.3.1 oder neuer,"
  - pl: "- trzy helpery Home Assistant: przyrost trawy, ostatnie koszenie i następne"
    en: "- three Home Assistant helpers: grass growth, last mowing and next"
    de: "- drei Home Assistant-Helfer: Graswachstum, letztes Mähen und nächstes"
  - pl: "planowane koszenie,"
    en: "planned mowing,"
    de: "geplantes Mähen,"
  - pl: "- wyłączony harmonogram koszenia w aplikacji WORX."
    en: "- the mowing schedule in the WORX app turned off."
    de: "- deaktivierter Mähzeitplan in der WORX-App."
  - pl: "Kosiarka"
    en: "Mower"
    de: "Mähroboter"
  - pl: "Encja lawn_mower z integracji Worx Vision Cloud PLUS."
    en: "The lawn_mower entity from the Worx Vision Cloud PLUS integration."
    de: "lawn_mower-Entität aus der Integration Worx Vision Cloud PLUS."
  - pl: "Bateria"
    en: "Battery"
    de: "Akku"
  - pl: "Sensor procentu baterii kosiarki."
    en: "Mower battery percentage sensor."
    de: "Sensor für den Akkustand des Mähroboters in Prozent."
  - pl: "Bieżący stan opadu"
    en: "Current rain state"
    de: "Aktueller Niederschlagsstatus"
  - pl: "Binary sensor informujący, czy aktualnie pada. Może pochodzić z kosiarki albo lokalnej stacji pogodowej. Gdy jest dostępny, jego rzeczywisty pomiar ma pierwszeństwo nad prognozą deszczu. Czas schnięcia (3 h, po intensywnym opadzie 6 h) jest liczony od chwili przejścia czujnika w stan suchy, tylko gdy od północy zmierzono co najmniej 0,2 mm opadu."
    en: "Binary sensor that shows whether it is raining right now. It can come from the mower or a local weather station. When available, its real measurement takes priority over the rain forecast. The drying time (3 h, 6 h after heavy rain) is counted from the moment the sensor switches to dry, only when at least 0.2 mm of rain has been measured since midnight."
    de: "Binärsensor, der angibt, ob es gerade regnet. Er kann vom Mähroboter oder von einer lokalen Wetterstation stammen. Wenn verfügbar, hat seine tatsächliche Messung Vorrang vor der Regenvorhersage. Die Abtrocknungszeit (3 h, nach starkem Niederschlag 6 h) wird ab dem Wechsel des Sensors auf trocken gezählt, aber nur, wenn seit Mitternacht mindestens 0,2 mm Niederschlag gemessen wurden."
  - pl: "Pogoda"
    en: "Weather"
    de: "Wetter"
  - pl: "Temperatura"
    en: "Temperature"
    de: "Temperatur"
  - pl: "Czujnik temperatury zewnętrznej albo encja weather z atrybutem temperature. Służy do kontroli warunków startu. Dzienny przyrost trawy liczony jest ze średniej temperatury z prognozy godzinowej na najbliższe 24 godziny; bez prognozy używany jest ten odczyt, dlatego zalecany jest wtedy sensor średniej dobowej (np. integracja statistics)."
    en: "Outdoor temperature sensor or a weather entity with a temperature attribute. Used to check start conditions. Daily grass growth is calculated from the average temperature of the hourly forecast for the next 24 hours; without a forecast this reading is used, so a daily average sensor (e.g. the statistics integration) is recommended in that case."
    de: "Außentemperatursensor oder weather-Entität mit dem Attribut temperature. Dient zur Prüfung der Startbedingungen. Das tägliche Graswachstum wird aus der Durchschnittstemperatur der stündlichen Vorhersage für die nächsten 24 Stunden berechnet; ohne Vorhersage wird dieser Messwert verwendet, daher wird dann ein Sensor für den Tagesdurchschnitt empfohlen (z. B. Integration statistics)."
  - pl: "Zmierzony opad"
    en: "Measured rainfall"
    de: "Gemessener Niederschlag"
  - pl: "Sensor sumy opadu z bieżącego dnia lub ostatnich 24 godzin albo encja weather. Nie wybieraj chwilowego natężenia opadu. W MeteoFusion HA suma opadu jest pobierana automatycznie."
    en: "Rainfall total sensor for the current day or the last 24 hours, or a weather entity. Do not select an instantaneous rain rate. With MeteoFusion HA the rainfall total is read automatically."
    de: "Sensor für die Niederschlagssumme des aktuellen Tages oder der letzten 24 Stunden oder eine weather-Entität. Wähle keine momentane Niederschlagsintensität. Bei MeteoFusion HA wird die Niederschlagssumme automatisch abgerufen."
  - pl: "Prognoza godzinowa opcjonalnie"
    en: "Hourly forecast (optional)"
    de: "Stündliche Vorhersage (optional)"
  - pl: "Zalecana jest encja weather z integracji MeteoFusion HA. Automatyzacja wybiera z jej prognozy konkretną suchą godzinę z bezpieczną temperaturą i liczy z niej warunki wzrostu trawy na najbliższą dobę. Obsługiwane są również zwykłe encje weather, np. Tomorrow.io. Bez prognozy używane jest wybrane okno, a bieżące warunki są sprawdzane w chwili startu."
    en: "A weather entity from the MeteoFusion HA integration is recommended. The automation picks a specific dry hour with a safe temperature from its forecast and uses it to calculate grass growth conditions for the next 24 hours. Regular weather entities, e.g. Tomorrow.io, are also supported. Without a forecast the selected window is used and current conditions are checked at start time."
    de: "Empfohlen wird eine weather-Entität aus der Integration MeteoFusion HA. Die Automatisierung wählt aus ihrer Vorhersage eine konkrete trockene Uhrzeit mit sicherer Temperatur und berechnet daraus die Wachstumsbedingungen des Grases für die nächsten 24 Stunden. Normale weather-Entitäten werden ebenfalls unterstützt, z. B. Tomorrow.io. Ohne Vorhersage wird das gewählte Zeitfenster verwendet, und die aktuellen Bedingungen werden beim Start geprüft."
  - pl: "Wilgotność powietrza opcjonalnie"
    en: "Air humidity (optional)"
    de: "Luftfeuchtigkeit (optional)"
  - pl: "Lokalny sensor wilgotności zewnętrznej. Razem z temperaturą służy do wyliczenia punktu rosy; start jest możliwy, gdy powietrze jest co najmniej 2,5 °C cieplejsze od punktu rosy, czyli gdy rosa wyparowała. Bez tego sensora automatyzacja użyje wilgotności z encji weather, jeśli jest dostępna."
    en: "Local outdoor humidity sensor. Together with the temperature it is used to calculate the dew point; a start is possible when the air is at least 2.5 °C warmer than the dew point, i.e. when the dew has evaporated. Without this sensor the automation uses the humidity from the weather entity, if available."
    de: "Lokaler Sensor für die Außenluftfeuchtigkeit. Zusammen mit der Temperatur dient er zur Berechnung des Taupunkts; ein Start ist möglich, wenn die Luft mindestens 2,5 °C wärmer als der Taupunkt ist, also wenn der Tau verdunstet ist. Ohne diesen Sensor verwendet die Automatisierung die Luftfeuchtigkeit der weather-Entität, sofern verfügbar."
  - pl: "Naslonecznienie / UV"
    en: "Sunlight / UV"
    de: "Sonneneinstrahlung / UV"
  - pl: "Sensor UV/nasłonecznienia albo encja weather z atrybutem uv_index. Do dziennego przyrostu używane jest maksymalne UV z prognozy godzinowej na najbliższe 24 godziny. Gdy prognoza nie podaje UV, używany jest ten odczyt, a odczyt nocny (poniżej 1) jest zastępowany typową wartością dla pory roku."
    en: "UV/sunlight sensor or a weather entity with a uv_index attribute. Daily growth uses the maximum UV from the hourly forecast for the next 24 hours. When the forecast has no UV, this reading is used, and a night reading (below 1) is replaced with a typical value for the season."
    de: "UV-/Sonneneinstrahlungssensor oder weather-Entität mit dem Attribut uv_index. Für das tägliche Wachstum wird der maximale UV-Index der stündlichen Vorhersage für die nächsten 24 Stunden verwendet. Liefert die Vorhersage keinen UV-Wert, wird dieser Messwert verwendet, und ein nächtlicher Wert (unter 1) wird durch einen für die Jahreszeit typischen Wert ersetzt."
