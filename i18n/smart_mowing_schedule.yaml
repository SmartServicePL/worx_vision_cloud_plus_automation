  - pl: "{% set names = {0: 'poniedziałek', 1: 'wtorek', 2: 'środa', 3: 'czwartek', 4: 'piątek', 5: 'sobota', 6: 'niedziela'} %}"
    en: "{% set names = {0: 'Monday', 1: 'Tuesday', 2: 'Wednesday', 3: 'Thursday', 4: 'Friday', 5: 'Saturday', 6: 'Sunday'} %}"
    de: "{% set names = {0: 'Montag', 1: 'Dienstag', 2: 'Mittwoch', 3: 'Donnerstag', 4: 'Freitag', 5: 'Samstag', 6: 'Sonntag'} %}"
  - pl: "{% if days <= 0 %}dziś o {{ local.strftime('%H:%M') }}"
    en: "{% if days <= 0 %}today at {{ local.strftime('%H:%M') }}"
    de: "{% if days <= 0 %}heute um {{ local.strftime('%H:%M') }}"
  - pl: "{% elif days == 1 %}jutro o {{ local.strftime('%H:%M') }}"
    en: "{% elif days == 1 %}tomorrow at {{ local.strftime('%H:%M') }}"
    de: "{% elif days == 1 %}morgen um {{ local.strftime('%H:%M') }}"
  - pl: "{% else %}{{ names[local.weekday()] }} {{ local.strftime('%d.%m') }} o {{ local.strftime('%H:%M') }}{% endif %}"
    en: "{% else %}{{ names[local.weekday()] }} {{ local.strftime('%d.%m') }} at {{ local.strftime('%H:%M') }}{% endif %}"
    de: "{% else %}{{ names[local.weekday()] }} {{ local.strftime('%d.%m.') }} um {{ local.strftime('%H:%M') }}{% endif %}"
  - pl: "Termin koszenia: {{ plan_label | trim }}"
    en: "Mowing time: {{ plan_label | trim }}"
    de: "Mähtermin: {{ plan_label | trim }}"
  - pl: "Termin ponownego sprawdzenia: {{ plan_label | trim }}"
    en: "Next check: {{ plan_label | trim }}"
    de: "Nächste Prüfung: {{ plan_label | trim }}"
  - pl: "zmień okno koszenia albo potwierdź akcesorium FiatLux w ustawieniach automatyzacji"
    en: "change the mowing window or confirm the FiatLux accessory in the automation settings"
    de: "ändere das Mähfenster oder bestätige das FiatLux-Zubehör in den Einstellungen der Automatisierung"
  - pl: "bez prognozy godzinowej warunki można sprawdzić dopiero w chwili startu"
    en: "without an hourly forecast, conditions can only be checked at start time"
    de: "ohne stündliche Vorhersage können die Bedingungen erst beim Start geprüft werden"
  - pl: "prognoza pogody jest chwilowo niedostępna, więc warunki zostaną sprawdzone w chwili startu"
    en: "the weather forecast is temporarily unavailable, so conditions will be checked at start time"
    de: "Wettervorhersage ist vorübergehend nicht verfügbar, daher werden die Bedingungen beim Start geprüft"
  - pl: "trawa urośnie do progu koszenia około {{ ((growth_ready_ts | float(0)) | as_datetime | as_local).strftime('%d.%m') }}, a prognoza nie sięga jeszcze tego dnia"
    en: "grass will reach the mowing threshold around {{ ((growth_ready_ts | float(0)) | as_datetime | as_local).strftime('%d.%m') }}, and the forecast does not reach that day yet"
    de: "Gras erreicht die Mähschwelle etwa am {{ ((growth_ready_ts | float(0)) | as_datetime | as_local).strftime('%d.%m.') }}, die Vorhersage reicht aber noch nicht bis zu diesem Tag"
  - pl: "prognoza na najbliższe dni nie daje suchego terminu; warunki zostaną ocenione ponownie, gdy prognoza obejmie ten dzień"
    en: "the forecast for the next few days has no dry slot; conditions will be re-evaluated once the forecast covers that day"
    de: "Vorhersage für die nächsten Tage bietet keinen trockenen Termin; die Bedingungen werden erneut bewertet, sobald die Vorhersage diesen Tag abdeckt"
  - pl: "prognoza przewiduje deszcz w czasie koszenia, a w najbliższych dniach nie ma lepszego terminu"
    en: "the forecast predicts rain during mowing, and there is no better time in the next few days"
    de: "Vorhersage meldet Regen während des Mähens, und in den nächsten Tagen gibt es keinen besseren Termin"
  - pl: "duże ryzyko deszczu ({{ d.prob | round(0) | int }}%), a w najbliższych dniach nie ma lepszego terminu"
    en: "high risk of rain ({{ d.prob | round(0) | int }}%), and there is no better time in the next few days"
    de: "hohes Regenrisiko ({{ d.prob | round(0) | int }}%), und in den nächsten Tagen gibt es keinen besseren Termin"
  - pl: "trawa może być jeszcze mokra po deszczu, a w najbliższych dniach nie ma lepszego terminu"
    en: "the grass may still be wet after rain, and there is no better time in the next few days"
    de: "Gras kann nach Regen noch nass sein, und in den nächsten Tagen gibt es keinen besseren Termin"
  - pl: "w prognozie powietrze jest tylko {{ d.spread | round(1) | string | replace('.', ',') }} °C cieplejsze od punktu rosy (wilgotność {{ (d.hum | round(0) | int) if d.hum is not none else '?' }}%), więc trawa może być jeszcze mokra od rosy"
    en: "in the forecast the air is only {{ d.spread | round(1) | string | replace('.', '.') }} °C warmer than the dew point (humidity {{ (d.hum | round(0) | int) if d.hum is not none else '?' }}%), so the grass may still be wet from dew"
    de: "laut Vorhersage ist die Luft nur {{ d.spread | round(1) | string | replace('.', ',') }} °C wärmer als der Taupunkt (Luftfeuchte {{ (d.hum | round(0) | int) if d.hum is not none else '?' }}%), daher kann das Gras noch nass vom Tau sein"
  - pl: "wysoka wilgotność powietrza ({{ (d.hum | round(0) | int) if d.hum is not none else '?' }}%), więc trawa może być mokra od rosy"
    en: "high air humidity ({{ (d.hum | round(0) | int) if d.hum is not none else '?' }}%), so the grass may be wet from dew"
    de: "hohe Luftfeuchtigkeit ({{ (d.hum | round(0) | int) if d.hum is not none else '?' }}%), daher kann das Gras nass vom Tau sein"
  - pl: "prognozowana temperatura {{ d.temp | round(0) | int }} °C jest poza dozwolonym zakresem {{ tmin | int }}–{{ tmax | int }} °C"
    en: "forecast temperature {{ d.temp | round(0) | int }} °C is outside the allowed range {{ tmin | int }}–{{ tmax | int }} °C"
    de: "vorhergesagte Temperatur {{ d.temp | round(0) | int }} °C liegt außerhalb des zulässigen Bereichs {{ tmin | int }}–{{ tmax | int }} °C"
  - pl: "prognoza nie potwierdza dobrych warunków przez cały czas koszenia"
    en: "the forecast does not confirm good conditions for the whole mowing time"
    de: "Vorhersage bestätigt keine guten Bedingungen für die gesamte Mähdauer"
  - pl: "{% set names = {'rain': 'deszcz', 'wet_after_rain': 'mokra trawa po deszczu',"
    en: "{% set names = {'rain': 'rain', 'wet_after_rain': 'wet grass after rain',"
    de: "{% set names = {'rain': 'Regen', 'wet_after_rain': 'nasses Gras nach Regen',"
  - pl: "'dew': 'rosa', 'temperature': 'temperatura poza zakresem ' ~ (min_mowing_temperature_c | int) ~ '–' ~ (max_mowing_temperature_c | int) ~ ' °C',"
    en: "'dew': 'dew', 'temperature': 'temperature out of range ' ~ (min_mowing_temperature_c | int) ~ '–' ~ (max_mowing_temperature_c | int) ~ ' °C',"
    de: "'dew': 'Tau', 'temperature': 'Temperatur außerhalb des Bereichs ' ~ (min_mowing_temperature_c | int) ~ '–' ~ (max_mowing_temperature_c | int) ~ ' °C',"
  - pl: "'data': 'za krótka prognoza', 'later': 'pogorszenie pogody w trakcie koszenia'} %}"
    en: "'data': 'forecast too short', 'later': 'weather getting worse during mowing'} %}"
    de: "'data': 'zu kurze Vorhersage', 'later': 'Wetterverschlechterung während des Mähens'} %}"
  - pl: "poza oknem {{ window }}, bo koszenie jest dozwolone tylko w wybrane dni albo za dnia"
    en: "outside the {{ window }} window, because mowing is allowed only on selected days or in daylight"
    de: "außerhalb des Fensters {{ window }}, da Mähen nur an ausgewählten Tagen oder bei Tageslicht erlaubt ist"
  - pl: "poza oknem {{ window }}, bo w oknie prognoza wskazuje: {{ labels.items | join(', ') }}"
    en: "outside the {{ window }} window, because in the window the forecast shows: {{ labels.items | join(', ') }}"
    de: "außerhalb des Fensters {{ window }}, da die Vorhersage im Fenster Folgendes meldet: {{ labels.items | join(', ') }}"
  - pl: "poza oknem {{ window }}, bo trawa osiągnie próg koszenia dopiero po oknie"
    en: "outside the {{ window }} window, because the grass reaches the mowing threshold only after the window"
    de: "außerhalb des Fensters {{ window }}, da das Gras die Mähschwelle erst nach dem Fenster erreicht"
  - pl: "poza oknem {{ window }}, bo minimalna przerwa od ostatniego koszenia kończy się po oknie"
    en: "outside the {{ window }} window, because the minimum gap since the last mowing ends after the window"
    de: "außerhalb des Fensters {{ window }}, da der Mindestabstand zum letzten Mähen erst nach dem Fenster endet"
  - pl: "poza oknem {{ window }}, bo trawa schnie po deszczu dłużej niż trwa okno"
    en: "outside the {{ window }} window, because the grass takes longer to dry after rain than the window lasts"
    de: "außerhalb des Fensters {{ window }}, da das Gras nach Regen länger abtrocknet, als das Fenster dauert"
  - pl: "poza oknem {{ window }}, bo dzisiejsze okno już minęło albo nie ma w nim bezpiecznej godziny"
    en: "outside the {{ window }} window, because the window for today has already passed or has no safe time"
    de: "außerhalb des Fensters {{ window }}, da das heutige Fenster bereits vorbei ist oder keine sichere Uhrzeit enthält"
