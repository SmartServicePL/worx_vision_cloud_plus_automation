    en: "next time after a finished mowing) are calculated by the same planner, so notifications"
    de: "Termin nach abgeschlossenem Mähen) berechnet derselbe Planer, daher nennen Benachrichtigungen"
  - pl: "zawsze podają ten sam, aktualny termin,"
    en: "always show the same, current time,"
    de: "immer denselben, aktuellen Termin,"
  - pl: "- termin zaplanowany na dziś nie jest później przesuwany przez okresowe zmiany"
    en: "- a time planned for today is not moved later by periodic forecast"
    de: "- ein für heute geplanter Termin wird später nicht durch periodische Änderungen"
  - pl: "prognozy; termin na kolejne dni jest ponownie oceniany przy dziennym przeliczeniu,"
    en: "changes; a time on later days is re-evaluated at the daily recalculation,"
    de: "der Vorhersage verschoben; ein Termin für die folgenden Tage wird bei der täglichen Neuberechnung erneut bewertet,"
  - pl: "- w chwili startu pierwszeństwo mają rzeczywiste czujniki: przy suchej pogodzie"
    en: "- at start time real sensors take priority: in dry weather"
    de: "- beim Start haben echte Sensoren Vorrang: Bei trockenem Wetter"
  - pl: "robot rusza, a po wykryciu faktycznego deszczu wraca do bazy,"
