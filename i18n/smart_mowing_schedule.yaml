  - pl: "{% if d.temp is not none %}{% set parts.items = parts.items + [(d.temp | round(0) | int) ~ ' °C'] %}{% endif %}"
    en: "{% if d.temp is not none %}{% set parts.items = parts.items + [(d.temp | round(0) | int) ~ ' °C'] %}{% endif %}"
    de: "{% if d.temp is not none %}{% set parts.items = parts.items + [(d.temp | round(0) | int) ~ ' °C'] %}{% endif %}"
