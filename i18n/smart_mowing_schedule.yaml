    en: "{% set parts.items = parts.items + ['rain ' ~ (rain_total | round(1) | string | replace('.', '.')) ~ ' mm'] %}"
    de: "{% set parts.items = parts.items + ['Niederschlag ' ~ (rain_total | round(1) | string | replace('.', ',')) ~ ' mm'] %}"
